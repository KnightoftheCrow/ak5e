  description:
    value: >-
      <table><thead><tr><td><p>SP Cost</p></td><td><p>Start
      SP</p></td><td><p>Charging</p></td><td><p>Activation</p></td><td><p>Duration</p></td></tr></thead><tbody><tr><td><p>40</p></td><td><p>15</p></td><td><p>Automatic</p></td><td><p>Action</p></td><td><p>Instant</p></td></tr></tbody></table><p><strong>Effect:</strong>
      You can only use this Operator Skill while you are wielding a weapon with
      the Thrown Property. You launch the weapon in a water-parting line, up to
      100 feet long and 5 foot wide; all Creatures within the area must make a
      Dexterity Saving Throw against your Martial DC. On a failed Save, they
      take 8d6 Piercing Damage. On a successful Save, they take half as much
      Damage</p><hr><p><strong>Semi-Automated: </strong>The pull-down effect is
      not automated.</p>
