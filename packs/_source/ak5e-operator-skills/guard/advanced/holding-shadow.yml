  description:
    value: >-
      <table><thead><tr><td><p>SP Cost</p></td><td><p>Start
      SP</p></td><td><p>Charging</p></td><td><p>Activation</p></td><td><p>Duration</p></td></tr></thead><tbody><tr><td><p>40</p></td><td><p>20</p></td><td><p>Automatic</p></td><td><p>Action</p></td><td><p>Instant</p></td></tr></tbody></table><p><strong>Effect:</strong>
      Each Creature in a 20-foot cube originating from you must make a Dexterity
      Saving Throw against your Martial DC as shadows grasp at them. On a failed
      Save, they take 4d6 Force Damage and their Movement Speed is halved until
      the end of their next Turn. On a successful Save, they take half as much
      Damage, and their Speed is not reduced. At the beginning of your next
      Turn, all Creatures within the affected zone take 4d6 Force
      Damage.</p><hr><p><strong>Semi-Automated: </strong>The follow up Damage
      must be triggered manually.</p>
