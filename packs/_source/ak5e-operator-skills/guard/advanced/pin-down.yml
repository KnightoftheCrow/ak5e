  advancement: {}
  description:
    value: >-
      <table><thead><tr><td><p>SP Cost</p></td><td><p>Start
      SP</p></td><td><p>Charging</p></td><td><p>Activation</p></td><td><p>Duration</p></td></tr></thead><tbody><tr><td><p>40</p></td><td><p>10</p></td><td><p>Offensive</p></td><td><p>Action</p></td><td><p>Instant</p></td></tr></tbody></table><p><strong>Effect:</strong>
      You call down a rain of needle-like Arts, pinning Creatures down. Choose
      up to 3 different Creatures you can see within 60 feet. Those Creatures
      must succeed on a Dexterity Saving Throw against your Martial DC or take
      6d6 Force Damage and be Restrained until the end of their next Turn. If
      the Creature is not touching the ground when it fails this Saving Throw,
      it is pulled 50 feet directly towards the ground. If you only choose one
      Creature when using this Skill; on a successful Saving Throw, that
      Creature takes half Damage, and is pulled 50 feet towards the ground if it
      is not touching the ground.</p><hr><p><strong>Semi-Automated: </strong>The
      pull-down effect is not automated.</p>
