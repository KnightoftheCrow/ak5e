      Action</p></td><td><p>3
      Rounds</p></td></tr></tbody></table><p><strong>Effect:</strong> You adopt
      a specialised stance designed to exploit weaknesses in the enemies’
      defence, at the cost of your own defence. Your Melee Attacks ignore
      Resistance and Damage Reduction against Physical Damage. Additionally, if
      you hit a Creature with a Melee Attack that would be Resistant or have
      Damage Reduction against that Attack, that Attack deals additional Damage
      equal to half of your Character Level. However, for the duration, Attack
      Rolls against you are made at Advantage.</p><hr><p><strong>Semi-Automated:
      </strong>The Resistance and DR ignoring effects are not automated.
      Everything else is.</p>
