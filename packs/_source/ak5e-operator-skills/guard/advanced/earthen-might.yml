      <table><thead><tr><td><p>SP Cost</p></td><td><p>Start
      SP</p></td><td><p>Charging</p></td><td><p>Activation</p></td><td><p>Duration</p></td></tr></thead><tbody><tr><td><p>30</p></td><td><p>20</p></td><td><p>Automatic</p></td><td><p>Bonus
      Action</p></td><td><p>5
      Rounds</p></td></tr></tbody></table><p><strong>Effect:</strong> When you
      activate this Skill, and at the beginning of each of your Turns while this
      Operator Skill is Active, you gain 1 Earthen Might. Each Earthen Might you
      have grants you 2 Damage Resistance against all Damage. As a Bonus Action
      during your Turn, you may consume all of your Earthen Might to add +2
      Damage to Damage Rolls you make for Melee Attacks for each Earthen Might
      consumed until the end of that Turn. At the end of a Turn you have done
      so, the Skill ends. When the Skill Ends, you lose all Earthen
      Might.</p><hr><p><strong>Semi-Automated: </strong>While this Skill is
      Active, you will gain 1 use of this item at the beginning of each of your
      Turns; this represents your stacks. The only non-automated part is that
      the Skill will not end after a Turn on which you have consumed your
      stacks.</p>
