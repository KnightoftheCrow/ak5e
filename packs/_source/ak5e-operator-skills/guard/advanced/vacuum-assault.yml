  description:
    value: >-
      <table><thead><tr><td><p>SP Cost</p></td><td><p>Start
      SP</p></td><td><p>Charging</p></td><td><p>Activation</p></td><td><p>Duration</p></td></tr></thead><tbody><tr><td><p>40</p></td><td><p>15</p></td><td><p>Automatic</p></td><td><p>Bonus
      Action</p></td><td><p>3
      Rounds</p></td></tr></tbody></table><p><strong>Effect:</strong> Once per
      Turn when you make an Attack Roll, you can force all hostile Creatures
      within 30 feet of you to make a Strength Saving Throw against your Martial
      DC. On a failed Save, they are pulled 20 feet towards you; on a successful
      Save, they are only pulled 10 feet towards you. If a Creature would enter
      your space as a result of this movement, they are placed as close to you
      as possible, and take 2d8 Bludgeoning
      Damage.</p><hr><p><strong>Semi-Automated: </strong>Use the correct
      activity for if your Martial DC is scaling with STR or DEX. The Damage
      dealt to Creatures pulled into your Space must be triggered manually.</p>
