      Rounds</p></td></tr></tbody></table><p><strong>Effect:</strong> Assume a
      stance ready for countering. While in this stance, when a Creature you can
      see hits you with an Attack, you can use your Reaction to halve the Damage
      of that Attack, and make a Melee Attack against them if they are within
      your Reach. If that Attack hits, you regain use of your
      Reaction.</p><p><strong>Not Automated: </strong>The halving damage
      reaction is provided to you while the Skill is active; the reaction
      refunding cannot be automated.</p>
