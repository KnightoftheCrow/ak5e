      Rounds</p></td></tr></tbody></table><p><strong>Effect: </strong>Choose a
      number that is both less than half of your Maximum Hit Points and less
      than half of your current Hit Points. You lose that many Hit Points, and
      gain Temporary Hit Points equal to the Hit Points you lost. While you have
      those Temporary Hit Points, your Attacks deal Additional Damage equal to
      your Proficiency Bonus. You lose these temporary Hit Points at the end of
      the duration of this Operator Skill.</p><hr><p><strong>Semi-Automated:
