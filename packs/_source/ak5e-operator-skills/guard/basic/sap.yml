      against your Martial DC or become Dazed until the end of their next
      Turn.</p><p><strong>Partially Automated: </strong>Use the activate skill
      activity to spend the SP and grant an effect that allows you to activate
      the Sap Saving Throw on a Creature. The Sap Saving Throw must be triggered
      manually. Make sure to choose the correct Saving Throw for your Martial
      DC.</p>
