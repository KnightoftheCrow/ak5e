  description:
    value: >-
      <table><thead><tr><td><p>SP Cost</p></td><td><p>Start SP</p></td><td
      data-colwidth="93"><p>Charging</p></td><td><p>Activation</p></td><td><p>Duration</p></td></tr></thead><tbody><tr><td><p>40</p></td><td><p>15</p></td><td
      data-colwidth="93"><p>Automatic</p></td><td><p>Action</p></td><td><p>Instant</p></td></tr></tbody></table><p><strong>Effect:</strong>
      Every Creature within a 15-foot cube originating from you must make a
      Constitution Saving Throw against your Martial DC; Creatures who are
      within your Reach have Disadvantage on this Saving Throw, and take double
      Damage from this Operator Skill. On a failed Save, they take 3d10 Slashing
      Damage and are Frightened of you. While Frightened, they may attempt this
      Saving Throw again at the beginning of each of their Turns, ending the
      Condition on a successful Save. On a successful Save, they take half as
      much Damage, and are not Frightened.</p><hr><p><strong>Semi-Automated:
      </strong>Use the "At Risk of Overrun" Activity on Creatures within your
      Reach before using Overrun on them. Remember that you can shift+t to
      target multiple Creatures.<strong> </strong>Use the appropriate activity
      if you primarily use Strength or Dexterity for your Attacks. </p>
