      data-colwidth="93"><p>Automatic</p></td><td><p>Action</p></td><td><p>Instant</p></td></tr></tbody></table><p><strong>Effect:</strong>
      Choose a Creature you can see within 50 feet; you dash forward in a
      straight line towards that Creature until they are within your Reach. This
      movement does not provoke Opportunity Attacks. After you do so, make a
      Melee Attack against that Creature with Advantage; you gain a +5 bonus to
      this Attack Roll, but the Attack deals no Damage at this stage. Subtract
      the Creature’s Armour Class from the result of the Attack Roll, and divide
      the resulting value by two, rounding up; the target Creature takes hits
      from the weapon used for the Attack Roll equal to the remaining
      value.</p><hr><p><strong>Cannot be Automated.</strong></p>
