  advancement: {}
  description:
    value: >-
      <table><thead><tr><td><p>SP Cost</p></td><td><p>Start SP</p></td><td
      data-colwidth="93"><p>Charging</p></td><td><p>Activation</p></td><td><p>Duration</p></td></tr></thead><tbody><tr><td><p>40</p></td><td><p>15</p></td><td
      data-colwidth="93"><p>Automatic</p></td><td><p>Action</p></td><td><p>Instant</p></td></tr></tbody></table><p><strong>Effect:</strong>
      Every other Creature within a 25-foot-radius, 100-foot-high cylinder
      centred on you must make a Strength Saving Throw against your Martial DC.
      On a failed Save, they take 3d10 Force Damage, and their Speed is reduced
      to 0 until the end of their next Turn. Additionally, at the end of their
      next Turn, they take 3d10 Force Damage. If they are flying when they fail
      the Save, they are forced directly down to the ground, taking falling
      Damage as appropriate, and are Stunned. On a successful Save, they take
      half as much Damage, and their Speed is only
      halved.</p><hr><p><strong>Semi-Automated: </strong>Use the appropriate
      activity if you primarily use Strength or Dexterity for your Attacks.
      Creatures with a Fly Speed of &gt; 0 that fail the Save will be
      Stunned.</p>
