  description:
    value: >-
      <table><thead><tr><td><p>SP Cost</p></td><td><p>Start SP</p></td><td
      data-colwidth="93"><p>Charging</p></td><td><p>Activation</p></td><td><p>Duration</p></td></tr></thead><tbody><tr><td><p>40</p></td><td><p>15</p></td><td
      data-colwidth="93"><p>Automatic</p></td><td><p>Bonus
      Action</p></td><td><p>3
      Rounds</p></td></tr></tbody></table><p><strong>Effect:</strong> Your Arts
      coalesce into a spectral floating weapon within a space you can see with
      100 feet. When you activate this Opeartor Skill, and as a Bonus Action on
      subsequent Turns, you can cause the weapon to move up to 20 feet in a
      direction of your choice, and make a Melee Attack using the weapon against
      a target within 5 feet of it; you can use your Dexerity Modifier instead
      of Strength for the Attack and Damage Rolls, and you are considered to be
      Proficient with it. On a hit, the weapon deals 2d10 + your Ability
      Modifier Force Damage. The Critical Range of Attacks with this Weapon is
      increased by 1.</p><hr><p><strong>Semi-Automated: </strong>This summons an
      Edge of Fate token that can make the attacks. Use the appropriate activity
      if you primarily use Strength or Dexterity for your Attacks. There is an
      activity on the Edge of Fate itself to increase its Damage based on
      Liberty you expended to use it; set the scaling value to the appropriate
      amount.</p>
