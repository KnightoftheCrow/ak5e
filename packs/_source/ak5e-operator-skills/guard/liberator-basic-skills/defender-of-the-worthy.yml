      Round</p></td></tr></tbody></table><p><strong>Effect:</strong> When you
      activate this Operator Skill, you gain 1d8 Temporary Hit Points for each
      Liberty you consumed this Turn. While this Skill is Active, when a
      Creature within 15 feet of you is attacked, you may move to them and
      replace them as the target of the Attack as a Reaction. If you still have
      Temporary Hit Points after the Attack, you regain your Reaction, and can
      make a Melee Attack against the attacking
      Creature.</p><hr><p><strong>Semi-Automated: </strong>Use the scaling value
      to match the amount of Liberty you consumed. The Attack replacement effect
      cannot be automated.</p>
