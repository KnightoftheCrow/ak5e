      data-colwidth="93"><p>Automatic</p></td><td><p>Action</p></td><td><p>Instant</p></td></tr></tbody></table><p><strong>Effect:</strong>
      All Creatures within a 25-foot-radius Sphere centred on you (but excluding
      you) must make a Strength Saving Throw against your Martial DC. On a
      failed Save, they take 2d10 Slashing Damage, and are pulled 15 feet
      directly towards you. On a successful save, they take half as much Damage,
      and are not pulled. Then, all Creatures within 10 feet of you take 1d10
      Slashing Damage for each Liberty you consumed when activating this
      Operator Skill.</p><hr><p><strong>Automated: </strong>For the follow up
      damage, set the scaling value to the Liberty expended.</p>
