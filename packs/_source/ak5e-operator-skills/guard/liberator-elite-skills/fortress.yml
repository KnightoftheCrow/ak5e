  description:
    value: >-
      <table><thead><tr><td><p>SP Cost</p></td><td><p>Start
      SP</p></td><td><p>Charging</p></td><td><p>Activation</p></td><td><p>Duration</p></td></tr></thead><tbody><tr><td><p>50</p></td><td><p>30</p></td><td><p>Automatic</p></td><td><p>Action</p></td><td><p>5
      Round</p></td></tr></tbody></table><p><strong>Effect:</strong> You project
      an aura with your Arts to defend your allies and punish your foes. Allied
      Creatures within 30 feet of you gain a bonus to Saving Throws equal to the
      amount of Liberty you expended to activate this Skill. Additionally, all
      Attacks against them have Disadvantage, and cannot have Advantage. When a
      Creature misses an Attack against a Creature within 30 feet of you, you
      may use your Reaction to deal 1d10 Force Damage to that Creature for every
      two Liberty you consumed when activating this Operator
      Skill.</p><hr><p><strong>Semi-Automated: </strong>The aura effects are
      automated; set the Scaling Value to the expended Liberty. Use the Activity
      on this Feature to deal the reflection damage.</p>
