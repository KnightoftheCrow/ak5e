  description:
    value: >-
      <table><thead><tr><td><p>SP Cost</p></td><td><p>Start
      SP</p></td><td><p>Charging</p></td><td><p>Activation</p></td><td><p>Duration</p></td></tr></thead><tbody><tr><td><p>65</p></td><td><p>20</p></td><td><p>Automatic</p></td><td><p>Action</p></td><td><p>Instant</p></td></tr></tbody></table><p><strong>Effect:</strong>
      Choose up to three different Creatures you can see within 100 feet. You
      may make a Melee Attack against each of those Creatures as if they were
      within your Reach; the additional Damage you gained by consuming Liberty
      is doubled for those Attacks. If a Creature is reduced to 0 Hit Points by
      these Attacks, you may choose an additional Creature to Attack, up to a
      maximum total of six Attacks; you cannot Attack the same Creature more
      than once. Afterwards, you may then teleport to an unoccupied space within
      5 feet of a Creature you Attacked as part of this Operator
      Skill.</p><hr><p><strong>Semi-Automated: </strong>Enchant the weapon you
      intend to use and use the Activity it provides to that weapon to make
      Storm Attacks. Set the scaling value to the amount of Liberty you
      expended.</p>
