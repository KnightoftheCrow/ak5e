    value: >-
      <table><thead><tr><td><p>SP Cost</p></td><td><p>Start
      SP</p></td><td><p>Charging</p></td><td><p>Activation</p></td><td><p>Duration</p></td></tr></thead><tbody><tr><td><p>65</p></td><td><p>30</p></td><td><p>Automatic</p></td><td><p>Bonus
      Action</p></td><td><p>Until Long
      Rest</p></td></tr></tbody></table><p><strong>Effect:</strong> You gain
      Temporary Hit Points equal to half of your maximum Hit Points.
      Furthermore, your Attacks deal 2 additional dice of Damage, and have +1
      Critical Range. However, at the end of each of your Turns, you lose 15 Hit
      Points; this amount cannot be reduced. The amount of Hit Points you lose
      doubles for every Round after the first (On the second round you lose 30
      HP, on the third 60, etc). This Operator Skill ends when you are reduced
      to 0 Hit Points. When you are reduced to 0 Hit Points while this Skill is
      Active, you become Incapacitated until you are no longer Dying. Hit Points
      you lose as a result of this Skill cannot kill you via the “Massive
      Damage” rule.</p><hr><p><strong>Automated: </strong>The Temporary HP,
      additional attack dice, and critical range are automated. There is an
      Activity on this item that will drain your HP; set the scaling to the
      number of turns this Skill has been active, starting at 1. </p>
