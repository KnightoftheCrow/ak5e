  description:
    value: >-
      <table><thead><tr><td><p>SP Cost</p></td><td><p>Start
      SP</p></td><td><p>Charging</p></td><td><p>Activation</p></td><td><p>Duration</p></td></tr></thead><tbody><tr><td><p>30</p></td><td><p>30</p></td><td><p>Offensive</p></td><td><p>Action</p></td><td><p>Instant</p></td></tr></tbody></table><p><strong>Effect:</strong>
      All Creatures (except you) within a cross-shaped area centred on you (each
      line is 10-feet wide and 50-feet long) must make a Dexterity Saving Throw
      against your Martial DC, taking 4d6 Bludgeoning Damage on a failed Save,
      or half as much on a successful one. After you have used this Skill 3
      times, the Activation Cost becomes “Bonus Action”, and its SP Cost becomes
      15. After you complete a Long Rest, this Skill returns to its original
      state.</p><hr><p><strong>Semi-Automated: </strong>Use the correct activity
      for if your Martial DC is scaling with STR or DEX.</p>
