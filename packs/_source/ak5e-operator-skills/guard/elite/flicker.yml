  description:
    value: >-
      <table><thead><tr><td><p>SP Cost</p></td><td><p>Start
      SP</p></td><td><p>Charging</p></td><td><p>Activation</p></td><td><p>Duration</p></td></tr></thead><tbody><tr><td><p>65</p></td><td><p>35</p></td><td><p>Automatic</p></td><td><p>Action</p></td><td><p>Instant</p></td></tr></tbody></table><p><strong>Effect:</strong>
      Choose a Creature you can see within 30 feet; that Creature must make a
      Dexterity Saving Throw against your Martial DC as your weapon flashes
      towards them in a blur. On a failed Save, they take six Hits from one
      weapon you are wielding. On a successful save, they take only three Hits.
      If the Creature is an Elite or Leader, instead of each hit dealing its
      individual Damage, add together the Damage of all the hits; the total is
      the Damage that Creature takes.</p><hr><p><strong>Semi-Automated:
      </strong>The Saving Throw does not do any Damage on fail; manually resolve
      the hits against the target. If they are an Elite or Leader, you can use
      the Activity on this Feature and set the scaling amount to the total
      Damage of the hits.</p>
