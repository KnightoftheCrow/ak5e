  description:
    value: >-
      <table><thead><tr><td><p>SP Cost</p></td><td><p>Start
      SP</p></td><td><p>Charging</p></td><td><p>Activation</p></td><td><p>Duration</p></td></tr></thead><tbody><tr><td><p>65</p></td><td><p>30</p></td><td><p>Automatic</p></td><td><p>Action</p></td><td><p>Instant</p></td></tr></tbody></table><p><strong>Effect:</strong>
      You cannot make, or have made, any Attacks the Turn you Activate this
      Operator Skill. Choose a location you can see within 300-feet. You raise
      30-feet into the air and hover there; for the remainder of the Turn, your
      Speed becomes 0. At the beginning of your next Turn, you appear at the
      chosen location with thunderous impact; all other Creatures within 20-feet
      of that location must make a Dexterity Saving Throw against your Martial
      DC. On a failed Save, they take 14d6 Thunder Damage; on a successful Save,
      they take half as much Damage.</p><hr><p><strong>Semi-Automated:
      </strong>The Activate Activity will set your Speed to 0 and expend your
      SP.<strong> </strong>Use the correct activity for if your Martial DC is
      scaling with STR or DEX.</p>
