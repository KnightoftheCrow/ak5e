  description:
    value: >-
      <table><thead><tr><td><p>SP Cost</p></td><td><p>Start
      SP</p></td><td><p>Charging</p></td><td><p>Activation</p></td><td><p>Duration</p></td></tr></thead><tbody><tr><td><p>65</p></td><td><p>30</p></td><td><p>Automatic</p></td><td><p>Action</p></td><td><p>5
      Rounds</p></td></tr></tbody></table><p><strong>Effect:</strong> You summon
      a Light of Hope in a location you can see. The Light is intangible, cannot
      be damaged or moved, and projects bright light in a 30-foot radius around
      it. For the duration of the Skill, Friendly Creatures within 15-foot of
      the Light have Advantage on Wisdom and Charisma Saving Throws, and gain
      Temporary Hit Points at the beginning of each of their Turns equal to your
      Character Level. Once per Turn, when you hit a Creature with an Attack
      while you are within 15-feet of a Light of Hope, that Creature loses 1d8
      Hit Points.</p><p><strong>Duration:</strong> 5
      Rounds.</p><p><strong>Semi-Automated: </strong>The light that you summon
      correctly provides Advantage on Wisdom and Charisma Saves. When you summon
      the Light, ensure you add it to the combat and set its Initiative to the
      same as its Summoner; it will start providing the Temp HP as soon as it
      has had a "Turn". The 1d8 Hit Point loss on hit is an Opt-in Effect while
      this Skill is Active; it does not automatically check if you are actually
      within 15 feet of the light, nor can you see the result of the 1d8, but it
      is applied.</p>
