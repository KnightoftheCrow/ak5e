      You bring a monstrous radiant blade down in a 80-foot-long, 10-foot-wide
      line originating from you. All Creatures within the area must make a
      Dexterity Saving Throw against your Martial DC; on a failed Save, they
      take 10d8 Radiant Damage. On a successful Save, they take half as much
      Damage.</p><hr><p><strong>Semi-Automated: </strong>Use the correct
      activity for if your Martial DC is scaling with STR or DEX.</p>
