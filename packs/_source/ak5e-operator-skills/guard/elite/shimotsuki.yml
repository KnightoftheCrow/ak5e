  description:
    value: >-
      <table><thead><tr><td><p>SP Cost</p></td><td><p>Start
      SP</p></td><td><p>Charging</p></td><td><p>Activation</p></td><td><p>Duration</p></td></tr></thead><tbody><tr><td><p>80</p></td><td><p>30</p></td><td><p>Offensive</p></td><td><p>Action</p></td><td><p>Instant</p></td></tr></tbody></table><p><strong>Effect:</strong>
      When you activate this Operator Skill, you may immediately move up to your
      Speed; you can only move in a single straight line, but may pass through
      other Creature’s Spaces as part of that movement. When you finish the
      movement, all Creatures you passed through while moving, and all Creatures
      of your choice within 15 feet of you must make a Dexterity Saving Throw
      against your Martial DC as you whirl an ice-formed blade around. On a
      failed Save, they take 6d8 Slashing Damage + 6d8 Cold Damage. On a
      successful Save, they take half as much
      Damage.</p><hr><p><strong>Semi-Automated: </strong>Use the correct
      activity for if your Martial DC is scaling with STR or DEX.</p>
