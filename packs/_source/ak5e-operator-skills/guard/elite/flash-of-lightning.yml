  description:
    value: >-
      <table><thead><tr><td><p>SP Cost</p></td><td><p>Start
      SP</p></td><td><p>Charging</p></td><td><p>Activation</p></td><td><p>Duration</p></td></tr></thead><tbody><tr><td><p>80</p></td><td><p>40</p></td><td><p>Offensive</p></td><td><p>Action</p></td><td><p>Instant</p></td></tr></tbody></table><p><strong>Effect:</strong>
      You disappear in a flash of thunder, leaving only defeated foes in the
      aftermath. Choose up to five Creatures you can see within 60 feet; you
      immediately make a Melee Attack against each of those Creatures as if they
      were in your Reach. On a hit, the Attack deals 1 additional die of Damage,
      and the Damage of that Attack is converted to Lightning Damage. In
      addition, other hostile Creatures within 10 feet of the Creature you hit
      must make a Dexterity Saving Throw against your Martial DC, taking 4d6
      Thunder Damage on a failed Save, or half as much on a successful
      Save.</p><hr><p><strong>Semi-Automated: </strong>Using this skill grants
      you an effect that grants the additional die of Damage and Lightning
      Conversion to your Melee Attacks until the end of the Turn. You can use
      the AoE Damage Activity to deal the aftershocks; make sure to untarget the
      initial Creature.</p>
    chat: ''
