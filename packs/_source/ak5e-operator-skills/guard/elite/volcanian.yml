      <table><thead><tr><td><p>SP Cost</p></td><td><p>Start
      SP</p></td><td><p>Charging</p></td><td><p>Activation</p></td><td><p>Duration</p></td></tr></thead><tbody><tr><td><p>80</p></td><td><p>35</p></td><td><p>Automatic</p></td><td><p>Bonus
      Action</p></td><td><p>3
      Rounds</p></td></tr></tbody></table><p><strong>Effect:</strong> For the
      duration, you are Resistant to Fire Damage, the Damage of your Melee
      Weapon Attacks is converted to Fire Damage, and deal 1d8 additional Fire
      Damage. Furthermore, as a Bonus Action on each of your Turns, you can
      choose a point you can see within 45 feet; all Creatures within a
      10-foot-radius, 50-foot-tall cylinder centred on that point must make a
      Dexterity Saving Throw against your Martial DC, as a column of flame
      bursts from underneath them. On a failed Save, they take 6d6 Fire Damage;
      on a successful Save, they take half as much
      Damage.</p><hr><p><strong>Automated.</strong></p>
