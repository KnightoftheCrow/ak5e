  description:
    value: >-
      <table><thead><tr><td><p>SP Cost</p></td><td><p>Start
      SP</p></td><td><p>Charging</p></td><td><p>Activation</p></td><td><p>Duration</p></td></tr></thead><tbody><tr><td><p>80</p></td><td><p>35</p></td><td><p>Offensive</p></td><td><p>Action</p></td><td><p>Instant</p></td></tr></tbody></table><p><strong>Effect:</strong>
      Choose a Creature within 60-feet that you can see. You teleport to a
      location within 5-feet of that Creature; they then must make a
      Constitution Saving Throw against your Martial DC, taking 8d12 Slashing
      Damage on a failed Save, or half as much on a successful one. If this
      Damage reduces the Creature to less than 50 Hit Points, they
      die.</p><hr><p><strong>Semi-Automated: </strong>Use the correct activity
      for if your Martial DC is scaling with STR or DEX.</p>
