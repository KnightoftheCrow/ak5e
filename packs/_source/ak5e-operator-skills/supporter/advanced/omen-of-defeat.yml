      rounds</p></td></tr></tbody></table><p><strong>Effect:</strong> When a
      Creature within 100 feet of you that you can see takes Damage while it has
      less than 50% of its maximum Hit Points, you can apply an Omen of Defeat
      to that Creature. When a Creature with an Omen of Defeat takes Damage,
      they take additional Psychic Damage equal to your Proficiency Bonus. A
      Creature affected by Omen of Defeat can make a Charisma Saving Throw
      against your Spell Save DC at the end of each of their Turns, removing the
      Omen of Defeat on a success. A Creature can only be affected by one Omen
      of Defeat at a time.</p><p><strong>Not Automated.</strong></p>
