      rounds</p></td></tr></tbody></table><p><strong>Effect: </strong>You create
      a transparent cloud of choking, stinging gas in a 15-foot radius sphere
      centred on a location you can see within 60 feet; this sphere spreads
      around corners. When a Creature begins their Turn within the sphere or
      enters it during their Turn, they must make a Constitution Saving Throw
      against your Martial DC or Spell Save DC (your choice). On a failed Save,
      until the end of their next Turn they are Silenced and Blinded.
      Additionally, they immediately lose Concentration on any Arts. On a
      successful Save, nothing happens.</p><p><strong>Not
      Automated.</strong></p>
