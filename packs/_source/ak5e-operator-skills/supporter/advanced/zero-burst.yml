      <table><thead><tr><td><p>SP Cost</p></td><td><p>Start
      SP</p></td><td><p>Charging</p></td><td><p>Activation</p></td><td><p>Duration</p></td></tr></thead><tbody><tr><td><p>40</p></td><td><p>20</p></td><td><p>Automatic</p></td><td><p>Action</p></td><td><p>Instant</p></td></tr></tbody></table><p><strong>Effect:
      </strong>You create a torrent of freezing air in a cylinder with a 10 foot
      radius and 60 foot height, centred on a location you can see within range.
      All Creatures within the area must make a Constitution Saving Throw
      against your Spell Save DC. On a failed Save, they take 6d8 Cold Damage
      and suffer the Frozen Condition. A Frozen Creature may reattempt the
      Saving Throw at the end of each of their Turns, ending the Condition on a
      success. On a successful Save, they take half as much Damage, and are not
      Frozen.</p><p><strong>Not Automated.</strong></p>
