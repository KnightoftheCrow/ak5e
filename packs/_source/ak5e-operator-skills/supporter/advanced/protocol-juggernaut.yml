      </strong>You create an Air Support Automaton (Page 466) at a location you
      can see within 10 feet. You control this Automaton as if you were an
      Artificer (See the Artificer Supporter’s Master of Machines Feature); this
      Automaton does not count against the maximum number of Automatons you can
      control. The Automaton you create in this way can take no Actions.
      However, when an allied Creature within 15 feet of that Drone would take
      Damage, the Drone can use its Reaction to negate that Damage against that
      Creature. After it has used this Reaction twice, or after 1 minute, the
      Automaton you created in this way self-destructs.</p><p><strong>Not
