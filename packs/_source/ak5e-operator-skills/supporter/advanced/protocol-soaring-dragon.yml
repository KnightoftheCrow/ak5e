      <table><thead><tr><td><p>SP Cost</p></td><td><p>Start
      SP</p></td><td><p>Charging</p></td><td><p>Activation</p></td><td><p>Duration</p></td></tr></thead><tbody><tr><td><p>50</p></td><td><p>15</p></td><td><p>Automatic</p></td><td><p>Action</p></td><td><p>Instant</p></td></tr></tbody></table><p><strong>Effect:
      </strong>You create an Air Supporter Automaton (Page 466) at a location
      you can see within 10 feet. You control this Automaton as if you were an
      Artificer (See the Artificer Supporter’s Master of Machines Feature); this
      Automaton does not count against the maximum number of Automatons you can
      control. The Automaton you create in this way can only take the following
      Action, as an Action; this Automaton chooses a location it can see within
      100 feet. All Creatures within 10 feet of that location must make a
      Dexterity Saving Throw against your Martial DC or Spell Save DC (your
      choice). On a failed Save, they take 3d6 Thunder Damage; on a successful
      Save, they take half as much Damage. After 1 minute, the Automaton you
      created in this way self-destructs.</p><p><strong>Not
      Automated.</strong></p>
