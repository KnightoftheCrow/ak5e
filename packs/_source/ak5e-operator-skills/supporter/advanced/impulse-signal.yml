      rounds</p></td></tr></tbody></table><p><strong>Effect: </strong>You create
      a zone of amplification in a 20-foot-radius sphere centred on a location
      you can see within 100 feet. When you create this zone, choose an Arts
      Damage Type. When a Creature takes Damage of the chosen Type while within
      that area, it takes additional Damage of that type equal to one roll of
      your Aid Die. Once a Creature has taken this additional Damage, it cannot
      take it again until the beginning of your next Turn. You can expend an
      Action during your Turn to extend the duration of this Operator Skill by 1
      Round, up to a maximum of 5 Rounds; when you do so, you may also move the
      sphere to a different location you can see within 100
      feet.</p><p><strong>Not Automated.</strong></p>
