      rounds</p></td></tr></tbody></table><p><strong>Effect: </strong>You create
      a 20 foot radius Sphere of silvery mist centred on a location you can see
      within 100 feet. This mist spreads around corners. When a hostile Creature
      that has the Invisible Condition or is hiding enters the area, they are
      revealed, losing the Invisible Condition. Allied Creatures within the area
      are considered to be in Half Cover.</p><p><strong>Not
      Automated.</strong></p>
