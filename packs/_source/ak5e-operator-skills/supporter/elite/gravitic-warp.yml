      a 20-foot-radius sphere of spatial manipulation Arts centred on a point
      you can see. For the duration, when a Creature would move while within the
      area, they must make an Intelligence Saving Throw against your Martial DC.
      On a failed Save, they take 6d6 Force Damage, and their Speed is reduced
      to 0 until the beginning of their next Turn. On a successful Save, they
      take half as much Damage, and their Speed is halved until the beginning of
      their next Turn.</p><p><strong>Not Automated.</strong></p>
