      Rounds</p></td></tr></tbody></table><p><strong>Effect: </strong>When you
      activate this Operator Skill, and as an Action on each of your subsequent
      Turns for the duration, you release a strange haze in a 30 foot sphere
      centred on you that confounds your enemies and empowers your allies.
      Hostile Creatures within the area must succeed on an Intelligence Saving
      Throw against your Spell Save or Martial DC (your choice) or have their
      Speed reduced to 0 until the beginning of your next Turn. Allied Creatures
      within the area recover Hit Points equal to one roll of your Aid
      Die.</p><p><strong>Not Automated.</strong></p>
