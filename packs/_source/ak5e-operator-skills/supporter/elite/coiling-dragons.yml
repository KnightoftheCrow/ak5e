      Rounds</p></td></tr></tbody></table><p><strong>Effect: </strong>Your
      Constructs are fitted with the ability to temporarily immobilize their
      foe. For the duration, when a Construct you have created hits a Creature
      with an Attack, that Creature must succeed on a Dexterity Saving Throw
      against your Martial DC or Spell Save DC (your choice) or have its Speed
      reduced to 0 until the beginning of your next Turn. Once a Creature has
      made this Saving Throw, it does not need to make it again until the end of
      your next Turn.</p><p><strong>Not Automated.</strong></p>
