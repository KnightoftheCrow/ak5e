    value: >-
      <table><thead><tr><td><p>SP Cost</p></td><td><p>Start
      SP</p></td><td><p>Charging</p></td><td><p>Activation</p></td><td><p>Duration</p></td></tr></thead><tbody><tr><td><p>20</p></td><td><p>15</p></td><td><p>Automatic</p></td><td><p>Action</p></td><td><p>Instant</p></td></tr></tbody></table><p>Draw
      a line on the ground originating from yourself, to 30 feet in length, and
      10 feet wide; you immediately move to the end point of this line, and all
      Creatures within the area must make a Strength Saving Throw against your
      Martial DC. On a failed Save, they take 3d6 Bludgeoning Damage and are
      knocked 20 feet in the same direction you moved. On a successful Save,
      they take half as much Damage, and are not moved.</p><p><strong>Partially
      Automated:</strong> Movement and push are manual.</p>
