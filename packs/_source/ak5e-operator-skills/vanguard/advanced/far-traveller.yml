      Action</p></td><td><p>4 Rounds</p></td></tr></tbody></table><p>When you
      use this Operator Skill, you create an invisible mote of Arts at a
      location you can see within 10 feet of you. At the end of your next Turn,
      that mote travels in a straight line directly towards you, dealing 6d6
      Force Damage to all other Creatures it passes through. After this, your
      Attacks deal additional Force Damage equal to your Proficiency Bonus for
      the duration.</p><p><strong>Not automated.</strong></p>
