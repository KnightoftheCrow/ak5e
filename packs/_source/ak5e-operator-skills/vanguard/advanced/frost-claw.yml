      Rounds</p></td></tr></tbody></table><p>When you use this Skill, and as an
      Action on subsequent Turns for the duration, you release a cutting blast
      of ice-cold Arts energy in a 30-ft long, 5-ft wide line. All Creatures
      within the line must make a Dexterity Saving Throw against your Martial
      DC, taking 4d6 Cold Damage on a failed Save, or half as much on a
      successful Save.</p><p><strong>Partially Automated:</strong> use the Save
      activity on subsequent rounds.</p>
