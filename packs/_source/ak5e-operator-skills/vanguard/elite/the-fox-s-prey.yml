      Action</p></td><td><p>3 Rounds</p></td></tr></tbody></table><p>The shadows
      around you strike along aside you, before reclaiming you into them. When
      you take the Attack Action, you may make three additional Attacks as part
      of this Action; the amount of additional Attacks you can make decreases by
      1 at the beginning of each of your Turns. If you score a Critical Hit,
      that Creature becomes Dazed until the end of their next Turn. When this
      Skill ends, if you have reduced a Creature to 0 Hit Points, you become
      Invisible for 1 minute, or until you make an Attack. You can end this
      Skill early during your Turn, no Action required.</p>
