    value: >-
      <table><thead><tr><td><p>SP Cost</p></td><td><p>Start
      SP</p></td><td><p>Charging</p></td><td><p>Activation</p></td><td><p>Duration</p></td></tr></thead><tbody><tr><td><p>65</p></td><td><p>35</p></td><td><p>Automatic</p></td><td><p>Action</p></td><td><p>Instant</p></td></tr></tbody></table><p>Choose
      a Creature you can see within 30 feet; that Creature must make a Dexterity
      Saving Throw against your Martial DC as your weapon flashes towards them
      in a blur. On a failed Save, they take six Hits from one weapon you are
      wielding. On a successful save, they take only three Hits. If the Creature
      is an Elite or Leader, they take six hits regardless of if they pass or
      fail, and you gain a barrier that completely negates the next Damage you
      would take from that Creature.</p><p><strong>Not automated.</strong></p>
