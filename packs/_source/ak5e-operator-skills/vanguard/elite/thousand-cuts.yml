    value: >-
      <table><thead><tr><td><p>SP Cost</p></td><td><p>Start
      SP</p></td><td><p>Charging</p></td><td><p>Activation</p></td><td><p>Duration</p></td></tr></thead><tbody><tr><td><p>65</p></td><td><p>30</p></td><td><p>Offensive</p></td><td><p>Action</p></td><td><p>2
      Rounds</p></td></tr></tbody></table><p>For the duration, you manifest a
      storm of slashes in a 15-foot-radius Sphere that is always centred on you.
      When a Creature (except you) enters the area or begins its Turn there, it
      takes 3d10 Slashing Damage. You may extend the duration of this Skill by 1
      Round by expending your Action, up to a maximum of 5
      Rounds.</p><p><strong>Partially Automated:</strong> duration extension
      isn't automated.</p>
