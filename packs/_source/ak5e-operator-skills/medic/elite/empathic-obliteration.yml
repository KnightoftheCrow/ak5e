  description:
    value: >-
      <table><thead><tr><td><p>SP Cost</p></td><td><p>Start
      SP</p></td><td><p>Charging</p></td><td><p>Activation</p></td><td><p>Duration</p></td></tr></thead><tbody><tr><td><p>60</p></td><td><p>20</p></td><td><p>Automatic</p></td><td><p>Reaction</p></td><td><p>Instant</p></td></tr></tbody></table><p><strong>Effect:</strong>
      When a Creature within 60 feet that you can see would take Damage, you can
      use this Operator Skill. The triggering Creature takes no Damage, but may
      still suffer additional effects. Then, choose a different Creature you can
      see within 60 feet; that Creature takes that instance of Damage instead
      (but does not suffer additional effects).</p><p><strong>Semi-Automated:
      </strong>You must use the Active Skill Activity before the Creature takes
      Damage; the effect causes the Creature to be immune to the next instance
      of Damage. After, use the Damage Reflection Activity and set the Scaling
      Value to the same value as the rolled Damage.</p>
