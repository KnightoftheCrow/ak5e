  description:
    value: >-
      <table><thead><tr><td><p>SP Cost</p></td><td><p>Start
      SP</p></td><td><p>Charging</p></td><td><p>Activation</p></td><td><p>Duration</p></td></tr></thead><tbody><tr><td><p>80</p></td><td><p>40</p></td><td><p>Automatic</p></td><td><p>Action</p></td><td><p>Instant</p></td></tr></tbody></table><p><strong>Effect:</strong>
      Choose two willing Creatures you can see within 100 feet; add up their
      total Hit Points, and divide the result by two, rounding up. If the
      current Hit Points of either Creature are less than this value, they gain
      Hit Points until it is equal to that value; this is considered to be you
      restoring Hit Points to that Creature.</p><p><strong>Not Automated:
      </strong>Use the Activate Skill Activity to choose your targets. Then, you
      must manually do the required maths, and use the Restore HP Activity to
      heal them by setting the scaling to the appropriate value for each
      Creature.</p>
