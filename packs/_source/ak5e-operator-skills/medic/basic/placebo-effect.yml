  description:
    value: >-
      <table><thead><tr><td><p>SP Cost</p></td><td><p>Start
      SP</p></td><td><p>Charging</p></td><td><p>Activation</p></td><td><p>Duration</p></td></tr></thead><tbody><tr><td><p>20</p></td><td><p>15</p></td><td><p>Automatic</p></td><td><p>Action</p></td><td><p>Instant</p></td></tr></tbody></table><p><strong>Effect:
      </strong>Choose a Creature you can see within 50 feet that has a negative
      Status Condition, and choose one such Status Condition on that Creature.
      That Status Condition is then removed, and all hostile Creatures within 10
      feet of that Creature must succeed on a Charisma Saving Throw against your
      Spell Save DC or suffer that Status Condition; they may reattempt this
      Saving Throw at the end of each of their Turns, ending the effect on a
      success.</p><p><strong>Semi-Automated: </strong>When you use the activity,
      ensure to exclude friendly Creatures. Additionally, you must apply the
      relevant condition to Creatures that fail the Save (they are marked with a
      Condition), and remove it from the initial Creature. Creatures make the
      Save at the end of their Turns automatically.</p>
