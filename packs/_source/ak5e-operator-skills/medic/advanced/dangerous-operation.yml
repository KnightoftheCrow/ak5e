      <table><thead><tr><td><p>SP Cost</p></td><td><p>Start
      SP</p></td><td><p>Charging</p></td><td><p>Activation</p></td><td><p>Duration</p></td></tr></thead><tbody><tr><td><p>30</p></td><td><p>10</p></td><td><p>Automatic</p></td><td><p>Bonus
      Action</p></td><td><p>3 Rounds</p></td></tr></tbody></table><p>When you
      restore Hit Points to a single Creature, all hostile Creatures within 10
      feet of that Creature must make a Dexterity Saving Throw against your
      Spell Save DC. On a failed Save, they take Necrotic Damage equal to half
      the Hit Points restored to the triggering Creature. On a successful Save,
      they take half as much Damage.</p><p><strong>Semi-Automated: </strong>When
      you use this Skill, use the scaling to select a value equal to 50% of the
      Hit Points you restored.</p>
