      </strong>Growth-promoting energy surges for a moment in a 10-foot-radius
      sphere centred on a point you can see within 60 feet, causing plants to
      sprout and bloom. Each creature of your choice in the Sphere must make a
      Constitution saving throw against your Spell Save DC, taking 3d6 Necrotic
      damage on a failed Save or half as much damage on a successful Save.
      Additionally, one Creature of your choice in that area regains 3d6 Hit
      Points.</p><p><strong>Not Automated.</strong></p>
