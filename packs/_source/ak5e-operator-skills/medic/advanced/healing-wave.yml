    value: >-
      <table><thead><tr><td><p>SP Cost</p></td><td><p>Start
      SP</p></td><td><p>Charging</p></td><td><p>Activation</p></td><td><p>Duration</p></td></tr></thead><tbody><tr><td><p>35</p></td><td><p>15</p></td><td><p>Automatic</p></td><td><p>Bonus
      Action</p></td><td><p>Instant</p></td></tr></tbody></table><p>You release
      a surge of restorative Arts that lands with a physical force; you project
      a 15-foot square originating from you. All hostile Creatures within the
      area must make a Strength Saving Throw against your Spell Save DC, taking
      4d6 Bludgeoning Damage and being pushed to the edge of the area on a
      failed Save. On a successful Save, they take half as much Damage, and are
      not pushed. One allied Creature of your choice within the area recovers
      2d6 Hit Points.</p><p><strong>Automated.</strong></p>
