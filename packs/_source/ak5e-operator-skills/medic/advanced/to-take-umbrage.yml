      Rounds</p></td></tr></tbody></table><p>Choose a willing Creature you can
      see within 30 feet; once per Turn, when a Creature hits that Creature with
      an Attack, the Attacker takes 1d12 Force Damage, and the Attacked Creature
      restores Hit Points equal to half of the Damage
      dealt.</p><p><strong>Semi-Automated: </strong>Activating the Skill marks
      your willing Creature; when that Creature is attacked, use the Deal Force
      Damage Activity; this will then trigger the Healing Activity. Use the
      scaling Feature to set the value to half of the Force Damage dealt.</p>
