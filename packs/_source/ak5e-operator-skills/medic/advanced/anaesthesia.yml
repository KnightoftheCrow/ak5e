      Rounds</p></td></tr></tbody></table><p>You release a 15-foot-radius sphere
      of debillitating gas centered on a grounded point you can see within 20
      feet of you. When a Creature enters the gas or starts its Turn there, they
      must succeed on a Constitution Saving Throw against your Spell Save DC or
      suffer Nervous Impairment until the beginning of their next Turn. The
      cloud moves 10 feet along the ground at the beginning of each of your
      Turns, as if it were moving away from the location you used this Skill
      at.</p>
