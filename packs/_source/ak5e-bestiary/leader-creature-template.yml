      description:
        value: >-
          <h3>Leader's Resistance</h3><p>(Some Leader Actions will call for a
          Leader’s Resistance Saving Throw. A Leader’s Resistance Saving Throw
          is a d20 roll; on a result of 11 or higher, the Saving Throw
          succeeds.)</p><p>[[lookup @name]] chooses one Condition, Art, or other
          effect with a duration of less than one year currently affecting them,
          and makes a Leader’s Resistance Saving Throw. On a successful Save,
          that Condition or Effect ends on them. [[lookup @name]] can use this
          Leader Action even if an effect would normally prevent them from
          taking Actions.</p><hr><p><strong>Semi-Automated: </strong>Use the
          Activity on this Feature to make a flat d20 Saving Throw and grant 1
          Menace. On a success, you must remove the effect yourself. </p>
