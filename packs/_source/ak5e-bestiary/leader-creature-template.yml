items:
  - name: Leader Creature
    type: feat
    _id: toGgSkX9FWveReQF
    img: icons/environment/people/cavalry-heavy.webp
    system:
      activities: {}
      uses:
        recovery: []
        max: ''
        spent: 0
      advancement:
        d4P1tcSq24pWnDcp:
          name: Baseline Leader Mechanics
          type: ItemGrant
          _id: d4P1tcSq24pWnDcp
          configuration:
            items:
              - optional: false
                sort: 0
                uuid: Item.vZnj6SVwdjeO6Ul7
              - uuid: Item.SksHk7O07JVQLM0E
                optional: false
                sort: 0
            optional: false
            sorting: m
            spell: null
          flags: {}
          value: {}
          level: 0
          hint: ''
      description:
        value: >-
          <p>This Creature is a Leader, and has a number of special rules
          governing it. Some Features will look for this feature to function
          correctly. Drag this Feature onto prospective Leader
          Creatures.</p><h3>Leader Actions</h3><p>During its Turn, a Leader can
          move and interact with objects as normal. However, a Leader does not
          take any Actions or Bonus Actions during its Turn unless:</p><p>A)
          They are forced to do so by another effect.</p><p>B) They can use
          their Action to reattempt a Saving Throw.</p><p>C) They can use their
          Action to continue an Art (Such as Sunbeam)</p><p>Instead, Leaders
          take Leader Actions as described in their statblock.</p><p>A Leader
          takes one Leader Action at the end of each Player Character’s Turn. At
          the GM’s discretion, a Leader may take a Leader Action after a
          non-Player Character’s Turn, such as a sidekick or major ally of the
          Player Characters. Some Leader Actions have additional restrictions on
          how often they can be used, such as requiring the Leader to expend
          Menace (detailed below), or a limited amount of times per Round
          (detailed on the Leader Action). Leader Actions are considered to be
          Actions, and thus any effect preventing a Leader from taking an Action
          will prevent them from taking Leader Actions.</p><h3>Leader's
          Resistance</h3><p>Some Leader Actions will call for a Leader’s
          Resistance Saving Throw. A Leader’s Resistance Saving Throw is a d20
          roll; on a result of 11 or higher, the Saving Throw
          succeeds.</p><h3>Menace</h3><p>Menace is spent to perform special
          Leader Actions or Reactions; the maximum Menace a Creature can have is
          10.</p><ul><li><p>A Leader Creature gains Menace when it rolls
          Initiative equal to the number of current Players.</p></li><li><p>A
          Leader Creature gains 1 Menace each time it takes a Leader Action, or
          ends its Turn; a Creature does not gain Menace after a Leader Action
          that expended any Menace.</p></li></ul><h3>Scaling Hit
          Points</h3><p>When a Leader Creature’s Hit Points are determined, the
          amount is then modified by the number of Players. Each Leader Creature
          statblock has an additional number in brackets next to its Hit Points.
          For each additional Player beyond four, the Creature’s maximum Hit
          Points are increased by the value in brackets.</p><p>If there are less
          than four Players, the Creature’s maximim Hit Points are decreased by
          the value in brackets; the Creature’s Maximum Hit Points can only be
          decreased in this way two times.</p>
        chat: ''
