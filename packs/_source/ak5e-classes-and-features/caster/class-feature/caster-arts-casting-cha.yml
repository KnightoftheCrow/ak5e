  description:
    value: >-
      <p>You can cast Arts in a way most Terrans
      cannot.</p><ul><li><p><strong>Arts Pool:</strong> Choose one of the
      Standard Arts Pools; you learn all of the Arts in that Pool, and they are
      always Prepared.</p></li><li><p><strong>Arts Points:</strong> The Caster
      Features table shows how many Arts Points (AP) you have to cast Arts of
      Level 1 or higher. You regain all expended Arts Points when you finish a
      Long Rest.</p></li><li><p><strong>Maximum Arts Level:</strong> The Caster
      Features table shows the maximum Level you can cast an Art at, based on
      your Caster Level. If an Art’s Level is above your current Maximum Art
      Level, you cannot cast it, even if it is
      Prepared.</p></li><li><p><strong>Spellcasting Ability:</strong> When you
      gain this Feature, choose either Intelligence, Wisdom, or Charisma; that
      is your Spellcasting Ability.</p></li></ul>
