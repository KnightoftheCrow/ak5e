  description:
    value: >-
      <p>Explosives aren’t all about the heat of the moment.</p><p>Once per
      Short Rest, when you would use a weaponwith the Splash (X) Property during
      an Attack, you can instead choose to fire a specially fused munition at
      apoint you can see within the range of that weapon. As a Reaction to a
      Creature moving, you can detonate that munition; resolve an Attack with
      the weapon you used on the point you chose, as per the Splash (X)
      Property. If you do not manually detonate it, it detonates automatically
      after 10 minutes unless you disarm it as an Action while within 5
      feet.</p><p><strong>Not Automated.</strong></p>
