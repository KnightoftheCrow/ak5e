  description:
    value: >-
      <p>You can focus all of your might on a singular enemy in a concerted
      effort to destroy them utterly.</p><p>An an Action, choose a Creature you
      can see within 100 feet; that Creature must make a Dexterity Saving Throw
      against your Spell Save DC. On a failed Save, they take 4d8 Arts
      Bludgeoning Damage for each Bound Weapon you have. On a successful Save,
      they take half as much Damage. All of your Bound Weapons are then placed
      in empty spaces as close to that Creature as possible.</p><p>Once you have
      used this Feature, you may not do so again until you have completed a Long
      Rest.</p><hr><p><strong>Semi-Automated: </strong>Set the scaling value to
      your number of Bound Weapons. Afterwards, manually move your Bound Weapons
      close to the target.</p>
