    value: >-
      <p>For many, Arts are an end rather than a means. Flinger Marksmen believe
      in the opposite; they are a tool to be utilized, not an end unto
      themselves. Using their honed Arts, they control the field; and strike
      like a missile.</p><p>You gain the following Branch
      Features:</p><table><tbody><tr><td
