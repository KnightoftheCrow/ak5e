  advancement: {}
  description:
    value: >-
      <p>Your Arts are built not for long term care, but urgent, instant first
      aid, enough to get someone back on their feet. You gain the following
      benefits:</p><ul><li><p><strong>My Spirit for Yours.</strong> During your
      Turn, you may expend any amount of your current Resilience (no Action
      required); for each Resilience you expend, you regain 1 expended Arts
      Point.</p></li><li><p><strong>Painkiller.</strong> When you restore Hit
      Points to a Creature, you can also grant 1d8 Temporary Hit Points to that
      Creature. If you expend 2 Resilience, you can grant 3d8 Temporary Hit
      Points instead.</p></li></ul><hr><p><strong>Automated.</strong></p>
