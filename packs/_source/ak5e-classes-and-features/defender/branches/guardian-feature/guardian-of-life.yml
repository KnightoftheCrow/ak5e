  description:
    value: >-
      <p>You can cast Arts; the information below details how you use those
      rules as a Guardian.</p><ul><li><p><strong>Arts Points:</strong> The
      Guardian Arts Casting table shows how many Arts Points you have to cast
      your Level 1+ Arts. You regain all expended Arts Points when you finish a
      Long Rest.</p></li><li><p><strong>Maximum Arts Level:</strong> The
      Guardian Arts Casting table shows the maximum Level you can cast an Art
      at, based on your Defender Level.</p></li><li><p><strong>Spellcasting
      Ability:</strong> When you gain this Feature, choose either Intelligence,
      Wisdom, or Charisma; that is your Spellcasting
      Ability.</p></li><li><p><strong>Spellcasting Focus:</strong> Shields
      equipped by you gain the Casting Unit Property for the
      duration.</p></li><li><p><strong>Guardian Arts Pool:</strong> When you
      gain this Feature, you learn all of the Arts from the Healing Arts Special
      Arts Pool of 5th Level or less, including all Cantrips in that Pool. These
      Arts are always
      prepared.</p></li></ul><table><thead><tr><td><p>Level</p></td><td><p>Maximum
      Art Level</p></td><td><p>Arts
      Points</p></td></tr></thead><tbody><tr><td><p>1</p></td><td><p>1</p></td><td><p>3</p></td></tr><tr><td><p>2</p></td><td><p>1</p></td><td><p>3</p></td></tr><tr><td><p>3</p></td><td><p>1</p></td><td><p>4</p></td></tr><tr><td><p>4</p></td><td><p>1</p></td><td><p>4</p></td></tr><tr><td><p>5</p></td><td><p>2</p></td><td><p>6</p></td></tr><tr><td><p>6</p></td><td><p>2</p></td><td><p>6</p></td></tr><tr><td><p>7</p></td><td><p>2</p></td><td><p>7</p></td></tr><tr><td><p>8</p></td><td><p>2</p></td><td><p>7</p></td></tr><tr><td><p>9</p></td><td><p>3</p></td><td><p>10</p></td></tr><tr><td><p>10</p></td><td><p>3</p></td><td><p>10</p></td></tr><tr><td><p>11</p></td><td><p>3</p></td><td><p>11</p></td></tr><tr><td><p>12</p></td><td><p>3</p></td><td><p>11</p></td></tr><tr><td><p>13</p></td><td><p>4</p></td><td><p>12</p></td></tr><tr><td><p>14</p></td><td><p>4</p></td><td><p>12</p></td></tr><tr><td><p>15</p></td><td><p>4</p></td><td><p>15</p></td></tr><tr><td><p>16</p></td><td><p>4</p></td><td><p>15</p></td></tr><tr><td><p>17</p></td><td><p>5</p></td><td><p>16</p></td></tr><tr><td><p>18</p></td><td><p>5</p></td><td><p>16</p></td></tr><tr><td><p>19</p></td><td><p>5</p></td><td><p>17</p></td></tr><tr><td><p>20</p></td><td><p>5</p></td><td><p>17</p></td></tr></tbody></table><hr><p><strong>Automated.</strong></p>
