  description:
    value: >-
      <p>You may have dedicated a part of yourself to the healing of others, but
      you are still a frontline fighter; woe betide those who forget
      that.</p><p>You can activate this Feature as a Bonus Action. For the next
      minute, whenever you make an Attack against a hostile Creature, you may
      restore 1d4 Hit Points to a Creature of your choice that you can see
      within 30 feet (no Action required). This amount is increased to 1d6 at
      7th Level, and 1d8 at 14th Level.</p><p>Once you have used this Feature,
      you may not do so again until you complete a Long
      Rest.</p><hr><p><strong>Semi-Automated: </strong>You must manually trigger
      the heal Activity on this Feature when required.</p>
