  description:
    value: >-
      <p>Defenders treading the path of the Dreadnought seek always to bare
      their fangs at the strongest. For them, the fortitude they develop is not
      the goal, but merely a means for them to withstand enough punishment to
      reach their desired foe, and crush them mercilessly.</p><p>You gain the
      following Branch Features:</p><table><tbody><tr><td
