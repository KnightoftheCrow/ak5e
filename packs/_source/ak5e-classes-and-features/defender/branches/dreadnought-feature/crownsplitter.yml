  description:
    value: >-
      <p>You can focus your strength even more than the average warrior, doling
      out blows that can crack concrete with regularity.</p><p>While you have an
      Active Operator Skill, your Melee Attacks deal additional Damage equal to
      your Strength Modifier. If the target of that Melee Attack is an Elite or
      Leader Creature, this additional Damage is increased to twice your
      Strength Modifier.</p><hr><p><strong>Semi-Automated: </strong>Options for
      adding the Damage from Crownslayer are AC5e Opt-In Options.</p>
