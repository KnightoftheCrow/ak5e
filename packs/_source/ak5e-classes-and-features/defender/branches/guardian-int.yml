  description:
    value: >-
      <p>A Defender’s role is to protect; all Defenders would agree, but what
      they protect is a matter of individual taste. For some, it’s themselves,
      others their allies; Guardian Defenders fall in the latter camp with
      fervour. It is not enough to simply prevent harm coming to them, but to
      cure any harm that does befall them.</p><p>You gain the following Branch
      Features:</p><table><tbody><tr><td
      data-colwidth="50"><p><strong>Level</strong></p></td><td><p><strong>Branch
      Feature</strong></p></td></tr><tr><td data-colwidth="50"><p
      style="text-align:center">1</p></td><td><p>@UUID[Compendium.ak5e.ak5e-classes-and-features.Item.3iC1qXCR22DZ4YGA]{Guardian
      of Life}</p></td></tr><tr><td data-colwidth="50"><p
      style="text-align:center">4</p></td><td><p>@UUID[Compendium.ak5e.ak5e-classes-and-features.Item.Kze7HMzW47lgynji]{The
      Best Medicine}</p></td></tr><tr><td data-colwidth="50"><p
      style="text-align:center">9</p></td><td><p>@UUID[Compendium.ak5e.ak5e-classes-and-features.Item.uc92aH853DX2Gfxr]{Not
      Today}</p></td></tr><tr><td data-colwidth="50"><p
      style="text-align:center">12</p></td><td><p>@UUID[Compendium.ak5e.ak5e-classes-and-features.Item.VWnFZHgs0Y1w4aT5]{Aura
      of Mercy}</p></td></tr><tr><td data-colwidth="50"><p
      style="text-align:center">15</p></td><td><p>@UUID[Compendium.ak5e.ak5e-classes-and-features.Item.dOyqDxX3fErXtv1v]{Guardian
      At Death's Door}</p></td></tr></tbody></table>
