  description:
    value: >-
      <p>An Artshield is a specialist in the field of combatting Casters. They
      combine heavy equipment and rigorous training to develop the necessary
      strength to weather the storm, augementing their significant strength with
      their own unique Arts. When hostile Arts threaten their allies, Artshields
      stand to take the brunt, before retailiating with disruptive
      strikes.</p><p>You gain the following Branch
      Features:</p><table><tbody><tr><td
      data-colwidth="50"><p><strong>Level</strong></p></td><td><p><strong>Branch
      Feature</strong></p></td></tr><tr><td data-colwidth="50"><p
      style="text-align:center">1</p></td><td><p>@UUID[Compendium.ak5e.ak5e-classes-and-features.Item.AKP43YGj6KvrLj0f]{Against
      the Storm}</p></td></tr><tr><td data-colwidth="50"><p
      style="text-align:center">4</p></td><td><p>@UUID[Compendium.ak5e.ak5e-classes-and-features.Item.DhjjgZIfg0D2VAl8]{Weapons
      of the Enemy}</p></td></tr><tr><td data-colwidth="50"><p
      style="text-align:center">9</p></td><td><p>@UUID[Compendium.ak5e.ak5e-classes-and-features.Item.49QAELRp3gD3OWEj]{Oppressive
      Force}</p></td></tr><tr><td data-colwidth="50"><p
      style="text-align:center">12</p></td><td><p>@UUID[Compendium.ak5e.ak5e-classes-and-features.Item.pKS4qzxWCvyhY3mT]{Stormchaser}</p></td></tr><tr><td
