  description:
    value: >-
      <p>No matter the situation, your allies know they can turn to you to keep
      their heads above the water. You gain the following
      benefits:</p><ul><li><p><strong>Automatic Defence.</strong> If you are not
      Incapacitated, and are wielding a shield with the Bastion Property, allied
      Creatures within 10 feet of you have Advantage on Strength and Dexterity
      Saving Throws against effects you can see.</p></li><li><p><strong>Tide
      Turner.</strong> When you use your Shelter Action, you can expend 1
      Resilience to choose 1 allied Creature within the radius of that Shelter
      Action (no Action required); that Creature gains Temporary Hit Points
      equal to 2d6 + your Constitution Modifier, until the beginning of your
      next Turn. Granting these Temporary Hit Points is considered to be
      restoring Hit Points for the purposes of gaining
      Mettle.</p></li></ul><hr><p><strong>Semi-Automated: </strong>Automatic
      Defence is automated.<strong> </strong>Use the Enchantment Activity on
      this Feature to upgrade your Shelter Feature with new Activities; however,
      the Temporary Hit Points are not removed at the beginning of your next
      Turn.</p>
