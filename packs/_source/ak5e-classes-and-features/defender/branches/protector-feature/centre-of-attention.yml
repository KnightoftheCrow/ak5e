  description:
    value: >-
      <p>Your expertise is in the protecting of others, and it shows.</p><p>When
      you use your Shelter Action, you may additionally attempt to taunt
      Creatures of your choice within 10 feet that can see or hear you (no
      Action required). Those Creatures must succeed on a Wisdom Saving Throw
      against your Protector DC, or be Taunted by you until the end of their
      next Turn. A Taunted Creature must take a hostile Action against you if it
      is able; if its Action would target an area (such as casting the Fireball
      Art), you must be within the affected area.</p><p>You can use this Feature
      a number of times equal to your Constitution Modifier (min. 1), and regain
      all expended uses upon finishing a Long Rest.</p><hr><p><strong>Automation
      not required.</strong></p>
