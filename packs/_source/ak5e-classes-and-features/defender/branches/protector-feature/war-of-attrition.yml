  description:
    value: >-
      <p>You don’t have to defeat your foes, per se. You just have to outlast
      them.</p><ul><li><p><strong>Unending Defence.</strong> If your Turn ends
      and you have no Resilience remaining, you recover 1
      Resilience.</p></li><li><p><strong>Walking Bunker.</strong> The Resilience
      Cost of using your Shelter Action as a Bonus Action is reduced to
      0.</p></li></ul><hr><p><strong>Semi-Automated: </strong>Use the
      Enchantment Activity on this Feature to upgrade your Shelter Feature with
      new Activities. Walking Bunker cannot be automated; manually reduce the
      cost of your BA Shelter Actions.</p>
