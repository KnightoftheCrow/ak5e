  description:
    value: >-
      <p>You are unbreakable; this wall shall never
      fall.</p><ul><li><p><strong>Improved Taunt.</strong> You are Resistant to
      Damage dealt by Creatures that are Taunted by
      you.</p></li><li><p><strong>Greater Improved Shelter.</strong> When you
      use your Shelter Action, you can expend 2 Resilience to cause Creatures of
      your choice with 10 feet (except you) to become Resistant to all Damage. A
      Creature loses this Resistance at the end of at their Turn, or immediately
      after taking any Damage.</p></li></ul><hr><p><strong>Semi-Automated:
      </strong>You are resistant to the Damage of Taunt Creatures. Use the
      Enchantment Activity on this Feature to upgrade your Shelter Feature with
      new Activities.</p>
