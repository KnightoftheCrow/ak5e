  advancement: {}
  description:
    value: >-
      <p>You don’t have to defeat your foes, per se. You just have to outlast
      them. You gain the following benefits:</p><ul><li><p><strong>Improved
      Shelter.</strong> The Radius of your Shelter Action is increased to 10
      feet from 5 feet.</p></li><li><p><strong>Punishment.</strong> When you hit
      a Creature with an Attack, or a Creature fails a Saving Throw against you,
      that Creature has Disadvantage on the next Attack Roll it makes before the
      end of your next Turn.</p></li><li><p><strong>Shield Bash.</strong> When a
      Creature hits you with a Melee Attack while you are wielding a shield with
      the Bastion Property, you can attempt to knock them off Balance as a
      Reaction. That Creature must succeed on a Strength Saving Throw against
      your Protector DC or be knocked Off Balance until the end of your next
      Turn. Attacks against Creatures that have been knocked Off Balance are
      made at Advantage.</p><p>From 7th Level, Creatures that fail this Saving
      Throw also take Bludgeoning Damage equal to 1d8 + your Constitution
      Modifier.</p></li></ul><hr><p><strong>Semi-Automated: </strong>Use the
      activites on this Feature when appropriate. Shield Bash automatically
      applies Punishment on failed Save.</p>
    chat: ''
