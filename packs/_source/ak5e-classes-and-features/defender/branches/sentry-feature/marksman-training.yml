  description:
    value: >-
      <p>You learn to better blend your identity as a ranged Defender, creating
      a potent hybrid.</p><ul><li><p><strong>Operator Skill Access.</strong>
      Whenever you gain a new Operator Skill, you may instead choose a Skill
      from the appropriate Operator Skills table available to the Marksman
      Class.</p></li><li><p><strong>Additional Fighting Style.</strong> You gain
      a Fighting Style from one of the options available to the Marksman
      Class.</p></li></ul><hr><p><strong>Automated: </strong>Fighting Style
      selection is automated; when choosing Operator Skills, you may drag in
      Marksman Skills in lieu of choosing a Defender Skill.</p>
