    value: >-
      <p>When a Creature makes an Attack against you, or a Creature benefitting
      from your Shelter Action, you can make a Ranged Weapon Attack against the
      Attacking Creature as a Reaction. After making this Attack, you can expend
      1 Resilience to refund use of your Reaction.</p><hr><p><strong>Cannot be
      automated: </strong>The Activities on this Feature are just for tracking
      purposes.</p>
