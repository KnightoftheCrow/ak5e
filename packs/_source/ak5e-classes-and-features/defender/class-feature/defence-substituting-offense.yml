  description:
    value: >-
      <p>Every Defender has a different road to tread; you must choose your own
      path. Choose of one the following options:</p><ul><li><p><strong>Extra
      Attack.</strong> When you take the Attack Action, you can make an
      additional Attack as part of that Action.</p></li><li><p><strong>Skilled
      Defender.</strong> You gain 1 Skill Point whenever a hostile Creature
      makes an Attack against you, or you take Damage from a hostile Creature
      through a non-Attack source. This is increased to 2 Skill Points at 7th
      Level, and 3 Skill Points at 14th Level.</p></li></ul>
