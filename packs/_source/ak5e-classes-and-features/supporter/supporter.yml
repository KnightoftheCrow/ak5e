  description:
    value: >-
      <h3>Core Supporter Traits</h3><table><tbody><tr><td data-colwidth="142"><p
      style="text-align:center"><strong>Primary
      Ability</strong></p></td><td><p>Charisma/Wisdom</p></td></tr><tr><td
      data-colwidth="142"><p style="text-align:center"><strong>Hit Point
      Die</strong></p></td><td><p>D6 per Supporter level</p></td></tr><tr><td
      data-colwidth="142"><p style="text-align:center"><strong>Saving Throw
      Proficiencies</strong></p></td><td><p>Two from the following:
      Constitution, Charisma, Wisdom</p></td></tr><tr><td data-colwidth="142"><p
      style="text-align:center"><strong>Skill
      Proficiencies</strong></p></td><td><p>Choose 3 from: Arts, Lore, Tech,
      Insight, Deception, Persuasion</p></td></tr><tr><td data-colwidth="142"><p
      style="text-align:center"><strong>Weapon
      Proficiencies</strong></p></td><td><p>Light Melee</p></td></tr><tr><td
      data-colwidth="142"><p style="text-align:center"><strong>Tool
      Proficiencies</strong></p></td><td><p>A Tool Kit/Vehicle Proficiency of
      your Choice</p></td></tr><tr><td data-colwidth="142"><p
      style="text-align:center"><strong>Armor
      Training</strong></p></td><td><p>Light Armour, Light
      Shields</p></td></tr><tr><td data-colwidth="142"><p
      style="text-align:center"><strong>Starting
      Equipment</strong></p></td><td><p>Choose A or B:</p><p>(A): (a) 1x Light
      Melee Weapon</p><p>(a) 1x Light Melee Weapon or (b) 1x Light
      Shield;</p><p>(a) Protective Clothing;</p><p>2x Tool Kit you are
      Proficient with;</p><p>(B): 1300
      LMD.</p></td></tr></tbody></table><h3>Facilitators and Fixers</h3><p>The
      role of a Supporter is rarely to take centre stage, though they do not shy
      away from it. Supporters, both moral and immoral, exist to facilitate the
      actions of their comrades; to allow them to reach new heights, and in so
      doing take the Supporter with them. They function best at the core of a
      coordinated team effort, delivering aid where it is needed, when it is
      needed.</p>
