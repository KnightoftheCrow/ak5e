  description:
    value: >-
      <p>Your efforts can lift entire armies up. </p><p>When a Creature other
      than yourself within 60 feet of you rolls one of your Aid Die, you can use
      your Reaction to choose a different Creature that can hear you, except
      yourself, within 60 feet and grant them one of your Aid Die without
      expending any of your Aid Die. You cannot use this Feature on these
      supplementary Aid Dice.</p><hr><p><strong>Semi-Automated: </strong>A new
      activity has been added to your Provide Aid Feature; trigger it when
      appropriate.</p>
