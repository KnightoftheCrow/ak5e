  description:
    value: >-
      <p>Your calling is to help others achieve the peak of their capability.
      This help is represented by your Aid Die, which is a
      d8.</p><ul><li><p><strong>Providing Aid.</strong> As a Bonus Action, you
      can Provide Aid to another Creature within 60 feet who can see or hear
      you. This consumes one of your Aid Dice, and grants it to that Creature. A
      Creature can only have one Aid Die at a time.</p><p>Once within the next
      ten minutes, when that Creature makes an Attack Roll, Skill Check, Saving
      Throw (except Death Saving Throws), Damage Roll, or Healing Roll, they may
      expend and roll that Aid Dice, adding the number rolled to the
      total.</p></li><li><p><strong>Number of Uses.</strong> The amount of Aid
      Dice you possess is equal to either your Intelligence, Wisdom, or Charisma
      Modifier (choose when you gain this Feature). You regain all expended uses
      when you finish a Long Rest.</p></li><li><p><strong>Aid Die Size.</strong>
      Your Aid Die is a d8. This increases to a d10 at 7th Level, and d12 at
      14th Level.</p></li></ul><hr><p><strong>Automated: </strong>By default
      this scales with Intelligence. Change the stat referenced (int) in the max
      section of usage (under the details tab) to wis or cha respectively.</p>
