  description:
    value: >-
      <p>When a Creature expends your Aid Die, they gain an additional effect
      based on whether the die is benefitting a Attack Roll, Skill Check, Saving
      Throw, Damage Roll, or Healing Roll, as detailed in the Advanced Aid
      table:</p><table><tbody><tr><td><p
      style="text-align:center"><strong>Benefitting Roll</strong></p></td><td><p
      style="text-align:center"><strong>Additional
      Effect</strong></p></td></tr><tr><td><p>Attack Roll</p></td><td><p
      style="text-align:center">The Critical Range of that Attack is increased
      by 1.</p></td></tr><tr><td><p>Skill Check</p></td><td><p
      style="text-align:center">The Creature rolls your Aid Die an additional
      time, and choose which result they wish to
      use.</p></td></tr><tr><td><p>Saving Throw</p></td><td><p
      style="text-align:center">The Creature can gain Temporary Hit Points equal
      to the amount rolled on your Aid Die + your Proficiency
      Bonus.</p></td></tr><tr><td><p>Damage Roll</p></td><td><p
      style="text-align:center">When a Creature rolls this Aid Die to increase
      the Damage they deal, they can choose a different Creature within 10 feet
      of a Creature they are going to Damage; that additional Creature takes
      Force Damage equal to the amount rolled on the Aid
      Die.</p></td></tr><tr><td><p>Healing Roll</p></td><td><p
      style="text-align:center">Creatures that recover Hit Points from this Roll
      can also gain Temporary Hit Points equal to the amount rolled on your Aid
      Die.</p></td></tr></tbody></table>
