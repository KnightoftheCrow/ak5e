    value: >-
      <p>You are a steadfast pillar of the team, without whom they would surely
      crumble. You gain the following benefits:</p><ul><li><p><strong>Aid Die
      Regeneration.</strong> If your Turn begins and you have no Aid Dice
      remaining, you regain one Aid Die.</p></li><li><p><strong>Short Rest
      Refill.</strong> Whenever you finish a Short Rest, you recover Aid Dice
      equal to half of your maximum Aid Dice, rounding
      up.</p></li></ul><hr><p><strong>Automated.</strong></p>
