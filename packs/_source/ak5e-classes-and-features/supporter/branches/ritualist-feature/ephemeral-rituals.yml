  advancement: {}
  description:
    value: >-
      <p>When you activate an Ephemeral Ritual, you gain that benefit until you
      next complete a Long Rest, after which you must activate the Ritual again
      to regain the benefit.</p><table><thead><tr><td><p
      style="text-align:center"><strong>Ritual Name</strong></p></td><td><p
      style="text-align:center"><strong>Ritual
      Benefits</strong></p></td></tr></thead><tbody><tr><td><p>Burning Infusion
      (Automated)</p></td><td><p>Once per Turn, when you deal Fire Damage to a
      Creature or Creatures, one of those Creatures (of your choice) suffers the
      Burning Condition.</p></td></tr><tr><td><p>Corrosive Infusion
      (Automated)</p></td><td><p>Once per Turn, when you deal Acid Damage to a
      Creature or Creatures, one of those Creatures (of your choice) must
      succeed on a Constitution Saving Throw against your Spell Save DC or
      suffer the Corroded Condition. They can attempt this Saving Throw again at
      the end of each of their Turns, ending the Condition on a
      success.</p></td></tr><tr><td><p>Lightning Infusion
      (Automated)</p></td><td><p>Once per Turn, when you deal Lightning Damage
      to a Creature or Creatures, one of those Creatures (of your choice) must
      succeed on a Constitution Saving Throw against your Spell Save DC or
      suffer the Nervous Impairment Condition. They can attempt this Saving
      Throw again at the end of each of their Turns, ending the Condition on a
      success.</p></td></tr><tr><td><p>Necrotic Infusion
      (Automated)</p></td><td><p>Once per Turn, when you deal Necrotic Damage to
      a Creature or Creatures, one of those Creatures (of your choice) must
      succeed on a Constitution Saving Throw against your Spell Save DC or
      suffer the Necrotised Condition. They can attempt this Saving Throw again
      at the end of each of their Turns, ending the Condition on a
      success.</p></td></tr><tr><td><p>Jack of Trades (Not
      Automated)</p></td><td><p>You gain Proficiency in three Skills of your
      Choice; if you are already Proficient in a chosen Skill, you instead gain
      Expertise.</p></td></tr><tr><td><p>Invocation of Rebounding (Not
      Automated)</p></td><td><p>Once per Turn, when you make an Attack Roll
      against a Creature and miss, you may reroll that Attack Roll, possibly
      turning that miss into a Hit. You may use this Feature a number of times
      equal to your Proficiency Bonus.</p></td></tr><tr><td><p>Invocation of
      Blades (Automated)</p></td><td><p>You gain a +1 Bonus to Attack and Damage
      Rolls for Melee Attacks. Additionally, you may convert Physical Damage
      dealt by your Melee Attacks into Force Damage
      instead.</p></td></tr><tr><td><p>Fundamental Ritual
      (Automated)</p></td><td><p>Your Spell Save DC is increased by
      1.</p></td></tr><tr><td><p>Vindictive Invocation (Not
      Automated)</p></td><td><p>A Creature that has a Status Condition inflicted
      by you takes Force Damage at the end of their Turn equal to one roll of
      your Aid Die.</p></td></tr><tr><td><p>Lightstep Ritual (Not
      Automated)</p></td><td><p>Allied Creatures within 15 feet of you are not
      slowed by Difficult Terrain that you can
      see.</p></td></tr><tr><td><p>Invocation of Equity (Not
      Automated)</p></td><td><p>When you cast an Art on an allied Creature that
      does not restore Hit Points or deal Damage, you may target one additional
      Creature to gain the benefit of that
      Art.</p></td></tr><tr><td><p>Lifeguard Invocation (Semi
      Automated)</p></td><td><p>You learn the Prayer of Healing Art; it is
      always Prepared, and does not count towards your Known Arts. Additionally,
      when a Creature gains or grants Temporary Hit Points as a result of
      expending your Aid Die, they may instead convert those Temporary Hit
      Points to Hit Points instead.</p></td></tr></tbody></table>
    chat: >-
      <p>When you activate an Ephemeral Ritual, you gain that benefit until you
      next complete a Long Rest, after which you must activate the Ritual again
      to regain the benefit.</p>
