  description:
    value: >-
      <p>Here is the list of all your Permanent
      Rituals.</p><table><tbody><tr><td><p
      style="text-align:center"><strong>Ritual Name</strong></p></td><td><p
      style="text-align:center"><strong>Essence Cost</strong></p></td><td><p
      style="text-align:center"><strong>Ritual
      Benefits</strong></p></td></tr><tr><td><p>Burning
      Ascension</p></td><td><p>20</p></td><td><p>The first time each Turn you
      hit a Creature with an Attack, that Attack deals additional Fire Damage
      equal to one roll of your Aid Die. Additionally, Fire Damage dealt by you,
      or from a Burning Condition inflicted by you, ignores Resistances and DR
      against Fire Damage.</p></td></tr><tr><td><p>Corrosive
      Ascension</p></td><td><p>20</p></td><td><p>The first time each Turn you
      hit a Creature with an Attack, that Attack deals additional Acid Damage
      equal to one roll of your Aid Die. Additionally, when you inflict the
      Corroded Condition on a Creature, they lose all Resistances to Physical
      Damage for the next instance of Damage they
      suffer.</p></td></tr><tr><td><p>Enervating
      Ascension</p></td><td><p>20</p></td><td><p>The first time each Turn you
      hit a Creature with an Attack, that Attack deals additional Lightning
      Damage equal to one roll of your Aid Die. Additionally, when you inflict
      the Nervous Impairment Condition on a Creature, while it has that
      Condition, the first time each Turn that Creature takes an Action they
      lose Hit Points equal to one roll of your Aid
      Die.</p></td></tr><tr><td><p>Necrotic
      Ascension</p></td><td><p>20</p></td><td><p>The first time each Turn you
      hit a Creature with an Attack, that Attack deals additional Necrotic
      Damage equal to one roll of your Aid Die. Additionally, once per Turn,
      when a Creature that has the Necrotised Condition that was inflicted by
      you would deal Damage, you can cause that Damage to be halved (no Action
      required); this effect is applied before the -3 Damage of the Necrotised
      Condition.</p></td></tr><tr><td><p>Ephemeral
      Lord</p></td><td><p>20</p></td><td><p>When you complete an Ephemeral
      Ritual, each Creature of your choice within 30 feet gains one of your Aid
      Dice; this does not consume your Aid Dice.</p></td></tr><tr><td><p>Occult
      Charm</p></td><td><p>20</p></td><td><p>If you make a Charisma-based Skill
      Check against a Creature, and the result is less than your Charisma Score,
      you can change the result to be equal to your Charisma Score (no Action
      required). Once you have used this Feature, you may not do so again until
      you have completed a Short or Long Rest.</p></td></tr><tr><td><p>Rituals
      of Battle</p></td><td><p>20</p></td><td><p>Once per Turn, when a Creature
      you can see who you have Damaged since the beginning of your last Turn is
      reduced to 0 Hit Points, you regain one of your expended Aid
      Dice.</p></td></tr><tr><td><p>True Warrior's
      Ritual</p></td><td><p>20</p></td><td><p>Your Strength is increased by 2,
      to a maximum of 20. Additionally, you may use your Strength Modifier as
      your Spellcasting Modifier. Finally, if you have made an Weapon Attack
      Roll using Strength during your Turn, you may cast a Cantrip with a
      Casting Time of Action as a Bonus
      Action.</p></td></tr><tr><td><p>Allknower</p></td><td><p>30</p></td><td><p>You
      may add half of your Proficiency Bonus, rounding up, to the results of
      Skill Checks using Skills you are not Proficient with. Additionally, when
      you make a Skill Check,and the natural result is less than 8, it becomes
      8.</p></td></tr><tr><td><p>Circle of
      Healing</p></td><td><p>30</p></td><td><p>When a Creature you can see
      within 15 feet would recover Hit Points, you can increase the amount of
      Hit Points recovered by an amount equal to one roll of your Aid Die; a
      Creature cannot gain additional Hit Points in this manner again until the
      start of your next Turn.</p></td></tr><tr><td><p>Preternatural
      Cognition</p></td><td><p>30</p></td><td><p>You gain Proficiency in all
      Saving
      Throws.</p></td></tr><tr><td><p>Polymath</p></td><td><p>40</p></td><td><p>When
      your Aid Die is rolled, if the natural result is less than half of the
      maximum value that could be rolled on that die, it becomes half of the
      maximum
      value.</p></td></tr><tr><td><p>Secret-Keeper</p></td><td><p>40</p></td><td><p>Once
      a week, you can ask the DM one question. The DM must answer your question
      as honestly as possible, but may only give one of three answers; Yes, No,
      Neither.</p></td></tr><tr><td><p>To Cross the
      Boundary</p></td><td><p>40</p></td><td><p>As a Bonus Action, you may
      either take the Dash Action, or end any effect on you that is causing you
      to be Grappled or Restrained. Additionally, you learn the Knock Art; it is
      always Prepared, and does not count against your Known
      Arts.</p></td></tr><tr><td><p>Wise Beyond
      Years</p></td><td><p>40</p></td><td><p>Your passive Perception is
      increased by 10, and you can no longer be Surprised. Additionally, you can
      determine the true feelings of a Creature you can see towards you (no
      Action required). The GM gives one of three answers; Friendly, Neutral,
      Hostile. Additionally, the GM tells you whether that Creature is under the
      influence of another Creature or effect. You can use this Feature a number
      of times equal to your Proficiency Bonus, and recover all expended uses
      when you complete a Short or Long Rest.</p></td></tr></tbody></table>
