  description:
    value: >-
      <p>Your tools are so enchanted, so steeped in Arts, that they almost have
      a life of their own. Almost. You gain the following
      benefits:</p><p><strong>Ritual Tool Maximum.</strong> The maximum amount
      of Ritual Tools you can have at a time is increased to
      2.</p><p><strong>Ritual Relics.</strong> Your Ritual Tools provide
      additional effects:</p><ul><li><p><strong>Arts Wand/Staff.</strong> Your
      Spell Attack Rolls when casting the Eldritch Blast Cantrip have +1
      Critical Range.</p></li><li><p><strong>Clothing.</strong> When you succeed
      on a Saving Throw against an Art or Art-like Effect to take only half
      Damage, you instead take no Damage if you succeed on the Saving Throw, and
      only half Damage if you fail.</p></li><li><p><strong>Instrument.</strong>
      You can play your Instrument as an Action. If you do, until the end of
      your next Turn, your Speed is reduced to 0, and you gain a +5 bonus to
      your Spell Save DC and Spell Attack
      Rolls.</p></li><li><p><strong>Piercing/Slashing Weapon.</strong> When you
      hit a Creature with an Attack using this Ritual Tool, that Attack deals
      additional Damage equal to one roll of your Aid Die of one of the
      following Damage Types (your choice): Acid, Fire, Lightning,
      Necrotic.</p></li><li><p><strong>Trinket.</strong> You may use this Ritual
      Tool’s reroll on any d20 roll. Additionally, you may now use this reroll
      to succeed an additional time per Short Rest.</p></li></ul><p><strong>Not
      Automated.</strong></p>
