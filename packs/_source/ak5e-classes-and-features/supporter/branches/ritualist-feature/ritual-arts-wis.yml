  description:
    value: >-
      <p>You can cast Arts; the information below details how you use those
      rules as a Ritualist.</p><ul><li><p><strong>Arts Points.</strong> The
      Ritualist Arts Casting table shows how many Arts Points you have to cast
      your Level 1+ Arts. You regain all expended Arts Points when you finish a
      Long Rest.</p></li><li><p><strong>Maximum Arts Level.</strong> The
      Ritualist Arts Casting table shows the maximum Level you can cast an Art
      at, based on your Supporter Level. If an Art’s Level is above your current
      Maximum Art Level, you cannot cast it, even if it is
      Prepared.</p></li><li><p><strong>Spellcasting Ability.</strong> When you
      gain this Feature, choose either Intelligence, Wisdom, or Charisma; that
      is your Spellcasting Ability.</p></li><li><p><strong>Ritualist Arts
      Pools.</strong> When you gain this Feature, choose a number of Arts from
      any of the Standard Arts Pools available to the Caster Class equal to the
      Arts Known value in the Ritualist Arts Casting Table; they do not have to
      be from the same Arts Pool. You learn those Arts, and they are always
      Prepared. When your Arts Known increases, you may select an additional
      Art; when you finish a Long Rest, you may exchange one of these Arts for
      another valid selection.</p></li></ul><hr><p><strong>Semi-Automated:
      </strong>When you can pick a new Art, you will have to drag and drop the
      Art you want into learn into the prompt box.</p>
