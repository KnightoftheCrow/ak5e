  description:
    value: >-
      <p>Ritualism is about channelling large amounts of Arts to create long
      term, lasting effects; you have created the ultimate destructive
      expression of this.</p><p>You can conduct a stationary 10 minute Ritual as
      if you were concentrating on an Art; at the conclusion of that Ritual, you
      choose a point you can see. All Creatures and Objects within 100 feet of
      the chosen point must make a Dexterity Saving Throw against your Spell
      Save DC. On a failed Save, they take Damage equal to 10 rolls of your Aid
      Die + your Supporter Level as a spear of energy crashes down from on high;
      Objects and Structures take double Damage. The Damage Type of this Damage
      is either Fire, Lightning, Necrotic, or Acid; you choose which. On a
      successful Save, they take half as much Damage.</p><p>Once you have used
      this Feature, you may not do so again until you have completed a Long
      Rest.</p><p><strong>Not Automated.</strong></p>
