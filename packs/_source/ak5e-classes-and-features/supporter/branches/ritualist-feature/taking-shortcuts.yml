  description:
    value: >-
      <p>Your familiarity with Ritual allows you to take a few shortcuts here
      and there. You gain the following
      benefits:</p><ul><li><p><strong>Continuing Ritual.</strong> When you
      complete a Long Rest, you may choose one Ephemeral Rituals that you had
      active before the Long Rest to reactivate.</p></li><li><p><strong>Instant
      Ritual.</strong> As a Bonus Action, you may immediately activate any
      currently non-active Ephemeral Ritual for 1 minute. Once you have used
      this Feature, you may not do so again until you complete a Long
      Rest.</p></li></ul><p><strong>Not Automated.</strong></p>
