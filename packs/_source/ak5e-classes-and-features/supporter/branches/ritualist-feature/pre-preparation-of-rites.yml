  description:
    value: >-
      <p>Ritual is something that requires preparation, and you are keenly aware
      of this. You gain the following benefits:</p><p><strong>Esoteric
      Arts.</strong> You learn one of the following Ritual Arts of your choice;
      it is always Prepared, and does not count against your number of Arts
      Known, but must always be cast as a Ritual.</p><ul><li><p>Find
      Familiar</p></li><li><p>Unseen
      Servant</p></li><li><p>Augury</p></li></ul><p><strong>Ritual
      Expert</strong>. You can cast any Art you know as a Ritual. At the end of
      that Casting Time, you may choose one of the following
      options:</p><ul><li><p>You immediately cast that Art; if the Art would
      require Concentration, you ignore that requirement for the duration of
      that Art.</p></li><li><p>You do not manifest that Art’s effects, and
      instead store that cast. If you do, you may cast that Art as an Action
      once; this casting does not cost Arts Points. You can only have one Art
      stored this way at a time.</p></li></ul><p><strong>Not
      Automated.</strong></p>
