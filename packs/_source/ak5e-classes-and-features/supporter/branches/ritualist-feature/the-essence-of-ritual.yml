  description:
    value: >-
      <p>The essence of Ritual is pre-preparation. You gain the following
      benefits:</p><p><strong>Ritual Performance.</strong> You have access to a
      number of Rituals. These Rituals are divided into two types; Ephemeral
      Rituals and Permanent Rituals.</p><ul><li><p><strong>Ephemeral
      Rituals.</strong> When you activate an Ephemeral Ritual, you gain that
      benefit until you next complete a Long Rest, after which you must activate
      the Ritual again to regain the benefit.</p></li><li><p><strong>Permanent
      Rituals.</strong> When you activate a Permanent Ritual, you gain that
      benefit permanently, unless stated otherwise.</p></li></ul><p>All of your
      Ephemeral and Permanent Rituals can be found in their respective tables
      below. You access these Rituals by meeting certain criteria, listed below;
      once you have met a Criteria, you cannot meet that Criteria again until
      you complete a Short or Long Rest. When you meet one of these Criteria,
      you earn 1 Essence, and can immediately activate 1 Ephemeral Ritual of
      your choice (no Action required). To activate a Permanent Ritual of your
      choice, you must expend the required amount of Essence for that Ritual by
      completing a 10 minute Ritual, as if you were casting a Ritual
      Art.</p><p><strong>Accoutrements of Ritual.</strong> You can conduct a 10
      minute long Ritual to convert one of the following items into a Ritual
      Tool: A Melee Weapon that deals Piercing or Slashing Damage, an Instrument
      you are Proficient with, a set of Clothing, an Arts Wand or Arts Staff, or
      a trinket such as a ring or pendant. The item functions as a normal item
      of its type, but gains special benefits when equipped by you, detailed
      below. You can only have one Ritual Tool at a time; if you convert a new
      Ritual Tool when you already have your maximum amount, the oldest Ritual
      Tool returns to being an ordinary item.</p><ul><li><p><strong>Arts
      Wand/Arts Staff.</strong> You learn the Eldritch Blast Art; it does not
      count against your Arts Known, but you must be wielding this Ritual
      Equipment to cast it. Additionally, once per Turn when you hit a hostile
      Creature with the Eldritch Blast Cantrip, you can choose a willing
      Creature you can see within 30 feet of you (no Action required), then
      expend and roll one of your Aid Dice; that Creature gains Temporary Hit
      Points equal the amount rolled. If the Attack that triggered this effect
      was a Critical Hit, your Aid Die is not
      expended.</p></li><li><p><strong>Clothing.</strong> While you are wearing
      this Clothing, and are not wearing any Armour, your base Armour Class is
      equal to 13 + your Spellcasting Ability Modifier. Additionally, at the
      beginning of your Turn, if you do not have any Temporary Hit Points, you
      gain Temporary Hit Points equal to your Proficiency
      Bonus.</p></li><li><p><strong>Instrument.</strong> This Instrument gains
      the Casting Unit and Conductive (1) Properties. Additionally, once per
      Long Rest, when you play this Instrument for at least a minute, you regain
      expended Arts Points equal to half of your maximum Arts
      Points.</p></li><li><p><strong>Piercing/Slashing Weapon.</strong> You may
      use your Spellcasting Ability Modifier, instead of Strength or Dexterity,
      for the Attack and Damage Rolls with that Weapon. Additionally, you are
      considered Proficient with that Ritual Tool. Finally, once per Long Rest,
      as a Bonus Action while you are wielding this Ritual Tool, you may lose
      1d4 Hit Points. If you do, you gain a bonus to your Spell Save DC and
      Spell Attack Rolls equal to the Hit Points you lost until the end of the
      Turn.</p></li><li><p><strong>Trinket.</strong> When you fail a Saving
      Throw, you may reroll that Saving Throw, but must use the new result.
      After you succeed on a Saving Throw as a result of this reroll, you may
      not use this Feature again until you have completed a Short
      Rest.</p></li></ul><p><strong>Not Automated.</strong></p>
