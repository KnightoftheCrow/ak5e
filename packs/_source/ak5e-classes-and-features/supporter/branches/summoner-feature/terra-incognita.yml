  description:
    value: >-
      <p>To say your Arts are unusual would be an understatement. Perhaps some
      day they will fit within the wider understoof structure of Originium Arts,
      but for now, they are laws until themselves. You gain the following
      benefits:</p><ul><li><p><strong>Advanced Summoner’s Arts.</strong> You
      learn the following Arts; Bless, Shield of Faith, Expeditious Retreat,
      Heroism, Haste.</p></li><li><p><strong>Continuum</strong>. When one of
      your Creations dies while under the effect of one of your non-Damaging
      Arts (such as Haste), you may recast that Art during your next Turn as an
      Action without expending Arts Points. If you do so, the duration of that
      casting is equal to the duration that was remaining on the
      Creation.</p></li></ul><hr><p><strong>Semi-Automated: </strong>You are
      provided the Arts automatically. For Continuum, you must simply recast the
      Art and keep a note for what the adjusted duration should be.</p>
