    recovery: []
    max: ''
  advancement: {}
  description:
    value: >-
      <p>As an Action, you can expend 3 Sparks of Creation to create a Greater
      Summon in an unoccupied location you can see within 10 feet of you. When
      you do so, you choose its Stat Block; Greater Protector Creation, Greater
      Slayer Creation, or Greater Sling Creation; The physical appearance of the
      Summon is determined by you, but should be appropriate for the type of
      Summon it is. A Summon lasts for 1 minute, at which point it
      disintegrates.</p><p>Alternatively, if two of your non-Greater Creations
      of the same type are within 10 feet of each-other, you can combine them
      into the corresponding Greater Creation as an
      Action.</p><p><strong>Partially Automated. </strong>The Summoning is
      automatic; however, the number of Sparks is not. It must be calculated
      manually.</p>
    chat: ''
