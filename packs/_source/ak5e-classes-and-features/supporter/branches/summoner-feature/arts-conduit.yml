  description:
    value: >-
      <p>The Arts infused in your Summons allow you to treat them as a kind of
      “relay station” for your Arts. You gain the following
      benefits:</p><ul><li><p><strong>Arts Relay.</strong> When you cast a
      non-damaging Art that targets only one of your Summons, you may choose a
      different Creature you can see within 30 feet of that Summon; that
      Creature gains the benefits of that Art.</p></li><li><p><strong>Group
      Aid.</strong> When you grant an Aid Die to one of your Summons using your
      Provide Aid Feature, you may also grant an Aid Die to a different Creature
      you can see (except yourself) within 10 feet of that Summon; this
      additional Aid Die does not consume one of your Aid
      Dice.</p></li></ul><p><strong>Not Automated.</strong></p>
