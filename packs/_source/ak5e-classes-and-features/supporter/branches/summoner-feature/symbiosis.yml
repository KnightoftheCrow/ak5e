  description:
    value: >-
      <p>Your Summons are created with your Arts, and thus your Arts have the
      strongest effect on them. You gain the following
      benefits:</p><ul><li><p><strong>Art Cost Reduction.</strong> When you cast
      a non-damaging Art that targets one or more of your Summons, one of the
      Arts Points you used to cast that Art is refunded after it is
      cast.</p></li><li><p><strong>Non-Damaging Restructuring.</strong> As a
      Bonus Action, you can choose one of your Summons that you can see; expend
      and roll one of your Aid Dice. That Summon regains Hit Points equal to
      twice the value rolled, and gains any remaining Hit Points as Temporary
      Hit Points instead.</p></li></ul><p><strong>Not Automated.</strong></p>
