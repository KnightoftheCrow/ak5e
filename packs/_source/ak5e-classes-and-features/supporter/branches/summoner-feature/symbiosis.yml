  description:
    value: >-
      <p>Your Summons are created with your Arts, and thus your Arts have the
      strongest effect on them. You gain the following
      benefits:</p><ul><li><p><strong>An Extension of Yourself.</strong> When
      you use your Bonus Action to provide Aid, you can also issue commands to
      your Creations as part of that Bonus
      Action.</p></li><li><p><strong>Non-Damaging Restructuring.</strong> As an
      Action, choose up to two of your Simple Creations you can see; you may
      transform each into a different form of Simple Creation. Their current Hit
      Points are not altered by this
      Transformation.</p></li></ul><hr><p><strong>Automated: </strong>An
      extension of yourself does not need automating. Use the activity on this
      Feature to transform your Summons.</p>
    chat: ''
