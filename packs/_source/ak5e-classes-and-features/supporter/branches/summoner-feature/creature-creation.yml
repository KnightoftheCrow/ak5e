  advancement: {}
  description:
    value: >-
      <p>You can use a combination of your Arts and physical matter to create
      artificial creatures, and instil them with motion.</p><p><strong>Sparks of
      Creation.</strong> You have a number of Sparks of Creation that you use to
      create your Summons that increase with your Supporter Level, as shown in
      the Summoner Features Table. You regain all expended Sparks of Creation
      when you complete a Long Rest.</p><p><strong>Art of Creation:</strong> As
      an Action, you can expend one of your Sparks of Creation to create a
      Summon in an unoccupied location you can see within 10 feet of you. When
      you do so, you choose its Stat Block; <strong>Protector Creation</strong>,
      <strong>Slayer Creation</strong>, or <strong>Sling Creation</strong>. The
      physical appearance of the Summon is determined by you, but should be
      appropriate for the type of Summon it is. A Summon lasts for 1 minute, at
      which point it disintegrates. The maximum number of Summons you can have
      at a time is three.</p><p><strong>Summons in Combat.</strong> Your Summons
      act immediately after your Turn, in an order determined by you. As a Bonus
      Action during your Turn, you may give each of your Summons a particular
      instruction, such as to use a certain Action, pursue a certain Creature,
      or protect a Creature or location; they will attempt to fulfil this
      instruction until it is completed, they are destroyed, or given a
      different instruction. If a Summon has no instructions, each type of
      Creation has “default behaviour” that it will
      follow:</p><ul><li><p><strong>Protector Creation</strong>. Remains as
      close to you as it can, and prioritises protecting
      you.</p></li><li><p><strong>Slayer Creation.</strong> Aggressively pursues
      the nearest hostile Creature, and attacks them until they are reduced to 0
      Hit Points before selecting a new target.</p></li><li><p><strong>Sling
      Creation.</strong> Attacks the nearest hostile
      Creature.</p></li></ul><p><strong>Partially Automated. </strong>The
      Summoning is automatic; however, the number of Sparks is not. It must be
      calculated manually.</p>
