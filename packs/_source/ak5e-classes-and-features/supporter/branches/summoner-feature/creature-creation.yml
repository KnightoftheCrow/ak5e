  description:
    value: >-
      <p>You can use a combination of your Arts and physical matter to create
      artificial creatures, and instil them with
      motion.</p><ul><li><p><strong>Sparks of Creation.</strong> You have a
      number of Sparks of Creation that you use to summon your Creations that
      increase with your Supporter Level, as shown in the Summoner Features
      Table. You regain all expended Sparks of Creation when you complete a Long
      Rest.</p></li><li><p><strong>Art of Creation.</strong> As an Action, you
      can expend one of your Sparks of Creation to create a Simple Creation in
      an unoccupied location you can see within 10 feet of you. When you do so,
      you choose its Stat Block; Protector Creation, Slayer Creation, or Conduit
      Creation. The physical appearance of the Creation is determined by you,
      but should be appropriate for the type of Creation it is. A Creation lasts
      for 1 minute, at which point it disintegrates. The maximum number of
      Creations you can have at a time is
      three.</p></li><li><p><strong>Creations in Combat.</strong> Your Creations
      act during your Turn, after you have acted but before your Turn ends. As a
      Bonus Action, you may give each of your Creations an instruction, such as
      to use an Action in their Stat Block, attack a certain Creature, or
      protect a Creature or location; if you do so, they may act immediately
      upon being given the instruction if you desire, instead of after you. A
      Creation will attempt to fulfil this instruction until it is destroyed, or
      given a different instruction. If a Creation has no instructions, each
      type of Creation has “default behaviour” that it will
      follow:</p><ul><li><p><strong>Conduit Creation.</strong> Attacks the
      nearest hostile Creature.</p></li><li><p><strong>Protector
      Creation.</strong> Remains as close to you as it can, and prioritises
      protecting you.</p></li><li><p><strong>Slayer Creation.</strong>
      Aggressively pursues the nearest hostile Creature, and attacks them until
      they are reduced to 0 Hit Points before selecting a new
      target.</p></li></ul></li></ul><p>At 7th Level, each of your Creations
      becomes upgraded:</p><p><strong>Conduit Creation.</strong> The Conduit
      Creation gains a new Action:</p><blockquote><p><strong>Channeling (Can
      only be used within 15 feet of this Creature’s
      Summoner).</strong></p><p>Until the beginning of their next Turn, the
      Summoner of this Creature has a +1 Bonus to their Spell Save DC and Spell
      Attack Rolls. They must remain within 15 feet of this Creature to benefit
      from this effect.</p></blockquote><p><strong>Protector Creation.</strong>
      The Protector Creation gains a new
      Trait:</p><blockquote><p><strong>Unyielding Defender.</strong></p><p>When
      this Creature uses its Intervene Reaction, it is Resistant to the Damage
      it takes from the triggering Attack. Additionally, Creatures hit by this
      Creature’s Slam Attack cannot make Opportunity Attacks until the end of
      their next Turn.</p></blockquote><p><strong>Slayer Creation.</strong> The
      Slayer Creation gains a new Trait:</p><blockquote><p><strong>Critical
      Edge</strong></p><p>This Critical Range of this Creature’s Melee Attacks
      is increased by 1.</p></blockquote><p>and a new
      Action:</p><blockquote><p><strong>Melee Multiattack
      (2).</strong></p><p>This Creature makes two Melee
      Attacks.</p></blockquote><p></p>
