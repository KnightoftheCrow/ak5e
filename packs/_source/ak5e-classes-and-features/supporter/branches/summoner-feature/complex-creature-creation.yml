  description:
    value: >-
      <p>As an Action, you can expend 3 Sparks of Creation to create a Complex
      Creation in an unoccupied location you can see within 10 feet of you. When
      you do so, you choose its Stat Block; Hunter Creation, Lanternbearer
      Creation, or Sentinel Creation; The physical appearance of the Creation is
      determined by you, but should be appropriate for the type of Creation it
      is. A Creation lasts for 1 minute, at which point it disintegrates. You
      can only control one Complex Creation at a time.</p><p>Alternatively, if
      two of your Simple Creations are within 10 feet of each-other, you can
      combine them into any Complex Creation as an
      Action.</p><hr><p><strong>Semi-Automated: </strong>Your Creature Creation
      Feature now has new options. Use the Activity on this Feature on one of
      the Simple Creations close to each other to transform it into a Complex
      Creation, then delete the other Simple Creation.</p>
