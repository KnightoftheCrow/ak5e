  description:
    value: >-
      <p>Your unusual Arts are so refined as to appear effortless; a terrifying
      prospect for your foes. You gain the following
      benefits:</p><p><strong>Maximum Summon Slots.</strong> The maximum amount
      of Summons you can have at one time is increased to
      four.</p><p><strong>Refactorisation.</strong> When you use your
      Non-Damaging Restructuring Feature to restore Hit Points to one of your
      Summons, you can restore half as many Hit Points to a different Summon you
      can see within 30 feet of that original Summon.</p><p><strong>Simultaneous
      Summoning.</strong> Once per Turn when you summon a non-Greater Creation,
      you can expend 1 Spark of Creation to summon an additional non-Greater
      Creation; the additional Summon does not have to be of the same Stat Block
      as the original.</p><p><strong>Not Automated.</strong></p>
