  description:
    value: >-
      <p>Your unusual Arts are so refined as to appear effortless; a terrifying
      prospect for your foes. You gain the following
      benefits:</p><ul><li><p><strong>Maximum Summon Slots.</strong> The maximum
      amount of Summons you can have at one time is increased to
      four.</p></li><li><p><strong>Refactorisation. </strong>When you use your
      Non-Damaging Restructuring Feature, you can now cause your Complex
      Creations to transform into a different Complex Creation. Their current
      Hit Points are not altered by this
      Transformation.</p></li><li><p><strong>Simultaneous Summoning.
      </strong>Once per Turn, when you summon a Simple Creation, you can expend
      1 additional Spark of Creation to summon a second Simple Creation within
      an unoccupied space you can see within 10 feet; the additional Simple
      Creation does not have to be of the same type as the
      original.</p></li></ul><hr><p><strong>Automated: </strong>Your Symbiosis
      Feature now has new options. To use simultaneous summoning, just use
      Creature Creation twice.</p>
