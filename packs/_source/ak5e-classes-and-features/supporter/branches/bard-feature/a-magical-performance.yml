  advancement: {}
  description:
    value: >-
      <p>You learn to compose and perform special Performances that are entwined
      with Arts.</p><ul><li><p><strong>Composing a Performance.</strong> When
      you finish a Short or Long Rest, you may expend and roll any amount of
      your Aid Dice; the total value rolled is your Muse. You then expend this
      Muse to compose a number of Performances, up to your Charisma
      Modifier.</p><p>A Performance is made up of Arts; a Performance has a
      minimum length of three Arts. To compose a Performance, choose Arts from
      the Performance Arts table by spending the Muse required for each Art you
      wish to add to that Performance; you cannot have the same Art
      consecutively within a Performance. When you have finished Composing your
      Performances, you gain Temporary Hit Points equal to the amount of Muse
      remaining, and all remaining Muse is then
      lost.</p></li><li><p><strong>Putting on a Performance.</strong> As an
      Action during your Turn, while you have a Instrument you are Proficient
      with equipped, you may choose one of your Performances and begin
      Performing. If you do, you immediately cast the first Art in that
      Performance. Arts cast as part of a Performance do not cost Arts
      Points.</p><p>When you cast an Art for the first time during a Performance
      that requires Concentration, you can ignore that Concentration
      requirement. However, for the Duration of your Performance, you must
      Concentrate on it as if it was an Art. When your Performance ends, you can
      choose one Art to maintain your Concentration on; all other Arts
      end.</p><p>On each of your subsequent Turns, you may spend an Action to
      cast the next Art in the Performance, corresponding to the usual Action
      Cost for that Art. When all Arts in the Performance have been cast, or you
      end your Turn without having cast an Art from the Performance, that
      Performance ends.</p><p>Your Spellcasting Ability for Arts you cast as
      part of a Performance is Charisma, and you use an Instrument that you are
      Proficient with as a Spellcasting Focus with the Casting Unit
      Property.</p></li><li><p><strong>No Encore.</strong> When a Performance
      ends, that Performance cannot be performed again; it must be Composed
      again. When you complete a Long Rest, all Performances you have not
      Performed are also lost and must be recomposed, as their Muse has
      faded.</p></li><li><p><strong>Rising Crescendo.</strong> When you cast the
      second Art of your Performance, and for each Art after that you cast as
      part of the Performance, you gain the following benefits until your
      Performance ends:</p><ul><li><p><strong>Additional Healing.</strong> When
      you restore Hit Points or grant Temporary Hit Points with an Art, the
      amount you restore/grant is increased by 1.</p></li><li><p><strong>Shield
      Power.</strong> When you cast the Shield of Faith or Mage Armour Arts, you
      may target an additional Creature to gain the
      effects.</p></li><li><p><strong>Spell Save DC Increase.</strong> Your
      Spell Save DC increases by 1.</p></li><li><p><strong>Spell Attack
      Bonus.</strong> You gain a +1 Bonus to your Spell Attack
      Rolls.</p></li></ul></li></ul><hr><p><strong>Semi-Automated: </strong>When
      you use the Generate Muse Activity, it will generate uses on your
      Performance Arts Feature. The Activites on that Feature are used to
      compose your Performances; track what Performances you have made with your
      Performance 1-5 Features.</p><p>Start your Performance with the Activity
      on this Feature, and end it with the corresponding Activity when its
      finished.</p><p>Use the Activites on this Feature when you will cast the
      next Art in your Performance, as this Feature is what provides the Rising
      Cresendo buffs. All are automated except Shield Power; use the +/- keys to
      increase the number of targets when you cast those Arts.</p>
    chat: >-
      <p><strong>Putting on a Performance.</strong> As an Action during your
      Turn, while you have a Instrument you are Proficient with equipped, you
      may choose one of your Performances and begin Performing. If you do, you
