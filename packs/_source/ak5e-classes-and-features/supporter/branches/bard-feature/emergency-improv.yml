  description:
    value: >-
      <p>As an Action during your Turn, while you have an Instrument you are
      Proficient with equipped, you can quickly try to come up with a
      Performance on the spot; make a DC17 Performance Check, as if you were
      using the Improvise a Tune Proficient Use of your Instrument. If you
      succeed, you may either:</p><ul><li><p>Immediately expend and roll one of
      your Aid Die, gaining Muse equal to the amount rolled, and Compose a
      Performance using that Muse. This Performance is lost if you do not begin
      Performing it within a minute of Composing it.</p></li><li><p>Immediately
      expend and roll one of your Aid Die, gaining Muse equal to the amount
      rolled, and insert an Art into your current Performance at any point with
      Muse cost equal to or less than Muse you gained.</p></li></ul><p>Once you
      have used this Feature, you may not do so again until you have completed a
      Long Rest.</p><p><strong>Not Automated.</strong></p>
