  description:
    value: >-
      <p>Music is a part of your very being. You gain the following
      benefits:</p><ul><li><p><strong>Instrument Proficiency.</strong> You gain
      Proficiency in three Instruments of your
      choice.</p></li><li><p><strong>Speak to the Soul.</strong> When you or a
      Creature that can hear you rolls one of your Aid Die, you can replace the
      result of that die with your Performance Modifier. Once you have done so,
      you may not do so again until you complete a Short or Long
      Rest.</p></li><li><p><strong>Performance Expertise.</strong> You gain
      Proficiency in the Performance Skill. If you already have Proficiency, you
      gain Expertise instead.</p></li></ul><p><strong>Not
      Automated.</strong></p>
