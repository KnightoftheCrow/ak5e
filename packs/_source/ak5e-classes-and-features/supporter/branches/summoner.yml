  description:
    value: >-
      <p>There are precious few Summoners; the Arts they employ are
      exceptionally complex, and seemingly resist all academic study; every
      Summoner has a unique way of accessing their ability, and few are capable
      of explaining how it works. Their rarity only adds to their demand; the
      ability to draw a small fighting force out of the air is a trump card
      generals throughout history would have given an arm for, and for good
      reason. Breaking the frontline of a Summoner is an exercise in attrition,
      and even the greatest get tired.</p><p>You get next Branch
      features:</p><table><tbody><tr><td
      data-colwidth="50"><p>Level</p></td><td><p>Branch
      Feature</p></td></tr><tr><td data-colwidth="50"><p
