  description:
    value: >-
      <p>A robot is no longer just that when it has been made by you. You gain
      the following benefits:</p><ul><li><p><strong>Advanced Personality
      Matrix.</strong> The personality matrix of your Automatons is upgraded.
      Their Intelligence, Wisdom, and Charisma Scores are increased to 10, each
      gains Proficiency in two Saving Throws of your choice, and they can
      understand complex instructions; when you use your Bonus Action to command
      an Automaton, you can cause it to both move and take an
      Action.</p></li><li><p><strong>Maximum Automaton Limit.</strong> The
      maximum amount of Automatons you can have at once is increased to 2. When
      you use your Bonus Action to command your Automaton, you can command all
      of your Automatons simultaneously.</p></li></ul><p><strong>Not
      Automated.</strong></p>
