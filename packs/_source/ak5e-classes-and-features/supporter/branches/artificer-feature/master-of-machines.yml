  description:
    value: >-
      <p>You support your allies through the creation of specialised tools and
      aids. You gain the following benefits:</p><p><strong>Expert
      Touch.</strong> You gain Proficiency in the Technology Skill; if you are
      already Proficient, you instead gain Expertise. Additionally, you gain
      Proficiency in Vehicles (Drones).</p><p><strong>Fort Builder.</strong> As
      an Action, you can deploy a piece of portable cover up to 5 feet in
      length, 3 foot in height, and 1 foot in depth, to an unoccupied space
      within 5 feet of you; it is sufficient to provide Half Cover. You can use
      this Feature a number of times equal to your Proficiency Bonus, and regain
      all expended uses when you complete a Long
      Rest.</p><p><strong>Professional Engineer.</strong> You have created a
      custom Automaton; choose one of Automaton Variants on Page 466/467. This
      Automaton gains benefits, as befitting a custom job:</p><ul><li><p>It has
      additional Maximum Hit Points equal to your Technology
      Modifier.</p></li><li><p>Its Proficiency Bonus is equal to
      yours.</p></li><li><p>When it makes an Attack, it can use your
      Intelligence Modifier for the Attack and Damage Roll (replacing the flat
      +2 for Damage Rolls).</p></li></ul><p><strong>Your Automaton in
      Combat.</strong> In Combat, the Automaton acts during your Turn. It can
      use Reactions on its own, but it will not move or take Actions unless you
      use your Bonus Action to verbally command it to either move to a location
      of your choice, or take one Action in its Stat Block. To command your
      Automaton in this way, you must be within 100 feet of
      it.</p><p><strong>Restoring or Replacing your Automaton.</strong> As a
      Construct, the Automaton cannot regain Hit Points in most ways (See Page
      9).</p><p>If your Automaton is reduced to 0 Hit Points, it is destroyed.
      You can rebuild a destroyed Automaton as a Long Rest Activity if you
      retain the destroyed Automaton’s components. If they are not retrieved,
      replacing the components costs 500 LMD. The maximum number of Automatons
      you can have at once is one; if you create more than your maximum, you
      cannot upkeep or control the first anymore, and it will crumble to
      uselessness.</p><p><strong>Not Automated.</strong></p>
    chat: ''
