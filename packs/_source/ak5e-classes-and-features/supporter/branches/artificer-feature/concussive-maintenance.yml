  description:
    value: >-
      <p>As anyone who has worked with machines will tell you, sometimes they
      just need a good smack to get working.</p><p>When you take the Attack
      Action, if there is an Automaton within your Reach, you may sacrifice one
      of your Attacks to bash that Automaton (your choice if there are multiple)
      into shape. Expend and roll one of your Aid Die, and multiply the result
      by your Proficiency Bonus; that Automaton recovers that many Hit
      Points.</p><p><strong>Not Automated.</strong></p>
