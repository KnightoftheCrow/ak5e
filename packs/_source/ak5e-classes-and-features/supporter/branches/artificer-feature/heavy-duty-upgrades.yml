  description:
    value: >-
      <p>Refining of your craft has allowed you to produce upgraded versions of
      the typical Automatons. You gain the following
      benefits:</p><ul><li><p><strong>Basic Personality Matrix.</strong> You can
      instill a rudimentary sentience whenever you create a new custom
      Automaton, or as a Short Rest Activity with a pre-existing custom
      Automaton. It can speak, understands that it is artificial, and is
      unwaveringly loyal to you. When you instil sentience, roll a d6 on the
      following table to determine its
      personality:</p></li></ul><table><tbody><tr><td><p
      style="text-align:center"><strong>Roll</strong></p></td><td><p
      style="text-align:center"><strong>Personality</strong></p></td></tr><tr><td><p
      style="text-align:center">1</p></td><td><p
      style="text-align:center">Taciturn</p></td></tr><tr><td><p
      style="text-align:center">2</p></td><td><p
      style="text-align:center">Caring</p></td></tr><tr><td><p
      style="text-align:center">3</p></td><td><p
      style="text-align:center">Excitable</p></td></tr><tr><td><p
      style="text-align:center">4</p></td><td><p
      style="text-align:center">Warlike</p></td></tr><tr><td><p
      style="text-align:center">5</p></td><td><p
      style="text-align:center">Nervous</p></td></tr><tr><td><p
      style="text-align:center">6</p></td><td><p
      style="text-align:center">Analytic</p></td></tr></tbody></table><ul><li><p><strong>Loaded
      for Bear.</strong> When you create a new custom Automaton, or use your
      Fort Builder Feature, you may apply one of the Upgrades, detailed below,
      based on whether you create a Automaton or Portable
      Cover.</p></li></ul><p>Additionally, as a Long Rest Activity, you can
      install one Upgrade onto each of your Automatons; the maximum number of
      Upgrades an Automaton can have is two.</p>
