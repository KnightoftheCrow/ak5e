  description:
    value: >-
      <p>You are familiar with the heavy tools of your trade, but you are no
      boorish brute. You gain the following
      benefits:</p><ul><li><p><strong>Additional Weapon Proficiencies.</strong>
      You gain Proficiency with Heavy Melee Weapons.</p></li><li><p><strong>As
      One.</strong> When you take the Attack Action during your Turn, you may
      also cause each Automaton you created to take an Action of your choosing.
      If you do, that Automaton cannot take that same Action until the beginning
      of your next Turn.</p></li><li><p><strong>Calculated Strikes.</strong>
      When you make a Weapon Attack, you may use your Intelligence Modifier,
      instead of Strength or Dexterity, for the Attack and Damage
      Rolls.</p></li></ul><p><strong>Not Automated.</strong></p>
