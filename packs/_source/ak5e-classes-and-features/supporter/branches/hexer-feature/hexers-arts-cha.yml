  description:
    value: >-
      <p>You can cast Arts; the information below details how you use those
      rules as a Hexer.</p><ul><li><p><strong>Arts Points.</strong> The Hexer
      Arts Casting table shows how many Arts Points you have to cast your Level
      1+ Arts. You regain all expended Arts Points when you finish a Long
      Rest.</p></li><li><p><strong>Maximum Arts Level.</strong> The Hexer Arts
      Casting table shows the maximum Level you can cast an Art at, based on
      your Supporter Level. If an Art’s Level is above your current Maximum Art
      Level, you cannot cast it, even if it is
      Prepared.</p></li><li><p><strong>Spellcasting Ability.</strong> When you
      gain this Feature, choose either Intelligence, Wisdom, or Charisma; that
      is your Spellcasting Ability.</p></li><li><p><strong>Hexer Arts
      Pools.</strong> When you gain this Feature, choose one of the Standard
      Arts Pools available to the Caster Class; you learn all of the Arts of 5th
      Level or less from those Pools, in addition to any Cantrips from those
      Pools. These Arts are always Prepared. At 11th Level, you may choose an
      additional Standard Arts
      Pool.</p></li></ul><hr><p><strong>Automated.</strong></p>
