  description:
    value: >-
      <p>When you deal Damage to one or more Creatures with an Art, you can
      apply a Hex to one of those Creatures for 1 minute. Choose one of the
      following Hexes:</p><ul><li><p><strong>Abjuring Hex</strong>. When a
      Creature affected by this Hex makes a Damage Roll, it must also roll a die
      of the same size as your Aid Die, and subtracts half of that result from
      their Damage Roll, to a minimum of 1.</p></li><li><p><strong>Binding
      Hex.</strong> All Creatures affected by this Hex have their Speed reduced
      by a value equal to two rolls of your Aid Die, rounded to the nearest
      five.</p></li><li><p><strong>Breaking Hex.</strong> All Creatures affected
      by this Hex have any Damage Reduction they have reduced by a value equal
      to one roll of your Aid Die.</p></li><li><p><strong>Looping Hex.</strong>
      When you cast an Art that requires Concentration on a Creature affected by
      this Hex, that Art doesn’t count against the maximum number of Arts you
      can concentrate on simultaneously, as long as the Creature remains
      Hexed.</p></li></ul><p>Additionally, when a Creature affected by any of
      your Hexes is hit by an Attack, you deal Force Damage to them equal to one
      roll of your Aid Die. Once they have taken this Damage, they cannot take
      it again until the beginning of your next Turn.</p><p>You can use this
      Feature a number of times equal to your Proficiency Bonus, and regain all
      expended uses when you complete a Long Rest. A Creature can only be
      affected by one instance of each Hex at a time.</p><p><strong>Not
      Automated.</strong></p>
