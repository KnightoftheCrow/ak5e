  description:
    value: >-
      <p>You develop additional Hexes with which to cripple your foes. The
      following Hexes are added to your list of options for your Potent Hex
      Feature:</p><ul><li><p><strong>Voicethief Hex.</strong> A Creature
      affected by this Hex must succeed on an Intelligence Saving Throw against
      your Spell Save DC or be Silenced until the end of their next Turn. While
      they remain affected by this Hex, they must repeat this Saving Throw at
      the beginning of each of their Turns.</p></li><li><p><strong>Wasting
      Hex.</strong> Choose one Ability Score; when a Creature affected by this
      Hex makes an Ability Check or Saving Throw based on that Ability Score,
      they suffer a penalty to the roll equal to one roll of your Aid
      Die.</p></li></ul><p><strong>Not Automated.</strong></p>
