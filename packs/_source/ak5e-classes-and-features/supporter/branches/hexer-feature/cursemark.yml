  description:
    value: >-
      <p>You develop a way to dilute your Hexes over a wider area, with lessened
      effect.</p><p>As a Bonus Action, you can expend a use of your Potent Hex
      Feature to choose a point you can see within 100 feet, and one of the
      options available for your Potent Hex Feature. For the next minute, while
      a Creature is within 10 feet of the chosen point, that Creature suffers
      the effects of the chosen Hex. However, if you do so, your Aid Die becomes
      a d6 for the purposes of that Hex.</p>
