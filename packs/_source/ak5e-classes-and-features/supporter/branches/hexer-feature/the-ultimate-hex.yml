  description:
    value: >-
      <p>When you deal Damage to a Creature with an Art, you can apply the
      Ultimate Hex to one of those Creatures for 1 minute. The Ultimate Hex
      combines the effects of all options of your Potent Hex Feature, in
      addition to the following effect:</p><p><strong>Rupturing Hex.</strong>
      The first time each Turn a Creature affected by this Hex is hit by an
      Attack, instead of taking Force Damage equal to one roll of your Aid Die,
      all hostile Creatures within 5 feet of that Creature take Force Damage
      equal to one roll of your Aid Die. Additionally, when that Creature is
      reduced to 0 Hit Points, all Creatures of your choice within 15 feet of
      that Creature must make a Dexterity Saving Throw against your Spell Save
      DC; on a failed Save, they take Force Damage equal to four rolls of your
      Aid Die. On a successful Save, they take half as much Damage.</p><p>The
      Hexes applied as part of your Ultimate Hex are not cumulative with your
      Potent Hex Feature. Once you have applied the Ultimate Hex, you may not do
      so again until you complete a Long Rest.</p><p><strong>Not
      Automated.</strong></p>
