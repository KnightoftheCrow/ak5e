      that Force Damage to a different Creature you can see within 30 feet of
      the Hexed Creature.</p></li><li><p><strong>Spare the Rod.</strong> When
      you use your Cursemark Feature, you may choose any number of Creatures to
      be unaffected by the Hex you place.</p></li></ul><p><strong>Not
      Automated.</strong></p>
