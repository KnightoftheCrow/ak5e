  description:
    value: >-
      <p>It is an unfortunate truth that it is not safe to be a medic
      everywhere. It is a fortunate truth that you are also capable of casting
      conventional Arts.</p><p>When you gain this Feature, choose one of the
      Standard Arts Pools available to the Caster Class; you learn all of the
      Arts from that Pool of 5th Level or less, including Cantrips. These Arts
      cost 1 fewer Arts Point to cast, to a minimum of 0. From 11th Level, these
      Arts instead cost 2 fewer Arts Points.</p><p><strong>Semi-Automated:
      </strong>You will be prompted to choose an Arts Pool; however, the cost
      reduction is not automated. You must manually adjust the AP cost of your
      Arts.</p>
