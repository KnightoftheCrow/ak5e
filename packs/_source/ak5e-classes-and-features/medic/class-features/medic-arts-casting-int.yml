  description:
    value: >-
      <p>You can cast specialised Arts to preserve
      life.</p><ul><li><p><strong>Arts Pool:</strong> You learn all of the Arts
      in the Healing Arts Special Arts Pool, and they are always
      Prepared.</p></li><li><p><strong>Arts Points:</strong> The Medic Features
      table shows how many Arts Points (AP) you have to cast Arts of Level 1 or
      higher. You regain all expended Arts Points when you finish a Long
      Rest.</p></li><li><p><strong>Maximum Arts Level:</strong> The Medic
      Features table shows the maximum Level you can cast an Art at, based on
      your Medic Level. If an Art’s Level is above your current Maximum Art
      Level, you cannot cast it.</p></li><li><p><strong>Spellcasting
      Ability:</strong> When you gain this Feature, choose either Intelligence
      or Wisdom; that is your Spellcasting Ability.</p></li></ul>
