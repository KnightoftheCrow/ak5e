  description:
    value: >-
      <p>You have a pool of Life Support that replenishes when you finish a Long
      Rest. The maximum amount of Life Support in your pool at each Level is
      shown in the table below.</p><p>As an Action, you can touch a Creature and
      expend any amount of your current Life Support; the Creature recovers that
      many missing Hit Points.</p><p>You can also expend Life Support in the
      following ways, or in ways determined by your Medic
      Branch:</p><ul><li><p><strong>Preserver</strong>: When you roll dice to
      determine the Hit Points recovered by another Creature, or the Temporary
      Hit Points gained by another Creature, you can expend 5 Life Support to
      reroll any number of those dice; you must use the new
      results.</p></li><li><p><strong>Urgency of Treatment:</strong> When you
      would cast an Art from your Healing Arts Pool, you can expend Life Support
      in multiples of 10 to reduce the Arts Point cost of that casting by 1 for
      every 10 Life Support expended, to a minimum of
      0.</p></li></ul><p><strong>Semi-Automated: </strong>You must use Preserver
      BEFORE triggering a roll of any healing dice, and it rerolls all healing
      dice, keeping the highest. Urgency Treatment allows you to expend Life
      Support for Arts Points, and thus must also be used before casting an
      Art.</p><table><thead><tr><th><p>Level</p></th><th><p>Life
      Support</p></th></tr></thead><tbody><tr><td><p>1st</p></td><td><p>20</p></td></tr><tr><td><p>2nd</p></td><td><p>35</p></td></tr><tr><td><p>3rd</p></td><td><p>35</p></td></tr><tr><td><p>4th</p></td><td><p>50</p></td></tr><tr><td><p>5th</p></td><td><p>50</p></td></tr><tr><td><p>6th</p></td><td><p>65</p></td></tr><tr><td><p>7th</p></td><td><p>65</p></td></tr><tr><td><p>8th</p></td><td><p>80</p></td></tr><tr><td><p>9th</p></td><td><p>80</p></td></tr><tr><td><p>10th</p></td><td><p>95</p></td></tr><tr><td><p>11th</p></td><td><p>95</p></td></tr><tr><td><p>12th</p></td><td><p>110</p></td></tr><tr><td><p>13th</p></td><td><p>110</p></td></tr><tr><td><p>14th</p></td><td><p>125</p></td></tr><tr><td><p>15th</p></td><td><p>125</p></td></tr><tr><td><p>16th</p></td><td><p>140</p></td></tr><tr><td><p>17th</p></td><td><p>140</p></td></tr><tr><td><p>18th</p></td><td><p>155</p></td></tr><tr><td><p>19th</p></td><td><p>155</p></td></tr><tr><td><p>20th</p></td><td><p>170</p></td></tr></tbody></table>
    chat: >-
      <p>You have a pool of Life Support that replenishes when you finish a Long
      Rest. The maximum amount of Life Support in your pool at each Level is
      shown in the table below.</p><p>As an Action, you can touch a Creature and
      expend any amount of your current Life Support; the Creature recovers that
      many missing Hit Points.</p><p>You can also expend Life Support in the
      following ways, or in ways determined by your Medic
      Branch:</p><ul><li><p><strong>Preserver:</strong> When you roll dice to
      determine the Hit Points recovered by another Creature, or the Temporary
      Hit Points gained by another Creature, you can expend 5 Life Support to
      reroll any number of those dice; you must use the new
      results.</p></li><li><p><strong>Urgency of Treatment:</strong> When you
      would cast an Art from your Healing Arts Pool, you can expend Life Support
      in multiples of 10 to reduce the Arts Point cost of that casting by 1 for
      every 10 Life Support expended, to a minimum of 0.</p></li></ul>
