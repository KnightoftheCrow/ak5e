  description:
    value: >-
      <div id="p234" data-index="233" class="page"><div
      class="columnWrapper"><div class="block wide"><h2
      id="medic">Medic</h2><p>In Londinium’s war-torn streets, gentle light
      radiates from the hands of a hooded Sarkaz woman, closing the wounds of
      the soldier lying in front of her. She does not know this man. He may even
      be her enemy; it does not matter. Her sword remains sheathed, and she
      prays she will never again have to draw it.</p><p>As the pioneers return
      from the site of the accident, terror writ large across their faces, a
      Liberi moves among these potential Infected with mechanical efficiency.
      The crystals growing in her skull throb in sympathetic pain, but she
      pushes the pain down. Some day she will die, but today she can save
      lives.</p></div><h3 id="the-selfless-the-unsung">The Selfless, The
      Unsung</h3><p>Medical Arts are some of the most difficult Arts to master;
      a sloppy application can do more harm than good. It requires meticulous
      study of both Arts and medicine, alongside a healthy helping of natural
      talent. Many medical Casters are also medical professionals in the
      traditional sense, though the two are not necessarily
      synonymous.</p><p>All this to say, becoming a Medic requires a tremendous
      amount of work and effort, all for the privilege to put yourself directly
      in harm’s way. Organised conflict might recognise the sacred nature of
      medics, but most conflict on Terra is not organised, resulting in the
      exact opposite effect; you are a target. This feat of work all for
      increased risk all but ensures those who pursue it possess a selfless
      spirit, willing to risk their own hide to protect others. A Medic is not
      the one who crushes the foe and leads the charge; they are not the ones
      whose names will be signed in history. They are the ones that ensure those
      who do those things make it home to record that history.</p><h3>Medic
      Traits</h3><table><tbody><tr><td data-colwidth="142"><p
      style="text-align:center"><strong>Primary
      Ability</strong></p></td><td><p>Intelligence</p></td></tr><tr><td
      data-colwidth="142"><p style="text-align:center"><strong>Hit Point
      Die</strong></p></td><td><p>D6</p></td></tr><tr><td data-colwidth="142"><p
      style="text-align:center"><strong>Saving Throw
      Proficiencies</strong></p></td><td><p>Two from the following (Choose when
      you select this Class): Constitution, Intelligence,
      Wisdom</p></td></tr><tr><td data-colwidth="142"><p
      style="text-align:center"><strong>Skill
      Proficiencies</strong></p></td><td><p>Medicine + Two from: Lore, Arts,
      Tech, Insight, Perception, Persuasion</p></td></tr><tr><td
      data-colwidth="142"><p style="text-align:center"><strong>Weapon
      Proficiencies</strong></p></td><td><p>Light Melee</p></td></tr><tr><td
      data-colwidth="142"><p style="text-align:center"><strong>Tool
      Proficiencies</strong></p></td><td><p>A Tool Kit/Vehicle Proficiency of
      your Choice</p></td></tr><tr><td data-colwidth="142"><p
      style="text-align:center"><strong>Armor
      Training</strong></p></td><td><p>Light Armour, Light
      Shields</p></td></tr><tr><td data-colwidth="142"><p
      style="text-align:center"><strong>Starting
      Equipment</strong></p></td><td><p>You start with the following Equipment,
      in addition to any Equipment granted by your Background.</p><ul><li><p>(A)
      1x Light Melee Weapon OR (B) 1x Light Shield</p></li><li><p>(A) 1x Arts
      Wand OR (B) 1x Arts Staff</p></li><li><p>1x Protective
      Clothing</p></li><li><p>1x Tool Kit that you are Proficient
      with</p></li></ul><p>OR</p><ul><li><p>1300
      LMD</p></li></ul></td></tr></tbody></table></div></div><p></p><h3
      id="class-features-4">Medic Features</h3><div id="p234" data-index="233"
      class="page"><div class="columnWrapper"><div
      class="columnSplit"><table><thead><tr><th><p>Level</p></th><th><p>Proficiency
      Bonus</p></th><th><p>Features</p></th><th><p>Maximum Art
      Level</p></th><th><p>Arts Points (AP)</p></th><th><p>Life
      Support</p></th></tr></thead><tbody><tr><td><p>1st</p></td><td><p>+2</p></td><td><p>Elite
      0- Arts Casting, Life Support, Medical Expertise, Medic
      Branch</p></td><td><p>1</p></td><td><p>3</p></td><td><p>20</p></td></tr><tr><td><p>2nd</p></td><td><p>+2</p></td><td><p>Basic
      Operator
      Skill</p></td><td><p>1</p></td><td><p>4</p></td><td><p>35</p></td></tr><tr><td><p>3rd</p></td><td><p>+2</p></td><td><p>Basic
      Talent</p></td><td><p>2</p></td><td><p>6</p></td><td><p>35</p></td></tr><tr><td><p>4th</p></td><td><p>+2</p></td><td><p>Ability
      Score Improvement, Branch
      Feature</p></td><td><p>2</p></td><td><p>7</p></td><td><p>50</p></td></tr><tr><td><p>5th</p></td><td><p>+3</p></td><td><p>Self-Defence
      Protocol</p></td><td><p>3</p></td><td><p>10</p></td><td><p>50</p></td></tr><tr><td><p>6th</p></td><td><p>+3</p></td><td><p>Ability
      Score
      Improvement</p></td><td><p>3</p></td><td><p>11</p></td><td><p>65</p></td></tr><tr><td><p>7th</p></td><td><p>+3</p></td><td><p>Elite
      1- Branch Feature, Advanced Operator
      Skill</p></td><td><p>4</p></td><td><p>12</p></td><td><p>65</p></td></tr><tr><td><p>8th</p></td><td><p>+3</p></td><td><p>Ability
      Score Improvement, Basic Talent
      Module</p></td><td><p>4</p></td><td><p>15</p></td><td><p>80</p></td></tr><tr><td><p>9th</p></td><td><p>+4</p></td><td><p>Advanced
      Talent</p></td><td><p>5</p></td><td><p>16</p></td><td><p>80</p></td></tr><tr><td><p>10th</p></td><td><p>+4</p></td><td><p>Ability
      Score
      Improvement</p></td><td><p>5</p></td><td><p>17</p></td><td><p>95</p></td></tr><tr><td><p>11th</p></td><td><p>+4</p></td><td><p>Branch
      Feature</p></td><td><p>6</p></td><td><p>20</p></td><td><p>95</p></td></tr><tr><td><p>12th</p></td><td><p>+4</p></td><td><p>Ability
      Score Improvement,
      Resuscitation</p></td><td><p>6</p></td><td><p>21</p></td><td><p>110</p></td></tr><tr><td><p>13th</p></td><td><p>+5</p></td><td><p>Advanced
      Talent
      Mastery</p></td><td><p>7</p></td><td><p>22</p></td><td><p>110</p></td></tr><tr><td><p>14th</p></td><td><p>+5</p></td><td><p>Elite
      2- Elite Operator
      Skill</p></td><td><p>7</p></td><td><p>25</p></td><td><p>125</p></td></tr><tr><td><p>15th</p></td><td><p>+5</p></td><td><p>Branch
      Feature</p></td><td><p>8</p></td><td><p>26</p></td><td><p>125</p></td></tr><tr><td><p>16th</p></td><td><p>+5</p></td><td><p>Ability
      Score
      Improvement</p></td><td><p>8</p></td><td><p>27</p></td><td><p>140</p></td></tr><tr><td><p>17th</p></td><td><p>+6</p></td><td><p>9th
      Level
      Arts</p></td><td><p>9</p></td><td><p>30</p></td><td><p>140</p></td></tr><tr><td><p>18th</p></td><td><p>+6</p></td><td><p>To
      Rob the
      Ferryman</p></td><td><p>9</p></td><td><p>31</p></td><td><p>155</p></td></tr><tr><td><p>19th</p></td><td><p>+6</p></td><td><p>Ability
      Score
      Improvement</p></td><td><p>9</p></td><td><p>32</p></td><td><p>155</p></td></tr><tr><td><p>20th</p></td><td><p>+6</p></td><td><p>Chosen
      of
      Asclepius</p></td><td><p>9</p></td><td><p>35</p></td><td><p>170</p></td></tr></tbody></table></div><div
      style="align-text:left" class="block"><div id="p234" data-index="233"
      class="page"><div class="columnWrapper"><h4
      id="1st-level-arts-casting-1">1st Level: Arts Casting</h4><p>You can cast
      specialised Arts to preserve life.</p><p><em><strong>Arts
      Pool:</strong></em> You learn all of the Arts in the Healing Arts Special
      Arts Pool, and they are always Prepared.</p><p><em><strong>Arts
      Points:</strong></em> The Medic Features table shows how many Arts Points
      (AP) you have to cast Arts of Level 1 or higher. You regain all expended
      Arts Points when you finish a Long Rest.</p><p><em><strong>Maximum Arts
      Level:</strong></em> The Medic Features table shows the maximum Level you
      can cast an Art at, based on your Medic Level. If an Art’s Level is above
      your current Maximum Art Level, you cannot cast
      it.</p><p><em><strong>Spellcasting Ability:</strong></em> When you gain
      this Feature, choose either Intelligence or Wisdom; that is your
      Spellcasting Ability.</p></div></div><h4 id="1st-level-life-support">1st
      Level: Life Support</h4><p>You have a pool of Life Support that
      replenishes when you finish a Long Rest. The maximum amount of Life
      Support in your pool at each Level is shown in the Medic Table.</p><p>As
      an Action, you can touch a Creature and expend any amount of your current
      Life Support; the Creature recovers that many missing Hit
      Points.</p><p>You can also expend Life Support in the following ways, or
      in ways determined by your Medic Branch:</p><p><strong>Preserver:</strong>
      When you roll dice to determine the Hit Points recovered by another
      Creature, or the Temporary Hit Points gained by another Creature, you can
      expend 5 Life Support to reroll any number of those dice; you must use the
      new results.</p><p><strong>Urgency of Treatment:</strong> When you would
      cast an Art from your Healing Arts Pool, you can expend Life Support in
      multiples of 10 to reduce the Arts Point cost of that casting by 1 for
      every 10 Life Support expended, to a minimum of 0.</p><h4
      id="1st-level-medical-expertise">1st Level: Medical Expertise</h4><p>No
      matter the origin of your medical knowledge, you are adept at saving
      lives; you gain Expertise in the Medical Skill.</p></div><h4
      id="1st-level-medic-branch">1st Level: Medic Branch</h4><p>Choose a Medic
      Branch which most closely fits the style you envision for yourself. Choose
      one from the following list; further details on these Branches can be
      found at the end of the Class Description. The Branch you choose grants
      you Features at Level 1, 4, 7, 11, and
      15.</p><ul><li><p><strong>Physician:</strong> Physician Medics specialise
      in healing singular targets, preserving the life of their target at any
      cost.</p></li><li><p><strong>Therapist:</strong> A Therapist Medic knows
      that a general treatment is not enough; treatment must be targeted and
      personalised. They use their powers to modify the effects of their Arts to
      better suit the situation, and the
      patient.</p></li><li><p><strong>Triage:</strong> The battlefield is a
      chaotic place, and often a great number of people need treating at the
      same time. Triage Medics specialise in dealing out healing to multiple
      patients simultaneously, aiming only to preserve as many lives as
      possible.</p></li><li><p><strong>Ward:</strong> Prevention is better than
      cure, or so the adage goes. Ward Medics take this to heart, dishing out
      barriers that prevent their allies from coming to harm, and ward off
      Status Conditions.</p></li><li><p><strong>Witchcraft:</strong> While all
      Medics are potent Casters, Witchcraft Medics weave destruction into their
      aid, blending offensive Arts and healing.</p></li></ul></div></div><div
      id="p236" data-index="235" class="page"><div class="columnWrapper"><h4
      id="2nd-level-basic-operator-skill-4">2nd Level: Basic Operator
      Skill</h4><p>You learn a Basic Operator Skill from the Basic Medic Skills
      table, or from any other Basic Skill table available to you.</p><h4
      id="3rd-level-basic-talent-4">3rd Level: Basic Talent</h4><p>You gain a
      Basic Talent of your choice from the Basic Medic Talents table. When you
      reach 8th Level, you may either pick a different Basic Talent to gain, or
      upgrade your Basic Talent, gaining its Module Effect.</p><h4
      id="4th-level-ability-score-improvement-4">4th Level: Ability Score
      Improvement</h4><p>When you reach 4th Level, and again at 6th, 8th, 10th,
      12th, 16th, and 19th Level, you can increase one Ability Score of your
      choice by 2, or you can increase two Ability Scores of your choice by 1.
      As normal, you can’t increase an Ability Score above 20 using this
      feature.</p><h4 id="5th-level-self-defence-protocol">5th Level:
      Self-Defence Protocol</h4><p>It is an unfortunate truth that it is not
      safe to be a medic everywhere. It is a fortunate truth that you are also
      capable of casting conventional Arts.</p><p>When you gain this Feature,
      choose one of the Standard Arts Pools available to the Caster Class that
      you have not chosen previously; you learn all of the Arts from that Pool
      of 5th Level or less, including Cantrips. These Arts cost 1 fewer Arts
      Point to cast, to a minimum of 0. From 11th Level, these Arts instead cost
      2 fewer Arts Points.</p><h4 id="7th-level-advanced-operator-skill-4">7th
      Level: Advanced Operator Skill</h4><p>You learn an Advanced Operator Skill
      from the Advanced Medic Skills table, or from any other Advanced Skill
      table available to you.</p><h4 id="9th-level-advanced-talent-4">9th Level:
      Advanced Talent</h4><p>You gain an Advanced Talent of your choice from the
      Advanced Medic Talents table. When you reach 13th Level, you may either
      pick a different Advanced Talent to gain, or upgrade your Advanced Talent,
      gaining its Module Effect.</p><h4 id="12th-level-resuscitation">12th
      Level: Resuscitation</h4><p>In your hands, the borders of life and death
      begin to blur, and you can pull back those who have just slipped over the
      edge.</p><p>Once per Long Rest, you can cast the Revivify Art without
      expending any Arts Points.</p><h4
      id="14th-level-elite-operator-skill-4">14th Level: Elite Operator
      Skill</h4><p>You learn an Elite Operator Skill from the Elite Medic Skills
      table, or from any other Elite Skill table available to you.</p><h4
      id="18th-level-to-rob-the-ferryman">18th Level: To Rob the
      Ferryman</h4><p>When you revive someone using the Revivify Art, they
      recover Hit Points equal to three times your Medic Level.</p><h4
      id="20th-level-chosen-of-asclepius">20th Level: Chosen of
      Asclepius</h4><p>Whenever you would roll to determine the amount of Hit
      Points you restore to a Creature, you can choose not to roll, and instead
      use the highest number possible for each die. For example, instead of
      restoring 2d6 Hit Points to a Creature, you restore 12.</p></div></div>
