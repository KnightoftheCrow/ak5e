  description:
    value: >-
      <p>Prevention is better than cure is an oft-spoken adage that typically
      refers to the prevention of disease rather than the treating of it. Ward
      Medics take this conclusion and extrapolate it, using specially formulated
      Arts; surely it is better to prevent all injury than to heal it.</p><p>You
      gain the following Branch Features:</p><table><tbody><tr><td
