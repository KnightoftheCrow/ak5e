  description:
    value: >-
      <p>When you roll to determine the Damage of an Art or Operator Skill, you
      can choose not to roll, and instead deal the maximum amount possible. If
      you do, you can then restore a number of Hit Points equal to the amount
      rolled. Choose a number of Creatures you can see within 60 feet of you,
      and divide those Hit Points between them.</p><p>Once you have used this
      Feature, you may not do so again until you finish a Long
      Rest.</p><hr><p><strong>Semi-Automated: </strong>Use the Activate Feature
      before you cast the Art to maximize the Damage. Afterwards, use the Heal
      Activity and set the scaling value to the amount you intend to heal for
      each Creature of your choice.</p>
