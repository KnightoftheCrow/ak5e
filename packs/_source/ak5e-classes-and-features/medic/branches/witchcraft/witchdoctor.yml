  description:
    value: >-
      <p>You further refine your technique for “supporting” your allies through
      your Arts. You gain the following benefits:</p><p><strong>Operator Skill
      Access</strong>. Whenever you gain a new Operator Skill, you may instead
      choose a Skill from the appropriate Operator Skills table available to the
      Caster Class.</p><p><strong>Improved Life Support</strong>. The range at
      which you can restore Hit Points with your Life Support Feature is
      increased to 60 feet.</p><hr><p><strong>Automated: </strong>The increase
      in LS range is automated. The choice of Operator Skills does not need to
      be automated.</p>
