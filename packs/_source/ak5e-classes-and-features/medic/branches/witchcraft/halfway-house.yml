  description:
    value: >-
      <p>You bridge the gap between offensive and medical Arts, gaining the
      following benefits:</p><p><strong>Additional Arts Pool.</strong> Choose
      one of the Standard Arts Pools available to the Caster Class. You learn
      all of the Arts in that Pool, and they are always prepared for you. From
      5th Level, these Arts cost 1 fewer Arts Point to cast, to a minimum of 0.
      From 11th Level, these Arts instead cost 2 fewer Arts
      Points.</p><p><strong>Healing through Harm.</strong> As a Reaction, when
      you roll to determine the Damage of an Art, you may add half of that value
      to your Life Support Pool; this allows you to temporarily exceed your
      maximum Life Support; any additional Life Support is lost when you
      complete a Long Rest. Once you have used this Feature, you must complete a
      Short Rest before you may do so again.</p><hr><p><strong>Semi-Automated:
      </strong>Your additional choice of Arts Pool is automated. Use the
      Activity on this Feature and set the scaling value to the amount of Life
      Support you should regain; however, this will not increase your maximum
      Life Support. Starting at Level 5, you have an Opt-In when you roll Damage
      or an Attack for a non-Cantrip Spell to regain Arts Points.</p>
