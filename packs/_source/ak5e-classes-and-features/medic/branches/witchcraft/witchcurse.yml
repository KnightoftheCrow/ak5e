  description:
    value: >-
      <p>You gain an additional way to use your Life Support
      Feature:</p><ul><li><p><strong>Witchcurse.</strong> As a Bonus Action, you
      can expend 10 Life Support to choose a Creature you can see within 60 feet
      and place a Witchcurse upon them for 1 minute, or until you place another
      Witchcurse. The Witchcurse causes that Creature to experience greater harm
      than they perhaps are; the first time each Turn a Creature with your
      Witchcurse takes Arts Damage, roll 2d6; you may restore that many Hit
      Points to a Creature you can see within 60 feet, and the Creature with
      your Witchcurse takes Psychic Damage equal to the amount of Hit Points you
      restored.</p><hr></li></ul><p><strong>Semi-Automated: </strong>The Damage
      from Witchcurse is automated; you must trigger the Activity on this
      Feature manually for the healing.</p>
