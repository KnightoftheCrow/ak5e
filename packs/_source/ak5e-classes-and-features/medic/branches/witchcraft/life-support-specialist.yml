  description:
    value: >-
      <p>You gain the following benefits:</p><p><strong>Efficient Life
      Support.</strong> When you cast a levelled Art, you gain Life Support
      equal to twice the Arts Points you expended to cast that Art, and you may
      restore Hit Points with your Life Support Feature as an Action or Bonus
      Action this Turn.</p><p><strong>Witch’s Boon.</strong> If you restore at
      least 5 Hit Points to a Creature with your Life Support Feature, until the
      end of that Creature’s next Turn, they deal additional 1d10 Force Damage
      with their Attacks.</p><hr><p><strong>Semi-Automated: </strong>The
      activities on this Feature must be triggered manually, but their effects
      are automatic.</p>
    chat: ''
