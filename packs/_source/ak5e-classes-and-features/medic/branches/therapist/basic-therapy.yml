  advancement: {}
  description:
    value: >-
      <p>The versatility of your Healing Arts are their true merit; you can take
      these Arts to heights that others cannot. You gain access to the Basic
      Therapies listed below. You can use these Therapies to temporarily modify
      Arts that you cast; to use a Therapy, you must expend the amount of Life
      Support that Therapy costs.</p><p>You can only use one Therapy option on
      an Art when you cast it unless noted otherwise.</p><h3>Basic
      Therapies</h3><p>The following Therapies are presented in alphabetical
      order.</p><h4><strong>Empowering Therapy</strong></h4><p><strong>Life
      Support Cost:</strong> 5</p><p><strong>Effect:</strong> When you cast an
      Art, Creatures affected by that Art deal additional Damage on their next
      successful Attack within 1 minute equal to your Spellcasting Ability
      Modifier.</p><h4><strong>Energising Therapy</strong></h4><p><strong>Life
      Support Cost:</strong> 5</p><p><strong>Effect:</strong> When you cast an
      Art that targets only one Creature, that Creature can immediately move
      half their Speed after the Art.</p><h4><strong>Long-Distance
      Therapy</strong></h4><p><strong>Life Support Cost:</strong>
      5</p><p><strong>Effect:</strong> When you cast an Art that has a range of
      at least 5 feet, you can double the range of the Art. Alternatively, when
      you cast an Art that has a range of Touch, you can make that Art’s range
      30 feet.</p><h4><strong>Long-Term Therapy</strong></h4><p><strong>Life
      Support Cost:</strong> 5</p><p><strong>Effect:</strong> When you cast an
      Art that has a duration of 1 minute or longer, you can double its duration
      to a maximum duration of 24 hours.</p><p>If the affected Art requires
      Concentration, you have Advantage on any Saving Throw you make to maintain
      that Concentration.</p><h4><strong>Psychological
      Therapy</strong></h4><p><strong>Life Support Cost:</strong>
      5</p><p><strong>Effect:</strong> When you cast an Art that restores Hit
      Points, affected Creatures automatically pass the next Intelligence,
      Wisdom, or Charisma Saving Throw they make before the beginning of your
      next Turn.</p><h4><strong>Recuperative
      Therapy</strong></h4><p><strong>Life Support Cost:</strong>
      5</p><p><strong>Effect:</strong> When you cast an Art that targets only
      one Creature, for the next minute, that Creature regains Hit Points after
      taking any Damage from a hostile Creature equal to your Spellcasting
      Ability Modifier.</p><hr><p><strong>Partially Automated:
      </strong>Empowering and Psychological Therapy is automated. All other
      Therapies cannot be automated.</p>
    chat: >-
      <p>The versatility of your Healing Arts are their true merit; you can take
      these Arts to heights that others cannot. You gain access to the Basic
      Therapies listed below. You can use these Therapies to temporarily modify
      Arts that you cast; to use a Therapy, you must expend the amount of Life
      Support that Therapy costs.</p><p>You can only use one Therapy option on
      an Art when you cast it unless noted otherwise.</p>
