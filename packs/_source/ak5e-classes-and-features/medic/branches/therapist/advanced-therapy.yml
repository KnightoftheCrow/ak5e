  description:
    value: >-
      <p>Your treatment has advanced; you gain access to the Advanced Therapies
      listed below.</p><h3>Advanced Therapies</h3><p>The following Therapies are
      presented in alphabetical order.</p><h4><strong>Cleansing
      Therapy</strong></h4><p><strong>Life Support Cost:</strong>
      10</p><p><strong>Effect:</strong> When you cast an Art that restores Hit
      Points to a single Creature, you may end one Status Condition affecting
      that Creature.</p><h4><strong>Regenerative
      Therapy</strong></h4><p><strong>Life Support Cost:</strong>
      10</p><p><strong>Effect:</strong> When you cast an Art that restores Hit
      Points to a single Creature, for the next minute, that Creature regains
      1d6 Hit Points at the beginning of each of their
      Turns.</p><h4><strong>Resistance Therapy</strong></h4><p><strong>Life
      Support Cost:</strong> 10</p><p><strong>Effect:</strong> When you cast an
      Art, Creatures affected by the Art automatically pass their Saving Throws
      against Arts and other Art-like effects until the beginning of your next
      Turn.</p><hr><p><strong>Partially Automated: </strong>Regenerative and
      Resistance Therapy are automated. Cleansing Therapy cannot be
      automated.</p>
    chat: <p>Your treatment has advanced; you gain access to Advanced Therapies.</p>
