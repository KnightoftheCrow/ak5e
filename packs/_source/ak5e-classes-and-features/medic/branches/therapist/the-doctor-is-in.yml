  description:
    value: >-
      <p>The distinction of therapy is that it is not a one and done process; it
      takes time and repetition. This is something you know, and you have
      refined your skills to facilitate continuous treatment.</p><p>You can
      activate this Feature as a Bonus Action. When you do, choose one of your
      Basic Therapies. For the next minute, you may activate that Therapy option
      without expending Life Support, and you may use a second Therapy on each
      Art you cast; you may not use the same option twice.</p><p>Once you have
      used this Feature, you may not do so again until you have finished a Long
      Rest.</p><hr><p><strong>Not Automated: </strong>After you have declared
      your Therapy for this feature, just uncheck the box that asks you to pay
      the life support cost when you use that Therapy, or refund yourself the LS
      after using it.</p>
