  description:
    value: >-
      <p>You gain an additional way to use your Life Support
      Feature:</p><ul><li><p><strong>Stop the Flow.</strong> As an Action, you
      can expend 20 Life Support and touch a Creature that is Dying. That
      Creature immediately gains 6 Mettle; this Mettle gain allows them to
      temporarily exceed the maximum Mettle of 6, to a maximum of 8, until they
      are no longer Dying. Once a Creature has been the target of this Feature,
      this Feature cannot be used on them again until they are no longer
      Dying.</p></li></ul><hr><p><strong>Cannot be Automated.</strong></p>
