  description:
    value: >-
      <p>Your mere presence is enough to ward off death.</p><p>Once per Long
      Rest, you may activate this Feature as a Bonus Action. For the next
      minute, your project an aura in a 30-foot radius; the aura moves with you,
      and is centred on you. When a Creature enters the aura, or the aura enters
      a Creature’s space, you can restore Hit Points to that Creature equal to
      3d6 + your Spellcasting Ability Modifier (no Action required). Once you
      have restored Hit Points to a Creature in this way, they cannot benefit
      from this Feature again until the beginning of your next Turn.</p>
    chat: ''
