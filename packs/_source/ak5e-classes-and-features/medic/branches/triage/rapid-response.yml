  description:
    value: >-
      <p>You gain an additional way to use your Life Support
      Feature:</p><ul><li><p><strong>On the Scene.</strong> As an Action, you
      can expend 10 Life Support to move up to twice your Speed without
      provoking Opportunity Attacks. After you finish this movement, choose a
      number of other Creatures equal to your Proficiency Bonus that you moved
      within 5 feet of during this movement (you can only choose each Creature
      once per use of this Feature), and apply one of the following
      effects:</p><ul><li><p><strong>Heal.</strong> Restore a number of Hit
      Points to that Creature equal to 1d6 + your Spellcasting Ability
      Modifier.</p></li><li><p><strong>Harm.</strong> Make a Melee Spell Attack
      against that Creature as if they were within your Reach; on a hit, that
      Creature takes Necrotic Damage equal to 1d6 + your Spellcasting Ability
      Modifier.</p></li></ul></li></ul><p>The amount of Hit Points recovered and
      Necrotic Damage dealt is increased to 2d6 + your Spellcasting Ability
      Modifier at 7th Level, and 3d6 + your Spellcasting Ability Modifier at
      14th Level.</p><hr><p><strong>Semi-Automated: </strong>Use the Activate
      Feature to grant you a number of uses on this Feature. Move your distance,
      then use Heal/Harm against targets who were within range during that
      movement. When you use Heal/Harm, set the scaling value to how many
      Creature you are targeting to Heal/Harm respectively to consume the
      appropriate uses.</p><p>Above Level 11, Two more Activities will appear
      for the Touch of Life and Death Feature. Use these after you have used
      Heal/Harm. The Poison is automated; the condition removal is not.</p>
