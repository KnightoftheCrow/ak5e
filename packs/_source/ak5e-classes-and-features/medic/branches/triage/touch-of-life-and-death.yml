  description:
    value: >-
      <p>Your phantasmagoric hands can snatch life and preserve it with the same
      gentle caress. When you deal Damage or restore Hit Points to a Creature as
      a result of your On the Scene Feature, you can expend 10 Life Support (no
      Action required) to cause an additional
      effect.</p><ul><li><p><strong>Heal.</strong> You can end a Condition with
      a duration of 1 hour or less on that Creature; if the Duration is greater
      than 1 hour, it is instead paused for 1
      hour.</p></li><li><p><strong>Harm.</strong> That Creature is Poisoned
      until the beginning of your next
      Turn.</p></li></ul><hr><p><strong>Semi-Automated: </strong>Your Rapid
      Response Feature is upgraded.</p>
