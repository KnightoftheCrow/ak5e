  description:
    value: >-
      <p>You gain an additional way to use your Life Support
      Feature:</p><p><strong>Healing Reverberations.</strong> As a Reaction when
      you roll to determine Hit Points restored to a Creature, you can expend 15
      Life Support. At the beginning of your next Turn, that Creature recovers
      Hit Points equal to half of the amount they recovered from the triggering
      instance, or 15 Hit Points; whichever is
      greater.</p><hr><p><strong>Partially Automated: </strong>The Activate
      activity applies an effect to target Creature as a reminder. When the
      effect expires, use the Restore HP activity and set the scaling value to
      the amount of HP restored that is greater than 15 (or leave it at 0 if it
      is less than 15).</p>
    chat: ''
