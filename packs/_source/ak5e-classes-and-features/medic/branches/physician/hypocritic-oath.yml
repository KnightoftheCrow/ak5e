  description:
    value: >-
      <p>All medicine have at least two outcomes, depending on the
      dose.</p><p>When you roll to determine the Hit Points restored to a
      Creature, you may instead choose to harm them. That Creature must make a
      Constitution Saving Throw against your Spell Save DC; on a failed Save,
      they instead take Necrotic Damage equal to the amount of Hit Points they
      would have recovered. On a successful Save, they take half as much
      Necrotic Damage.</p><p>This Damage is still considered to be restoring Hit
      Points for the purpose of any Features that require
      it.</p><hr><p><strong>Partially Automated: </strong>Use the Activity on
      this Feature and set the scaling value to the amount they would have
      recovered.</p>
