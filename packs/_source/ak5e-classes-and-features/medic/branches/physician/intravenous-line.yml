  description:
    value: >-
      <p>You gain an additional way to use your Life Support
      Feature:</p><ul><li><p><strong>Intravenous Line.</strong> As an Action,
      you can expend 10 Life Support to choose a Creature you can see within 15
      feet, and tune your Arts to that Creature’s biorhythms for 10 minutes, or
      until you use this Feature again. An unwilling Creature must make a
      Constitution Saving Throw against your Spell Save DC, being affected by
      this feature on a failed Save, or taking 2d8 Necrotic Damage on a
      successful Save.</p><p>While tuned to a Creature, you know the direction
      that Creature is in, and you can sense when it has less than half of its
      maximum Hit Points. In addition, once per Turn, when you deal Damage or
      restore Hit Points to that Creature, roll 1d6; the amount restored or
      dealt is increased by the amount rolled.</p><p>This amount is increased to
      2d6 at Level 7.</p></li></ul><p><strong>Automated: </strong>Only the
      effect to allow you to know if a Creature is at less than 50% HP is not
      automated; ask your DM.</p>
