  description:
    value: >-
      <p>You are the first line of defence for your patients against the world’s
      woes. You gain the following benefits:</p><p><strong>Collective
      Ward</strong>. When a Creature within 30 feet of you with your Ward would
      take Damage, you can remove any amount of your Ward from other Creatures
      within 30 feet of you to reduce that Damage by the amount of Ward removed,
      to a minimum of 0 (no Action required).</p><p><strong>Ward
      Regeneration.</strong> If you begin your Turn and do not have your Ward,
      you can gain Temporary Hit Points equal to half of your Medic Level,
      rounded up; this is considered to be your
      Ward.</p><hr><p><strong>Semi-Automated: </strong>When you use the
      Collective Ward Activity, declare how much of your Ward you will be
      removing (and from where), and set the scaling value to the total amount
      of Ward removed. Ward Regeneration happens automatically if you have no
      Temp HP.</p>
