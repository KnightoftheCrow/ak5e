  description:
    value: >-
      <p>You gain an additional way to use your Life Support
      Feature:</p><ul><li><p><strong>Warding Surge.</strong> As a Reaction when
      a Creature with your Ward would take Damage, you can expend 10 Life
      Support to grant that Creature Resistance to those Damage Types until the
      end of the current Turn.</p><p>After you use this Feature, you may expend
      15 Life Support to restore use of your
      Reaction.</p></li></ul><hr><p><strong>Semi-Automated: </strong>This
      Feature grants Resistance to all Damage Types against the next hit.
      Enduring Damage Resistances for the remainder of the turn must be added
      manually. </p>
