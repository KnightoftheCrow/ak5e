  description:
    value: >-
      <p>When a Creature that has your Ward is targeted by an Attack from a
      Creature within 30 feet of them, you can expend your Reaction to cause the
      attacking Creature to make a Dexterity Saving Throw against your Spell
      Save DC. On a failed Save, they take 2d10 Force Damage, and the Attack
      misses that Creature regardless of the result of the roll; on a successful
      Save, they take half as much Damage, and suffer no other
      effects.</p><p>After you use this Feature, you may expend 15 Life Support
      to restore use of your Reaction.</p><hr><p><strong>Not Automated:
      </strong>The Activites on this Feature must be triggered manually at the
      correct time.</p>
    chat: ''
