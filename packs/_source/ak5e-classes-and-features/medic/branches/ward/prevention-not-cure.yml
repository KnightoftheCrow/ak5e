  description:
    value: >-
      <p>Your unique twist on medical Arts is designed to keep people from
      reaching harm, rather than putting them back together. You gain the
      following benefits:</p><p><strong>Ward.</strong> Whenever you would roll
      to Restore Hit Points to a Creature, you can instead grant that same
      amount of Temporary Hit Points. These Temporary Hit Points are known as
      your Ward, and interact with your other Features.</p><p><strong>Additional
      Temporary Hit Points.</strong> Whenever you grant Temporary Hit Points as
      a result of an Action or Bonus Action, roll 1d8 and add the result to the
      amount of Temporary Hit Points granted. Additionally, if those Temporary
      Hit Points were granted as a result of an Art, increased the amount
      granted by the number of Arts Points spent on that
      Art.</p><hr><p><strong>Semi-Automated: </strong>The replacement effect of
      temporary HP is currently not working due to a module bug. You must apply
      your Ward by using the Activity on this Ability.</p>
    chat: ''
