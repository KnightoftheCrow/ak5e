  description:
    value: >-
      <p>You move through targets less like a ghost, and more like bloody-handed
      death. You gain the following benefits:</p><ul><li><p><strong>Pay it
      Forward.</strong> Once per Turn, when you hit a Creature with a Ranged
      Attack using a Weapon that has the Thrown Property, you may move up to
      half of your Speed.</p></li><li><p><strong>Second Strike.</strong> When
      you hit a Creature with a Ranged Attack using a Weapon that has the Thrown
      Property, your next Melee Attack this Turn against that Creature deals
      additional Damage equal to your Agent
      Level.</p></li></ul><hr><p><strong>Semi-Automated: </strong>Pay it Forward
      requires no Automation; Second Strike has an Opt-In available whenever you
      hit with a Melee Attack during your Turn.</p>
