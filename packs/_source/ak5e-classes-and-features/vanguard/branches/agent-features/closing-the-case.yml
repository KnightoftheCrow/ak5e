  description:
    value: >-
      <p>On any Turn that you have used your Shadowstrike Feature, you may
      activate this Feature as a Bonus Action; choose a Creature you can see
      within 30 feet. That Creature takes 1d8 Piercing Damage for each time this
      Turn you have:</p><ul><li><p>Hit that Creature with a Ranged Attack using
      a Weapon that has the Thrown Property.</p></li><li><p>Hit that Creature
      with a Melee Weapon Attack.</p></li></ul><p>This Damage is increased to
      2d8 at Level 14.</p><p><strong>Partially Automated: </strong>activity
      considers 1 hit.</p>
