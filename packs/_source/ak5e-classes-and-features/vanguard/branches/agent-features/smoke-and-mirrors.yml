  description:
    value: >-
      <p>If you don’t want to be caught, you won’t be.</p><p>During your Turn
      (no Action required), or as a Reaction, you can create a 10 foot radius
      sphere of magical darkness centred on yourself until the beginning of your
      next Turn; you can see through this Darkness. You may use this Feature
      once per Short Rest; however, if you reduce a Creature to 0 Hit Points,
      you may use this Feature without expending your use of
      it.</p><p><strong>Not automated.</strong></p>
