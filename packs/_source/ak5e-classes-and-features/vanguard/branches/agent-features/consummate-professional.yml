  description:
    value: >-
      <p>A professional never blames his tools, and is never found without them.
      You gain the following benefits:</p><ul><li><p><strong>Tool
      Proficiency.</strong> You gain Proficiency in the Mechanism
      Kit.</p></li><li><p><strong>Make it Happen.</strong> You are always
      considered to have access to a Mechanism Kit, even if you do not
      physically possess one. This Mechanism Kit has unlimited Charges, but you
      cannot use the “The Best Laid Plans” Proficient Activity with this
      chargeless kit.</p></li></ul><hr><p><strong>Automated: </strong>The
      Activities from the Mechanism Kit are on this Feature.</p>
