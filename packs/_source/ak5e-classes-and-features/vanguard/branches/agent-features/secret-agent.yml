  description:
    value: >-
      <p>The covert Arts are your bread and butter. You gain the following
      benefits:</p><p><strong>Skill Expertise.</strong> You gain Expertise in
      one Skill of your choice in which you have Proficiency. Stealth or Sleight
      of Hand are recommended.</p><p><strong>Fade.</strong> As a Bonus Action
      during your Turn, you may grant yourself the Invisible Condition until the
      end of your next Turn. The Condition ends early if you make an Attack
      Roll, or force a Creature to make a Saving Throw.</p><p>You may use this
      Feature a number of times equal to your Proficiency Bonus, and regain all
      expended uses when you finish a Long Rest. If you are in Darkness when you
      use this Feature, you do not expend a use of it.</p>
