  description:
    value: >-
      <p>Your training has given you a speciality with a particular set of
      tactics. You gain the following
      benefits:</p><p><strong>Quicklaunch.</strong> When you make an Attack Roll
      using a Weapon with the Thrown Property, you may Draw a different Weapon
      with the Thrown Property as part of that
      Attack.</p><p><strong>Shadowstrike.</strong> When you take the Attack
      Action while you have the Invisible Condition, you gain the following
      benefits until the end of the Turn:</p><ul><li><p>You may make 1
      additional Attack as part of that Attack Action.</p></li><li><p>When you
      hit with an Attack, you may use your Tip of the Spear Feature (no Action
      required).</p></li></ul><p><strong>Not automated.</strong></p>
