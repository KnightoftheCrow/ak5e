  description:
    value: >-
      <p>As an Action while you are wielding your Standard, or are within 5 feet
      of it if it is planted, you may launch it at a grounded location you can
      see within 60 feet. For each Creature within 15 feet of the chosen point,
      you can apply one on the following effects based on whether they are
      friendly or hostile to you (neutral Creatures are considered be
      friendly):</p><p><strong>Friendly.</strong> The Creature can gain
      Temporary Hit Points equal to 1d12 + your Charisma
      Modifier.</p><p><strong>Hostile.</strong> The Creature must make a
      Dexterity Saving Throw against your Standard Bearer DC. On a failed Save,
      they take 6d6 Thunder Damage, and their Speed is reduced by 15ft until the
      end of their next Turn. On a successful Save, they take half as much
      Damage, and their Speed is not reduced.</p><p>Your Standard is then
      planted at the chosen location. Until the end of your next Turn, both you
      and your Standard project your Aura of Influence, at a 10-foot and 25-foot
      radius respectively. </p><p>Once you have used this Feature, you must
      finish a Short Rest before you may do so again.</p>
