  description:
    value: >-
      <p>A Standard Bearer needs a standard. When you choose this Branch, a
      Standard is added to your starting equipment.</p><p><strong>Creating the
      Standard.</strong> Your Standard is a Melee Weapon with the following
      traits:</p><table><thead><tr><td><p><strong>Name</strong></p></td><td
      data-colwidth="77"><p><strong>Category</strong></p></td><td><p><strong>Damage</strong></p></td><td><p><strong>Properties</strong></p></td><td
      data-colwidth="78"><p><strong>Weight</strong></p></td><td><p><strong>Cost</strong></p></td></tr></thead><tbody><tr><td><p>Standard</p></td><td
      data-colwidth="77"><p>Special Melee</p></td><td><p>1d8
      Piercing</p></td><td><p>Finesse, Two-Handed</p></td><td
      data-colwidth="78"><p>5 lb.</p></td><td><p>200
      LMD</p></td></tr></tbody></table><p>You can only have one Standard at a
      time; replacing a Standard costs 200 LMD.</p><p>Your Standard is a symbol
      of power; it lifts up your allies, and casts down your foes. While you are
      wielding it, it projects an Aura of Influence around you in a
      10-foot-radius sphere centered on you. As a Bonus Action while you are
      wielding it, you can plant the Standard at your current location; A
      Planted Standard does not impede movement, and can be picked up by a
      Creature within 5 feet of it as a Bonus Action.</p><p>While the Standard
      is planted, the size of the Aura of Influence is increased to 25 feet, but
      it is centered on the Standard instead of you. Additionally, when a
      Creature enters that area, or begins their Turn there, you can use your
      Tip of the Spear Feature on that Creature (no Action required). Once you
      have done so, you cannot do so again on that Creature until the beginning
      of your next Turn.</p><hr><p><strong>Semi-Automated: </strong>See the
      Standard Item provided for information on how your Aura of Influence
      works.</p>
