  description:
    value: >-
      <p>When you speak, others listen. When you give commands, others obey,
      even to defy death. You gain the following
      benefits:</p><ul><li><p><strong>Duty Not Yet Done.</strong> When an allied
      Creature within your Aura of Influence would be reduced to 0 Hit Points
      but not killed outright, you can use your Reaction to order them to
      survive. If you do, they instead survive on 1 Hit Point. Once you have
      used this Feature on a Creature, you may not do so again on that Creature
      until you have completed a Long Rest.</p></li><li><p><strong>Skill
      Expertise.</strong> You gain Proficiency in the Persuasion and
      Intimidation Skills. If you already have Proficiency in either Skill, you
      instead gain Expertise in that
      Skill.</p></li></ul><hr><p><strong>Semi-Automated: </strong>The Skill
      Expertise is Automated: Duty not yet done cannot be.</p>
