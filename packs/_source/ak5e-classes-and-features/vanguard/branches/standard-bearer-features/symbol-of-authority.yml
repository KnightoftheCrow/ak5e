  description:
    value: >-
      <p>Your Standard is a symbol of its own; as the name suggests, you are
      just its bearer. You gain the following benefits:</p><p><strong>King of
      the Hill.</strong> While your Standard is planted, you or an allied
      Creature that can see your Standard, who’s Speed is more than 0, can use
      their Bonus Action to either:</p><ul><li><p>Replace their Walking Speed
      with your Walking Speed until the end of that
      Turn.</p></li><li><p>Increase all of their Movement Speeds by 10 feet
      until the end of that Turn.</p></li></ul><p>If they do so, they must end
      their Turn within your Aura of Influence.</p><p><strong>Voice of the
      Herald.</strong> As an Action, choose up to two different Creatures
      (except yourself) within your Aura of Influence that can see you or hear
      you. Once before the end of that Creature’s next Turn, when they make a
      Damage Roll, they may roll 1d8 (no Action required) and add the result to
      the result of the triggering roll.</p>
