  uses:
    spent: 0
    recovery: []
    max: '999'
  advancement: {}
  description:
    value: >-
      <p>Those fighting around your Standard find themselves empowered, reminded
      of why they fight; your punctuating cries surge their morale to higher
      heights. This surging morale is represented by Fervour. You can gain
      Fervour in each of the following ways; once you have gained Fervour, you
      cannot gain Fervour in that way again until the beginning of your next
      Turn.</p><p>You can gain Fervour in each of the following ways, once per
      Turn:</p><ul><li><p>+1 when an allied Creature within your Aura of
      Influence scores a Critical Hit.</p></li><li><p>+1 when an allied Creature
      within your Aura of Influence reduces a hostile Creature to 0 Hit
      Points.</p></li><li><p>+1 when a hostile Creature within your Aura of
      Influence is reduced to 0 Hit Points.</p></li><li><p>+1 when an allied
      Creature within your Aura of Influence activates an Operator
      Skill.</p></li></ul><p>Fervour has no maximum value, but all of your
      Fervour is lost when you no longer in combat with hostile
      Creatures.</p><p>You expend Fervour as an Action to use one of your
      Battlecries, listed below.</p><p><strong>Chorus.</strong> Each Battlecry
      has a Chorus Effect; when you use a Battlecry, Creatures within your Aura
      of Influence can expend their Reaction in the way dictated by the chorus
      effect to join in with your battlecry, gaining a
      benefit.</p><table><thead><tr><td><p><strong>Battlecry</strong></p></td><td><p><strong>Effect</strong></p></td><td><p><strong>Chorus</strong></p></td></tr></thead><tbody><tr><td><p>Belligerant
      Exultation (3 Fervour)</p></td><td><p>Until the start of your next Turn,
      all allied Creatures within your Aura of Influence can use their Bonus
      Action to either take the Dash Action, or make a Weapon
      Attack.</p></td><td><p>An allied Creature can expend its Reaction in
      response to this Battlecry to take one of the above Actions as part of
      that Reaction. However, they cannot take that Action as part of their
      Bonus Action next Turn.</p></td></tr><tr><td><p>Cry Havoc (5
      Fervour)</p></td><td><p>You project a terrifying below in a 30-foot cone
      originating from you; hostile Creatures within this area must make a
      Wisdom Saving Throw against your Standard Bearer DC. On a failed Save,
      they take 2d4 Psychic Damage, and are Frightened of you. A Creature may
      reattempt this Saving Throw at the end of their Turn, ending the Condition
      on a success. On a successful Save, they take half as much Damage, and are
      not Frightened. Damage dealt by this Cry does not kill Creatures it
      reduces to 0 Hit Points, but instead completely breaks their morale,
      forcing them to flee or panic.</p></td><td><p>When you declare this
      Battlecry, allied Creatures can expend their Reaction to increase the
      length of the cone, and the amount of Psychic Damage dealt, by 10 feet and
      1d4, respectively.</p></td></tr><tr><td><p>Defiant Roar (10
      Fervour)</p></td><td><p>Until the end of your next Turn, all allied
      Creatures within your Aura of Influence have Damage Reduction against
      Physical Damage equal to your Charisma Modifier. You may extend the
      duration of this effect by an additional Round as an Action while you are
      within 5 feet of your Standard, to a maximum of 5
      Rounds.</p></td><td><p>An allied Creature can expend its Reaction in
      response to this Battlecry to gain Resistance to the next instance of
      Damage they take within a minute.</p></td></tr><tr><td><p>Heroic
      Proclamation (5 Fervour)</p></td><td><p>Until the end of your next Turn,
      all allied Creatures within your Aura of Influence are immune to the
      Frightened Condition; if they currently have the Condition, it is
      suspended while they are under this effect. Additionally, When a Creature
      under this effect makes an Attack Roll, they can roll 1d4 and add it to
      the result of their Attack Roll. You may extend the duration of this
      effect by an additional Round as an Action while you are within 5 feet of
      your Standard, to a maximum of 5 Rounds.</p></td><td><p>An allied Creature
      can expend its Reaction in response to this Battlecry to gain 1d8
      Temporary Hit Points that is cumulative with other Temporary Hit Points
      they have.</p></td></tr><tr><td><p>Rallying Cry (3
      Fervour)</p></td><td><p>All allied Creatures within your Aura of Influence
      expend and roll one of their Hit Dice (no Action required), recovering Hit
      Points equal to the amount rolled + your Charisma
      Modifier.</p><p></p></td><td><p>Immediately after gaining Hit Points as a
      result of this Battlecry, a Creature can use their Reaction to expend and
      roll one of their Hit Dice, recovering Hit Points equal to the amount
      rolled + your Charisma Modifier.</p></td></tr><tr><td><p>Strident Boast
      (10 Fervour)</p></td><td><p>Allied Creatures within your Area of Influence
      gain Skill Points equal to your Vanguard Level.</p></td><td><p>Immediately
      after gaining Skill Points as a result of this Battlecry, Creatures may
      expend their Reaction to gain that many Skill Points
      again.</p></td></tr></tbody></table><hr><p><strong>Semi-Automated:
      </strong>Belligerent Exhultation, Rallying Cry, Strident Boast cannot be
      automated. For Cry Havoc, set the scaling value to the amount of Creatures
      joining the Chorus. Other Features are automated.</p>
    chat: >-
      <p>You expend Fervour as an Action to use one of your Battlecries, listed
      below.</p><p><strong>Chorus.</strong> Each Battlecry has a Chorus Effect;
      when you use a Battlecry, Creatures within your Aura of Influence can
      expend their Reaction in the way dictated by the chorus effect to join in
      with your battlecry, gaining a benefit.</p>
