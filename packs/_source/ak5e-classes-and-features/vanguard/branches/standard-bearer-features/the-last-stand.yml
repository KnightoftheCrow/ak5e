  description:
    value: >-
      <p>You have a voice that can command whole armies… or condemn
      them.</p><p>As an Action during your Turn, while your Standard is planted
      and you are within 5 feet of it, you can declare a Final Stand. For 1
      minute, or until you end the Final Stand as an Action, the following
      effects are applied:</p><ul><li><p>Your Speed is reduced to
      0.</p></li><li><p>Your Standard cannot be moved.</p></li><li><p>As an
      Action, you can cause a willing Creature within your Aura of Influence to
      immediatley take a full Turn. After this additional Turn ends, your Turn
      resumes.</p></li><li><p>When you would gain Skill Points, you can instead
      cause a Creature within your Aura of Influence to gain those Skill
      Points.</p></li><li><p>When you use your Tip of the Spear Feature, you can
      immediately use it one additional time (no Action required), targeting the
      same Creature.</p></li></ul><p>Once you have used this Feature, you cannot
      do so again until you have completed a Long Rest.</p>
