  description:
    value: >-
      <p>Whether through study or experience, Tacticians lead their allies in
      the most literal sense. They consider their strengths and weaknesses, and
      orchestrate the battlefield to best make use of
      both.</p><blockquote><p><strong>Equipment Exchange</strong></p><p>When you
      choose this Branch, you may exchange 1x Light Melee Weapon or 1x Light
      Shield from your Starting Equipment for A) 1x Light Ranged Weapon that
      does not have the Firearm Property.</p></blockquote><p>You gain the
      following Branch Features:</p><table><tbody><tr><td
      data-colwidth="87"><p>Level</p></td><td><p>Branch
      Feature</p></td></tr><tr><td data-colwidth="87"><p
