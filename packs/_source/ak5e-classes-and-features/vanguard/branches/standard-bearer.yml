  description:
    value: >-
      <p>The sight of a banner fluttering triumphantly in the wind has both
      driven many acts of heroism, and set entire armies to flight. This is the
      essence of the Standard Bearer; flag waving, exhortation upon their lips,
      they guide their allies to glorious
      victory.</p><blockquote><p><strong>Standard Bearer DC</strong></p><p>Some
      Branch Features call for your Standard Bearer DC; this is calculated as 8
      + your Charisma Modifier + your Proficiency Bonus.</p></blockquote><p>You
      gain the following Branch Features:</p><table><tbody><tr><td
      data-colwidth="87"><p>Level</p></td><td><p>Branch
      Feature</p></td></tr><tr><td data-colwidth="87"><p
      style="text-align:center">1</p></td><td><p>@UUID[Compendium.ak5e.ak5e-classes-and-features.Item.xniXIBfLuVJzPJ24]{Battle
      Standard},
      @UUID[Compendium.ak5e.ak5e-classes-and-features.Item.48KmPpjSpi13otp7]{Battle
      Cry}</p></td></tr><tr><td data-colwidth="87"><p
