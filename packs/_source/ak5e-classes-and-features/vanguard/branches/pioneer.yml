  description:
    value: >-
      <p>Pioneer Vanguards are frontline fighters, through and through. Unlike
      other Vanguards, who skirt around the battle, Pioneers are typically first
      into the fray, and often the last out, using their skills to inflict heavy
      casualties. The role of a Pioneer is to establish a foothold in the
      battle, and it is a role they fill well.</p><p>You gain the following
      Branch Features:</p><table><tbody><tr><td
      data-colwidth="87"><p>Level</p></td><td><p>Branch
