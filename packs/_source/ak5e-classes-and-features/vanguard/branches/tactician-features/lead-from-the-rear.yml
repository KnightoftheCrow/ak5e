  description:
    value: >-
      <p>A Tactician’s position is not in the scrum, but guiding proceedings
      from afar. You gain the following
      benefits:</p><ul><li><p><strong>Additional Weapon Proficiencies.</strong>
      You gain Proficiency with Light Ranged
      Weapons.</p></li><li><p><strong>Forward Planning.</strong> When you
      complete a Long Rest, you can create a Plan. A Plan is based either in a
      particular location, or against a particular Creature. When you create
      each Plan, name either a location or a Creature you are familiar with.
      Your maximum number of Plans is equal to your Proficiency Bonus; if you
      would create a Plan when you are at your maximum Plans, you must first
      discard a Plan of your
      choice.</p></li></ul><blockquote><p><strong>Familiarity for
      Plans</strong></p><p>There are some restrictions for being able to claim
      familiarity with a location or Creature. However, these restrictions are
      not ironclad, and a DM may allow other reasons on their
      discretion.</p><p><strong>Creature.</strong> Can name at least two
      distinguishing features of that Creature (E.G. “A Feline, has a scar over
      his left eye, and wields a custom crossbow” or “An Originium Slug, twice
      the size of the rest, with a single horn on its
      front”).</p><p><strong>Location.</strong> Must have access to a map or
      some other way of knowing the geography of the intended area (E.G. “We’re
      going to be fighting inside this house, so I have this floor plan of the
      building” or “our battle is going to take place in these city streets, so
      our allies have got us access to this drone camera so that we can see the
      streets from here”).</p></blockquote><p>When you roll Initiative, and
      either of the following is true:</p><ul><li><p>The named Creature is
      hostile to you, and you can see them.</p></li><li><p>You are in the named
      location.</p></li></ul><p>You can activate that Plan (no Action required).
      You, and any Creatures of your choice, may add your Intelligence or Wisdom
      Modifier to the result of their Initiative Rolls for that
      Battle.</p><p>You can only have one Plan active at a
      time.</p><hr><p><strong>Semi-Automated: </strong>Creating a Plan gives you
      a use of this Feature; you must manually track the conditions for
      activating that plan. When you Activate a Plan, target the Creatures of
      your choice and choose the appropriate effect to apply BEFORE they roll
      Intiative.</p>
    chat: >-
      <p><strong>Forward Planning.</strong> When you complete a Long Rest, you
      can create a Plan. A Plan is based either in a particular location, or
      against a particular Creature. When you create each Plan, name either a
      location or a Creature you are familiar with. Your maximum number of Plans
      is equal to your Proficiency Bonus; if you would create a Plan when you
      are at your maximum Plans, you must first discard a Plan of your
      choice.</p><p>When you roll Initiative, and either of the following is
      true:</p><ul><li><p>The named Creature is hostile to you, and you can see
      them.</p></li><li><p>You are in the named location.</p></li></ul><p>You
      can activate that Plan (no Action required). You, and any Creatures of
      your choice, may add your Intelligence or Wisdom Modifier to the result of
      their Initiative Rolls for that Battle.</p><p>You can only have one Plan
      active at a time.</p>
