  description:
    value: >-
      <p>It all comes down to a pivotal moment. That moment was ten steps
      ago.</p><p>When a Creature within your Strategic Zone makes an Attack
      Roll, or a Creature is making an Attack Roll as part of one of your
      Tactics, you can use this Feature as a Reaction; that Attack Roll is
      considered to be a Critical Hit, with all the benefits that entails, and
      ignores any Resistance that Creature has to the Damage of that
      Attack.</p><p>Once you have used this Feature, you may not do so again
      until you have completed a Long Rest.</p><p><strong>Not
      automated.</strong></p>
