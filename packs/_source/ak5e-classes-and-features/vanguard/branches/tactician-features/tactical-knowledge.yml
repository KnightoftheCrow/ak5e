  description:
    value: >-
      <p>Your training as a Tactician allows you to direct the battlefield in
      ways others cannot; you gain access to Basic Tactics (detailed below) that
      are fueled by your Acumen.</p><p>Acumen: Acumen is the resource that
      represents your capacity to bear the mental strain of commanding. Your
      maximum Acumen is equal to twice your Proficiency Bonus. You regain all
      expended Acumen when you complete a Long Rest.</p><p>Using Tactics: You
      can activate a Tactic either as an Action or a Bonus Action by expending
      the required Acumen for that Tactic; this means that you can activate two
      Tactics in the same Turn if you have the Acumen. However, once you have
      used a Tactic, you cannot use that Tactic again until the start of your
      next Turn.</p><p>Recieving the benefit of Tactics. Many Tactics have no
      defined range of effect. However, a Creature must be able to hear or see
      the Tactician clearly to be a valid beneficiary of that Tactic; if an
      allied Creature is ruled by the DM as being unable to see or hear you
      clearly, they are not affected by your Tactics even if they are within its
      affected area. This means that communication through a radio, or through
      some other remote means, is sufficient for many Tactics to be effective.
      However, waving from the horizon is not likely to be clear enough to
      communicate your Tactics.</p><blockquote><p><strong>Example: Delivering
      Tactics</strong></p><ul><li><p>The Tactician, Player A, is communicating
      with Player B, a Guard, through the use of Messenger Kits. Because Player
      B can hear Player A’s instructions clearly, they can benefit when Player A
      uses the “Fall Back” Tactic on them.</p></li><li><p>Player A wants to
      issue the “Volley Fire” Tactic to Players C and D, Marksmen on a nearby
      roof. Players C and D do not have Messenger Kits, nor can they hear Player
      A, but they are close enough to easily visually make out Player A’s
      signalling with their arm, and can this benefit from that
      Tactic.</p></li><li><p>Player A wants to issue the “Move Up” Tactic to
      Player E, a Caster who is 300 feet away. Player E is too far away to hear
      Player A’s voice, does not have any other way to hear Player A, and while
      they can technically see them, they are so far away that they cannot make
      out any individual gesture. They cannot benefit from this
      Tactic.</p></li></ul></blockquote><p>From 4th Level, when a Creature
      expends a Reaction in response to one of your Tactics while they are
      within your Strategic Zone, you may immediately use your Tip of the Spear
      Feature on that Creature regardless of range (no Action
      required).</p><blockquote><p><strong>Tactics for Casters</strong></p><p>In
      the world of Terra, Casters are an important part of battle tactica, no
      more or less than other warriors. For the Tactician’s Tactics, this is
      represented in the following way: when a Tactic would allow a Creature to
      make a Melee or Ranged Weapon Attack as part of that Tactic, that Creature
      can instead cast a Cantrip that involves making a Melee or Ranged Spell
      Attack, respectively, to replace that Melee or Ranged Attack. However, if
      they do so, the exertion leaves them wobbling; they are Dazed until the
      end of their next Turn.</p></blockquote>
