  advancement: {}
  description:
    value: >-
      <p>Your training as a Tactician allows you to direct the battlefield in
      ways others cannot; you gain access to Basic Tactics (detailed below) that
      are fueled by your Acumen.</p><ul><li><p><strong>Acumen.</strong> Acumen
      is the resource that represents your capacity to bear the mental strain of
      commanding. Your maximum Acumen is equal to twice your Proficiency Bonus.
      You regain all expended Acumen when you complete a Long
      Rest.</p></li><li><p><strong>Using Tactics.</strong> You can activate a
      Tactic either as an Action or a Bonus Action by expending the required
      Acumen for that Tactic; this means that you can activate two Tactics in
      the same Turn if you have the Acumen. However, once you have used a
      Tactic, you cannot use that Tactic again until the start of your next
      Turn.</p></li><li><p><strong>Recieving the benefit of Tactics.</strong>
      Many Tactics have no defined range of effect. However, a Creature must be
      able to hear or see the Tactician clearly to be a valid beneficiary of
      that Tactic; if an allied Creature is ruled by the DM as being unable to
      see or hear you clearly, they are not affected by your Tactics even if
      they are within its affected area. This means that communication through a
      radio, or through some other remote means, is sufficient for many Tactics
      to be effective. However, waving from the horizon is not likely to be
      clear enough to communicate your
      Tactics.</p></li></ul><blockquote><p><strong>Example: Delivering
      Tactics</strong></p><ul><li><p>The Tactician, Player A, is communicating
      with Player B, a Guard, through the use of Messenger Kits. Because Player
      B can hear Player A’s instructions clearly, they can benefit when Player A
      uses the “Fall Back” Tactic on them.</p></li><li><p>Player A wants to
      issue the “Volley Fire” Tactic to Players C and D, Marksmen on a nearby
      roof. Players C and D do not have Messenger Kits, nor can they hear Player
      A, but they are close enough to easily visually make out Player A’s
      signalling with their arm, and can this benefit from that
      Tactic.</p></li><li><p>Player A wants to issue the “Move Up” Tactic to
      Player E, a Caster who is 300 feet away. Player E is too far away to hear
      Player A’s voice, does not have any other way to hear Player A, and while
      they can technically see them, they are so far away that they cannot make
      out any individual gesture. They cannot benefit from this
      Tactic.</p></li></ul></blockquote><p>From 4th Level, when a Creature
      expends a Reaction in response to one of your Tactics while they are
      within your Strategic Zone, you may immediately use your Tip of the Spear
      Feature on that Creature regardless of range (no Action
      required).</p><blockquote><p><strong>Tactics for Casters</strong></p><p>In
      the world of Terra, Casters are an important part of battle tactica, no
      more or less than other warriors. For the Tactician’s Tactics, this is
      represented in the following way: when a Tactic would allow a Creature to
      make a Melee or Ranged Weapon Attack as part of that Tactic, that Creature
      can instead cast a Cantrip that involves making a Melee or Ranged Spell
      Attack, respectively, to replace that Melee or Ranged Attack. However, if
      they do so, the exertion leaves them wobbling; they are Dazed until the
      end of their next Turn.</p></blockquote><h4>Charge (3 Acumen)- Automation
      not Required</h4><p>Choose a point you can see; allied Creatures within 10
      feet of the chosen point can immediately use their Reaction to move up to
      their Speed; they must finish this movement as close to a hostile Creature
      as possible. If they finish this movement with at least one hostile
      Creature within their Reach, as part of the same Reaction they can make a
      Melee Weapon Attack against one of those hostile Creatures.</p><h4>Fall
      Back (1 Acumen)- Automation not Required</h4><p>You command an ally to
      carefully fall back, avoiding undue harm. Choose an allied Creature; that
      Creature can immediately expend their Reaction to move 10 feet without
      provoking Opportunity Attacks, and then do so again. Each movement must
      move them away from hostile Creatures; they can only move closer if it is
      the only way to move closer to safety (E.G. they are
      surrounded).</p><h4>Move Up (1 Acumen)- Automation not Required</h4><p>You
      command an ally to move on the double. Choose an allied Creature; that
      Creature can immediately expend their Reaction to take the Dash
      Action.</p><h4>Pincer Manoeuvre (2 Acumen)- Provides Advantage to target
      Creature</h4><p>Choose an allied Creature; that Creature can use their
      Reaction to move up to their Speed; they must finish this movement as
      close to a hostile Creature as possible. If they finish this movement with
      a hostile Creature within their Reach who is also within the Reach of an
      allied Creature, as part of the same Reaction they can make a Melee Weapon
      Attack against one of those hostile Creatures; this Attack is made at
      Advantage.</p><h4>Switch Ranks (2 Acumen)- Automation not
      Required</h4><p>You command your allies to regroup, switching tired
      fighters for fresh ones. Choose a number of allied Creatures within 60
      feet of you, up to your Intelligence Modifier or Wisdom Modifier. Each of
      those Creatures can swap places with a willing Creature that has a Speed
      of more than 0 within 10 feet of themselves, without either Creature
      provoking Opportunity Attacks. A Creature cannot swap into a space it does
      not fit in.</p><h4>To My Side (2 Acumen)- Automation not
      Required</h4><p>You command your allies to form up on your position.
      Choose a number of allied Creatures within 60 feet of you, up to your
      Intelligence Modifier or Wisdom Modifier; those Creatures can immediately
      move up to their Speed as a Reaction, but must finish that Movement within
      15 feet of you if able, or as close to you as possible if they
      cannot.</p><hr><p><strong>Semi-Automated: </strong>See Individual
      Tactics.</p>
    chat: >-
      <p><strong>Using Tactics.</strong> You can activate a Tactic either as an
      Action or a Bonus Action by expending the required Acumen for that Tactic;
      this means that you can activate two Tactics in the same Turn if you have
      the Acumen. However, once you have used a Tactic, you cannot use that
      Tactic again until the start of your next
      Turn.</p><blockquote><p><strong>Tactics for Casters</strong></p><p>In the
      world of Terra, Casters are an important part of battle tactica, no more
      or less than other warriors. For the Tactician’s Tactics, this is
      represented in the following way: when a Tactic would allow a Creature to
      make a Melee or Ranged Weapon Attack as part of that Tactic, that Creature
      can instead cast a Cantrip that involves making a Melee or Ranged Spell
      Attack, respectively, to replace that Melee or Ranged Attack. However, if
      they do so, the exertion leaves them wobbling; they are Dazed until the
      end of their next Turn.</p></blockquote>
