  description:
    value: >-
      <p>Cerebral; that is your defining characteristic. The battlefield dances
      to the beat of your drum. This is represented by your Strategic
      Zones:</p><p><strong>Strategic Zone.</strong> Your Strategic Zone is a
      15-foot cube centered on a grounded location you can see within 60 feet.
      It remains for 1 minute, or until you dismiss it as a Bonus Action. When
      you place a Strategic Zone, it cannot overlap with any other Strategic
      Zone. The maximum number of Strategic Zones you can have at once is equal
      to your Proficiency Bonus.</p><p><strong>Placing your Strategic
      Zone.</strong> As an Action, you can designate one of your Strategic
      Zones. When you do so, you choose a Strategy (described below) to apply to
      that Strategic Zone for its duration. Alternatively, if a face of the
      Strategic Zone is touching the face of another of your Strategic Zones,
      you can instead choose for the new zone to inherit the Strategy placed on
      the old zone, so that both Zones have the same Strategy
      applied.</p><p><strong>Strategies.</strong> Your Strategies are listed in
      alphabetical order in the Strategies Table. Once you have applied a
      Strategy, you cannot apply that Strategy again until you have completed a
      Long Rest, except in the case of a Zone inheriting the Strategy from
      another Zone. Additionally, you can change the Strategy in one of your
      Strategic Zones as a Bonus Action; when you do so, you may also change the
      Strategy in all connected Strategic Zones. Finally, interconnected Zones
      are considered to be the same Zone for any Strategy that requires
      it.</p><table><tbody><tr><td
      data-colwidth="85"><p><strong>Strategy</strong></p></td><td><p><strong>Effect</strong></p></td></tr><tr><td
      data-colwidth="85"><p>Choke Point</p></td><td><p>When a hostile Creature
      is hit by an Attack while they are within this Strategic Zone, all
      connected Zones with this Strategy become Difficult Terrain for that
      Creature until the beginning of their next Turn.</p></td></tr><tr><td
      data-colwidth="85"><p>Elastic Defence</p></td><td><p>When an allied
      Creature within this Strategic Zone would be required to make a Dexterity
      Saving Throw against an effect that targets an area, they can use their
      Reaction to move up to half their Speed. After this movement, if they are
      no longer in the affected area, they automatically succeed on that Saving
      Throw.</p></td></tr><tr><td
      data-colwidth="85"><p>Encirclement</p></td><td><p>When an allied Creature
      within this Strategic Zone makes an Attack against a hostile Creature
      within the same Zone, that is also within the reach of two or more other
      allied Creatures, that Attack ignores any Damage Reduction that Creature
      has against that Attack.</p></td></tr><tr><td
      data-colwidth="85"><p>Raid</p></td><td><p>When an allied Creature begins
      their Turn in this Zone, or enters this Zone during this Turn, they gain
      the following benefits until the end of their next Turn: Their Speed is
      increased by 10 feet, and when they hit a Creature no more than one size
      larger than them with a Melee Attack, they can knock that Creature away
      from them 10 feet.</p></td></tr><tr><td data-colwidth="85"><p>Rank
      Fighting</p></td><td><p>When a Melee Attack is made against allied
      Creature in this Zone, other allied Creatures that meet the following
      conditions can expend their Reaction to make a Melee Weapon Attack against
      the Attacking Creature, if both the Attacking and Attacked Creature are
      within their Reach.</p></td></tr><tr><td data-colwidth="85"><p>Strength in
      Numbers</p></td><td><p>When you use a Tactic that only affects a single
      Creature (such as “Fall Back”, or “Pincer Manoeuvre”), you can affect an
      additional Creature with that Tactic.</p></td></tr><tr><td
      data-colwidth="85"><p>Superior Firepower</p></td><td><p>Allied Creatures
      within this Zone have Advantage on Ranged Attacks against Creatures that
      have been Attacked since the end of the end of the allied Creature’s last
      Turn. If they already have Advantage, that Attack instead deals 1d8
      additional Damage; this additional Damage can only be dealt once per
      Turn.</p></td></tr></tbody></table><p><strong>Partially
      Automated:</strong> zone placement.</p>
