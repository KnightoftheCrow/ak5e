  description:
    value: >-
      <p>No plan survives contact with the enemy, but having a plan is
      essential. You gain the following
      benefits:</p><ul><li><p><strong>Lynchpin.</strong> When you would place a
      Strategic Zone, you can instead attach that Zone to yourself, with the
      Zone being centered on and moving with you. You can only have one
      Strategic Zone attached to you in this way, and a Zone attached to you can
      overlap with your other Strategic Zones, allowing for Creatures to be
      affected by more than one of your Strategies at a time. Additionally, when
      the face of a Zone attached to you touches the face of another of your
      Zones, you can either:</p><ul><li><p>Cause the other Zones, and all
      connected Zones, to inherit the Strategy from the Zone attached to
      you.</p></li><li><p>Cause the Zone attached to you to inherit the Strategy
      from the other Zone.</p></li></ul></li><li><p><strong>The Big
      Plan.</strong> When you activate a Plan using your Forward Planning
      Feature, you can also activate this Feature (no Action required). If you
      do so, until the end of your first Turn, you can place your Strategic
      Zones without expending an Action, and you may place them at any range,
      even to locations you cannot see. Once you have used this Feature, you
      cannot do so again until you complete a Long
      Rest.</p></li></ul><hr><p><strong>Semi-Automated: </strong>There are new
      Strategies with "Lynchpin" in their names on your Strategic Genius
      Feature. The Big Plan Activity is just for tracking, and cannot be
      automated.</p>
