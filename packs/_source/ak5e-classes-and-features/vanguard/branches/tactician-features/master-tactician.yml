  description:
    value: >-
      <p>Your mind is as great a weapon as any steel, and has laid low more
      enemies than most weapons will ever. You gain the following
      benefits:</p><p><strong>Tactical Expansion.</strong> You gain access to
      the Advanced Tactics listed below.</p><p><strong>Well-Drilled.</strong>
      When an allied Creature begins its Turn within one of your Strategic
      Zones, it gains a additional Reaction that it can only expend on your
      Strategies or Tactics.</p><p><strong>Partially Automated:</strong> acumen
      consumption.</p>
