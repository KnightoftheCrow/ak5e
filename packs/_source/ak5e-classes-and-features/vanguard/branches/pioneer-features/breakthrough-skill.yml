  description:
    value: >-
      <p>You gain an additional Elite Operator Skill; you may choose from any
      Elite Operator Skill available to the Guard Class, Defender Class,
      Marksman Class, Specialist Class, or Vanguard Class. However, ignore the
      Charging Method for that Skill. When you complete a Long Rest, you may
      exchange this Operator Skill for a different Elite Operator Skill from one
      of those classes.</p><hr><p><strong>Semi-Automated: </strong>When you gain
      this Feature, and when you level up, you will be prompted to choose or
      exchange an Operator Skill. If you want to change it on Long Rest, delete
      the one you chose and drag a new one onto the sheet.</p>
