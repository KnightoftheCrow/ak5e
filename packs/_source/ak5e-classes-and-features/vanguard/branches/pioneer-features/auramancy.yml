  description:
    value: >-
      <p>You project an Aura in a 15-foot-radius around yourself that moves with
      you; you may disable or enable this Aura as an Action. When you complete a
      Long Rest, all effects your Aura currently has end, and you may choose one
      of the following effects for your Aura to gain. Your Aura is disabled
      while you have the Incapacitated Condition.</p><p>For every 20 Skill
      Points you expend, you may choose an additional one of these effects for
      your Aura to gain; you may not choose an effect that is already active. If
      a Creature is within multiple Auras from this Feature, it only benefits
      (or suffers) from one of those Auras; the Creature may choose which one it
      is affected
      by.</p><table><thead><tr><td><p><strong>Aura</strong></p></td><td><p><strong>Effect</strong></p></td></tr></thead><tbody><tr><td><p><strong>Aura
      of Clarity.</strong></p></td><td><p>You and allied Creatures within your
      Aura are immune to the Charmed and Frightened Conditions; if an affected
      Creature has one of these Conditions, it is suspended while they are
      within your Aura.</p></td></tr><tr><td><p><strong>Aura of
      Liberation.</strong></p></td><td><p>You and allied Creatures within your
      Aura are unaffected by Difficult Terrain. Additionally, the Speed of
      affected Creatures cannot be reduced except by
      Conditions.</p></td></tr><tr><td><p><strong>Aura of
      Protection.</strong></p></td><td><p>Allies within your Aura gain a bonus
      to Saving Throws equal to your Proficiency
      Bonus.</p></td></tr><tr><td><p><strong>Aura of
      Punishment.</strong></p></td><td><p>Hostile Creatures within your Aura
      take 1d4 Psychic Damage whenever they are hit by an
      Attack.</p></td></tr><tr><td><p><strong>Aura of
      Purity.</strong></p></td><td><p>You and allied Creatures within your Aura
      are Resistant to Poison and Necrotic Damage, and have Advantage on Saving
      Throws to resist or end the Poisoned
      Condition.</p></td></tr><tr><td><p><strong>Aura of
      Infirmity.</strong></p></td><td><p>Hostile Creatures within your Aura
      suffer a penalty to their Saving Throws equal to your Proficiency
      Bonus.</p></td></tr><tr><td><p><strong>Aura of
      Violence.</strong></p></td><td><p>You and allied Creatures within your
      Aura can gain a Bonus to the first Attack Roll they make each Turn equal
      to your Proficiency
      Bonus.</p></td></tr></tbody></table><blockquote><p><strong>Example:
      Overlapping Auras</strong></p><p>For example, if a Creature was within the
      range of two different Auras with Aura of Punishment active, and was hit
      by an Attack, it would only take 1d4 Psychic Damage, not
      2d4.</p><p>Similarly, if a Creature was within the range of two different
      Auras with Aura of Protection active, it would only gain the benefit of
      one of those Auras, and would have to choose which Aura to benefit
      from.</p></blockquote><hr><p><strong>Semi-Automated: </strong>All of your
      Auras are automated. However, you cannot disable them with an action;
      manually disable them from your effects tab if you want to.</p>
    chat: ''
