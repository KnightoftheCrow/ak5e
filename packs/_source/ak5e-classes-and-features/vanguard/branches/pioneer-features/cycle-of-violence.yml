  description:
    value: >-
      <p>Violence begets more violence; few understand this more keenly than
      you. You gain the following benefits:</p><p><strong>Additional
      Auras.</strong> The following options are added to your Auramancy
      Feature:</p><ul><li><p><strong>Aura of Pressure.</strong> Hostile
      Creatures that begin their Turn within your Aura take 5 (1d8) Force
      Damage.</p><p><strong>Aura of Shadows.</strong> Attacks against you from
      Creatures within your Aura are made with Disadvantage.</p><p><strong>Aura
      of Vigilance.</strong> You and allied Creatures within your Aura gain a
      bonus to Initiative Rolls equal to your Proficiency
      Bonus.</p></li></ul><p><strong>Skill Recharge.</strong> When your Operator
      Skill ends, you gain Skill Points equal to your Vanguard Level if you
      reduced a Creature to 0 Hit Points during the duration of that Skill, or
      with the Damage of that Skill.</p><p><strong>Not automated.</strong></p>
