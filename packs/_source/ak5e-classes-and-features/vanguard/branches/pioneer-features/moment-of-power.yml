  description:
    value: >-
      <p>Your strength comes in waves, spiking high before returning to normal.
      You gain the following benefits:</p><ul><li><p><strong>Skill
      Haste.</strong> During the Turn you activate an Operator Skill, and while
      you have an Active Operator Skill, you can make one additional Attack when
      you take the Attack Action.</p></li><li><p><strong>Tactical
      Burst.</strong> Whenever you activate an Operator Skill, you generate you
      can immediately use your Tip of the Spear Feature (no Action required).
      For every 10 Skill Points you spent to activate that Skill, you can use
      Tip of the Spear an additional
      time.</p></li></ul><hr><p><strong>Automation not Required.</strong></p>
