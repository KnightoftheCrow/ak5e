  description:
    value: >-
      <p>Those unlucky enough to recieve your charge are either staggered or
      dead. You gain the following benefits:</p><ul><li><p><strong>Push on
      Through.</strong> On your Turn, if you have reduced a Creature to 0 Hit
      Points, you can make a Melee Weapon Attack as a Bonus Action that
      Turn.</p></li><li><p><strong>Unbalancing Charge.</strong> When you apply
      your Mark as a result of an Attack immediately before which you moved 15
      feet in a straight line, it gains an additional effect; Creatures have
      Advantage on Attack Rolls against that Marked
      Creature.</p></li></ul><hr><p><strong>Semi-Automated: </strong>There is a
      new Apply Mark option on your Crash and Bash Feature.</p>
