  description:
    value: >-
      <p>You are not a typical Vanguard, and prefer a much more direct approach
      to the idea of “guiding allies”. You gain the following
      benefits:</p><ul><li><p><strong>Additional Weapon Proficiencies.</strong>
      You gain Proficiency with Heavy Melee Weapons.</p></li><li><p><strong>Mark
      for Elimination.</strong> When you deal Damage to a Creature, you mark
      that Creature until the beginning of your next Turn. If a Marked Creature
      is reduced to 0 Hit Points, you can immediately use your Tip of the Spear
      Feature (no Action
      required).</p></li></ul><hr><p><strong>Semi-Automated:</strong> Weapon
      Proficiencies, effect for Marked creature.</p>
