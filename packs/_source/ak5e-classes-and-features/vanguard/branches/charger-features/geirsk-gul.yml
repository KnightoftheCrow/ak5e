  description:
    value: >-
      <p>When you hit with a Momentous Strike for which you consumed 5 or more
      Momentum, you can force that Creature to make a Strength Saving Throw
      against your Martial DC (no Action required); your Martial DC is increased
      by 1 for each Momentum consumed to make that Attack until this Feature has
      resolved. You can use this Feature even if the Creature is reduced to 0
      Hit Points by your Momentous Strike, as long as the body remains; they
      automatically fail this Saving Throw.</p><p>You drive that Creature back a
      distance equal to your Speed, pushing them the whole way and thus moving
      with them. If you would push them into another Creature, that Creature
      must succeed on a Dexterity Saving Throw against your Martial DC or have
      you crash the original Creature into them; allied Creatures automatically
      succeed on this Save. If you do not crash into a Creature, this movement
      ends when you have moved the total distance or if you crash into an
      object. When you crash into a Creature or Object, both the original
      Creature and the additional Creature/Object take Bludgeoning Damage equal
      to half of the Damage dealt by the triggering Momentous Strike.</p><p>Once
      you have used this Feature, you must complete a Long Rest before you can
      do so again.</p><p><strong>Not automated.</strong></p>
