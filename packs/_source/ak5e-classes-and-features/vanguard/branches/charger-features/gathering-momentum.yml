  description:
    value: >-
      <p>As the battle wears on, you build up pace for a spine-shattering blow,
      represented by your Momentum. Your maximum Momentum is 6; You lose all
      accumulated Momentum when you are no longer involved in a Combat. You can
      gain Momentum in the following ways:</p><ul><li><p>+1 Momentum after you
      roll Initiative.</p></li><li><p>+1 Momentum when you hit a hostile
      Creature with a Melee Attack; you must have not Damaged them since the
      beginning of your last Turn AND have moved at least 15 feet in a straight
      line immediately before making the Attack.</p></li><li><p>+1 Momentum when
      you take the Couch Action detailed
      below.</p></li></ul><p><strong>Couch.</strong> As an Action, you take a
      stance ready to rush towards your enemy. Your Speed is reduced to 0 until
      the beginning of your next Turn. During your next Turn, your Speed is
      increased by 10 feet, and your first Melee Attack Roll during that Turn
      has a +1 Bonus for each Momentum you had when you used this
      Action.</p><p><strong>Momentous Strike.</strong> As an Action, you can
      expend all your Momentum to make a single potent strike into which you put
      your all. This Attack deals 1d6 additional Weapon Damage for each Momentum
      expended. This is increased to 1d8 at 7th Level, and 1d10 at 14th
      Level.</p><p><strong>Not automated.</strong></p>
