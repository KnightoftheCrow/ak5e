  description:
    value: >-
      <p>In Kazimierz, a Kuranta’s spear sparks as it makes contact with the
      Aegir’s greatsword. Her opponent’s strength is truly inhuman, but she does
      not need to outmatch her- only outmanoeuvre her.</p><p>In Ursus, two
      paramilitary forces clash in the ruined streets of a nomadic city. The
      outcome of their battle could very well determine the survival of hundreds
      of thousands; amongst the chaos, a cadre of messengers, led by a man with
      a single red streak in his hair, guides the soon to be winners to victory.
      He raises his standard once more.</p><p>In Kazdel, a Caprinae slinks into
      the shadows, blending into her umbral backdrop like a chameleon. In a few
      moments, the outcome of her handiwork will be discovered, and the message
      will be delivered. She will remain to observe the whole process; despite
      the dozens of people pouring into the murder scene, not a one will spot
      her.</p><h3>Leaders of the Pack</h3><p>Vanguards lead the way; that is the
      essence of what it means to be a Vanguard. Some choose the direct
      approach, physically leading their allies down a path with their own
      martial prowess; others, the indirect approach, clearing the way through
      stealth and subterfuge. Others still lead their allies in a literal sense,
      doling out orders, strategies, and tactics to win the day.</p><p>What ties
      all Vanguards together, despite their disparate diaspora, is that they are
      all team players. While they may function independently, they do so at the
      behest of their allies. A Vanguard with no allies swiftly finds an
      ignominious end.</p><h3>Vanguard Traits</h3><p></p><table><tbody><tr><td
      data-colwidth="142"><p style="text-align:center"><strong>Primary
      Ability</strong></p></td><td><p>Dexterity</p></td></tr><tr><td
      data-colwidth="142"><p style="text-align:center"><strong>Hit Point
      Die</strong></p></td><td><p>D8 per Vanguard level</p></td></tr><tr><td
      data-colwidth="142"><p style="text-align:center"><strong>Saving Throw
      Proficiencies</strong></p></td><td><p>Dexterity + one of your choice from
      the following: Strength, Charisma</p></td></tr><tr><td
      data-colwidth="142"><p style="text-align:center"><strong>Skill
      Proficiencies</strong></p></td><td><p>Choose 3 from: Acrobatics,
      Athletics, Perception, Persuasion, Stealth,
      Wilderness</p></td></tr><tr><td data-colwidth="142"><p
      style="text-align:center"><strong>Weapon
      Proficiencies</strong></p></td><td><p>Light Melee</p></td></tr><tr><td
      data-colwidth="142"><p style="text-align:center"><strong>Tool
      Proficiencies</strong></p></td><td><p>Messenger Kit</p></td></tr><tr><td
