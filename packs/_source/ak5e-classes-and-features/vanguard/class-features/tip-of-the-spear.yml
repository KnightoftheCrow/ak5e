  description:
    value: >-
      <p>As a Vanguard, you lead and direct your allies, pushing them ever
      onwards, supporting them when they might otherwise fail. Each Vanguard
      Branch, and some Skills and Talents, will provide you with the opportunity
      to use this Feature to grant beneficial effects to an ally; each instance
      will specify the conditions under which you do so.</p><p>When you use this
      Feature, choose an allied Creature you can see within 60 feet; roll 1d6
      and apply the corresponding effect to them until the start of your next
      Turn; these effects are cumulative.</p><table><tbody><tr><td
      data-colwidth="31"><p><strong>Roll</strong></p></td><td><p><strong>Effect</strong></p></td></tr><tr><td
      data-colwidth="31"><p>1</p></td><td><p>Additional Damage equal to your
      Proficiency Bonus on one Damage Roll of their choice.</p></td></tr><tr><td
      data-colwidth="31"><p>2</p></td><td><p>They gain 1d6 Temporary Hit Points;
      these Hit Points are additive with any Temporary Hit Points they already
      have.</p></td></tr><tr><td data-colwidth="31"><p>3</p></td><td><p>Speed
      increased by 10 feet.</p></td></tr><tr><td
      data-colwidth="31"><p>4</p></td><td><p>+2 Bonus to Attack
      Rolls.</p></td></tr><tr><td
      data-colwidth="31"><p>5</p></td><td><p>Critical Range increased by
      1.</p></td></tr><tr><td data-colwidth="31"><p>6</p></td><td><p>Whenever
      they gain a Skill Point, they gain 1 more.</p></td></tr></tbody></table>
