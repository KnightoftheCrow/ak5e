  description:
    value: >-
      <p>You gain additional benefits based on your Weapon
      Specialisation.</p><p><strong>Ranged Combat.</strong> When you take the
      Attack Action, you may make one additional Attack as part of that Action;
      this Attack must be a Ranged Attack. Additionally, when you roll a 1 for a
      Ranged Attack Roll, you may reroll that die; you must use the new
      result.</p><hr><p><strong>Automated: </strong>The extra attack does not
      need to be automated.</p>
