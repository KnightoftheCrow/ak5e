  description:
    value: >-
      <p>You gain additional benefits based on your Weapon
      Specialisation.</p><p><strong>Ranged Combat.</strong> Whenever you have
      Advantage on a Ranged Attack Roll, you may roll an additional die, keeping
      only the die with the highest result. Additionally, you may expend 1
      Prowess as a Bonus Action to give yourself Advantage on the next Ranged
      Attack Roll you make.</p><hr><p><strong>Automated.</strong></p>
