  description:
    value: >-
      <p>No matter your path, you have reached its end. Only death can keep you
      from your mission now.</p><p>You gain one of the following benefits based
      on your choice of Hunter or Bodyguard:</p><p><strong>Bodyguard.
      </strong>You are Resistant to all Damage dealt by a hostile Creature with
      your Deathmark. Additionally, after using your Blade Shield Reaction, you
      regain use of your Reaction. Finally, when another Creature within 10 feet
      of you is targeted for an Attack by a hostile Creature, you can transfer
      your Deathmark, wherever it is, to the Attacking Creature as a
      Reaction.</p><hr><p><strong>Semi-Automated: </strong>This Feature cannot
      be set to trigger when a nearby Creature is attacked; you must trigger it
      manually.</p>
