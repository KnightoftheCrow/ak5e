    value: >-
      <p>You gain one of the following benefits based on your choice of Hunter
      or Bodyguard:</p><p><strong>Hunter.</strong> When you score a Critical
      Hit, you may roll 1 additional Damage die and add it to the extra Damage
      inflicted by that Critical Hit. Additionally, when you score a Critical
      Hit against a living Creature, you also inflict the Bleeding
      Condition.</p><hr><p><strong>Automated.</strong></p>
