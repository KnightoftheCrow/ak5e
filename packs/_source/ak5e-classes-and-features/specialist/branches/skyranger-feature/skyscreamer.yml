  advancement: {}
  description:
    value: >-
      <p>The difference between you and Icarus is that Icarus did not believe
      hard enough.</p><p>Once per Long Rest, while you are wearing your Flight
      Suit, you can transform it into its ultimate Combat Mode for 1 minute.
      While in Combat Mode, you gain the following
      benefits:</p><ul><li><p><strong>Multirole:</strong> You are considered to
      be in all three Doctrines at once. Additionally, you may use any of the
      options of your Air Doctrine Feature without expending
      Fuel.</p></li><li><p><strong>Special Weapons.</strong> You gain access to
      the following Special Weapons for the duration; they do not need to be
      equipped for you to use
      them.</p></li></ul><table><thead><tr><td><p><strong>Name</strong></p></td><td><p><strong>Category</strong></p></td><td><p><strong>Damage</strong></p></td><td><p><strong>Properties</strong></p></td><td
      data-colwidth="78"><p><strong>Weight</strong></p></td><td><p><strong>Cost</strong></p></td></tr></thead><tbody><tr><td><p>Core
      Cannon</p></td><td><p>Light Ranged</p></td><td><p>3d8
      Force</p></td><td><p>Range (100/300), Rapid Fire, Light</p></td><td
      data-colwidth="78"><p>-</p></td><td><p>-</p></td></tr><tr><td><p>Core
      Saber</p></td><td><p>Light Melee</p></td><td><p>3d8
      Force</p></td><td><p>Deadly, Finesse. Reach, Light</p></td><td
      data-colwidth="78"><p>-</p></td><td><p>-</p></td></tr></tbody></table><hr><p><strong>Automated:
      </strong>All of your Air Doctrine options are repeated on this Feature;
      these are versions that do not require Fuel but DO require you to have
      activated Skyscreamer.</p>
