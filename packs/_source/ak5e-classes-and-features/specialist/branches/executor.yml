  description:
    value: >-
      <p>An Executor Specialist’s primary concern is their mission, whatever it
      may be. Skulking in the shadows, waiting for their moment, before fading
      away once more. As a result, they are often not the most sociable people;
      but if you need a target dead, or a target preserved, you can ask for no
      better.</p><p>You get the following Branch
      features:</p><table><tbody><tr><td
      data-colwidth="50"><p>Level</p></td><td><p>Branch
      Feature</p></td></tr><tr><td data-colwidth="50"><p
      style="text-align:center">1</p></td><td><p>@UUID[Compendium.ak5e.ak5e-classes-and-features.Item.IJmhoIOctMN9mUDB]{The
      Wolf and the Shepherd (Hunter
      Path)}</p><p>OR</p><p>@UUID[Compendium.ak5e.ak5e-classes-and-features.Item.wdArlFZHTvXVS5DR]{The
      Wolf and the Shepherd (Bodyguard Path)}</p></td></tr><tr><td
