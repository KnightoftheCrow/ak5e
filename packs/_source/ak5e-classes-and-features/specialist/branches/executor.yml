      style="text-align:center">5</p></td><td><p>@UUID[Compendium.ak5e.ak5e-classes-and-features.Item.cafTpF1e9GXPsnc4]{In
      Every Shadow}</p></td></tr><tr><td data-colwidth="50"><p
