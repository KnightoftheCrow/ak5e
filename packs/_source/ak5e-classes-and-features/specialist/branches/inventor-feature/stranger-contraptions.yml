  description:
    value: >-
      <p>The effect of your Strange Contraptions are
      improved.</p><table><thead><tr><td data-colwidth="136"><p
      style="text-align:center"><strong>Stranger
      Contraption</strong></p></td><td><p
      style="text-align:center"><strong>Effect</strong></p></td></tr></thead><tbody><tr><td
      data-colwidth="136"><p style="text-align:center">12 Million Lumen
      Flashlight (Automated)</p></td><td><p>Creatures that succeed on the Saving
      Throw are Dazed until the end of their next Turn.</p></td></tr><tr><td
      data-colwidth="136"><p style="text-align:center">Fun Toy
      (Automated)</p></td><td><p>The Mobile Camera has the Invisible
      Condition.</p></td></tr><tr><td data-colwidth="136"><p
      style="text-align:center">Musbeast Remover
      (Automated)</p></td><td><p>Creatures that fail the Saving Throw suffer the
      Bleeding Condition.</p></td></tr><tr><td data-colwidth="136"><p
      style="text-align:center">Needlefly Fumigator (Cannot be
      automated)</p></td><td><p>When you use this Strange Contraption, you may
      choose any number of Creatures to be immune to its effects until the end
      of their next Turn.</p></td></tr><tr><td data-colwidth="136"><p
      style="text-align:center">Over-tuned Speaker (Automation not
      required)</p></td><td><p>You can now control the volume of the sound
      produced, and may also pick a particular direction to direct the
      sound.</p></td></tr><tr><td data-colwidth="136"><p
      style="text-align:center">Portable Firestarter (Cannot be
      automated)</p></td><td><p>When a Creature or Object takes Damage from the
      Burning Condition that was gained through this Strange Contraption, the
      Fire Damage taken is increased by your Intelligence
      Bonus.</p></td></tr><tr><td data-colwidth="136"><p
      style="text-align:center">Universal Keycard (Automation not
      required)</p></td><td><p>No longer leaves a trace.</p></td></tr><tr><td
      data-colwidth="136"><p style="text-align:center">Unstable Contraption
      (Automated)</p></td><td><p>Damage increased to
      8d8.</p></td></tr></tbody></table><hr><p><strong>Semi-Automated.</strong></p>
