  description:
    value: >-
      <p>You gain the following benefits:</p><ul><li><p><strong>Delivery
      Service. </strong>The range at which you can apply Infusions is increased
      to 30 feet.</p></li><li><p><strong>Questionable Rejuvenation.
      </strong>When you apply an Infusion to a Creature, and when a Creature
      succeeds on a Saving Throw against one of your Infusions, that Creature
      gains 1d10 Temporary Hit Points; if that Infusion is Procoagulant, these
      Temporary Hit Points are instead added to the Temporary Hit Points granted
      by that Infusion.</p></li></ul><hr><p><strong>Semi-Automated: </strong>The
      range of your Infusions is automatically increased. Stimpack can be done
      by using the Activity on this Feature when it would activate; if the
      Stimulant is procoagulant, set the scaling value to their current Temp
      HP.</p>
