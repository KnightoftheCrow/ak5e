  description:
    value: >-
      <p>Your Alchemical Concoctions have developed so far as to appear as
      magic.</p><p>As an Action, you can choose a Creature you can see within 30
      feet; that Creature cannot lose Hit Points for the next minute, as if they
      were under the effect of Invulnerability.</p><p>Once you have used this
      Feature, you may not do so again until you have completed a Long
