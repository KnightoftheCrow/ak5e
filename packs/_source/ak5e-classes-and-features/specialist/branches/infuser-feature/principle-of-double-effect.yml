  description:
    value: >-
      <p>You are but a simple chemist, dispensing medication to those in need.
      If it happens to have some side effects, are you really to blame? You gain
      the following benefits:</p><ul><li><p><strong>Additional Tool
      Proficiencies.</strong> You are Proficient with the Pharmacology
      Kit.</p></li><li><p><strong>Alchemical Infusions.</strong> As a Bonus
      Action, you can apply one of your chemical Infusions to a willing Creature
      you can see within 10 feet of you that is not a Construct or Undead for 1
      minute. Infusions available for you to apply are in the Infusions table
      below. A Creature can only have one Infusion applied to them at a time;
      applying a second Infusion removes the effect of any other Infusions on
      that Creature. You may use this Feature a number of times equal to twice
      your Proficiency Bonus, and recover all expended uses when you complete a
      Long Rest.</p><p>To gain a benefit from an Infusion, that Creature must
      Leverage it. Each Infusion describes the scenarios under which it can be
      Leveraged. When a Creature chooses to Leverage an Infusion that has been
      applied to it by you, it must immediately make a Constitution Saving Throw
      against your Infuser DC. On a successful Save, they gain the benefit of
      that Infusion; on a failed Save, they gain the benefit of that Infusion,
      but they are additionally Dazed until the beginning of their next Turn,
      and cannot Leverage any Infusions while they have this Condition. An
      Infusion is not consumed when it is Leveraged.</p><p>At 7th Level, your
      Infusions increase in effectiveness; when a Creature leverages one of your
      Infusions, they roll an additional dice for its effect (I.E 2d6 instead of
      1d6). If that Infusion does not roll dice for its effect (Such as
      Respiration Stimulant), that effect is instead
      doubled.</p></li></ul><table><thead><tr><td><p><strong>Infusion</strong></p></td><td><p><strong>Leverage
      Condition</strong></p></td><td><p><strong>Effect</strong></p></td></tr></thead><tbody><tr><td><p>Adrenaline
      Trigger</p></td><td><p>As a Reaction when the Creature fails a Strength
      Skill Check, Saving Throw, or misses a Melee Attack.</p></td><td><p>The
      Creature rolls 1d6 and adds the result to their total result, possibly
      changing a failure into a Success.</p></td></tr><tr><td><p>Flight Reflex
      Stimulant</p></td><td><p>As a Reaction when the Creature fails any Saving
      Throw (except against leveraging an Infusion).</p></td><td><p>The Creature
      rolls 1d6 and adds the result to the result of that Saving Throw, possibly
      changing a failure into a Success.</p></td></tr><tr><td><p>Focus
      Heightener</p></td><td><p>As a Reaction when the Creature fails a
      Dexterity Skill Check, Saving Throw, or misses a Ranged
      Attack.</p></td><td><p>The Creature rolls 1d6 and adds the result to their
      total result, possibly changing a failure into a
      Success.</p></td></tr><tr><td><p>Hesitation Suppressor</p></td><td><p>As a
      Reaction when the Creature forces a hostile Creature to make a Saving
      Throw.</p></td><td><p>The Creature rolls 1d4; the DC of that Saving Throw
      is increased by the amount rolled.</p></td></tr><tr><td><p>Muscle
      Strengthener</p></td><td><p>As a Reaction when the Creature hits a
      Creature with a Melee Attack.</p></td><td><p>The Creature rolls 1d6; The
      Damage of that Melee Attack is increased by the amount
      rolled.</p></td></tr><tr><td><p>Procoagulant</p></td><td><p>As a Bonus
      Action</p></td><td><p>The Creature rolls one of their Hit Dice (this does
      not expend that Hit Dice) and adds their Constitution Modifier; they gain
      that many Temporary Hit Points. Additionally, if they have the Bleeding
      Condition, it is removed.</p></td></tr><tr><td><p>Respiration
      Stimulant</p></td><td><p>As a Bonus Action</p></td><td><p>The Creature’s
      Speed is increased by 10 feet until the end of the
      Turn.</p></td></tr><tr><td><p>Sensation Nulling</p></td><td><p>As a
      Reaction when the Creature takes Damage</p></td><td><p>The Creature rolls
      1d4; they gain Damage Reduction against all Damage equal to the result
      until the end of that
      Turn.</p></td></tr></tbody></table><hr><p><strong>Semi-Automated:
      </strong>Use the Activity on this Feature to apply an Infusion. The
      Infusions are items added to that Character's Sheet; each infusion has
      instructions on how to use it. All require them to set the Scaling Value
      to your Infuser DC.</p>
    chat: >-
      <p>To gain a benefit from an Infusion, that Creature must Leverage it.
      Each Infusion describes the scenarios under which it can be Leveraged.
      When a Creature chooses to Leverage an Infusion that has been applied to
      it by you, it must immediately make a Constitution Saving Throw against
      your Infuser DC. On a successful Save, they gain the benefit of that
      Infusion; on a failed Save, they gain the benefit of that Infusion, but
      they are additionally Dazed until the beginning of their next Turn, and
      cannot Leverage any Infusions while they have this Condition. An Infusion
      is not consumed when it is Leveraged.</p>
