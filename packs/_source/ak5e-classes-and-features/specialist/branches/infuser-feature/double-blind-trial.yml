  advancement: {}
  description:
    value: >-
      <p>As a Bonus Action while you have access to a Pharmacology Kit, you can
      expend Prowess and 1 use of your Alchemical Infusions Feature to roll 1d4
      and apply the corresponding Toxin to that Weapon; this does not require
      you to physically possess the Toxin. This Toxin can be applied to weapons
      that already have a Toxin applied to them; however, this additional Toxin
      expires at the end of that Turn, regardless of its normal
      expiry.</p><table><thead><tr><td><p
      style="text-align:center"><strong>Result</strong></p></td><td><p
      style="text-align:center"><strong>Toxin</strong></p></td></tr></thead><tbody><tr><td><p
      style="text-align:center">1</p></td><td><p>Necrotoxin</p></td></tr><tr><td><p
      style="text-align:center">2</p></td><td><p>Haemotoxin</p></td></tr><tr><td><p
      style="text-align:center">3</p></td><td><p>Cytotoxin</p></td></tr><tr><td><p
      style="text-align:center">4</p></td><td><p>Neurotoxin</p></td></tr></tbody></table><p><strong>Gaining
      Prowess as an Infuser.</strong> As an Infuser, you gain 1 Prowess when a
      Creature that either has the Poisoned Condition, or is affected by a Toxin
      created by you, is reduced to 0 Hit Points. Additionally, you gain 1
      Prowess when the effect of one of your Infusions causes a Creature to
      succeed on an Attack Roll, Skill Check, or Saving Throw it would otherwise
      have failed; you can only gain Prowess in this way once per
      Round.</p><hr><p><strong>Semi-Automated: </strong>You can apply the Toxin
      using this Feature but must roll the 1d4 manually. Gaining Prowess cannot
      be automated.</p>
    chat: ''
