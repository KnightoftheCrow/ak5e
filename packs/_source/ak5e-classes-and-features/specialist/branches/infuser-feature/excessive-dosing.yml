  description:
    value: >-
      <p>Your toxins reach new heights of lethality, much to your joy. You gain
      the following benefits:</p><ul><li><p><strong>Succumb.</strong> The DC of
      your Toxins is increased by your Proficiency
      Bonus.</p></li><li><p><strong>Toxic Shock</strong>. Creatures that fail a
      Saving Throw against your Toxins are now additionally Poisoned for the
      same duration as that Toxin’s Conditions. If the Toxin does not apply a
      Condition upon failing the Saving Throw (such as Haemotoxin), they are
      instead Poisoned until the end of their next
      Turn.</p></li></ul><hr><p><strong>Semi-Automated: </strong>There are new
      Activites on Toxins when YOU use them, with the increased DC. If someone
      else is using your toxin, you will have to use the activity for them.</p>
