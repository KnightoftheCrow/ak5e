  description:
    value: >-
      <p>You have created a Doll, a construct that is friendly to you and your
      companions. Visually, the Doll appears to be you but cannot speak; a
      Creature must succeed on a DC18 Perception Check to see that it is fake,
      unless there is an obvious clue that something is amiss. In addition, you
      can see and hear whatever your Doll can see and hear. The Doll is capable
      of wearing clothes, armour, and wielding weapons; it is Proficient with
      all Weapons and Armour that you are.</p><ul><li><p><strong>The Doll in
      Combat.</strong> In Combat, the Doll acts during your Turn, and can use
      Reactions on its own. However, it will not move or take Actions unless you
      use your Bonus Action to command it to move; as part of that Bonus Action,
      you can also command it to take an Action in its Stat Block. To command
      the Doll in this way, you must be within 100 feet of
      it.</p></li><li><p><strong>Restoring or Replacing the Doll.</strong> As a
      Construct, the Doll cannot regain Hit Points in most ways (See Page
      9).</p><p>If the Doll is reduced to 0 Hit Points, it is destroyed.
      Replacing a Doll requires a Ritual performed as a Long Rest Activity if
      you retain the Doll’s components. If they are not retrieved, replacing the
      components requires 500 LMD. If you already have a Doll when you create
      one, the old Doll immediately perishes.</p></li><li><p><strong>Growing
      Together</strong>. Whenever you gain the Ability Score Improvement Feature
      from the Specialist Class, the Doll permanently increases one Ability
      Score of your Choice by 1. Newly created Dolls retain the benefit of this
      improvement.</p></li></ul><hr><p><strong>Semi-Automated: </strong>You can
      create the Doll with this Feature. You must manually equip it with
      equipment, and increase its stats for Growing Together manually.</p>
