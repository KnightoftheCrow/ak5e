  description:
    value: >-
      <p>Your control over your Doll is legendary. You gain the following
      benefits:</p><ul><li><p><strong>Doll Multiattack.</strong> When your Doll
      takes the Strike Action, it can now make two additional Attacks as part of
      that Action.</p></li><li><p><strong>Doll Raid.</strong> When you take the
      Attack Action, you can also cause your Doll to take the Strike Action (no
      Action required). Once you have used this Feature, you may not do so again
      until you have completed a Long
      Rest.</p></li></ul><hr><p><strong>Automation not required: </strong>The
      Doll Raid Activity is just for tracking.</p>
