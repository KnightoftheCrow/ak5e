  description:
    value: >-
      <p>The environment is the greatest weapon of a Trapmaster; if it is not
      dangerous yet, it will be. You gain the following
      benefits:</p><ul><li><p><strong>Place Trap.</strong> Over the course of
      ten seconds (or two rounds), you can plant a Trap in an unoccupied space
      on the ground within 5 feet of you; unless stated, a Trap can only be
      triggered once. The Traps available for you to place are found
      below.</p><p>There is no limit to the amount of Traps you can have planted
      at once. You can use this Feature a number of times equal to your twice
      your Proficiency Bonus, and regain all expended uses when you complete a
      Long Rest.</p></li><li><p><strong>Devil’s Own Luck.</strong> The
      environment is full of danger if you know where to look. As a Bonus
      Action, you can suggest an visible object in the environment to function
      as a Trap of your choice (except Timed Explosive), and the trigger
      condition for that “trap”. This trigger condition should be an action you
      actively perform, not when the Creature enters a defined space like
      ordinary traps. If the GM agrees with your suggestion, that object
      functions in the way you suggested; once it has been triggered, this
      “trap” is expended as other Traps are. Once you have successfully
      suggested a Trap in this way, you may not do so again until you complete a
      Short or Long Rest.</p></li><li><p><strong>Skill Expertise.</strong> You
      gain Proficiency in the Sleight of Hand Skill. If you already have
      Proficiency, you instead gain
      Expertise.</p></li></ul><hr><p><strong>Semi-Automated: </strong>All of
      your Traps are added to your sheet as items. Setting up traps consumes
      uses from this Feature. When triggering Devil's Own Luck, trigger one of
      the respective trap "Trigger" activities.</p>
