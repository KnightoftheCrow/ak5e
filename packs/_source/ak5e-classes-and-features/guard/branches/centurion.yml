  description:
    value: >-
      <p><span class="fontstyle0">Centurions are battle incarnate; a whirling
      tempest of weapons eager to leap into the massed ranks of the foe, and
      wreak their havoc. The more foes bought against them, the greater the
      challenge. The greater the challenge, the greater the
      glory.</span></p><blockquote><p><span style="font-size:11pt"
      class="fontstyle0"><strong>Centurion DC</strong></span></p><p><span
      class="fontstyle1">Some Centurion Features do not use your Martial DC, but
      instead a Centurion DC. Your Centurion DC is calculated as 8 + Your
      Intimidation Modifier.</span></p></blockquote><table><tbody><tr><td
      data-colwidth="50"><p>Level</p></td><td><p>Branch
