  description:
    value: >-
      <p>Parry and Counter; these are the principles that will keep you alive.
      You gain the following benefits:</p><ul><li><p><strong>Every Victory,
      Another Step.</strong> When your Opponent is reduced to 0 Hit Points or
      you accept their surrender, you regain 1 expended
      Aggression.</p></li><li><p><strong>Press the Attack: Lightning Reflexes (1
      Aggression).</strong> You can use this Press the Attack Option as a
      Reaction when you would be required to make a Saving Throw against an
      effect you can see; you can instead make a Dexterity Saving Throw against
      that effect.</p></li><li><p><strong>Punish every Opening.</strong> Once
      per Turn, you may use your Press the Attack: Reposte Feature without
      expending your Reaction when you succeed on a Saving Throw if the Creature
      that caused you to make that Saving Throw is within your
      Reach.</p></li></ul><hr><p><strong>Cannot be Automated.</strong></p>
