  uses:
    spent: 0
    recovery:
      - period: initiative
        type: loseAll
    max: '10'
  advancement: {}
  description:
    value: >-
      <p>As a Duellist, you single out your foes before utterly dismantling them
      with precise strikes. You gain the following
      benefits:</p><ul><li><p><strong>Duelling Blades.</strong> Greatswords and
      Polearms are considered to have the Finesse Property while wielded by
      you.</p></li><li><p><strong>Rules of Engagement.</strong> As a Bonus
      Action, you may declare a hostile Creature you can see to be your
      Opponent. While you have an Opponent, you can earn Points in your duel
      with that Opponent; you can earn Points in the following ways, up to a
      maximum of 10:</p><ul><li><p>+1 Point when you declare your Opponent. Once
      you have gained Points in this way, you cannot do so again until the end
      of your next Turn.</p><ul><li><p>You gain an additional Point if you are
      not wielding a Heavy Melee Weapon; this additional Point is lost if you
      equip a Heavy Melee Weapon after gaining the
      Point.</p></li></ul></li><li><p>+1 Point at the beginning of your Turn if
      you have dealt Damage to your Opponent since the beginning of your last
      Turn.</p><ul><li><p>You gain an additional Point if your Opponent has NOT
      dealt Damage to you since your last Turn.</p></li></ul></li></ul><p>When
      your Opponent is reduced to 0 Hit Points, you accept their surrender, a
      minute passes without either of you dealing Damage to the other, or you
      declare a new Opponent, you lose all Points you have earned.</p><p>You can
      expend your Points to carry out Engagements, detailed below. You cannot
      use the same Engagement more than once per
      Turn.</p></li></ul><h3>Engagements</h3><p><strong>Analysis (0
      Points)</strong> As an Action, you study a hostile Creature you can see,
      observing their movements. Once during your next Turn, if you gain any
      Points, you gain 1 additional Point.</p><p><strong>Balestra (2
      Point)</strong> You prepare to make your next Melee Attack before the end
      of your next Turn a powerful lunging strike (no Action required). The
      reach of that Melee Attack is increased by 10 feet; after you make the
      Attack, you move 10 feet towards the Creature, finishing the movement as
      close to them as you can. If the Creature was more than 10 feet away from
      you when you made the Attack, the Damage of that Attack is not decreased
      by Damage Reduction.</p><p><strong>Derobement (1 Point)</strong> When you
      make a Melee Attack against a Creature, you may attempt to confound and
      misdirect any retaliation they might offer (no Action required); the
      Damage of that Attack is halved, but if it hits, that Creature has
      Disadvantage on Attack Rolls against you until the start of your next
      Turn.</p><p><strong>Displacement (1 Point)</strong> When you make a Melee
      Attack against a Creature, you can use your weapon to make space for
      yourself (no Action required); the Damage of that Attack is halved, but if
      it hits, you can can move up to 10 feet directly away from the Creature
      you attacked. This movement does not provoke Opportunity Attacks from that
      Creature.</p><p><strong>En Garde (1 Point)</strong> When you expend your
      Reaction for your Lightning Reflexes or Reposte Press the Attack Option,
      you may use this Engagement (no Action required) to returning to a
      guarding stance, refunding use of your Reaction.</p><p><strong>Feint (1
      Point)</strong> As a Bonus Action, you mislead a Creature you can see on
      your next strike. The next Melee Attack you make against that Creature
      before the end of your next Turn has Advantage; that Creature must be able
      to see you to gain this benefit.</p><p><strong>Fleche (2 Points)</strong>
      As a Bonus Action, you can make your next Melee Attack this Turn a Fleche;
      a precise and lethal strike to a weak point. That Attack deals additional
      Damage equal to your Guard Level.</p><p><strong>Redoublement (1
      Point)</strong> When you miss a Creature with a Melee Attack, you can use
      the momentum of the attack to try again on a different angle; you can
      reroll that Attack Roll as a Reaction. However, if you do, the Damage of
      that Attack is halved.</p><p><strong>Score (1 Points)</strong> When you
      make a Melee Attack against a Creature, you may attempt to score their
      flesh (no Action required); the Damage of that Attack is halved, but if it
      hits, it causes that Creature to suffer the Bleeding
      Condition.</p><hr><p><strong>Semi-Automated: </strong>Enchant the Weapons
      you use with this Feature to gain access to the Engagements. Use Declare
      Opponent to mark your Opponent, and Gain Points whenever you would gain
      Points.</p>
    chat: >-
      <p>As a Duellist, you single out your foes before utterly dismantling them
      with precise strikes. You gain the following
      benefits:</p><ul><li><p><strong>Duelling Blades.</strong> Greatswords and
      Polearms are considered to have the Finesse Property while wielded by
      you.</p></li><li><p><strong>Rules of Engagement.</strong> As a Bonus
      Action, you may declare a hostile Creature you can see to be your
      Opponent. While you have an Opponent, you can earn Points in your duel
      with that Opponent; you can earn Points in the following ways, up to a
