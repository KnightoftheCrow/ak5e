  description:
    value: >-
      <p>Your mind is no longer so singular as to consider every opponent a
      seperate challenge; the world is your opponent. When you declare a
      Creature as your Opponent but do not issue a Grand Challenge, or when your
      Opponent dies or surrenders, you no longer lose the Points you currently
      have. Additionally, declaring your Opponent during your Turn no longer
      requires your Bonus Action</p><hr><p><strong>Automated: </strong>When you
      declare a non-Grand Challenge Opponent using your Singular Foe Feature it
      no longer removes all of your Points.<br></p>
