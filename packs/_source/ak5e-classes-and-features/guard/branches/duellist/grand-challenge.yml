  description:
    value: >-
      <p>When you declare a Creature as your opponent, you may also declare a
      Grand Challenge (no Action required). For the next minute, or until your
      Opponent changes, dies, or surrenders, you gain the following
      benefits:</p><ul><li><p><strong>Corps a Corps.</strong> Whenever your
      Opponent deals Damage to a Creature that is not you, you may, if possible,
      make an Attack of Opportunity against them (no Action Required); you
      cannot do so again until the beginning of your next
      Turn.</p></li><li><p><strong>Displacement.</strong> You are Resistant to
      all Damage dealt by Creatures other than your
      Opponent.</p></li></ul><p>When you hit your Opponent with a Melee Attack
      while you have 10 Points, you can make that Attack a Coup de Grâce;that
      Creature takes 8d8 Slashing or Piercing Damage (your choice) that is not
      reduced by Resistance or Damage Reduction, and the Grand Challenge ends;
      that Creature remains your Opponent if they survive.</p><p>Once you have
      used this Feature, you may not do so again until you complete a Long
      Rest.</p><hr><p><strong>Automated: </strong>Your Singular Foe Feature now
      has the option to issue a Grand Challenge.</p>
