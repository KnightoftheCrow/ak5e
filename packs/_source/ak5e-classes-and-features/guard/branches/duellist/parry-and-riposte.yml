  description:
    value: >-
      <p>With a deft flick, you brush aside the clumsy blows of your foe. You
      gain the following benefits:</p><ul><li><p><strong>Parry.</strong> The
      first time each Round you use the Forestall Press the Attack option, it
      does not consume your Reaction, and costs 1 fewer Aggression (minimum of
      0).</p></li><li><p><strong>Press the Attack: Reposte (1
      Aggression).</strong> You may use this Press the Attack Option as a
      Reaction when a Creature within your Reach misses you with an Attack; make
      an Attack of Opportunity against that
      Creature.</p></li></ul><hr><p><strong>Semi-Automated: </strong>Reposte is
      Automated; Parry is not.</p>
