  description:
    value: >-
      <p>The closer to death you are, the harder you fight. You gain the
      following benefits:</p><ul><li><p><strong>Nothing to Lose.</strong> If you
      have equal to or less than 50% of your maximum Hit Points remaining, you
      can make a Melee Weapon Attack as a Bonus Action. If you have equal to or
      less than 10% of your maximum Hit Points remaining, you can instead make
      two Melee Weapon Attacks as part of this Bonus
      Action.</p></li><li><p><strong>Soloblade.</strong> When you hit a Creature
      with a Melee Attack, you can recover 2d6 Hit Points. This amount increases
      to 2d8 at 7th Level, and 2d10 at 14th Level.</p></li><li><p><strong>Stand
      Alone.</strong> When another Creature would restore Hit Points to you, you
      instead gain Temporary Hit Points equal to the Hit Points you would have
      recovered.</p></li></ul><hr><p><strong>Automated: </strong>Soloblade and
      Stand Alone are automated; there is an Opt-In when you hit with a Melee
      Attack for Soloblade. Nothing To Lose does not need automation.</p>
