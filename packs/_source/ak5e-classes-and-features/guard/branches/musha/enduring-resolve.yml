  description:
    value: >-
      <p>To live and fight so close to the edge is to spit in the eye of death.
      To fall, is to fail. You gain the following
      benefits:</p><ul><li><p><strong>Additional Saving Throw
      Proficiency.</strong> You gain Proficiency in Wisdom Saving
      Throws.</p></li><li><p><strong>Not Yet.</strong> When you would be reduced
      to 0 Hit Points but not killed outright by a hostile Action, you can make
      a DC10 Wisdom Saving Throw. If you succeed, you survive with Hit Points
      equal to twice your Proficiency Bonus instead. If you had less Hit Points
      than this value before the Damage, you recover Hit Points until you have
      that value. Each time you use this Feature, the DC of the Saving Throw
      increases by 5. When you finish a Long Rest, the DC resets to
      10.</p></li></ul><hr><p><strong>Semi-Automated: </strong>You must trigger
      the Not Yet Activity on this Feature when necessary. The increasing DC is
      accomplished via the uses on the item, so do not touch these. You will be
      healed if you pass the Saving Throw.</p>
    chat: ''
