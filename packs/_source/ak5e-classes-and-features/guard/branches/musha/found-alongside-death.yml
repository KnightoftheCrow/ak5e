  description:
    value: >-
      <p>As death approaches, your reflexes sharpen; the reaper will have to
      work hard to claim you. You gain the following
      benefits:</p><ul><li><p><strong>Greater Blood Price.</strong> When you use
      your Blood Price Feature, you may choose to lose twice as many Hit Points
      instead.</p></li><li><p><strong>Living on the Edge.</strong> If you have
      equal to or less than 50% of your maximum Hit Points remaining, your AC is
      increased by a value equal to half of your Proficiency Bonus, rounding up;
      you additionally recieve a Bonus on Saving Throws against effects you can
      see equal to this value. If you have equal to or less than 10% of your
      maximum Hit Points remaining, your AC is instead increased by a value
      equal to your Proficiency Bonus; you additionally recieve a Bonus on
      Saving Throws against effects you can see equal to this
      value.</p></li></ul><hr><p><strong>Automated.</strong></p>
