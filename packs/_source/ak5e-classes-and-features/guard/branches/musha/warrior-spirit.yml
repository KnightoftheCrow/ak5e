  description:
    value: >-
      <p>Kill or be killed, win or be forgotten. This is the code of the Musha;
      you gain the following benefits:</p><ul><li><p><strong>Go Forth.</strong>
      When a Creature makes an Attack against you, you may use your Reaction to
      move up to your Speed towards that Creature.</p></li><li><p><strong>Press
      the Attack: Retaliator (2 Aggression).</strong> You may use this Press the
      Attack Option (no Action required) after you have used your Go Forth
      Feature, if the triggering Creature is within your Reach after the
      movement; make a Melee Attack against the triggering Creature.
      Alternatively, you may use your Iai Feature, but must Attack the
      triggering Creature as part of
      it.</p></li></ul><hr><p><strong>Automated.</strong></p>
    chat: ''
