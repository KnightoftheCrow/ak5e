  advancement: {}
  description:
    value: >-
      <p>Blood and life is a currency, to be spent in pursuit of one’s goals.
      Musha are just more willing to spend big. When you use any option from
      this Feature, you lose 2d8 Hit Points; this cannot be reduced in any way,
      and you may not expend Temporary Hit Points in this manner. Additionally,
      you cannot gain Hit Points through your Soloblade Feature for any Attack
      you make as part of an Option from this
      Feature.</p><ul><li><p><strong>Center Oneself.</strong> Someone willing to
      trade away their own life cannot be swayed by lesser woes. With a
      steadying breath, you force away such impediments. As an Action, you can
      end one of the following Conditions on yourself if the duration on that
      Condition is less than 24 hours: Charmed, Dazed, Frightened, Paralyzed,
      Stunned. If the duration is longer than a minute, you instead do not
      suffer from that Condition for the next minute. You can use this Action
      even if an effect would prevent you from taking
      Actions.</p></li><li><p><strong>Dig Deep.</strong> You pull power from
      deep within, strengthening your here-and-now with a loan from tomorrow. As
      an Action, you can gain Skill Points equal to the Hit Points you lose to
      use this Action.</p></li><li><p><strong>Iai.</strong> In a single motion,
      you draw your weapon and strike your enemy. As an Action, draw a Melee
      Weapon you are carrying that you have enough available hands to make
      Attacks with. Then, you move up to half your Speed in a straight line; you
      can move through the space of other Creatures during this movement, and do
      not provoke Opportunity Attacks. Make a Melee Attack using the weapon you
      drew against a Creature you passed through as if they were within your
      Reach; this Attack is made at Advantage, and deals additional Damage equal
      to half of the Hit Points you expended to use this
      Action.</p></li><li><p><strong>Ichimonji.</strong> A deadly blow,
      delivered from a high stance, sends foes reeling. As an Action, make a
      Melee Weapon Attack against a Creature within your Reach. On a hit, the
      Attack deals additional Damage equal to the Hit Points you expended to use
      this Action, and the Creature is knocked off balance; until the end of the
      Turn, you have Advantage on Melee Attacks against that Creature.
      </p></li></ul><hr><p><strong>Semi-Automated: </strong>Use the Pay Blood
      Price Activity to expend the HP, then use the Activity you want to use.
      Center Oneself does not require automation. Set the Scaling Value on Dig
      Deep, Iai, and Ichimonji to the HP you expended. Iai and Ichimonji buff
      the next Melee Attack you make. If you hit with Ichimonji, use the Apply
      Off Balance Activity on this Feature on the Hit Creature.<br></p>
    chat: ''
