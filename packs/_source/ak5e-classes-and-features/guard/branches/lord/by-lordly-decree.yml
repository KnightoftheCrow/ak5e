  description:
    value: >-
      <p>Your belief in yourself is so potent that you truly can carry out
      miracles. You gain the following benefits:</p><ul><li><p><strong>Make it
      So.</strong> When you make a d20 roll to which you would add an Ability
      Score Bonus, you can expend a use of your Manifestation Feature to instead
      add your Charisma Bonus. If you are not Proficient in the roll, you are
      considered to be Proficient in it.</p><p><em>Authority:</em> If you are
      already Proficient in the roll, you instead are treated as having
      Expertise in that roll. This allows you to temporarily have Expertise in
      rolls that cannot normally have it, such as Saving Throws and Attack
      Rolls.</p></li><li><p><strong>Press the Attack: A Leader Leads (1+
      Authority)</strong> You can use this Press the Attack Option when you gain
      Authority (no Action required); for each Aggression you expend, choose one
      allied Creature that can see or hear you. That Creature gains a Special
      Inspiration that expires after 1
      minute.</p></li></ul><hr><p><strong>Automated.</strong></p>
