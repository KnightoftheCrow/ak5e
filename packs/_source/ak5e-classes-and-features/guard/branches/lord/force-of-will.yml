  advancement: {}
  description:
    value: >-
      <p>Your strange arts have found new, explosive expression.</p><p>You gain
      one of the following benefits based on the Damage Type of your
      Manifestation Feature. When you change the Damage Type of your
      Manifestation Feature, the benefit you gain from this Feature also
      changes. You can only use this Feature once per
      Turn.</p><table><thead><tr><td><p>Damage
      Type</p></td><td><p>Effect</p></td></tr></thead><tbody><tr><td><p>Fire,
      Psychic, Force, Thunder</p></td><td><p>When you hit a Creature with a
      Weapon Attack, you can cause your Arts to surge through them with
      explosive effect. Creatures within 10 feet of that Creature (except
      yourself) must make a Dexterity Saving Throw against your Martial DC. On a
      failed Save, they take 3d6 Damage of the same Type dealt by your
      Manifestation Feature; on a successful Save, they take half as much
      Damage.</p></td></tr><tr><td><p>Bludgeoning, Piercing, Slashing,
      Radiant</p></td><td><p>As an Action, you can fire a slash of Arts energy
      in a 5-foot-wide, 50-foot-long line originating from you. Creatures within
      the area must make a Dexterity Saving Throw against your Martial DC. On a
      failed Save, they take 8d6 Damage of the same Type dealt by your
      Manifestation Feature; on a successful Save, they take half as much
      Damage.</p></td></tr><tr><td><p>Acid, Cold, Lightning, Necrotic,
      Poison</p></td><td><p>When you hit a Creature with a Melee Weapon Attack,
      you can channel your will into the blow, dealing a mortal blow. That
      Creature must make a Constitution Saving Throw against your Martial DC,
      taking 6d6 Damage of the same Type dealt by your Manifestation Feature on
      a failed Save, or half as much Damage on a successful
      Save.</p></td></tr></tbody></table><p>Irrespective of which benefit you
      gain, you can only use this Feature a number of times equal to your
      Proficiency Bonus, and regain all expended uses when you complete a Long
      Rest.</p><hr><p><strong>Semi-Automated: </strong>Use the Choose Force of
      Will Activity to select the right set of Damage Types; this will allow you
      to use the corresponding Activity.</p>
