  description:
    value: >-
      <p>A Lord doesn’t think of themselves at being better than everyone else;
      they know that they are. They are destined to lead, by virtue of the fact
      that none can stop them. You gain the following
      benefits:</p><ul><li><p><strong>Overruled.</strong> Whenever you are
      afflicted by an effect that requires you to make an Intelligence, Wisdom,
      or Charisma Saving Throw at the beginning or end of your Turn to end the
      effect, you may make that Saving Throw at the beginning and end of your
      Turn.</p></li><li><p><strong>Position of Power.</strong> As a result of
      your actions, you can enter a special state known as having Authority.
      While you have Authority, your other Branch Features have additional
      effects, and at the beginning of each of your Turns, you can gain 1d8
      Temporary Hit Points (no Action required).</p><p>You can gain Authority in
      the following ways:</p><ul><li><p>When an Elite or Leader Creature you
      have damaged since the beginning of your last Turn is reduced to 0 Hit
      Points.</p></li><li><p>You reduce 2 or more Creatures to 0 Hit Points in
      the same Turn.</p></li><li><p>You reduce the Hit Points of a Creature who
      is not missing any Hit Points to 0 in a single instance of
      damage.</p></li></ul><p>You can lose Authority in the following
      ways:</p><ul><li><p>You are reduced to 0 Hit Points.</p></li><li><p>Your
      Turn ends while you are afflicted by an effect that requires you to roll a
      Saving Throw during your Turn to end the effect. If that Saving Throw is
      rolled at the end of your Turn, you roll to determine if that effect ends
      before you see if you lose your Authority.</p></li><li><p>You are Prone at
      the end of your Turn.</p></li><li><p>You roll
      Initiative.</p></li></ul></li><li><p><strong>Press the Attack: Manifest
      Destiny (3 Aggression)</strong> You can use this Press the Attack Option
      when you would lose Authority (no Action required); you do not lose
      Authority.</p></li></ul><hr><p><strong>Semi-Automated: </strong>Use the
      Toggle Authority Activity on this to grant or remove authority. Other
      aspects of this Feature cannot be, or do not need to be, automated.</p>
