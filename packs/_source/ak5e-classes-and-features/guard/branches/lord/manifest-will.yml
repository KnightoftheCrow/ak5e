  advancement: {}
  description:
    value: >-
      <p>You can channel your will into strange Arts that turn even dull blades
      into lethal weapons. You gain the following
      benefits:</p><ul><li><p><strong>Manifestation.</strong> During your Turn,
      if it is not currently Manifested, you may Manifest your Will for 1 minute
      (no Action required). While your Will is Manifested:</p><ul><li><p>Melee
      weapons wielded by you gain the Range (30/-) Property.</p></li><li><p>When
      you make a Ranged Attack using these weapons, you may use your Strength
      Modifier instead of your Dexterity for the Attack and Damage
      Rolls.</p></li><li><p>Your Weapon Attacks deal additional Force Damage
      equal to your Charisma Modifier.</p></li></ul><p>You may use this Feature
      a number of times equal to your Proficiency Bonus, and regain all expended
      uses when you complete a Long Rest.</p></li><li><p><strong>Will
      Attunement.</strong> You may change the Damage Type dealt by your
      Manifestation Feature by conducting a 10 minute long ritual, as if you
      were casting a Ritual Art. At the conclusion of the Ritual, you may choose
      a Damage Type that one of your Operator Skills can deal; this becomes the
      new Damage Type for your Manifestation
      Feature.</p></li></ul><p><em>Authority:</em> If you have Authority, your
      Ranged and Melee Weapon Attacks while your will is Manifested mark
      Creatures hit until the end of your next Turn with a Ranged or Melee Mark
      respectively. If you hit a marked Creature with a Weapon Attack that does
      not match the mark, that mark is expended, and that Attack deals 1d6
      additional Damage of the same Type dealt by your Manifestation
      Feature.</p><hr><p><strong>Semi-Automated: </strong>Use the Activate
      Manifestation Activity to start, and enchant a Melee Weapon you are
      wielding. If you need to enchant two weapons, run the Manifestation
      enchantment a second time (you do not need to use Activate Manifestation a
      second time); this will cause the affected weapons to deal additional
      Damage. After using will Attunement, your Manifestation Damage will have a
      dropdown list of options; choose the correct one. Use the "Apply Mark"
      Activity on this Feature when you have authority and choose the correct
      mark; it can only be activated by the opposite type of attack. </p>
    chat: ''
