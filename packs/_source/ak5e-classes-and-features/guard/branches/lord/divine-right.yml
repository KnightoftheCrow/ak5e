  description:
    value: >-
      <p>Does your authority come from divine providence? No, of course not; but
      if it appears to, then it is the same thing. The Authority benefits of
      your other Features are
      improved:</p><ul><li><p><strong>Manifestation.</strong> When you deal
      additional Damage as a result of a Ranged or Melee Mark, you can cause all
      other Creatures of your choice within 10 feet of the original Creature to
      also suffer that Damage.</p></li><li><p><strong>Castle Doctrine.</strong>
      When you hit a Creature with a Melee Attack made as a result of Castle
      Doctrine, they must make a Wisdom Saving Throw against your Martial DC. On
      a failed Save, you reduce their Speed to 0 until the end of next Turn. On
      a successful Save, their Speed is halved until the end of their
      Turn.</p></li><li><p><strong>Pursuit of Power.</strong> When you are
      moving as a result of this Feature, hostile Creatures that you move within
      5 feet of take Damage equal to your Charisma Modifier of the same type as
      your Manifestation Feature. A Creature can only take this Damage once per
      Turn.</p></li><li><p><strong>Make It So.</strong> If you fail the roll
      after using this Feature, you may reroll it, but must use the new
      result.</p></li></ul><hr><p><strong>Semi-Automated: </strong>Castle
      Doctrine and Pursuit of Power have new activites on King's Domain Feature.
      Your Make It So rolls are made at Advantage. The changes to Manifestation
      cannot be automated.</p>
