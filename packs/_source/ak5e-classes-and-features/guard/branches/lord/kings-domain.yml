  advancement: {}
  description:
    value: >-
      <p>It’s a ruler’s right to choose their hunting grounds. When you use your
      Manifestation Feature, you may choose one of the following effects to
      activate for the duration of that
      Manifestation:</p><ul><li><p><strong>Castle Doctrine.</strong> Your will
      manifests into a 15-foot-radius sphere centred on the location you were
      when you used your Manifestation Feature. When a hostile Creature enters
      this area while you are in it, you may (as a Reaction) move up to half of
      your Speed towards them and make a Melee Weapon Attack against them. If
      the Creature is not an Elite or Leader Creature, and you hit them with the
      Attack, your Reaction is refunded.</p><p><em>Authority:</em> If you hit a
      Creature with a Melee Attack made as a result of this Feature, you reduce
      their Speed by half until the end of their
      Turn.</p></li><li><p><strong>Pursuit of Power.</strong> Once per Turn,
      when you hit a Creature with a Weapon Attack, you may move up to your
      Movement Speed without provoking Opportunity Attacks; your Jump Distance
      is doubled when making this Movement.</p><p><em>Authority:</em> This
      Feature is no longer limited to once per
      Turn.</p></li></ul><hr><p><strong>Cannot be Automated: </strong>The
      Activites on this Feature leave a zone and grant an effect, but these are
      purely for tracking purposes.</p>
