  description:
    value: >-
      <p><span class="fontstyle0">Ideological grievance, repressed anger,
      longing, revenge; these are the weapons of a Liberator. To be a Liberator
      is to understand the value of considered action; to rage and scream
      accomplishes naught. The right moment, and the right time, can change the
      world.</span></p><p>You gain the following Branch
