  advancement: {}
  description:
    value: >-
      <p>One neck is the same as any other when your weapon finds it.</p><p>As
      an Action, you attempt to strike a lethal blow at a Creature within your
      Reach using a weapon you are wielding; that Creature must make a Dexterity
      Saving Throw against your Martial DC. On a failed Save, they take Xd6
      Damage of the same Damage Type as the weapon you are wielding, where X is
      equal to twice your Proficiency Bonus, and begin Bleeding. Additionally,
      if the Creature that failed was an Elite or Leader Creature, other hostile
      Creatures within 30 feet of them must succeed on a Wisdom Saving Throw
      against your Centurion DC or become Frightened of you until the end of
      your next Turn. On a successful Save, they suffer half as much Damage, and
      no other effects.</p><p>Once you have used this Feature, you must finish a
      Long Rest before you can do so again.</p><hr><p><strong>Semi-Automated:
      </strong>You must trigger the Radial Fear activity manually when
      necessary.</p>
