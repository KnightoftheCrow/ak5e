  advancement: {}
  description:
    value: >-
      <p>When you make a Melee Weapon Attack against only one Creature, you may
      cause that Attack to cleave to another Creature; that Creature must both
      be within your Reach, and within 10 feet of the original Creature. If the
      result of that Attack Roll is greater than the second Creature’s Armour
      Class, they are hit by that Attack, independent of the Attack hitting the
      original Creature. Once you have used this Feature, you may not do so
      again until the beginning of your next Turn.</p><p>From 7th Level, you may
      cleave to two other Creatures instead of just one. From 14th Level, you
      can use this Feature once on each Turn. </p><hr><p><strong>Semi-Automated:
      </strong>Enchant the weapon you're going to use for Cyclone Strike with
      this Feature. It will add a new activity to that weapon that allows you to
      Cyclone Strike with it; remember you can use the + and - buttons to
      increase or decrease the number of targets.<br></p>
    chat: ''
