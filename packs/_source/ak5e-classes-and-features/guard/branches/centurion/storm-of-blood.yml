  description:
    value: >-
      <p>Kill, and kill again. The song of battle gives way to a storm of blood,
      and only you remain.</p><p>You may use this Feature as an Action;
      Creatures of your choice you can see within 15 feet of you must make a
      Dexterity Saving Throw against your Centurion DC. On a failed Save, they
      take 10d8 Slashing Damage and are Frightened of you until the end of your
      next Turn; while they are Frightened of you, they must move directly away
      from you on their Turn if able. On a successful Save, they take half as
      much Damage, and are not Frightened. Furthermore, after you have used this
      Feature, you gain the benefit of your Long-Arm Feature until the end of
      your next Turn (even when it is not your Turn), and hitting a Creature
      with an Attack of Opportunity refunds use of your Reaction.</p><p>Once you
      have used this Feature, you may not do so again until you have finished a
      Long Rest.</p><hr><p><strong>Semi-Automated: </strong>The Long-Arm effect
      and Reaction refunding is not automated.</p>
