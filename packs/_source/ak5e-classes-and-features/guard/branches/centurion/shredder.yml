  description:
    value: >-
      <p>21 to 1? You like those odds.</p><p>When you deal Damage to a Creature
      with a Melee Weapon Attack, choose a different Creature within 10 feet of
      the original Creature; that Creature takes Slashing Damage equal to your
      Strength Modifier. This Damage is doubled against Creatures who are
      Frightened of you.</p><hr><p><strong>Semi-Automated: </strong>There are
      Activites on this Feature for dealing the Shredder Damage, but it is
      probably faster to resolve without these activities.<br></p>
