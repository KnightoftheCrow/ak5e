  description:
    value: >-
      <p>You are an object of fear, a butcher set loose. You gain the following
      benefits:</p><ul><li><p><strong>Intimidating.</strong> You gain
      Proficiency in the Intimidation Skill, or Expertise if you already had
      Proficiency. Additionally, you may use your Strength Modifier, instead of
      your Charisma, to determine your Intimidation
      Modifier.</p></li><li><p><strong>Long-Arm</strong>. Melee Weapons you are
      wielding are considered to have the Reach Property during your Turn. If
      they already have that Property, their Reach is increased by 5 feet during
      your Turn.</p></li><li><p><strong>Press the Attack: Brutal Execution (2
      Aggression)</strong> You can use this Press the Attack option as a Bonus
      Action or Reaction immediately after you kill a Creature; you end them
      with such physicality that hostile Creatures within 10 feet of you that
      can see you take Psychic Damage equal to your Strength Modifier. If this
      Damage reduces a Creature to 0 Hit Points, they fall Unconscious rather
      than die. </p><hr></li></ul><p><strong>Semi-Automated:
      </strong>Intimidation Expertise is automated; using Strength instead of
      Charisma must be set manually. Long Arm is not automated. Brutal Execution
      can be used via the activites on this Feature.<br></p>
