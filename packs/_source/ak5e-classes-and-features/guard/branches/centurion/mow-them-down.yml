  description:
    value: >-
      <p>It is equally dangerous to flee from you as it is to assail you. You
      gain the following benefits:</p><ul><li><p><strong>Fearmonger.</strong>
      You have Advantage on Attack Rolls against Frightened Creatures, and
      Frightened Creature have Disadvantage on Attack Rolls against
      you.</p></li><li><p><strong>Ferocious Fling.</strong> Once per Short Rest,
      when you reduce a Creature to 0 Hit Points that is both:</p><ul><li><p>The
      same size or smaller than you</p></li><li><p>Within your
      Reach</p></li></ul><p>You may launch them as a projectile at another
      Creature within 30 feet of you (no Action required). This is a Ranged
      Weapon Attack using your Strength for the Attack and Damage Rolls; on a
      hit, the Attack deals Bludgeoning Damage equal to the launched Creature’s
      Constitution Score.</p></li></ul><p>If you used Brutal Execution on the
      Creature you threw, your use of this Feature is
      refunded.</p><hr><p><strong>Semi-Automated: </strong>The Interactions with
      the Frightened Condition are automated. The Ferocious Fling Attack can be
      made using this Feature; set the scaling value to the Constitution Score
      of the Creature.</p>
