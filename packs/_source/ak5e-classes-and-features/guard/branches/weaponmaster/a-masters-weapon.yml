  advancement: {}
  description:
    value: >-
      <p>You are familiar with almost all weaponry, but some just feel right in
      your hands.</p><p>As a Long Rest Action, you can spend time training and
      familiarising yourself with every foible of a weapon in your possession.
      At the end of that Long Rest, that Weapon is considered to be your
      Signature Weapon. You can only have one Signature Weapon at a time;
      performing this Action on a second weapon removes the Signature Weapon
      status from the first. Your Signature Weapon gains the following benefits
      when wielded by you;</p><ul><li><p><strong>Every Part of the
      Weapon.</strong> As a Bonus Action, you can change the Additional Effect
      on that Weapon granted by your Martial Mastery Feature to another
      Additional Effect until the end of the Turn.</p></li><li><p><strong>In
      Trained Hands.</strong> You have a +1 bonus to Attack and Damage Rolls
      with that Weapon.</p></li></ul><hr><p><strong>Automated: </strong>Enchant
      your Signature Weapon with this Feature. The Change Mastery Effect
      Activity does nothing, it is just for tracking.</p>
