  advancement: {}
  description:
    value: >-
      <p>The cacophony of war and battle flows through you; every sinew feels
      its vibrations, and sings its song. All you need to do is unleash
      it.</p><p>You may use this Feature as a Bonus Action; for the next minute,
      your Weapon Attacks have +1 Critical Range, and on a Critical Hit, you
      ignore any Damage Resistance that Creature has to Physical Damage.
      Additionally, Attacks with your Signature Weapon are made at Advantage for
      the duration.</p><p>Once you have used this Feature, you may not do so
      again until you complete a Long Rest.</p><hr><p><strong>Automated:
      </strong>Only the ignoring of Damage Resistance cannot be automated.</p>
