  description:
    value: >-
      <p>When you hit a Creature with a Melee Attack, you can mark them for
      Judgement Cut as a Bonus Action. Judgement Cut ends at the end of your
      second Turn after activating this Feature, or until when you end it early
      during your Turn by stowing a Weapon. For the duration, keep track of the
      total Weapon Damage you deal to that Creature; when the Mark ends or is
      ended by you, that Creature takes Slashing Damage equal to half of the
      total Weapon Damage they received from you in that time.</p><p>Once you
      have used this Feature, you may not do so again until you complete a Short
      or Long Rest.</p><hr><p><strong>Semi-Automated: </strong>Use the Mark for
      Judgement Cut Activity to use this Feature. To deal the Damage, use the
      other activity and set the scaling value to the TOTAL damage they recieved
      from you in that time; you must track this manually.</p>
