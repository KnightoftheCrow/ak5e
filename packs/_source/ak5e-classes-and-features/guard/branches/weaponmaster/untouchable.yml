  description:
    value: >-
      <p>It is a fool’s errand to even attempt to harm you by conventional
      means.</p><p>When a Creature within your Reach makes an Attack Roll
      against you, you may, as a Reaction, make a Melee Attack against them
      using a weapon you are wielding. If your Attack deals Damage to that
      Creature, their Attack automatically misses.</p><p>You may use this
      Feature twice, and regain all expended uses when you complete a Long
      Rest.</p><hr><p><strong>Semi-Automated: </strong>You will be prompted for
      the Reaction on this Feature when you are attacked. When you are given the
      option to apply a Status, roll an Attack against that Creature; if it
      hits, apply the effect. If it doesn't, close the box without applying the
      effect.</p>
