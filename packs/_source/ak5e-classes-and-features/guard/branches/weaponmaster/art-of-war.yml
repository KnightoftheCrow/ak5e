  description:
    value: >-
      <p>In your hands, all but the heaviest weapons flow like wind, and cut
      like water. You gain the following
      benefits:</p><ul><li><p><strong>Additional Fighting Styles.</strong> You
      gain a Fighting Style available to the Guard or Marksman Class. Whenever
      you complete a Long Rest, you may exchange this Fighting Style for a
      different one.</p></li><li><p><strong>Additional Weapon
      Proficiencies.</strong> You are Proficient in all Light Ranged and Heavy
      Ranged Weapons.</p></li><li><p><strong>Martial Mastery.</strong> Your
      Proficiency with all kinds of weapons provides you with a versatility in
      their use unavailable to the layman. Weapons that you are wielding, and
      are Proficient with, gain additional benefits according to the Martial
      Mastery Table.</p></li></ul><h3>Martial
      Mastery</h3><table><thead><tr><td><p><strong>Mastery
      Property</strong></p></td><td><p><strong>Affected
      Weapons</strong></p></td><td><p><strong>Additional
      Effect</strong></p></td></tr></thead><tbody><tr><td><p>Can
      Opener</p></td><td><p>Crossbow, Hammer, Heavy Crossbow, Heavy Hammer,
      Rifle</p></td><td><p>Once per Turn, when you hit a Creature that has
      Physical DR, that Attack deals an additional 1d8
      Damage.</p></td></tr><tr><td><p>Cornering</p></td><td><p>Bow, Greatbow,
      Machine Gun, Nailgun</p></td><td><p>When you hit a Creature, that
      Creature’s Speed is reduced by 10 feet until the end of their next Turn;
      this effect is not
      cumulative.</p></td></tr><tr><td><p>Drive</p></td><td><p>Spear, Polearm,
      Whip</p></td><td><p>When you hit a Creature, you can force that Creature
      to move to up to 15 feet in a direction of your choice. A Creature can
      only be moved in this way once per
      Turn.</p></td></tr><tr><td><p>Executioner</p></td><td><p>Knife,
      Shotgun</p></td><td><p>Once per Turn, when you hit a Creature that has the
      Incapacitated or Prone Condition, that Attack deals an additional 2d8
      Damage.</p></td></tr><tr><td><p>Flourish</p></td><td><p>Sword, Greatsword,
      Heavy Throwing Disc, Throwing Disc</p></td><td><p>Once per Turn, when you
      make an Attack with this Weapon and miss, you may roll 1d8 and add the
      total to your result, potentially turning that miss into
      hit.</p></td></tr><tr><td><p>Lethality</p><p></p><p></p></td><td><p>Axe,
      Greataxe, Hand Crossbow, Handgun</p></td><td><p>Once per Turn, when you
      hit a Creature that does not have any Physical DR, that attack deals an
      additional 1d8
      Damage.</p></td></tr></tbody></table><hr><p><strong>Semi-Automated:
      </strong>All Mastery Properties except Drive have Opt-In options
      available; these do not check for the correct weapon being used, so use
      them as appropriate. All Proficiencies are gained automatically; you must
      manually handle the changing of Fighting Styles.</p>
