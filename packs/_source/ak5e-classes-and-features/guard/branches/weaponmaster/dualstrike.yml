  description:
    value: >-
      <p>As comfortable with one weapon as with two, you move with a
      kinaesthetic grace that onlookers can only hope to imitate. You gain the
      following benefits:</p><ul><li><p><strong>Fast Hands</strong>. You can
      Interact with Object an additional time on each of your Turns, but you can
      only use this to draw or stow
      weapons.</p></li><li><p><strong>Steelwind.</strong> When you take the
      Attack Action while wielding weapons you are capable of Two-Weapon
      Fighting with, you can make the additional Attack from Two-Weapon Fighting
      as part of that Action, instead of as a Bonus Action. If you do so, you
      cannot use any Weapon Properties to make an Attack using your Bonus Action
      for the rest of that Turn.</p></li></ul><hr><p><strong>Automation not
      required.</strong></p>
