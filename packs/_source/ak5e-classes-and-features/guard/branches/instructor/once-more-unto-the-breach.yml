  description:
    value: >-
      <p>Sometimes, one final push is all it takes; one moment of resolve. You
      can provide that moment.</p><p>As an Action, you may use the Help Action
      against all allied Creatures within 60 feet that can see or hear you. You
      may issue an Instruction to each Creature you help; these Instructions do
      not consume Instruction Dice, but you cannot use your Kingmaker Feature to
      issue additional Instructions from these Instructions.</p><p>Once you have
      used this Feature, you cannot do so again until you have finished a Long
      Rest.</p><hr><p><strong>Semi-Automated: </strong>After you activate this
      Feature, you must use the Apply Instruction Feature to apply each
      Instruction.</p>
    chat: ''
