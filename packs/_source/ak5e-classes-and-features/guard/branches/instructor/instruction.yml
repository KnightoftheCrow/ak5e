  description:
    value: >-
      <p>You are talented in leading or training fighters of any stripe. You
      learn Instructions that are fuelled by special dice called Instruction
      Dice, detailed below under Instruction
      Options</p><ul><li><p><strong>Instructions:</strong> When you use the Help
      Action, you may also issue one Instruction to the same Creature you
      helped. Each Instruction expends 1 Instruction
      Die.</p></li><li><p><strong>Instruction Dice:</strong> You have four
      Instruction Dice, which are d6s; you regain all expended Instruction Dice
      when you finish a Short or Long Rest.</p><p>You gain an additional
      Instruction Die when you reach Guard Levels 7 (five dice total) and 14
      (six dice total)
      <br></p></li></ul><h3>Instructions</h3><table><thead><tr><td><p><strong>Instruction</strong></p></td><td><p><strong>Effect</strong></p></td></tr></thead><tbody><tr><td><p>Defend
      Yourself!</p></td><td><p>The AC of that Creature is increased by an amount
      equal to half the result of one roll of your Instruction Die until the end
      of their next Turn.</p></td></tr><tr><td><p>Focus!</p></td><td><p>That
      Creature gains a Bonus to the next Skill Check it makes before the
      beginning of your next Turn equal to one roll of your Instruction
      Die.</p></td></tr><tr><td><p>Get out of There!</p></td><td><p>That
      Creature may immediately move a distance equal to three rolls of your
      Instruction Die, rounded to the nearest 5. This movement does not provoke
      Opportunity Attacks from Creatures they were within the Reach of when they
      began this movement.</p></td></tr><tr><td><p>Go!</p></td><td><p>That
      Creature may immediately move a distance equal to half of their Speed +
      three rolls of your Instruction Die, rounded to the nearest
      5.</p></td></tr><tr><td><p>Hang In There!</p></td><td><p>When that
      Creature rolls a Death Saving Throw before the end of their next Turn,
      they gain a bonus to that Saving Throw equal to one roll of your
      Instruction Die. If the result of that Saving Throw is greater than 20,
      they gain the effect of rolling a 20 on the
      d20.</p></td></tr><tr><td><p>Keep Fighting!</p></td><td><p>The Creature
      gains Temporary Hit Points equal to one roll of your Instruction
      Die.</p></td></tr><tr><td><p>Now's Your Chance!</p></td><td><p>That
      Creature gains a bonus to the next Attack Roll it makes before the end of
      its next Turn equal to one roll of your Instruction
      Die.</p></td></tr><tr><td><p>Snap Out of It!</p></td><td><p>If that
      Creature is currently under an effect requiring them to make a Saving
      Throw at the beginning or end of their Turn, they can immediately attempt
      that Saving Throw with a Bonus equal to one roll of your Instruction
      Die.</p></td></tr><tr><td><p>Steel Yourself!</p></td><td><p>That Creature
      gains a Bonus to the next Saving Throw it makes within the next Minute
      equal to one roll of your Instruction
      Die.</p></td></tr><tr><td><p>Strike!</p></td><td><p>That Creature may
      immediately expend its Reaction to make an Attack or cast a Cantrip with a
      Casting Time of an Action; that Attack or Cantrip deals additional Damage
      equal to one roll of your Instruction
      Die.</p></td></tr></tbody></table><hr><p><strong>Semi-Automated:
      </strong>All of the instructions can be used via the Activites on your
      Squad Leader Feature. All except Get Out of There! and Go! are automated;
      these two make the roll, but the effects must be resolved manually. </p>
    chat: >-
      <p>You are talented in leading or training fighters of any stripe. You
      learn Instructions that are fuelled by special dice called Instruction
      Dice, detailed below under Instruction
      Options</p><ul><li><p><strong>Instructions:</strong> When you use the Help
      Action, you may also issue one Instruction to the same Creature you
      helped. Each Instruction expends 1 Instruction
      Die.</p></li><li><p><strong>Instruction Dice:</strong> You have four
      Instruction Dice, which are d6s; you regain all expended Instruction Dice
      when you finish a Short or Long Rest.</p><p>You gain an additional
      Instruction Die when you reach Guard Levels 7 (five dice total) and 14
      (six dice total) </p></li></ul><hr><p><strong>Semi-Automated: </strong>All
      of the instructions can be used via the Activites on your Squad Leader
      Feature. All except Get Out of There! and Go! are automated; these two
      make the roll, but the effects must be resolved manually. Notably, the
      bonus to AC granted by Defend Yourself! is not shown on the sheet; examine
      the applied effect to see the bonus granted.</p>
