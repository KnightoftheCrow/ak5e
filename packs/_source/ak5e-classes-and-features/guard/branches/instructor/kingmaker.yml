      <p>Once per Turn, when you issue an Instruction, you may choose a second
      allied Creature within 30 feet of you and issue the same Instruction to
      them. This additional Instruction does not expend an Instruction Die;
      however, your Instruction Die is always a d6 for this second
      Instruction.</p><hr><p><strong>Semi-Automated: </strong>Activate this
      Feature manually and choose the same Instruction you just granted; they
      are always issued as a d6.</p>
