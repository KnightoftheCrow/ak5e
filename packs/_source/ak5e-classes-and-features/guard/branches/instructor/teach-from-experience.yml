  description:
    value: >-
      <p>Your Instruction is not purely theoretical; you have lived it. You gain
      the following benefits:</p><ul><li><p><strong>From Experience.</strong> At
      the beginning of your Turn during Combat, you may choose one of your
      Instructions; you gain the benefit of that Instruction. This does not
      count as issuing an Instruction.</p></li><li><p><strong>Press the Attack:
      Cooperative Combat (1 Aggression).</strong> You can use this Press the
      Attack Action when you issue an Instruction to a Creature (no Action
      required); you also gain the benefit of that Instruction. Once you have
      benefitted from an Instruction in this way, you may not do so again until
      the beginning of your next
      Turn.</p></li></ul><hr><p><strong>Semi-Automated: </strong>At the
      beginning of each of your Turns, you will be prompted to use an Activity
      and choose an Instruction to apply for From Experience. When you use
      Cooperative Combat, choose the same Instruction you just issued.</p>
    chat: ''
