  description:
    value: >-
      <p>Like a orchestral masterpiece, you start slow and build up to the apex
      of your violent art. You gain the following
      benefits:</p><ul><li><p><strong>Critical Death’s Design.</strong> Both of
      your Death’s Design options can now Critically Hit. When you use Reap,
      roll a d20 as if you were making an Attack with the weapon used for Reap;
      if that Attack would result in a Critical Hit, Reap is considered to have
      Critically Hit all Creatures within the area. For Curtainfall, a Critical
      Hit on the Attack Roll causes Curtainfall to Critically Hit also. Neither
      option has its Damage multiplied on a Critical Hit, instead gaining the
      following bonuses on a Critical Hit</p><ul><li><p><strong>Reap.</strong>
      Any non-Elite, non-Leader Creatures hit by that Reap are considered to be
      Vulnerable to its Damage.</p></li><li><p><strong>Curtainfall.</strong> The
      Damage dealt by this Attack ignores Resistance to Physical
      Damage.</p></li></ul></li><li><p><strong>Critical Scaling.</strong> The
      Critical Range of your Reap and Curtainfall Actions is increased based on
      your current level of Ruin, as shown in the Reaper
      Table.</p></li></ul><blockquote><p><strong>Reaper and
      Hordes</strong></p><p>Reaper is a Branch that cares about killing hostile
      Creatures perhaps more than any other. As such, the reccomendation for
      Reaper interacting with Swarm is that the max Hit Points of the Creature
      that comprises the Swarm is considered the Threshold for earning “kills”.
      If they deal more than this Threshold in a single instance of Damage, they
      have “killed” 1 Creature; if that instance is double that Threshold, they
      have “killed” 2 Creatures, and so
      on.</p></blockquote><hr><p><strong>Semi-Automated: </strong>Your Reap
      Activity now triggers a targetless attack that checks for if the "attack"
      crits; you will have to double the damage dealt as a result of a crit
      manually. Curtainfall Crit cannot be automated. The Critical Scaling of
      these Actions is automated, however, Curtainfall will not show up as a
      Critical Hit even when it is, but rolling damage will roll it as if it is
      a Crit.</p>
