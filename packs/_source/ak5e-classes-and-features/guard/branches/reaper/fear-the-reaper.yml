  description:
    value: >-
      <p>Even for your allies, watching you work can be a perturbing sight. For
      your enemies, to know that they are next can be too much to bear.</p><p>As
      a Bonus Action, you can mark a hostile Creature you can see with your
      Reaper’s Mark for 1 hour. When a Creature with your Reaper’s Mark sees or
      hears you gain Ruin, they take 1d6 Psychic Damage; Creatures that are
      immune to the Frightened Condition do not take this Damage. Additionally,
      you can always sense the direction to Creature with your Reaper’s Mark,
      and if that Creature is moving, you know the direction of its movement.
      Finally, you can see a Creature with your Deathmark even if it has the
      Invisible Condition.</p><p>Once you have used this Feature, you cannot do
      so again until you complete a Long Rest.</p><hr><p><strong>Semi-Automated:
      </strong>You can mark a Creature with the Activity on this Feature. Your
      Reaper's Ruin Feature now has an additional Activity that allows you to
      gain Ruin and deal the Psychic Damage.</p>
