  advancement: {}
  description:
    value: >-
      <p>Your canvas is the battlefield, your paint death and destruction, and
      you are an adept artist indeed. You gain two options you can perform in
      place of the Attack Action.</p><ul><li><p><strong>Reap.</strong> While you
      are wielding a Melee Weapon, you can swing it in a 15-foot cleaving cone
      originating from you; all Creatures within that area must make on a
      Dexterity Saving Throw against your Martial DC. Roll the Damage of the
      weapon you used for the swing, as if you had hit with an Attack; any bonus
      that would increase or modify the Damage of that Attack are applied, such
      as the Deadly or Crush (X) Properties. On a failed Save, Creatures take
      half of the rolled Damage; on a successful Save, they take no
      Damage.</p></li><li><p><strong>Curtainfall.</strong> While you are
      wielding a Melee Weapon, you can make an Attack against a Creature within
      your Reach. If that Attack hits, that Attack deals 1d6 additional Damage
      to that Creature only for each Ruin you have; this additional Damage is
      not multiplied by a Critical Hit. After you have dealt Damage in this way,
      all of your Ruin is expended.</p></li></ul><hr><p><strong>Semi-Automated:
      </strong>Enchant the Weapons you intend to use with these options.
      Curtainfall is automated; you must set the damage for Reap to the Damage
      of the Weapon manually.</p>
