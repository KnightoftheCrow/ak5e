  uses:
    spent: 10
    recovery:
      - period: sr
        type: loseAll
    max: '10'
  advancement: {}
  description:
    value: >-
      <p>You are empowered by grinding conflict; as the battle continues, and
      your body count grows, your furor intensifies, represented by your
      Ruin.</p><h3>Ruin</h3><p>You gain 1 Ruin whenever you score a Critical
      Hit, or reduce a Creature to 0 Hit Points. You lose 1 Ruin at the end of
      your Turn if you did not deal Damage to a hostile Creature. You lose all
      Ruin if you are reduced to 0 Hit Points.</p><p>You gain a number of
      benefits based on your current Ruin, as shown in the “Effects” column of
      the Reaper Table; these effects are cumulative, and so you gain all
      previous effects in addition to the current one.</p><p>However, as your
      Ruin climbs, it becomes more difficult to heal you, not least of all
      because of the difficulty of identifying who’s blood is who’s. When
      another Creature attempts to restore Hit Points to you, the amount of Hit
      Points they restore is reduced by the value shown in the “Healing
      Recieved” column of the Reaper Table, corresponding to your current level
      of Ruin.</p><p><strong>Press the Attack: Lingering Violence (1
      Aggression)</strong> You can use this Press the Attack Option when your
      Ruin would decay by 1 as a result of you not damaging a hostile Creature
      (no Action required); it does not decay.</p><h3>Reaper
      Table</h3><table><thead><tr><td><p>Ruin</p></td><td><p>Effect</p></td><td><p>Reap
      Critical Range (Level 4+)</p></td><td><p>Curtainfall Critical Range (Level
      4+)</p></td><td><p>Healing
      Recieved</p></td></tr></thead><tbody><tr><td><p>0</p></td><td><p>-</p></td><td><p>+10</p></td><td><p>+0</p></td><td><p>0</p></td></tr><tr><td><p>1</p></td><td><p>-</p></td><td><p>+9</p></td><td><p>+1</p></td><td><p>-2</p></td></tr><tr><td><p>2</p></td><td><p>When
      you roll a 1 on a result for a Damage die, you may reroll that result but
      must use the new
      result.</p></td><td><p>+8</p></td><td><p>+2</p></td><td><p>-4</p></td></tr><tr><td><p>3</p></td><td><p>-</p></td><td><p>+7</p></td><td><p>+3</p></td><td><p>-6</p></td></tr><tr><td><p>4</p></td><td><p>Your
      movement does not provoke Opportunity Attacks from non-Elite or Leader
      Creatures.</p></td><td><p>+6</p></td><td><p>+4</p></td><td><p>-8</p></td></tr><tr><td><p>5</p></td><td><p>-</p></td><td><p>+5</p></td><td><p>+5</p></td><td><p>-10</p></td></tr><tr><td><p>6</p></td><td><p>You
      can move through the space of hostile Creatures, though you may not finish
      a movement in the same space as another; they are considered Difficult
      Terrain.</p></td><td><p>+4</p></td><td><p>+6</p></td><td><p>-12</p></td></tr><tr><td><p>7</p></td><td><p>-</p></td><td><p>+3</p></td><td><p>+7</p></td><td><p>-14</p></td></tr><tr><td><p>8</p></td><td><p>When
      you roll to determine Damage, you may make that roll an additional time
      and choose either
      total.</p></td><td><p>+2</p></td><td><p>+8</p></td><td><p>-16</p></td></tr><tr><td><p>9</p></td><td><p>-</p></td><td><p>+1</p></td><td><p>+9</p></td><td><p>-18</p></td></tr><tr><td><p>10</p></td><td><p>If
      one of your Attacks, or your Reap Feature reduces a Creature to less Hit
      Points than a value 5 + your Guard Level, it dies.</p></td><td><p>+
      0</p></td><td><p>+10</p></td><td><p>-20</p></td></tr></tbody></table><hr><p><strong>Semi-Automated:
      </strong>Use the Gain Ruin Activity to gain your Ruin; it is tied to the
      uses of this item. The changes to critical range, healing recieved, and
      damage rerolling effects are automated based on these uses; other effects
      cannot be, including the execute effect at 10 Ruin.<br></p>
