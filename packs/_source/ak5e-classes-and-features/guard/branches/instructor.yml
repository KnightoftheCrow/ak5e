  description:
    value: >-
      <p><span class="fontstyle0">An Instructor does not desire to be the centre
      of attention; they understand that victory can only be achieved through
      excellence not of a single person, but of a team. Instructors excel at
      helping that team excel, punctuating orders with punishing blows against
      the enemy.</span></p><p>You gain the following Branch
