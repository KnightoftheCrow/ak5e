  description:
    value: >-
      <p>While unencumbered, you can fight and move freely. While you are not
      wearing Medium or Heavy Armour, you gain the following
      benefits:</p><ul><li><p><strong>Bob and Weave.</strong> Your base Armour
      Class is equal to 10 + your Strength and Dexterity
      Modifiers</p></li><li><p><strong>Dexterous Attacks.</strong> You can use
      your Dexterity modifier instead of your Strength modifier for the Attack
      and Damage rolls of your Unarmed Strikes. In addition, when you make an
      Athletics Check to Grapple or Shove a Creature, you can use your Dexterity
      Modifier instead of Strength</p></li><li><p><strong>Art of the
      Fist.</strong> The Damage of your Unarmed Strikes is increased to 1d4 +
      your Ability Modifier. This is increased to 1d6 at 7th Level, and 1d8 at
      14th Level.</p><hr></li></ul><p><strong>Semi-Automated: </strong>The AC
      modification is automated, and you are granted an Unarmed Strike weapon
      which properly scales and has the Finesse Property. Using Dexterity for
      Athletics is not automated.</p>
