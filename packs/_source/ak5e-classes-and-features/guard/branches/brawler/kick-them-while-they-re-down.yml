  description:
    value: >-
      <p>Honour is for tournaments; a true fighter never passes up a free
      hit.</p><p>When you hit a Creature that has a detrimental Status Condition
      (such as Frightened, Stunned, Grappled, Prone, or Burning) with a Unarmed
      Strike, that Unarmed Strike deals additional Bludgeoning Damage equal to
      your Proficiency Bonus. </p><hr><p><strong>Semi-Automated: </strong>There
      is an Opt-In available for Damage Rolls that deal Bludgeoning
      Damage.<br></p>
