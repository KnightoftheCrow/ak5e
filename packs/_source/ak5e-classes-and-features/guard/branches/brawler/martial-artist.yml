      Techniques</h3><p><strong>Body Check (1 Aggression)</strong></p><p>When
      you hit a Creature with an Unarmed Strike, you may use this Technique (no
      Action required) to attempt to Shove that Creature. On a success, the
      distance you shove that Creature is doubled.</p><p><strong>Cross Counter
      (1 Aggression)</strong></p><p>When a Creature makes a Melee Attack against
      you, you can use this Technique as a Reaction to increase your Armour
      Class by a value equal to your Proficiency Bonus against that Attack,
      possibly causing it to miss. If that Attack misses you, you can make an
      Unarmed Attack against that Creature as part of this
      Reaction.</p><p><strong>Feint (1 Aggression)</strong></p><p>You may use
      this Technique as an Bonus Action; choose one Creature within your Reach;
      your next Unarmed Strike against this Creature before the end of your next
      Turn is made at Advantage.</p><p><strong>Follow Up (1
      Aggression)</strong></p><p>When you hit a Creature with an Unarmed Strike,
      you can use this Technique (no Action required) to make an Unarmed Strike
      against the same Creature. You can only use this Technique once per
      Turn.</p><p><strong>Footwork (1 Aggression)</strong></p><p>After making a
      Melee Attack, you can use this Technique (no Action required) to move up
      to half of your Movement Speed. This Movement does not provoke Opportunity
      Attacks.</p><p><strong>Guard Up (1 Aggression)</strong></p><p>You may use
      this Technique as a Bonus Action; you take the Dodge Action as part of
      that Bonus Action.</p><p><strong>Slip Off (2
      Aggression)</strong></p><p>When you would take Damage from an Attack you
      can see, you can use this Technique as a Reaction to halve that Attack’s
      Damage against you.</p><p><strong>Tag In (2 Aggression)</strong></p><p>If
      there is a Willing Creature (that is not Incapacitated) within your Reach,
      you may use this Technique to swap positions with them. This Movement
      still requires you to spend Movement, and does not provoke Opportunity
      Attacks.</p><p>Additionally, either you or the Creature you swapped with
      (your choice) may then make a single Melee Attack against a valid
      target.</p><p>You may only use Tag In once per
      Turn.</p><hr><p><strong>Partially Automated: </strong>Cross Counter,
      Feint, Guard Up, Slip Off are Automated. All others are not.<br></p>
    chat: >-
      <p>Your training has granted you a unique set of skills for down and dirty
      brawling. You gain access to special Basic Brawling Techniques that are
      fuelled by your Aggression.</p><hr><p><strong>Partially Automated:
      </strong>Cross Counter, Feint, Guard Up, Slip Off are Automated. All
      others are not.</p>
