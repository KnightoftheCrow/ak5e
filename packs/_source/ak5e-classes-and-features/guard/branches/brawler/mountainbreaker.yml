  description:
    value: >-
      <p>You unleash your furore in such a concentrated assault that few foes
      can hope to withstand it.</p><p>As an Action, you may
      either;</p><ul><li><p>Make an Unarmed Strike against a Creature within
      your Reach. If it hits, you may make another Unarmed Strike against it,
      and so on, until you miss or have made 10 Attacks; at which point the
      sequence ends. Each Attack after the first suffers a cumulative -2 to
      hit</p></li><li><p>Make an Unarmed Strike against a Creature within your
      Reach; if it hits, the Damage of that Attack is multiplied by five.
      Additionally, if the Creature is no more than one size larger than you,
      they are knocked 20 feet directly away from you and fall
      Prone</p></li></ul><p>Once you use this Feature, you must complete a Long
      Rest before you may do so again.</p><hr><p><strong>Semi-Automated:
      </strong>The Mountainbreaker 5x Strike can be performed using this
      Activity. The multihitting strike must be done manually.<br></p>
