  advancement: {}
  description:
    value: >-
      <p>You are no back alley thug. Your hands and feet are phantasmagoric; an
      express pass to unconsciousness. You gain the following
      benefits:</p><ul><li><p><strong>Always Ready.</strong> At the beginning of
      your Turn during combat, you regain one expended
      Aggression.</p></li><li><p><strong>Master Brawler.</strong> You gain
      access to the Advanced Brawling Techniques detailed
      below.</p></li></ul><h3>Advanced Brawling
      Techniques</h3><p><strong>Chokehold (2 Aggression)</strong></p><p>When you
      are Grappling a Creature no more than one Size Category larger than you,
      you may use this Technique as an Action; that Creature loses Hit Points
      equal to your Strength or Dexterity Score (your choice). Cannot be used on
      Creatures who do not breathe.</p><p><strong>CQC (2
      Aggression)</strong></p><p>When you hit a Creature with an Unarmed Strike,
      you may use this Technique (no Action required) to attempt to Grapple that
      Creature as part of that Attack.</p><p><strong>Disarm (3
      Aggression)</strong></p><p>When you are Grappling a Creature, you may use
      this Technique as an Action; the Creature you are Grappling must pass a
      Strength Saving Throw against your Martial DC or be forced to drop an item
      of your choice.</p><p><strong>Human Shield (2
      Aggression)</strong></p><p>When you are Grappling a Creature no more than
      one Size Category larger than you, you may use this Technique as an
      Action. That Creature must succeed on a Strength Saving Throw against your
      Martial DC or become Restrained by you. When you Restrain a Creature in
      this way, you swing them around to face a direction of your choice; you
      are considered to be in Three-Quarters Cover against Attacks from that
      direction, and if an Attack against you from that direction misses, it
      hits the Restrained Creature instead. You may change the direction in
      which you are presenting the Restrained Creature as an Action during your
      Turn. The Restrained Creature may reattempt the Saving Throw as an Action
      during their Turn, ending the Condition and the Grapple on a success. You
      may not Attack a Creature you have Restrained in this
      way.</p><p><strong>Menace (2 Aggression)</strong></p><p>You can use this
      Technique as an Action; choose a Creature within 30 feet that can see or
      hear you. That Creature must succeed a Wisdom Saving Throw against your
      Martial DC or become Frightened of you. A Creature may reattempt the
      Saving Throw at the end of each of their Turn, ending the Condition on a
      success.</p><p><strong>Skullshaker (2 Aggression)</strong></p><p>You may
      use this Technique as an Action; make an Unarmed Strike. If it hits, the
      Damage of that Attack is doubled, and the target is Dazed until the end of
      their next Turn.</p><p><strong>Weigh In (2 Aggression)</strong></p><p>When
      you hit a Creature with a Melee Attack, you may use this Technique to
      attempt to goad them. They must succeed on a Wisdom Saving Throw against
      your Martial DC or have Disadvantage on all Attack Rolls against Creatures
      that aren’t you until the end of their next
      Turn.</p><hr><p><strong>Partially Automated: </strong>When you use
      Chokehold, make sure use the right selection to deal the appropriate
      amount of damage. Menace and Weigh In are automated. Skullshaker allows
      you to enchant your Unarmed Strike with double damage, but the Dazed
      Condition must be applied manually.</p>
