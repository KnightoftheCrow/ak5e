  description:
    value: >-
      <p>Whenever you make a Melee Attack, you can choose to make that Attack a
      Foecrusher. A Foecrusher has one of the following effects (your
      Choice):</p><ul><li><p><strong>Staggering Strike.</strong> A Creature hit
      by this Attack has its Speed halved until the end of its next
      Turn.</p></li><li><p><strong>Dazing Strike</strong>. A Creature hit by
      this Attack has the Dazed Condition until the end of their next
      Turn.</p></li><li><p><strong>Renewing Strike</strong>. If you hit with
      this Attack, you may expend and roll one of your Hit Dice, and recover Hit
      Points equal to the amount rolled plus your Constitution
      Modifier.</p></li><li><p><strong>Smashing Strike.</strong> A Creature that
      takes Damage from this Attack is pushed 15 feet away from you; you may
      then move up to half your Speed directly towards that Creature without
      provoking Opportunity Attacks.</p></li></ul><p>You may use this Feature a
      number of times equal to your Proficiency Bonus, and regain all expended
      uses whenever you finish a Short Rest.</p><p><strong>Press the Attack:
      Overbear (2 Aggression)</strong> You may use this Press the Attack option
      when you make an Attack a Foecrusher (no Action required); that Attack
      deals 1d10 additional Damage, and you may choose a second Foecrusher
      Effect to apply to that Attack without expending a use of that Feature.
      You must choose a different Effect than the
      original.</p><hr><p><strong>Semi-Automated: </strong>Use the Activity on
      this Feature to Enchant your Weapon with the Foecrusher Attacks; all the
      Foecrusher Attacks are automated. When you hit with a Foecrusher, there is
      an optional Prompt to use Overbear, which consumes 2 Aggression. It does
      not let you apply the second Foecrusher effect automatically.</p>
