  description:
    value: >-
      <p>You are fortitude incarnate, a moving mountain. It is a fool’s errand
      to attempt to contain your mass. You gain the following
      benefits:</p><ul><li><p><strong>Extreme Fortitude.</strong> Whenever you
      roll a Hit Die, roll two dice and discard the lowest
      result.</p></li><li><p><strong>Maximum Bulk.</strong> Your Hit Point
      maximum increases by 3. Whenever you gain a Level thereafter, your Hit
      Point maximum increases by an additional
      3.</p></li></ul><hr><p><strong>Semi-Automated: </strong>The HP increase is
      automated; Hit Die Advantage is not.</p>
