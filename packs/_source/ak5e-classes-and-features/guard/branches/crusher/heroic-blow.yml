  description:
    value: >-
      <p>When you make a Melee Attack during your Turn, you may expend a use of
      your Foecrusher Feature to make that Attack a Heroic Blow. If you do so,
      when you roll Damage for that Attack, you may reroll any amount of the
      dice, and use either result. Additionally, that Attack gains the Crush (X)
      Property, where X is equal to twice your Proficiency Bonus. If it already
      has the Crush (X) Property, add the values of X together and use that
      value for X.</p><hr><p><strong>Semi-Automated: </strong>When you roll
      Damage for a Melee Attack, you will have an opt-in for Heroic Blow which
      consumes 1 Foecrusher to give you Advantage on that Damage Roll. The Crush
      (X) Portion cannot be automated.</p>
