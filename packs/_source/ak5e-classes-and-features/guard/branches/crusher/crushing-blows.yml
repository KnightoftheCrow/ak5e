  description:
    value: >-
      <p>Crushers place their all into each attack; weight, strength, and soul.
      You gain the following benefits:</p><ul><li><p><strong>Death’s
      Passing.</strong> When you make a Melee Attack with a Heavy Melee Weapon
      as part of the Attack Action and miss, the Creature you attacked takes
      Thunder Damage equal to twice your Proficiency
      Bonus.</p></li><li><p><strong>Heavy Metal.</strong> The Damage of Heavy
      Melee Weapons being wielded by you is increased by 1
      die.</p></li><li><p><strong>Singular Strike.</strong> When you take the
      Attack Action, you can only make one Attack as part of that Action, even
      if you would normally be able to make more. If the Attack you make is a
      Melee Attack, for each additional Attack you would otherwise have been
      able to make, that Attack’s Damage is increased by the
      following:</p><ul><li><p>The weapon’s Damage</p></li><li><p>Your Strength
      Modifier</p></li><li><p>Bonus Damage from the weapon being a +1/+2/+3
      weapon.</p></li></ul></li></ul><blockquote><p><strong>Example: Singular
      Strike</strong></p><p>You take the Attack Action using a Greatsword (2d6)
      and a Strength Modifier of 5. Because of your Heavy Metal Feature, the
      Damage of the Greatsword becomes 3d6.</p><p>If you would be capable of
      making one Attacks, the Damage of this Attack is 3d6+5.</p><p>If you would
      be capable of making two Attacks, the Damage of this Attack is
      6d6+10.</p><p>If you would be capable of making three Attacks, the Damage
      of this Attack is 9d6+15.</p><p>If you would be capable of making four
      Attacks, the Damage of this Attack is
      12d6+20.</p></blockquote><hr><p><strong>Semi-Automated: </strong>Death's
      Passing must be manually triggered. When you hit with an Attack, choose
      the correct option for Singular Strike based on how many Attacks you could
      have made.</p>
