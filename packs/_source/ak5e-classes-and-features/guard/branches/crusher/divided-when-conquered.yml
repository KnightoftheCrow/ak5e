  advancement: {}
  description:
    value: >-
      <p>The sweeping arc of your weapon demolishes ranks of your foes, cutting
      through the weak and unready with terrifying ease. You gain the following
      benefits:</p><ul><li><p><strong>Additional Reach.</strong> Heavy Melee
      Weapons you are wielding are considered to have the Reach
      Property.</p></li><li><p><strong>Horde Breaker.</strong> When you reduce a
      Creature within your Reach to 0 Hit Points with a Melee Attack using a
      Heavy Melee Weapon, you may repeat that Attack against another Creature
      within your Reach and within 10 feet of the original Creature. However, if
      this Attack hits, do not roll Damage; instead, the Damage is equal to the
      excess Damage from the original Attack. If this Attack also reduces a
      Creature within your Reach to 0 Hit Points, you may continue to make these
      Attacks until you make an Attack that does not reduce a Creature to 0 Hit
      Points, there are no other Creatures within 10 feet of the last Creature
      you attacked, or you have no excess Damage
      remaining.</p></li></ul><hr><p><strong>Semi-Automated: </strong>Manually
      grant Heavy Melee Weapons Reach. You can apply an Enchantment with this
      Feature to a Heavy Melee Weapon that lets you make Horde Breaker Attacks
      with it; set the scaling value on that Attack to the excess Damage, and
      make sure you set the Damage Type correctly.</p>
