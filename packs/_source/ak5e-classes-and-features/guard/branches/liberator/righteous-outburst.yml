  description:
    value: >-
      <p>All it takes to change history is for the right person to take action
      at the right time. Make sure that you do. You gain the following
      benefits:</p><ul><li><p><strong>Flash of Anger.</strong> When you hit a
      Creature with a Melee Weapon Attack, you can expend any amount (min. 1) of
      your Liberty to cause that Attack to deal additional 1d6 Damage for each
      Liberty expended; this additional Damage cannot be increased by Critical
      Hits. If a Creature is reduced to 0 Hit Points as a result of this Attack,
      1 Liberty is refunded.</p></li><li><p><strong>The Right Moment.</strong>
      When you activate an Operator Skill, all of your current Liberty is
      consumed. The amount of Liberty you consume in this way grants you the
      following benefits for the duration of that Skill:</p><ul><li><p>Operator
      Skills that force a Creature to make a Saving Throw during your Turn, and
      deal Damage, deal 1d6 additional Damage for every Liberty you consumed;
      this only applies to Damage dealt as a result of making that Saving
      Throw.</p></li><li><p>When you make a Melee Weapon Attack, it deals 1d6
      additional Damage for every 2 Liberty you
      consumed.</p></li></ul></li><li><p><strong>Unique Operator
      Skills.</strong> You have access to Operator Skills unique to this Branch,
      detailed below. When you gain a Basic, Advanced, or Elite Operator Skill,
      you may instead choose one from the corresponding Operator Skill Table for
      this Branch.</p></li></ul><hr><p><strong>Semi-Automated: </strong>Flash of
      Anger is automated. Use the Right Moment Activity on this item before you
      activate a Skill, and set the scaling value to your current Liberty. It
      will provide Damage to appropriate rolls, with no duration; delete the
      effect manually when the duration of the Skill ends. When you select an
      Operator Skill, there are additional entries for you.</p>
