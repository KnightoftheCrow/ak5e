  description:
    value: >-
      <p>You have become an ideological avatar, the distilled essence of all you
      believe in. You have held your tongue for long enough.</p><p>As an Action
      during your Turn, you can release your Liberty in a singular powerful
      burst; all of your Liberty is expended. All hostile Creatures within 20
      feet must make a Dexterity Saving Throw against your Martial DC or take
      1d12 Force Damage for every Liberty expended in this way. You then gain
      the following benefits for the next 10
      minutes.</p><ul><li><p><strong>Champion of the Worthy.</strong> Once on
      each of your Turns, if you have not used it that Turn you may use your
      Guide the Masses Feature without expending an Action. If you do so, you
      generate Liberty as if you had done so as an Action, and you may not do
      use that Feature as an Action that Turn.</p></li><li><p><strong>Shield of
      Belief.</strong> At the beginning of each of your Turns, you gain
      Temporary Hit Points equal to your Guard
      Level.</p></li><li><p><strong>Time to Act.</strong> Whenever you gain or
      are refunded Liberty, you gain one more.</p></li></ul><p>Once you have
      used this Feature, you cannot do so again until you complete a Long
      Rest.</p><hr><p><strong>Semi-Automated: </strong>Use the Activity on this
      item, and set the scaling value to your current Liberty. The Champion of
      the Worthy Effect and Time To Act effects cannot be automated; the Shield
      of Belief effect is.</p>
