  description:
    value: >-
      <p>You gain the following benefits:</p><ul><li><p><strong>Cannot be
      Denied.</strong> The additional Damage from your Flash of Anger Feature is
      now Force Damage. If you have an Operator Skill that deals an Arts Damage
      Type, you can cause your Flash of Anger Feature to deal that Damage Type
      instead of Force when you use it.</p></li><li><p><strong>Caught in the
      Crossfire.</strong> When you use your Flash of Anger Feature, you can
      choose a different Creature within 10 feet of the Creature you attacked;
      that Creature also takes the additional Damage dealt by your Flash of
      Anger Feature to the original
      Creature.</p></li></ul><hr><p><strong>Semi-Automated: </strong>Use the
      Activity on this Feature and set the Scaling Value and Damage Type to what
      it should be.</p>
