  description:
    value: >-
      <p>You practice what you preach, seeking out those who oppose your vision
      and striking them down. You gain the following
      benefits:</p><ul><li><p><strong>Far Reaching Guidance.</strong> The range
      of your Guide the Masses Feature is increased to 40
      feet.</p></li><li><p><strong>Improved Liberty.</strong> The additional
      Damage granted by your Flash of Anger and The Right Moment Features is
      increased to a d10.</p></li><li><p><strong>Press the Attack: Face Me (2
      Aggression)</strong> You can use this Press the Attack Feature as a Bonus
      Action; you can cast the Compelled Duel Art using this Feature as part of
      that Bonus Action, ignoring its Somatic Components. If you do so, you use
      your Martial DC in place of your Spellcasting DC for that
      Art.</p></li></ul><hr><p><strong>Semi-Automated: </strong>Far Reaching
      Guidance and Improved Liberty are automated. If you have the PHB, Face Me
      is automated, but assumes you are using STR for your Martial DC. If you
      are using DEX, edit the Feature.</p>
