  advancement: {}
  description:
    value: >-
      <p>You take action only when the moment is right. Until then, you watch
      and wait, providing what succor you can to those who rally to you. You
      gain the following benefits:</p><p><strong>Liberty.</strong> You have a
      special resource called Liberty. Liberty is expended to fuel your other
      Features, and empower your Operator Skills. Your maximum Liberty is
      6.</p><p>You can generate Liberty in the following ways. You can only
      generate Liberty during Combat.</p><ul><li><p>You gain 1 Liberty at the
      end of any of your Turns that you did not:</p><ul><li><p>Activate an
      Operator Skill, or have an active Operator Skill.</p></li><li><p>Cast an
      Art.</p></li><li><p>Make an Attack Roll.</p></li></ul></li><li><p>You gain
      1 Liberty when you use your Guide the Masses Feature as an
      Action.</p></li></ul><p><strong>Guide the Masses</strong>. As an Action
      while in Combat, you can choose an allied Creature you can see within 20
      feet, and grant them one of the following bonuses (your choice) until the
      beginning of your next Turn; these effects are not
      cumulative.</p><ul><li><p><strong>Advocate.</strong> The next time that
      Creature gains Hit Points or Temporary Hit Points, they gain an additional
      amount equal to your twice Proficiency Bonus or twice your current
      Liberty, whichever is higher.</p></li><li><p><strong>Empower.</strong>
      That Creature gains Damage Reduction against the next Damage they take
      equal to your Proficiency Bonus or your current Liberty, whichever is
      higher.</p></li><li><p><strong>Uplift.</strong> That Creature’s next
      successful Attack deals additional Damage equal to your Proficiency Bonus
      or your current Liberty, whichever is higher.</p></li></ul><p>Starting at
      7th Level, if you have used this Feature as an Action during a Turn, you
      may also use it as a Bonus Action during that Turn, but you must choose a
      different Creature for that Bonus Action.</p>
    chat: ''
