  description:
    value: >-
      <p>You gain the following
      benefits:</p><ul><li><p><strong>Arts-Touched.</strong> You gain
      Proficiency in the Arts Skill, or Expertise if you already have
      Proficiency in it.</p></li><li><p><strong>Blade Arts.</strong> You learn
      the Blade Arts Cantrip, shown below. It is considered to be a Spellsword
      Art for you. Additionally, Melee Weapons being wielded by you are
      considered to have the Casting Unit
      Property.</p></li><li><p><strong>Resonance.</strong> Your Blade Art
      Cantrip gains an additional effect depending on the Damage Type dealt.
      Once a Creature has made a Saving Throw against your Blade Art, they do
      not need to make that Saving Throw again until the beginning of your next
      Turn.</p></li></ul><table class="NormalTable"><tbody><tr><td
      style="border-left-style:none;border-bottom-style:none;border-right-style:none;border-top-style:none"><p><strong>Damage
      Type(Arts Pool)</strong></p></td><td
      style="border-left-style:none;border-bottom-style:none;border-right-style:none;border-top-style:none"><p><strong>Effect</strong></p></td></tr><tr><td
      style="border-left-style:none;border-bottom-style:none;border-right-style:none;border-top-style:none"><p><span
      class="fontstyle1">Acid (Corrosion)</span></p></td><td
      style="border-left-style:none;border-bottom-style:none;border-right-style:none;border-top-style:none"><p><span
      class="fontstyle1">A Creature that takes Acid Damage from this Cantrip
      takes Acid Damage at the end of their next Turn equal to the Acid Damage
      they took from this Cantrip.</span></p></td></tr><tr><td
      style="border-left-style:none;border-bottom-style:none;border-right-style:none;border-top-style:none"><p><span
      class="fontstyle1">Bludgeoning (Earth)</span></p></td><td><p>Your Reach is
      doubled until the end of the Turn, including for this
      Cantrip.</p></td></tr><tr><td
      style="border-left-style:none;border-bottom-style:none;border-right-style:none;border-top-style:none"><p><span
      class="fontstyle1">Cold (Frost)</span></p></td><td
      style="border-left-style:none;border-bottom-style:none;border-right-style:none;border-top-style:none"><p><span
      class="fontstyle1">A Creature that takes Damage from this Cantrip must
      pass a Constitution Saving Throw against your Martial DC or have its Speed
      halved until the end of its next Turn.</span></p></td></tr><tr><td
      style="border-left-style:none;border-bottom-style:none;border-right-style:none;border-top-style:none"><p><span
      class="fontstyle1">Fire (Flame)</span></p></td><td
      style="border-left-style:none;border-bottom-style:none;border-right-style:none;border-top-style:none"><p><span
      class="fontstyle1">A Creature that takes Damage from this Cantrip must
      pass a Dexterity Saving Throw against your Martial DC or suffer the
      Burning Condition.</span></p></td></tr><tr><td
      style="border-left-style:none;border-bottom-style:none;border-right-style:none;border-top-style:none"><p><span
      class="fontstyle1">Force (Crude)</span></p></td><td
      style="border-left-style:none;border-bottom-style:none;border-right-style:none;border-top-style:none"><p><span
      class="fontstyle1">Your Melee Attacks have a +1 bonus to their Attack and
      Damage Rolls, including for this Cantrip, until the end of your next
      Turn.</span></p></td></tr><tr><td
      style="border-left-style:none;border-bottom-style:none;border-right-style:none;border-top-style:none"><p><span
      class="fontstyle1">Lightning (Electric)</span></p></td><td><p>When you hit
      a Creature with this Cantrip, choose a different Creature you can see
      within 15 feet of the original Creature; that Creature takes Lightning
      Damage equal to half of the Lightning Damage taken by the original
      Creature.</p></td></tr><tr><td
      style="border-left-style:none;border-bottom-style:none;border-right-style:none;border-top-style:none"><p><span
      class="fontstyle1">Piercing (Fluid)</span></p></td><td
      style="border-left-style:none;border-bottom-style:none;border-right-style:none;border-top-style:none"><p><span
      class="fontstyle1">A Creature that takes Damage from this Cantrip must
      succeed a Constitution Saving Throw against your Martial DC, or they
      cannot take Reactions until the end of their next
      Turn.</span></p></td></tr><tr><td
      style="border-left-style:none;border-bottom-style:none;border-right-style:none;border-top-style:none"><p><span
      class="fontstyle1">Psychic (Psychic)</span></p></td><td><p>A Creature that
      takes Damage from this Cantrip loses 1d6 Hit Points.</p></td></tr><tr><td
      style="border-left-style:none;border-bottom-style:none;border-right-style:none;border-top-style:none"><p><span
      class="fontstyle1">Radiant (Light)</span></p></td><td
      style="border-left-style:none;border-bottom-style:none;border-right-style:none;border-top-style:none"><p><span
      class="fontstyle1">When you cast this Cantrip, you can cause Creatures of
      your choice within 10 feet of you to take Radiant Damage equal to your
      Proficiency Bonus.</span></p></td></tr><tr><td
      style="border-left-style:none;border-bottom-style:none;border-right-style:none;border-top-style:none"><p><span
      class="fontstyle1">Slashing (Wind)</span></p></td><td
      style="border-left-style:none;border-bottom-style:none;border-right-style:none;border-top-style:none"><p><span
      class="fontstyle1">A Creature that takes Damage from this Cantrip must
      pass a Constitution Saving Throw against your Martial DC or begin
      Bleeding.</span></p></td></tr><tr><td
      style="border-left-style:none;border-bottom-style:none;border-right-style:none;border-top-style:none"><p><span
      class="fontstyle1">Thunder (Spatial)</span></p></td><td
      style="border-left-style:none;border-bottom-style:none;border-right-style:none;border-top-style:none"><p><span
      class="fontstyle1">A Creature that takes Damage from this Cantrip must
      pass a Strength Saving Throw against your Martial DC or be knocked
      directly away from you 20
      feet.</span></p></td></tr></tbody></table><hr><p><strong>Automated:
      </strong>You will be prompted to choose the appropriate Blade Art at Level
      1 and 10 matching your Spellsword Arts Pool. Many of the functions of
      Blade Art are automated.<br
