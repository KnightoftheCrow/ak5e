  description:
    value: >-
      <p>You weave Art and Armament together with an artist’s
      skill.</p><p><strong>Spellsword Arts:</strong> Choose one of the Standard
      Arts Pools; you learn all levelled Arts from that Arts Pool of 5th Level
      or less. However, you cannot cast these Arts in the usual way; they can
      only be cast by using your Branch Features, and are referred to as
      Spellsword Arts.</p><ul><li><p><strong>Arts Points/Spellsword
      Points:</strong> You do not expend Arts Points to cast Spellsword Arts. To
      cast levelled Arts, you expend Spellsword Points; the Artsblade table
      shows how many Spellsword Points you have to cast your Arts. You regain
      all expended Spellsword Points when you finish a Short or Long
      Rest.</p></li><li><p><strong>Maximum Arts Level:</strong> The Artsblade
      table shows the maximum level you can cast a Spellsword Art at, based on
      your Guard Level. When you cast a Spellsword Art, you must cast it at the
      maximum level you can cast that Art at.</p></li><li><p><strong>Casting
      Spellsword Arts:</strong> When you make a Melee Weapon Attack during your
      Turn, you can expend 1 Spellsword Point to cast a levelled Spellsword Art
      with a Casting Time of Action or Bonus Action as part of that Attack. An
      Art cast in this way is infused into that Attack instead of being cast
      normally; how that Art resolves depends on the Art in question. You can
      only cast a Spellsword Art once per Turn.</p></li></ul><p><strong>Press
      the Attack: Augmented Assault (2 Aggression)</strong> You may use this
      Press the Attack option during your Turn (no Action required) if you have
      not cast a Spellsword Art this Turn. You may cast two Spellsword Arts this
      Turn, but both must be Blade
      Art.</p><table><tbody><tr><td><p><strong>Level</strong></p></td><td><p><strong>Maximum
      Art Level</strong></p></td><td><p><strong>Spellsword
      Points</strong></p></td></tr><tr><td><p>1</p></td><td><p>1</p></td><td><p>1</p></td></tr><tr><td><p>2</p></td><td><p>1</p></td><td><p>1</p></td></tr><tr><td><p>3</p></td><td><p>1</p></td><td><p>1</p></td></tr><tr><td><p>4</p></td><td><p>1</p></td><td><p>1</p></td></tr><tr><td><p>5</p></td><td><p>2</p></td><td><p>1</p></td></tr><tr><td><p>6</p></td><td><p>2</p></td><td><p>1</p></td></tr><tr><td><p>7</p></td><td><p>2</p></td><td><p>2</p></td></tr><tr><td><p>8</p></td><td><p>2</p></td><td><p>2</p></td></tr><tr><td><p>9</p></td><td><p>3</p></td><td><p>2</p></td></tr><tr><td><p>10</p></td><td><p>3</p></td><td><p>2</p></td></tr><tr><td><p>11</p></td><td><p>3</p></td><td><p>2</p></td></tr><tr><td><p>12</p></td><td><p>3</p></td><td><p>2</p></td></tr><tr><td><p>13</p></td><td><p>4</p></td><td><p>2</p></td></tr><tr><td><p>14</p></td><td><p>4</p></td><td><p>3</p></td></tr><tr><td><p>15</p></td><td><p>4</p></td><td><p>3</p></td></tr><tr><td><p>16</p></td><td><p>4</p></td><td><p>3</p></td></tr><tr><td><p>17</p></td><td><p>5</p></td><td><p>3</p></td></tr><tr><td><p>18</p></td><td><p>5</p></td><td><p>3</p></td></tr><tr><td><p>19</p></td><td><p>5</p></td><td><p>3</p></td></tr><tr><td><p>20</p></td><td><p>5</p></td><td><p>3</p></td></tr></tbody></table><hr><p><strong>Semi-Automated:
      </strong>Many aspects of this Feature are impossible to automate and will
      require a player to edit the Arts they learn on their sheets to have them
      resolve as intended. Use the Expend Spellsword Points Activity to give
      yourself any number of Arts Points based on the Scaling you set; this is
      the most convenient way of having Arts cast using Spellsword Points.
      Augmented Assault does not need to be automated, but does expend
      Aggression.</p>
