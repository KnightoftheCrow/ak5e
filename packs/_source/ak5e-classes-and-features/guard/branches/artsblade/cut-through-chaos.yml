  description:
    value: >-
      <p>You can use this Feature in three ways:</p><ul><li><p>When a Creature
      makes a Spell Attack Roll against you, you can make a Melee Attack as a
      Reaction; if the result of your Attack Roll is greater than the Spell
      Attack Roll, that Spell Attack misses you.</p></li><li><p>When you would
      make a Saving Throw against an Art you can see, you can instead make a
      Melee Attack as a Reaction; if the result of your Attack Roll is greater
      than the DC of that Saving Throw, you are considered to have succeeded on
      that Saving Throw.</p></li><li><p>When the conditions are met to cast a
      Spellsword Art you know with a Casting Time of Reaction, you may expend
      your Reaction to cast that Art without expending a Spellsword
      Point.</p></li></ul><p>You can use this Feature a number of times equal to
      your Proficiency Bonus, and regain all expended uses when you complete a
      Long Rest.</p><hr><p><strong>Semi-Automated:</strong> When you are
      targeted by an effect you could use Cut Through Chaos against, you will be
      prompted to make a 0 Damage Melee Attack against yourself. If the trigger
      is a Spell Attack, and you succeed on the roll, choose to grant yourself
      the "Attack Misses" effect, or cancel it if your roll failed. For the
      Saving Throw, if you succeed on the roll, check the Opt-In box when you
      are prompted to roll the Saving Throw; from level 13 onwards, you will
      also be prompted to apply an effect if you pass or fail. The Casting
      Reaction Arts without expending Spellsword Points is not
      automated.<br></p>
    chat: ''
