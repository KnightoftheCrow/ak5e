  description:
    value: >-
      <p>You gain the following benefits:</p><p><strong>Clear Path.</strong>
      When you use your Cut Through Chaos Feature, you take no Damage if you
      succeed on the Saving Throw, and only half Damage if you
      fail.</p><p><strong>Unleash.</strong> When you use your Augmented Assault
      Feature to cast a Spellsword Art that has an area of a cone, cube, sphere,
      or line, the Art affects its normal area instead of only affecting the
      target; you are immune to the Damage of Arts you cast in this way. The Art
      otherwise affects all Creatures in the area as normal. Cubes and Spheres
      are centered on the target Creature; Cones and Lines originate from you
      and must include the target Creature. </p><hr><p><strong>Semi-Automated:
      </strong>Your Cut Through Chaos Feature is upgraded; Unleash cannot be
      automated.<br></p>
