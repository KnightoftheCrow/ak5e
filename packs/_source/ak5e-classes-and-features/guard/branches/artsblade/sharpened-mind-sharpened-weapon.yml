      style="border-left-style:none;border-bottom-style:none;border-right-style:none;border-top-style:none"><p><span
      class="fontstyle1">Instead of a Saving Throw, a Creature that takes Damage
      from this Cantrip suffers the Bleeding
      Condition.</span></p></td></tr><tr><td
      style="border-left-style:none;border-bottom-style:none;border-right-style:none;border-top-style:none"><p><span
      class="fontstyle1">Thunder (Spatial)</span></p></td><td
      style="border-left-style:none;border-bottom-style:none;border-right-style:none;border-top-style:none"><p><span
      class="fontstyle1">If a Creature knocked back by this Cantrip collides
