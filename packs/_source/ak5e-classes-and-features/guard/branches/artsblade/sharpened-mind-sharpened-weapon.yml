  description:
    value: >-
      <p>You gain the following benefits:</p><ul><li><p><strong>Additional Arts
      Pools.</strong> Choose two Standard Arts Pools other than the one you
      selected for your Sword and Sorcery Feature. You learn all levelled Arts
      from that Arts Pool of 3rd Level or less. These are Spellsword Arts, and
      are subject to the same restrictions.</p></li><li><p><strong>Improved
      Resonance.</strong> Your Resonance Feature is improved:
      </p></li></ul><table class="NormalTable"><tbody><tr><td
      style="border-left-style:none;border-bottom-style:none;border-right-style:none;border-top-style:none"><p><span
      class="fontstyle0"><strong>Damage Type (Arts
      Pool)</strong></span></p></td><td
      style="border-left-style:none;border-bottom-style:none;border-right-style:none;border-top-style:none"><p><span
      class="fontstyle0"><strong>Effect</strong></span></p></td></tr><tr><td
      style="border-left-style:none;border-bottom-style:none;border-right-style:none;border-top-style:none"><p><span
      class="fontstyle1">Acid (Corrosion)</span></p></td><td
      style="border-left-style:none;border-bottom-style:none;border-right-style:none;border-top-style:none"><p><span
      class="fontstyle1">A Creature that takes Acid Damage from this Cantrip
      suffers the Corroded Condition until the end of their next
      Turn.</span></p></td></tr><tr><td
      style="border-left-style:none;border-bottom-style:none;border-right-style:none;border-top-style:none"><p><span
      class="fontstyle1">Bludgeoning (Earth)</span></p></td><td
      style="border-left-style:none;border-bottom-style:none;border-right-style:none;border-top-style:none"><p><span
      class="fontstyle1">Creatures that take Damage from this Cantrip, or are
      hit by a Melee Attack from you while your Reach is increased by the effect
      of this Cantrip, must succeed on a Strength Saving Throw against your
      Spell Save DC or be knocked Prone.</span></p></td></tr><tr><td
      style="border-left-style:none;border-bottom-style:none;border-right-style:none;border-top-style:none"><p><span
      class="fontstyle1">Cold (Frost)</span></p></td><td
      style="border-left-style:none;border-bottom-style:none;border-right-style:none;border-top-style:none"><p><span
      class="fontstyle1">A Creature that fails the Saving Throw against this Art
      has Disadvantage on their Attack Rolls until the end of their next
      Turn.</span></p></td></tr><tr><td
      style="border-left-style:none;border-bottom-style:none;border-right-style:none;border-top-style:none"><p><span
      class="fontstyle1">Fire (Flame)</span></p></td><td
      style="border-left-style:none;border-bottom-style:none;border-right-style:none;border-top-style:none"><p><span
      class="fontstyle1">After you have cast this Art, your Melee Weapon Attacks
      deal 1d10 additional Fire Damage until the end of your next
      Turn.</span></p></td></tr><tr><td
      style="border-left-style:none;border-bottom-style:none;border-right-style:none;border-top-style:none"><p><span
      class="fontstyle1">Force (Crude)</span></p></td><td
      style="border-left-style:none;border-bottom-style:none;border-right-style:none;border-top-style:none"><p><span
      class="fontstyle1">The bonus to Attack Rolls and Damage Rolls is increased
      to +3.</span></p></td></tr><tr><td
      style="border-left-style:none;border-bottom-style:none;border-right-style:none;border-top-style:none"><p><span
      class="fontstyle1">Lightning (Electric)</span></p></td><td
      style="border-left-style:none;border-bottom-style:none;border-right-style:none;border-top-style:none"><p><span
      class="fontstyle1">When you hit a Creature with this Cantrip, you may
      choose up to two different Creatures you can see within 15 feet instead of
      one.</span></p></td></tr><tr><td
      style="border-left-style:none;border-bottom-style:none;border-right-style:none;border-top-style:none"><p><span
      class="fontstyle1">Piercing (Fluid)</span></p></td><td
      style="border-left-style:none;border-bottom-style:none;border-right-style:none;border-top-style:none"><p><span
      class="fontstyle1">A Creature that fails the Saving Throw can only take an
      Action or a Bonus Action during their next Turn, not
      both.</span></p></td></tr><tr><td
      style="border-left-style:none;border-bottom-style:none;border-right-style:none;border-top-style:none"><p><span
      class="fontstyle1">Psychic (Psychic)</span></p></td><td><p>A Creature that
      takes Damage from this Cantrip instead loses 2d6 Hit
      Points.</p></td></tr><tr><td
      style="border-left-style:none;border-bottom-style:none;border-right-style:none;border-top-style:none"><p><span
      class="fontstyle1">Radiant (Light)</span></p></td><td
      style="border-left-style:none;border-bottom-style:none;border-right-style:none;border-top-style:none"><p><span
      class="fontstyle1">The radius of this effect is
      doubled.</span></p></td></tr><tr><td
      style="border-left-style:none;border-bottom-style:none;border-right-style:none;border-top-style:none"><p><span
