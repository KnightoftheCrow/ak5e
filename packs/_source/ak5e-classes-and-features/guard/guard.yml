  description:
    value: >-
      <p>In water-logged Siracusa, a Lupo leaps into the fray alongside her
      fellow mafioso, a blade in each hand as she strikes at foes near and far.
      Ostensibly, their fight is for honour, but she cares not.</p><p>In
      rime-bound Sami, a Sarkaz’s Arts infused blade dispels demons with every
      swipe, burning corruption from the land. Every strike brings her closer to
      her truth.</p><p>In glittering Kazimierz, two Knights cross blades to the
      cheers of thousands. Each feels a palpable disdain for the fight, but they
      cannot, will not, back down.</p><p>Each of these people, heroes and
      villains both, are Guards; masters of the martial, the cut and thrust of
      close quarters combat. What is it that they guard; a way of life, their
      pride, an ideal? Only they know, but one thing is certain- they will fight
      for it until their very last breath.</p><h3>Born For Battle</h3><p>To be a
      Guard is to be sword and shield both. In the world of Terra, a world where
      brutal melee is commonplace amongst conflict both local and international,
      versatile fighters are an essential component of any fighting force, large
      or small. A Defender may hold the line, but it is the Guard who will push
      back the foe. A Marksman may strike down hordes of enemies at range, but
      it is the Guard who will seize the position. No matter what comes over the
      horizon- rebels, terrorists, monsters, demons, or worse- a Guard is
      ready.</p><h3>Guard Traits</h3><table><tbody><tr><td
      data-colwidth="142"><p style="text-align:center"><strong>Primary
      Ability</strong></p></td><td><p>Strength or Dexterity</p></td></tr><tr><td
      data-colwidth="142"><p style="text-align:center"><strong>Hit Point
      Die</strong></p></td><td><p>D10</p></td></tr><tr><td
      data-colwidth="142"><p style="text-align:center"><strong>Saving Throw
      Proficiencies</strong></p></td><td><p>Strength + one of your choice from
      the following: Constitution, Dexterity</p></td></tr><tr><td
      data-colwidth="142"><p style="text-align:center"><strong>Skill
      Proficiencies</strong></p></td><td><p>Three from: Acrobatics, Athletics,
      Lore, Insight, Intimidation, Wilderness</p></td></tr><tr><td
      data-colwidth="142"><p style="text-align:center"><strong>Weapon
      Proficiencies</strong></p></td><td><p>All Melee
      Weapons</p></td></tr><tr><td data-colwidth="142"><p
      style="text-align:center"><strong>Tool
      Proficiencies</strong></p></td><td><p>Maintenance Kit</p></td></tr><tr><td
      data-colwidth="142"><p style="text-align:center"><strong>Armor
      Training</strong></p></td><td><p>Light Armour, Medium Armour, Light
      Shields</p></td></tr><tr><td data-colwidth="142"><p
      style="text-align:center"><strong>Starting
      Equipment</strong></p></td><td><p>You start with the following Equipment,
      in addition to any Equipment granted by your Background.</p><ul><li><p>(A)
      1x Heavy Melee Weapon OR (B) 1x Light Melee Weapon</p></li><li><p>(A) 1x
      Light Melee Weapon OR (B) 1x Light Shield</p></li><li><p>(A) Reinforced
      Outfit OR (B) Combat Gear</p></li><li><p>One Kit you are Proficient
      with.</p></li></ul><p>OR</p><ul><li><p>1300
      LMD</p></li></ul></td></tr></tbody></table>
