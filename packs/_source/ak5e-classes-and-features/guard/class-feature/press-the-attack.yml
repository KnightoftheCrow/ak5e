  description:
    value: >-
      <p><span class="fontstyle0">As a Guard, you are the mainstay in any
      assault. Others defend, others facilitate, you push onwards. You gain
      access to special Press the Attack options, and gain additional ones from
      your Branch, that are fuelled by your Aggression.</span></p><h3><span
      style="text-decoration:underline"><span
      style="text-decoration:underline">Aggression</span></span></h3><p><span
      class="fontstyle0">You have 4 Aggression, which you expend to use Press
      the Attack options. You recover all expended Aggression when you complete
      a Short or Long Rest.</span></p><p><span class="fontstyle0">You gain 2
      additional Aggression at 7th Level (total of 6), and at 14th Level (total
      of 8).</span></p><p><span class="fontstyle0"><strong>Expending
      Aggression:</strong> Each Press the Attack option dictates the
      circumstances in which you can use it, and how much Aggression is required
      to use it. Some options allow you to spend more than the minimum
      Aggression to amplify the effects.</span></p><h4><span
      class="fontstyle0">Press the Attack: Forestall</span></h4><p><span
      class="fontstyle0">(1-3 Aggression) You can use this Press the Attack
      Option as a Reaction when you are hit by an Attack; for each Aggression
      you expend, your Armour Class is increased by a value equal to your
      Proficiency Bonus against the triggering Attack, possibly causing it to
      miss.</span></p><h4><span class="fontstyle0">Press the Attack:
      Smite</span></h4><p><span class="fontstyle0">(1-3 Aggression) You can use
      this Press the Attack Option when you hit with an Attack (no Action
      required); for each Aggression you expend, that Attack deals additional
      Damage equal to your Proficiency Bonus.</span></p><h4><span
      class="fontstyle0">Press the Attack: Strike True</span></h4><p><span
      class="fontstyle0">(1-3 Aggression) You can use this Press the Attack
      Option when you make an Attack Roll (no Action required); for each
      Aggression you expend, you gain a bonus to that Attack Roll equal to your
      Proficiency Bonus.</span> </p><p></p><p><strong>Semi-Automated:
      </strong>Forestall works at the moment it should; Smite and Strike True
      must be used before making their respective affected rolls.<br
      style="font-style:normal;font-variant:normal;font-weight:normal;letter-spacing:normal;line-height:normal;orphans:2;text-align:-webkit-auto;text-indent:0px;text-transform:none;white-space:normal;widows:2;word-spacing:0px;-webkit-text-size-adjust:auto;-webkit-text-stroke-width:0px"></p>
