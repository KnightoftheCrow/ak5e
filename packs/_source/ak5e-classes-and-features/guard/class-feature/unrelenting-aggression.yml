  description:
    value: >-
      <p><span class="fontstyle0">You gain the following Press the Attack
      option:</span></p><p><span class="fontstyle0"><strong>Press the Attack:
      Unrelenting Aggression (2 Aggression)</strong> You can use this Press the
      Attack Action as a Reaction when you miss a Creature with a Melee Attack;
      roll the Damage for that Attack, but do not add your Ability Score
      Modifier to the result. The Creature takes Damage equal to the amount
      rolled.</span></p><hr><p><strong>Cannot be Automated: </strong>The
      Activity on this Feature is just for expending Menace.<br
