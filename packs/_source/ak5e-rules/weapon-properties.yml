  - sort: 2300000
    name: Splash (X)
    type: rule
    _id: Ln2Qi7lbQKQbeoVc
    system:
      tooltip: ''
      type: rule
    title:
      show: true
      level: 1
    image: {}
    text:
      format: 1
      content: >-
        <p>You do not make Attack Rolls when attacking using a weapon with this
        Property. Instead, choose a point within the weapon’s range; all
        Creatures within X feet of that Point must make a Dexterity Saving Throw
        against your Martial DC, suffering the weapon’s normal Damage plus the
        Ability Score Modifier you used to determine your Martial DC on a failed
        Save, or half that amount on a successful Save. If you are not
        Proficient with the weapon, Creatures automatically pass this Saving
        Throw (even Normal Creatures).</p>
    video:
      controls: true
