  - sort: 2100000
    name: Rapid Fire
    type: rule
    _id: NvXIDkmhp3hM277E
    system:
      tooltip: ''
      type: rule
    title:
      show: true
      level: 1
    image: {}
    text:
      format: 1
      content: >-
        <p>If you have attacked with a weapon with this Property this Turn, you
        may make an additional Attack with that weapon as a Bonus Action.
        However, you do not add your Ability Modifier to the Damage Roll for
        Attacks you make using this Property.</p><blockquote><p><strong>Rapid
        Fire and Two-Weapon Fighting</strong></p><p>If you would perform
        Two-Weapon Fighting using two weapons with the Rapid Fire Property, the
        Bonus Action Attack you make as part of Two-Weapon Fighting is made at
        Advantage. That Attack is considered to be an Attack using the Rapid
        Fire Property in addition to a Two-Weapon Fighting Attack. If you have
        multiple Fighting Styles that would allow you to add your Ability
        Modifier to that Attack, you may apply one to that
        Attack.</p></blockquote>
    video:
      controls: true
