  description:
    value: >-
      <p>You gain the Anti-Arts Training Feature of the Caster Class; you may
      cast each Art you gain from this Feature once without expending Arts
      Points. You regain the ability to cast in this way when you complete a
      Long Rest. If you do not already have a Spellcasting Ability, Intelligence
      is your Spellcasting Ability for these Arts.</p><p><strong>Module
      Effect:</strong> When you cast the Counterspell Art, your Spellcasting
      Ability is treated as being 2 higher.</p><hr><p><strong>Semi-Automated:
      </strong>You are granted the appropriate Arts, and can cast them for free
      1/LR using this Feature. The Module Effect cannot be Automated.</p>
