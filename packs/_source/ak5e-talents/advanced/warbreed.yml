  description:
    value: >-
      <p>When an enemy within 15 feet of you is reduced to 0 Hit Points, you may
      expend 1 Hit Die to roll that die and recover Hit Points equal to the
      amount rolled + your Constitution Modifier.</p><p><strong>Module Effect:
      </strong>Once per Short Rest, you may use this Feature without expending a
      Hit Dice.</p><hr><p><strong>Semi-Automated: </strong>The Activites on this
      Feature do not check for the proximity of a dead Creature. Additionally,
      upon hitting level 13 there will be an Activity for the Module Effect;
      ignore it if you do not have the Module.</p>
