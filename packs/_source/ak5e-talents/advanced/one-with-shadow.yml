  description:
    value: >-
      <p>When a Creature makes an Attack against you, and doesn’t have Advantage
      on the Attack Roll, you can use your Reaction to give that Attack Roll
      Disadvantage. You can use this Feature a number of times equal to your
      Proficiency Bonus, and regain all expended uses when you complete a Long
      Rest.</p><p><strong>Module Effect:</strong> You can now use this Feature
      even when the Attack has Advantage.</p><hr><p><strong>Semi-Automated:
      </strong>Creatures that Attack you will have an Opt-In when they roll the
      attack that gives that Attack Disadvantage and costs one use of this
      Feature. The DM should ask you if you want to use this Feature at this
      juncture.</p>
