    value: >-
      <p>While your current Hit Points and Maximum Hit Points are the same, you
      may add your Proficiency Bonus to all Attack Rolls you make. If you are
      already adding your Proficiency Modifier, double your Proficiency Bonus
      for those Attacks instead.</p><p><strong>Module:</strong> While your
      current Hit Points and Maximum Hit Points are the same, you have +5 Bonus
      to Initiative Rolls, and your Speed is increased by
