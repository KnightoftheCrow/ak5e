  description:
    value: >-
      <p>When you would be reduced to 0 Hit Points but not killed outright, you
      are instead reduced to 1 Hit Point, and gain Temporary Hit Points equal to
      your Constitution Score. Once you have used this Feature, you may not do
      so again until you have finished a Long
      Rest.</p><p><strong>Module:</strong> The amount of Temporary Hit Points
      you gain from this Feature is doubled.</p><hr><p><strong>Semi-Automated:
      </strong>The activity on this Feature will grant you the Temp HP. The
      module effect will unlock at reaching level 13, don't use it unless you
      have the module.</p>
