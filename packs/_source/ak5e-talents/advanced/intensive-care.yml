  description:
    value: >-
      <p>As a Long Rest Activity, you can provide deep care for a Creature that
      has any failed Death Saving Throws. When they complete that Long Rest,
      they remove all failed Death Saving Throws.</p><p><strong>Module Effect:
      </strong>In addition, that Creature can gain Temporary Hit Points equal to
      your Character Level.</p><hr><p><strong>Semi Automated: </strong>The
      removal of Death Saving Throws does not need to be automated; the activity
      is just for prompting. The Module Activity grants the Temp HP.</p>
