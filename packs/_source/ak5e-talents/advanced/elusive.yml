  description:
    value: >-
      <p>If a Creature you can see makes an Attack Roll against you with
      Advantage, you can use your Reaction to remove the Advantage from that
      Attack Roll. You may use this Feature a number of times equal to your
      Proficiency Bonus, and regain all expended uses when you complete a Long
      Rest.</p><p><strong>Module Effect: </strong>Creatures that you can see can
      never have Advantage on Attacks against you unless you are
      Incapacitated.</p><hr><p><strong>Automated: </strong>Creatures that Attack
      you have an Opt-In if they have Advantage; you need to tell the DM when
      you want to use this Feature so they can choose the Opt-In.</p>
