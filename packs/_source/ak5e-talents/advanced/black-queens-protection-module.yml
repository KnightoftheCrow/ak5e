    value: >-
      <p><strong>Module Effect: </strong>The Damage Reduction is no longer lost
      after they take Physical Damage.</p><hr><p>Semi-Automated: <strong>You
      must manually trigger the activity on this item, but the damage</strong>
      reduction is automatic. However, the effect will be removed when the
      Creature takes ANY damage, not just Physical Damage. Use the module
