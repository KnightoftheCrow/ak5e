  description:
    value: >-
      <p>As an Action, you can place a Shadow Sentry for 1 hour at a point
      within 10 feet of you. A Shadow Sentry is an invisible, intangible Arts
      Construct that cannot move or take any Actions. When a Creature moves
      within 10 feet of the Sentry, you are alerted to that movement, even if
      the Creature is Invisible or you are asleep. Once you have used this
      Feature, you may not do so again until you have completed a Long
      Rest.</p><p><strong>Module Effect: </strong>When you have been alerted to
      a Creature by your Shadow Sentry, you know the location of that Creature
      for the next minute.</p><hr><p><strong>Automated: </strong>The Activity on
      this Feature places an Invisible Shadow Sentry with 10ft of Truesight.</p>
    chat: ''
