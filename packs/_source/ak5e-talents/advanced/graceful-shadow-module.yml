    value: >-
      <p><strong>Module Effect:</strong> When you take the Dodge Action, the
      first time before your next Turn that you would take Damage from a hostile
      Creature, that Damage is halved.</p><hr><p><strong>Automated: </strong>The
      basic effect of this Talent cannot be Automated, but the Module Effect is.
      When you would use the Dodge Action, use the Activity on the Module as
