  description:
    value: >-
      <p>When an allied Creature (except yourself) within 30 feet that you can
      see makes an Attack Roll, you can expend your Reaction to allow that
      Creature to reroll that Attack Roll. You may use this Feature a number of
      times equal to your Proficiency Bonus, and regain all expended uses when
      you complete a Short or Long Rest.</p><p><strong>Module Effect:</strong>
      When you use this Feature, that Creature gains Advantage on the Attack
      Roll they reroll.</p><hr><p><strong>Semi-Automated: </strong>The base
      version of this Feature is just for tracking purposes. The Activity on the
      Module version of this Feature provides Advantage on the next Attack Roll
      made by that Creature.</p>
