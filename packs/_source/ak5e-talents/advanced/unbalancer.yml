  advancement: {}
  description:
    value: >-
      <p>When you forcibly move a hostile Creature, that Creature must succeed
      on a Strength Saving Throw against your Martial DC or their Speed is
      reduced by 10 feet until the end of their next Turn. A Creature can only
      have their Speed reduced in this way once per Round.</p><p><strong>Module
      Effect:</strong> The reduction to the affected Creature’s Speed is now
      equal to 10 feet, or half the distance they were moved, which ever is
      greater.</p><hr><p><strong>Semi-Automated: </strong>Use the Activity on
      this Feature, or the module if you have it, when you move a Creature. For
      the module version, set the scaling value to the distance they were moved,
      and choose the effect that is the greater value when prompted.</p>
    chat: ''
