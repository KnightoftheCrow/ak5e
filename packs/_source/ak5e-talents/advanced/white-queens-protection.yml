  description:
    value: >-
      <p>When you restore 10 or more Hit Points to a Creature in a single Turn,
      that Creature gains Resistance against Arts Damage. This Resistance is
      lost after they take Arts Damage, or at the end of their next
      Turn.</p><p><strong>Module Effect: </strong>The Damage Reduction is no
      longer lost after they take Arts Damage.</p><hr><p><strong>Semi-Automated:
      </strong>You must manually trigger the activity on this item, but the
      resistance is automatic. However, the effect will be removed when the
      Creature takes ANY damage, not just Arts Damage. Use the module version if
      you have it.</p>
