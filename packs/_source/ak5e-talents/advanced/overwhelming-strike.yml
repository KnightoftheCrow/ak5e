  description:
    value: >-
      <p>When you roll a 20 on the d20 for an Attack Roll, you can deal
      additional Damage to the target equal to half of the Ability Score used
      for that Attack. The Damage Type is the same as one present on that Attack
      (your Choice, if there are multiple).</p><p><strong>Module
      Effect:</strong> The additional Damage becomes equal to the Ability Score
      used for that Attack.</p><hr><p><strong>Automated.</strong></p>
