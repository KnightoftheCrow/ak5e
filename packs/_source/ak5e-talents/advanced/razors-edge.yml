  description:
    value: >-
      <p>While you are Dying, the first Struggle Attack you make each Turn costs
      1 less Mettle (to a minimum of 0). Additionally, the Mettle Cost of the
      Stabilise Death’s Door Action is reduced by 1 for you for each time you
      deal Damage while Dying. This reduction is lost when you are no longer
      Dying.</p><p><strong>Module Effect:</strong> While you are Dying, your
      Attacks deal additional Weapon Damage equal to your Proficiency
      Bonus.</p><hr><p><strong>Semi-Automated: </strong>The basic effect of this
      talent cannot be automated. The Module Effect will provide an Opt-In
      component when rolling Attack Damage if your HP is &lt;25%.</p>
