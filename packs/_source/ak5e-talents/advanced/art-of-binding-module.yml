    value: >-
      <p><strong>Module Effect:</strong> This Feature can now be used without
      using your Reaction, and can be performed whenever a Creature whose Speed
      has been reduced by you takes Damage. However, once a Creature has taken
      this additional Damage, it cannot take it again until the beginning of
      your next Turn.</p><hr><p><strong>Semi-Automated: </strong>Use the
      Activity on this Feature, or the Module if you have it.</p>
