  advancement: {}
  description:
    value: >-
      <p>When you hit a Creature that has Physical Damage Reduction with an
      Attack, you steal 1 of their Damage Reduction, reducing their Damage
      Reduction by 1 and increasing yours by 1. At the end of your Turn, if you
      have not hit a Creature with an Attack, you lose any Damage Reduction you
      gained from this Feature, and it is returned to the Creatures you stole it
      from.</p><p><strong>Module Effect:</strong> The amount of Damage Reduction
      you steal when you hit a Creature with an Attack is increased to
      2.</p><hr><p><strong>Semi-Automated: </strong>Use the Activity on this
      Feature (or the Module if you have it) to Steal the DR and gain it for
      yourself. The removal of the DR upon not hitting with an Attack is not
      automated.</p>
