  description:
    value: >-
      <p>When your Hit Points are reduced to lower than half of their maximum,
      you may activate this Feature as a Reaction. For 1 minute, your AC is
      increased by a value equal to your Proficiency Bonus, and you recover 1d8
      missing Hit Points at the beginning of your Turn. This Hit Point
      restoration cannot restore you to more than half of your maximum Hit
      Points. Once you have used this Feature, you may not do so again until you
      have completed a Long Rest.</p><p><strong>Module Effect: </strong>The Hit
      Point recovery is increased to 2d8.</p><hr><p><strong>Semi-Automated:
      </strong>The Hit Point gain does not stop at half HP.</p>
