  description:
    value: >-
      <p>You have Damage Resistance against all Damage equal to your Proficiency
      Bonus when that Damage comes from an Elite or Leader
      Creature.</p><p><strong>Module:</strong> Your Attacks against Elite or
      Leader Creatures deal an additional 1d8 Force
      Damage.</p><hr><p><strong>Automated: </strong>This Feature looks for the
      Elite Creature or Leader Creature item found in the Bestiary on the
      Creature rolling Damage. If it is not there, this Feature will not
      work.</p>
