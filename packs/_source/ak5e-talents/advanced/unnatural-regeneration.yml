    value: >-
      <p><span class="fontstyle0">Once per Long Rest, as a Reaction when you
      take Damage, you may activate this Ability. For the next minute, at the
      beginning of each of your Turns, you recover Hit Points equal to your
      Proficiency Bonus.</span></p><p><strong>Module Effect: </strong>The amount
      of Hit Points restored is equal to twice your Proficiency Bonus
