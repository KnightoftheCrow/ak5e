  description:
    value: >-
      <p>When you reduce a Creature to 0 Hit Points, or a Creature you damaged
      on your last Turn is reduced to 0 Hit Points, you may reroll the result of
      the next Saving Throw you fail. This bonus is lost after completing a
      Short or Long Rest.</p><p><strong>Module Effect: </strong>If you still
      fail a Saving Throw after rerolling it with this Feature, you do not gain
      any Conditions as a result. You still suffer any other effects or
      Damage.</p><hr><p><strong>Semi-Automated: </strong>The base effect is
      automated, the Module effect is not.</p>
    chat: ''
