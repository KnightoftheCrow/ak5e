  advancement: {}
  description:
    value: >-
      <p>When you restore 10 or more Hit Points to a Creature in a single Turn,
      that Creature gains Damage Reduction against Physical Damage equal to your
      Proficiency Bonus. This Damage Reduction is lost after they take Physical
      Damage, or at the end of their next Turn.</p><p><strong>Module Effect:
      </strong>The Damage Reduction is no longer lost after they take Physical
      Damage.</p><hr><p><strong>Semi-Automated: </strong>You must manually
      trigger the activity on this item, but the damage reduction is automatic.
      However, the effect will be removed when the Creature takes ANY damage,
      not just Physical Damage.</p>
