  description:
    value: >-
      <p>The first time you deal Damage to a Creature with an Attack, that
      Attack deals 1d12 additional Weapon Damage. It is considered to be the
      first time you hit a Creature if you have rolled Initiative since the last
      time you hit them with an Attack.</p><p><strong>Module:</strong> The
      additional Damage becomes 2d12.</p><hr><p><strong>Semi-Automated:
      </strong>There is a Opt-In Component when rolling Damage; use it when
      Alpha Strike is applicable.</p>
