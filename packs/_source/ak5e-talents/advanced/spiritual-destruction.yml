  description:
    value: >-
      <p>As a Bonus Action, you can cause your next Attack to Silence Creatures
      hit by it until the end of their next Turn. You may use this Ability a
      number of times equal to your Proficiency Bonus, and regain all uses upon
      finishing a Long Rest.</p><p><strong>Module Effect:</strong> If a Creature
      Silenced by you is concentrating on any Art, its Concentration immediately
      ends. Additionally, if they have any Ability that triggers upon their
      death or reaching 0 Hit Points, they do not activate if they are Silenced
      by this Feature at the time (except
      Leaders).</p><hr><p><strong>Semi-Automated: </strong>Use the Activity on
      this Feature to apply the Silence. The Module Effect cannot be
      automated.</p>
