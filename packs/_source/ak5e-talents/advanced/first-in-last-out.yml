  description:
    value: >-
      <p>When a Creature misses you with a Melee Attack, until the end of your
      next Turn, your Attacks against that Creature are made at
      Advantage.</p><p><strong>Module Effect:</strong> When a Creature misses
      you with a Melee Attack, until the end of your next Turn, when you take
      the Attack Action, you may make one additional Attack as part of that
      Action; this effect is not cumulative.</p><hr><p><strong>Semi-Automated:
      </strong>You have an Opt-In effect when you roll Attacks; use it when
      appropriate.</p>
