  description:
    value: >-
      <p>When you make an Attack with a Knife, you can choose to take a -5
      Penalty to that Attack Roll. If you do, that Attack ignores any Damage
      Reduction on the target of that Attack.</p><p><strong>Module
      Effect:</strong> Additionally, that Attack ignores Resistance to Physical
      Damage.</p><hr><p><strong>Semi-Automated: </strong>There is an Opt-In
      available to take the -5 to Hit whenever you make an Attack with a weapon
      that has a Knife as its Base Item. However, ignoring Resistance and DR is
      not automated.</p>
