  description:
    value: >-
      <p>During your Turn, you have Advantage on your first Ranged Attack
      against each Creature that has had a Ranged Attack made against it by
      another Creature since the end of your last Turn.</p><p><strong>Module
      Effect:</strong> Your Ranged Attacks now have Advantage against Creatures
      that have had a Ranged Attack made against them by another Creature since
      the end of your last Turn.</p><hr><p><strong>Semi-Automated:
      </strong>There are opt-in's available for Ranged Attacks to give them
      Advantage. Use them when appropriate.</p>
