  description:
    value: >-
      <p>When you deal Necrotic Damage, you can force one of the Creatures you
      Damaged (your choice) to make a Constitution Saving Throw against your
      Spell Save DC. On a failed Save, they are Poisoned until the end of their
      next Turn. On a successful Save, nothing happens. You can use this Feature
      a number of times equal to your Proficiency Bonus, and regain all expended
      uses when you complete a Long Rest.</p><p><strong>Module Effect:
      </strong>When a Creature gains the Poisoned Condition as a result of this
      Feature, they also gain the Necrotised Condition for the same
      duration.</p><hr><p><strong>Partially Automated: </strong>Use the Activity
      on this Item to apply the Save and Condition on a fail. Use the version on
      the module to apply the enhanced version.</p>
