  description:
    value: >-
      <p>When a Creature whose Speed has been reduced by you takes Damage, you
      can expend your Reaction to cause that Creature to take additional Damage
      equal to one roll of your Aid Die.</p><p><strong>Module:</strong> This
      Feature can now be used without using your Reaction, and can be performed
      whenever a Creature whose Speed has been reduced by you takes Damage.
      However, once a Creature has taken this additional Damage, it cannot take
      it again until the beginning of your next Turn.</p><p><strong>Not
      Automated.</strong></p>
