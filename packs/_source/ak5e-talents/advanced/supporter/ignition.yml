  description:
    value: >-
      <p>When you cast an Art using Arts Points, you can use this Feature as a
      Reaction. Until the beginning of your next Turn, allied Creatures within
      15 feet of you deal additional Force Damage with their Attacks and Arts
      equal to the amount of Arts Points expended to cast that Art. Once you
      have used this Feature, you may not do so again until you have finished a
      Long Rest.</p><p><strong>Module:</strong> You can now use this Feature
      twice, and regain all expended uses when you complete a Long
      Rest.</p><p><strong>Not Automated.</strong></p>
