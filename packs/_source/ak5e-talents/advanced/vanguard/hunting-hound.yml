  description:
    value: >-
      <p>Once per Short Rest, when you hit a Creature with an Attack, you can
      mark them as your Hunt Target. For 1 minute, whenever you hit that
      Creature with an Attack, they take 1d6 additional Force
      Damage.</p><p><strong>Module:</strong> While they are marked as your Hunt
      Target, that Creature cannot benefit from the Invisible Condition, and you
      always know where they are.</p>
