  description:
    value: >-
      <p>Once per Turn, when you deal Damage as a result of an Attack, you can
      roll the Damage for that Attack twice and choose which of the results you
      want.</p><p><strong>Module Effect:</strong> When you use this Feature,
      that Attack deals additional Damage equal to your Proficiency
      Bonus.</p><hr><p><strong>Automated: </strong>There is an Opt-In Effect to
      roll Damage with Advantage. With the Module, you deal additional Damage
      when you do this.</p>
