  description:
    value: >-
      <p>When an allied Creature within 30 feet that can see or hear you would
      take Damage from an environmental source (such as fire, falling, or a
      trap), you can use your Reaction to halve the Damage you and that Creature
      take from that instance of Damage.</p><p><strong>Module Effect:</strong>
      If an allied Creature within 30 feet of you, that can see or hear you,
      would take 15 or less Damage from an environmental source, they instead
      take no Damage.</p><hr><p><strong>Automation not possible.</strong></p>
