  description:
    value: >-
      <p>If you have not taken any Damage since the start of your last Turn,
      when you deal Damage to a Creature you can deal 1d8 additional Damage to
      that Creature; you can only deal this additional Damage once per
      Turn.</p><p><strong>Module Effect:</strong> If you have not taken any
      Damage since the start of your last Turn, you treat any result of a 1 or 2
      you roll on a Damage die as a 3.</p><hr><p><strong>Semi-Automated:
      </strong>Both basic and module effects are opt in selections when rolling
      Damage; use them if the conditions are met.</p>
