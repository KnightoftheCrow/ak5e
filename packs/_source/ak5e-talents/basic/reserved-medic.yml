  description:
    value: >-
      <p>If you did not restore Hit Points to a Creature during your last Turn,
      the first time during your Turn that you roll to determine the amount of
      Hit Points you restore to a Creature, you may roll 1 additional die and
      add it to the total amount.</p><p><strong>Module Effect: </strong>If the
      Creature you restored Hit Points to on your last Turn was yourself, you
      are not considered to have restored Hit Points for the purposes of this
      Feature.</p><hr><p><strong>Semi-Automated: </strong>There is an Opt-In
      Effect when you roll dice to heal.</p>
