  description:
    value: >-
      <p>When an allied Creature within 30 feet that can see or hear you would
      take Damage from an environmental source (such as fire, falling, or a
      trap), you can use your Reaction to roll 1d8 and reduce the Damage they
      take from that source by the amount rolled multiplied by your Proficiency
      Bonus.</p><p><strong>Module:</strong> When an allied Creature within 30
      feet that can see or hear you would take Damage from an environmental
      source, you can use your Reaction to make that Creature take half Damage
      from that instance of Damage.</p><p><strong>Not automated.</strong></p>
