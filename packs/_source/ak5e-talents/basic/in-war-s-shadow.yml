  description:
    value: >-
      <p><span class="fontstyle0">Once per Turn, when a Creature you can see
      hits another Creature within 10ft of you with an Attack Roll, you canuse
      your Reaction to halve the Attack’s Damage against that Creature. However,
      if you do, you take the same amount of Damage.</span></p><p><strong>Module
      Effect: </strong>You can now also use this Feature when another Creature
      within 10ft of you would make a Saving Throw against an effect you can
      see. Damage that Creature would take as a result of that Saving Throw is
      halved, but you take the same amount of
      Damage.</p><hr><p><strong>Semi-Automated: </strong>You must manually
      trigger this Reaction when appropriate; it will cause the Creature to take
      half damage from the next Damage they would take.</p>
