  description:
    value: >-
      <p>When you restore 5 or more Hit Points in a single instance to a
      Creature with 50 or more maximum Hit Points, the amount of Hit Points you
      restore is increased by your Spellcasting Ability
      Modifier.</p><p><strong>Module Effect: </strong>When you restore 5 or more
      Hit Points in a single instance to a Creature with 100 or more maximum Hit
      Points, the amount of Hit Points you restore is additionally increased by
      your Proficiency Bonus. If you are already adding your Proficiency Bonus,
      your Proficiency Bonus is doubled for that instance
      instead.</p><hr><p><strong>Partially Automated: </strong>There is an AC5e
      Opt-In Prompt for all stages of this Talent.</p>
