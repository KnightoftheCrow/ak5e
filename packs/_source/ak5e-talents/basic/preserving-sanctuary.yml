  advancement: {}
  description:
    value: >-
      <p>When a Creature within 30 feet of you that you can see, and has more
      than half of their maximum Hit Points remaining, would take Damage; you
      can use your Reaction to grant them Damage Reduction against all Damage
      equal to your Proficiency Bonus. This Damage Reduction is lost immediately
      after they take the triggering Damage. You may use this Feature a number
      of times equal to your Proficiency Bonus, and regain all expended uses
      when you complete a Long Rest.</p><p><strong>Module Effect:</strong> You
      now regain all expended uses when you complete a Short or Long
      Rest.</p><hr><p><strong>Semi-Automated: </strong>You must manually trigger
      the activity on this Feature before Damage is rolled but after this hit
      connects.</p>
