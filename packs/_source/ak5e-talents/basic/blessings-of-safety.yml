  description:
    value: >-
      <p>Creatures within 10 feet of you that have less than half of their
      maximum Hit Points gain Damage Reduction against Physical Damage equal to
      your Proficiency Bonus.</p><p><strong>Module Effect:</strong> The Damage
      Reduction is now against all Damage.</p><hr><p><strong>Automated:
      </strong>Note that the application of the aura effect can be a little
      awkward, and might require you to move the token in and out of the aura to
      "refresh" it, but not always.</p>
