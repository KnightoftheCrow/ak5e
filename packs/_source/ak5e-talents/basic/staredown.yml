  description:
    value: >-
      <p><span class="fontstyle0">As a Bonus Action, choose a Creature you can
      see within 60 feet that can see you. Each Creature makes an Intimidation
      Check and compares the result. The Creature with the higher result has
      Advantage on Attacks against the other Creature for 1
      Minute.</span></p><p><strong>Module Effect: </strong>You have Advantage on
      the Intimidation Check for this Ability.</p><hr><p><strong>Semi-Automated:
      </strong>Resolve the opposed Intimidation Check manually. Then, use the
      Activity on this Feature targeting the losing Creature and apply the
      correct effect.</p>
