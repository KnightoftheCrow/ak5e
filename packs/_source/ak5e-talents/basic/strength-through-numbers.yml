    value: >-
      <p>When a Construct you have created is reduced to 0 Hit Points, you gain
      a special Inspiration that expires when you next complete a Long Rest;
      this Inspiration is not cumulative, but is only consumed when it causes
      you to succeed on a roll.</p><p><strong>Module:</strong> You also gain
      this Inspiration when you create a
      Construct.</p><hr><p><strong>Automated.</strong></p>
