  advancement: {}
  description:
    value: >-
      <p>When you would reduce a Creature to 0 Hit Points, you can instead
      choose to reduce them to 1 Hit Point; for the next minute, that Creature
      cannot recover Hit Points, is Dazed, and if they are reduced to 0 Hit
      Points by a Creature other than you, that Creature gains 3
      SP.</p><p><strong>Module Effect:</strong> When a Creature gains SP as a
      result of this Feature, you also gain that
      SP.</p><hr><p><strong>Semi-Automated:</strong> The Activity on this
      Feature applies the No Healing and Dazed Conditions, but cannot account
      for the SP gain.</p>
