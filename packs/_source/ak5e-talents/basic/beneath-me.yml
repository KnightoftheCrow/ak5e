  description:
    value: >-
      <p>Once per Turn, when you make an Attack against a Creature that is a
      smaller Size Category than you, you can give yourself Advantage on that
      Attack Roll.</p><p><strong>Module Effect:</strong> If you give yourself
      Advantage in this way, and the Attack hits, it deals additional Damage
      equal to your Proficiency Bonus.</p><hr><p><strong>Automated: </strong>You
      have an Opt-in to trigger for Attack Rolls if the target Creature's TOKEN
      is smaller than yours.</p>
