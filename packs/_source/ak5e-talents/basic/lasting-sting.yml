  description:
    value: >-
      <p>Creatures who you have dealt Poison Damage to during a Turn take 2d10
      Poison Damage at the end of the Turn.</p><p><strong>Module
      Effect:</strong> Additionally, at the end of the Turn, they must pass a
      DC15 Constitution Saving Throw or suffer the Poisoned Condition until the
      end of their next Turn.</p><hr><p><strong>Partially Automated:</strong>
      Trigger the Damage Activity on this Feature at the end of the Turn. If you
      have the Module, use the Activity on the Module instead.</p>
