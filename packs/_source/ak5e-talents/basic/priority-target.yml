    value: >-
      <p>When you would make an Attack Roll against a Creature that has a Ranged
      Weapon or a Weapon with the Casting Unit Property equipped, you have
      Advantage on that Attack.</p><p><strong>Module Effect:</strong> If you
      would have Disadvantage on Attacks against those Creatures, you do
      not.</p><hr><p><strong>Semi-Automated: </strong>There is an Opt-In
