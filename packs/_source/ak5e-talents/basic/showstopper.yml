  description:
    value: >-
      <p><span class="fontstyle0">When you hit a Creature with a Critical Hit,
      that Creature must succeed on a Wisdom Saving Throw against your Martial
      DC or deal half Damage with their Attacks until the end of their next
      Turn.</span></p><p><strong>Module Effect: </strong>A Creature that fails
      this Saving Throw also has its Speed reduced by half for the
      duration.</p><hr><p><strong>Semi-Automated: </strong>Use the Activity on
      this Feature after you Critically Hit a Creature. If you have the Module,
      use the version marked Module instead. Select the correct version for the
      sacling of your Martial DC, Strength or Dexterity.</p>
    chat: ''
