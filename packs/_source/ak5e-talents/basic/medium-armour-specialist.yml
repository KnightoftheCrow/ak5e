  description:
    value: >-
      <p>You gain Proficiency in Medium Armour, and wearing Medium Armour no
      longer imposes Disadvantage on Dexterity (Stealth)
      Checks.</p><p><strong>Module Effect: </strong>While you are wearing Medium
      Armour, the maximum bonus you can gain to your Armour Class is 3, instead
      of 2. Additionally, while wearing Medium Armour, you can add your Strength
      or Intelligence Modifier instead of Dexterity to calculate the bonus to
      your Armour Class.</p><hr><p><strong>Semi-Automated: </strong>The
      Proficiency and Module Effect to gain +1 AC are automated. Everything else
      must be handled manually.</p>
