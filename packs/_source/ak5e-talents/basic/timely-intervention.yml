  description:
    value: >-
      <p>Whenever you roll to determine the Hit Points you restore to a Creature
      while it is not your Turn, you may add your Spellcasting Ability Modifier
      to the amount rolled.</p><p><strong>Module: </strong>This Feature now
      applies to any Hit Points you restore when it is not your Turn, instead of
      only applying to rolls.</p><hr><p><strong>Partially Automated:
      </strong>This applies to all healing you do outside of your Turn, not just
      rolls. In essence, the Module Effect is always being applied.</p>
