  description:
    value: >-
      <p>Over the course of a Long Rest, you can choose a number of Creatures up
      to your Proficiency Bonus who are also taking a Long Rest. If those
      Creatures complete that Long Rest, their maximum Hit Points are increased
      by 2d6, and they regain Hit Points to meet their new maximum Hit Points.
      This increase in Maximum Hit Points remains until those Creatures next
      complete a Long Rest. A Creature can only have its Maximum Hit Points
      increased in this way once per Long Rest.</p><p><strong>Module Effect:
      </strong>The increase in maximum Hit Points becomes
      4d6.</p><hr><p><strong>Not Automated: </strong>The increase max HP is
      currently bugged with midi-qol. The roll on this activity is entirely
      arbitrary; you must increase the max HP of affected Creatures
      manually.</p>
