  description:
    value: >-
      <p>Your Ranged Attacks against Creatures not touching the ground deal
      additional Damage equal to your Proficiency Modifier.</p><p><strong>Module
      Effect:</strong> If a Creature you can see moves using a Flying Speed
      within the Normal Range of a weapon you are wielding, you can expend your
      Reaction to make an Attack with that weapon against that Creature. You can
      use this Feature a number of times equal to your Proficiency Bonus, and
      regain all expended uses when you complete a Long
      Rest.</p><hr><p><strong>Semi-Automated: </strong>There is an Opt-In for
      Damage Rolls for Ranged Attacks when hitting Creatures with a Fly Speed
      &gt; 0. The Module Effect cannot be automated and is just for tracking
      uses.</p>
