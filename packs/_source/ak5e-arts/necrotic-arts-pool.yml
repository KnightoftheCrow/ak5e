  description:
    value: >-
      <p>The ruinous Arts of the Nachzehrer are foul and potent in equal
      measure, consuming life wholesale to fuel a relentless engine of death.
      Like other Witchcraft, this consumption is the “cost” they pay to conjure
      a tide of rot and decay; the Nachzehrer may thrive under such conditions,
      but all others will fall prey to the withering.</p><p>(Arts that are <span
      style="text-decoration:underline"><span
      style="text-decoration:underline">underlined</span></span> require the
      Player's Handbook. Arts that are in <em>italics</em> require Tasha's
      Cauldron of Everything. Arts that are <strong>Bold</strong> are not
      currently available in official content on Foundry; often Xanathar's Guide
      to Everything.)</p><table><thead><tr><td><p
      style="text-align:center"><strong>Arts Level</strong></p></td><td><p
      style="text-align:center"><strong>Arts</strong></p></td></tr></thead><tbody><tr><td><p>Cantrip</p></td><td><p>-</p></td></tr><tr><td><p>1st</p></td><td><p>Inflict
      Wounds, Ray of Sickness</p></td></tr><tr><td><p>2nd</p></td><td><p>Corpse
      Explosion, Wither</p></td></tr><tr><td><p>3rd</p></td><td><p><strong>Life
      Transference</strong>, Mass Inflict Wounds, <em>Spirit Shround (Necrotic
      Only)</em></p></td></tr><tr><td><p>4th</p></td><td><p>Blight,
      <strong>Septic
      Shock</strong></p></td></tr><tr><td><p>5th</p></td><td><p><strong>Enervation</strong>,
      Necrostorm</p></td></tr><tr><td><p>6th</p></td><td><p>Circle of Death,
      Harm</p></td></tr><tr><td><p>7th</p></td><td><p>Mass
      Exhaust</p></td></tr><tr><td><p>8th</p></td><td><p>Inflict
      Doom</p></td></tr><tr><td><p>9th</p></td><td><p>Ultimate
      Necrostorm</p></td></tr></tbody></table>
