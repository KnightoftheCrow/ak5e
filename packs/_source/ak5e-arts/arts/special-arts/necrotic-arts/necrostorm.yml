  description:
    value: >-
      <p>You unleash a storm of poisoned wind in a 20-foot-radius, 60-foot-tall
      cylinder centred on a point it can see within range. All Creatures within
      the area must make a Constitution Saving Throw; on a failed Save, they
      take 6d8 Necrotic Damage and are Poisoned until the end of their next
      Turn. On a successful Save, they take half as much Damage, and are not
      Poisoned.</p><p><strong>Partially Automated. </strong>Use the spell to
      create the area and do the damage. The poison effect is not automated.</p>
