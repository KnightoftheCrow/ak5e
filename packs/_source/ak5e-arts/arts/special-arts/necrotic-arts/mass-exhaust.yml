    value: >-
      <p>You create a 20-foot-radius sphere centered on a point you can within
      range that interferes with the respiration of Creatures, draining them of
      strength and will. When a Creature enters the Zone during their Turn, or
      begins their Turn in the Zone, they must succeed on a Constitution Saving
      Throw or suffer 1d4-1 (minimum of 1) Levels of Exhaustion. A Creature that
      has gained Exhaustion in this way can remove 1 Level of that Exhaustion as
      an Action.</p><p><strong>Not Automated.</strong></p>
