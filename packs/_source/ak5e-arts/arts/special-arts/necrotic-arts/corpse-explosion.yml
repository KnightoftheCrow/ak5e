  description:
    value: >-
      <p>You accelerate decay, and thus, the production of gas within a dead
      Creature of your choice within range. It explodes in a cloud of noxious
      gas and poisonous fluids; all Creatures within 15 feet of the corpse must
      make a Dexterity Saving Throw. On a failed Save, they take 3d8 Poison
      Damage, or 3d12 if the corpse was of a Large Creature. On a successful
      Save, they take half as much Damage.</p><p><strong>Partially
      Automated.</strong> You can drop the area and roll for damages and saving
      throws. Does not automatically detect a dead corpse.</p>
