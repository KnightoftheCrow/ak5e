  description:
    value: >-
      <p>You attempt to place a virulent, withering curse onto a Creature of
      your choice within range. That Creature must succeed on a Constitution
      Saving Throw or be Withered for the duration. A Withered Creature takes
      2d8 Necrotic Damage at the beginning of each of their Turns. A Withered
      Creature can make this Saving Throw again at the end of each of their
      Turns, ending the effect on a success.</p><p>If the target drops to 0 Hit
      Points before this Art ends, you can use a Bonus Action on a subsequent
      Turn of yours to attempt to Wither a new Creature.</p><p><strong>Not
      Automated.</strong></p>
