  description:
    value: >-
      <p>With a touch, you wrack the nervous system of a Creature, causing it to
      experience much greater pain from a given stimulus. When you cast this
      Art, choose one Saving Throw and one Damage Type. The Creature you touch
      must make a Constitution Saving Throw. On a failed Save, they are Doomed
      for the duration; while Doomed, they have Disadvantage on all Saving
      Throws of the chosen type, and they are Vulnerable to the Damage Type you
      chose.</p><hr><p><strong>Cannot be Automated.</strong></p>
