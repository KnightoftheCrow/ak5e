  description:
    value: >-
      <p>Choose a point you can see within range; you begin channelling your
      Arts as a swirling hurricane of foul mist builds around the chosen point.
      As an Action on your following Turn, all Creatures within a 50-foot-radius
      sphere centred on that point must make a Constitution Saving Throw. On a
      failed Save, they take 7d10 Necrotic Damage and are Poisoned. On a
      successful Save, they take half as much Damage only.</p><p>A Creature
      Poisoned in this way can reattempt the Saving Throw at the end of each of
      their Turns, ending the Condition on a success.</p><p><strong>Partially
      Automated. </strong>Zone can be placed on the ground and damages are done.
      Poison condition is not automated.</p>
