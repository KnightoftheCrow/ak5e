  description:
    value: >-
      <p>You touch one or two leaves, branches, grasses, or similar plant life.
      You strengthen and mold them creating the same number of Knives. While
      these Knives are wielded by you, you can use your Spellcasting Ability
      instead of your Strength or Dexterity for Attack and Damage Rolls.
      Additionally, Damage dealt by these Knives is considered to be Arts
      Damage. At the end of the Duration, the material you used in the Knives
      withers and rots away to nothing.</p><p><strong>Not
      Automated.</strong></p>
