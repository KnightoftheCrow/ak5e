  description:
    value: >-
      <p>You invoke the might of Muel the Feranmut itself, conjuring up an
      golden image of a mighty tree 100 feet in height and a canopy with a
      radius of 60 feet centered on a point within range. As a Bonus Action, you
      can choose up to five Creatures that are underneath the canopy of the
      Tree. If the Creature is hostile to you, it must make a Charisma Saving
      Throw; on a failed Save, it takes 3d8 Force Damage, or half as much on a
      successful Save. If the Creature is not hostile to you, it either regains
      3d8 Hit Points or gains 3d8 Temporary Hit Points; your
      choice.</p><p><strong>Not Automated.</strong></p>
