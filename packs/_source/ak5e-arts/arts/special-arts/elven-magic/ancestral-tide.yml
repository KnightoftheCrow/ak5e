    value: >-
      <p>You release a wave in a 40-foot-long, 20-foot-wide, and 10-foot high
      area originating from you that appears like water, populated by the
      “spirits” of elves who’s touch soothes your allies and burns your foes.
      Hostile Creatures within the area must make a Charisma Saving Throw; on a
      failed Save, they take 8d8 Force Damage. On a successful Save, they take
      half as much Damage. Willing non-hostile Creatures within the area gain
      4d8 Temporary Hit Points.</p><p><strong>Not Automated.</strong></p>
