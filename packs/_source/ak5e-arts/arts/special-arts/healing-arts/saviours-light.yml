  description:
    value: >-
      <p>Your Originium Arts manifest as seemingly divine light washing out from
      you, softly illuminating all areas within a 30-foot-radius sphere of Dim
      Light centered on you for the duration.</p><p>This light represents
      enhanced awareness granted by your Arts; you know the current and maximum
      Hit Points of all Creatures within this sphere. When you cast this Art,
      and at the beginning of your Turn (no Action required), you can grant any
      number of Creatures you can see within the sphere 2d8 Temporary Hit
      Points. While Creatures have these Temporary Hit Points, and you maintain
      Concentration on this Art, they have Advantage on all Saving
      Throws.</p><hr><p><strong>Semi-Automated: </strong>The knowing of Hit
      Points for Creatures in the area cannot be automated. You have an activity
      to grant the temporary Hit Points; this provides an effect that gives them
      Saving Throw Advantage, but this effect will not be removed if you lose
      concentration on the Art.</p>
