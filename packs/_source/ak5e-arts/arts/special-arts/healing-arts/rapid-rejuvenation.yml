  description:
    value: >-
      <p>You touch a Creature, vastly stimulating its natural healing properties
      with your own Arts. The Creature immediately recovers 4d8 Hit Points, and
      for the duration of the Art, recovers 10 Hit Points at the start of each
      of its Turns (100 Hit Points over the duration). However, when this Spell
      ends on a Creature, that Creature gains 1 Point of Exhaustion from the
      overconsumption of its bodily nutrients.</p><hr><p><strong>Semi-Automated:
      </strong>This Art doesn't apply the exhaustion at the end of its
      duration.</p>
