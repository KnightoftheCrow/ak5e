  description:
    value: >-
      <p>This Cantrip can only be cast as a Spellsword Art by an Artsblade. When
      it is cast, the Attack that this Art was cast as part of deals 1d6
      additional Arts Damage. You choose what Damage Type this Damage is; when
      you cast this Art, choose one of the Arts Pools you have selected for your
      Spellsword Arts. The Damage Type corresponds to the chosen Arts
      Pool.</p><table><thead><tr><td><p style="text-align:center"><strong>Arts
      Pool</strong></p></td><td><p style="text-align:center"><strong>Damage
      Type</strong></p></td></tr></thead><tbody><tr><td><p
      style="text-align:center">Corrosion</p></td><td><p
      style="text-align:center">Acid</p></td></tr><tr><td><p
      style="text-align:center">Crude</p></td><td><p
      style="text-align:center">Force</p></td></tr><tr><td><p
      style="text-align:center">Earth</p></td><td><p
      style="text-align:center">Bludgeoning</p></td></tr><tr><td><p
      style="text-align:center">Electric</p></td><td><p
      style="text-align:center">Lightning</p></td></tr><tr><td><p
      style="text-align:center">Flame</p></td><td><p
      style="text-align:center">Fire</p></td></tr><tr><td><p
      style="text-align:center">Fluid</p></td><td><p
      style="text-align:center">Piercing</p></td></tr><tr><td><p
      style="text-align:center">Frost</p></td><td><p
      style="text-align:center">Cold</p></td></tr><tr><td><p
      style="text-align:center">Light</p></td><td><p
      style="text-align:center">Radiant</p></td></tr><tr><td><p
      style="text-align:center">Psychic</p></td><td><p
      style="text-align:center">Psychic</p></td></tr><tr><td><p
      style="text-align:center">Spatial</p></td><td><p
      style="text-align:center">Thunder</p></td></tr><tr><td><p
      style="text-align:center">Wind</p></td><td><p
      style="text-align:center">Slashing</p></td></tr></tbody></table><p><strong>Cantrip
      Upgrade:</strong> The Additional Damage increases by 1d6 when you reach
      levels 5 (2d6), 11 (3d6), and 17 (4d6).</p><hr><p><strong>Partially
      Automated.</strong> Enchant the Weapon you mean to use for the Blade Art
      Attack and it will add an Action to that Weapon called Blade Art Attack
      that you can reuse; this activity will make a normal attack for that
      Weapon and add the additional damage of Blade Arts.</p><p>Your Lightning
      Resonance Features cannot be automated; handle the application of the
      chaining lightning manually.</p>
    chat: >-
      <p>This Cantrip can only be cast as a Spellsword Art by an Artsblade. When
      it is cast, the Attack that this Art was cast as part of deals 1d6
      additional Arts Damage. You choose what Damage Type this Damage is; when
      you cast this Art, choose one of the Arts Pools you have selected for your
      Spellsword Arts. The Damage Type corresponds to the chosen Arts
      Pool.</p><p><strong>Cantrip Upgrade:</strong> The Additional Damage
      increases by 1d6 when you reach levels 5 (2d6), 11 (3d6), and 17
      (4d6).</p><hr><p><strong>Partially Automated.</strong> Enchant the Weapon
      you mean to use for the Blade Art Attack and it will add an Action to that
      Weapon called Blade Art Attack that you can reuse; this activity will make
      a normal attack for that Weapon and add the additional damage of Blade
      Arts.</p><p>Your Lightning Resonance Features cannot be automated; handle
      the application of the chaining lightning manually.</p>
