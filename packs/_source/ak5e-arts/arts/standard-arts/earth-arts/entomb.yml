  description:
    value: >-
      <p>Pulling up rock and mud, you attempt to encase a Creature you can see
      within range in earth. That Creature must succeed on a Strength Saving
      Throw or become Incapacitated for the duration as they are imprisoned.
      While Incapacitated in this way, that Creature has Total Cover against any
      Creature or effect outside of the stone prison. A Creature Incapacitated
      in this way may reattempt the Saving Throw again at the beginning of each
      of their Turns; on a success, the effect ends. On a failed Saving Throw,
      they take 3d8 Bludgeoning Damage.</p><p><strong>Automated.</strong></p>
