  description:
    value: >-
      <p>You whip up dust, rock, and sand into a razor tempest centered on you
      in a 20-foot-radius sphere that moves with you, and goes around
      corners.</p><p>When you cast this Art, you can choose any number of
      Creatures to be immune to its Damage. When a Ranged Weapon Attack would
      pass through the affected area, roll 1d4; on any result except 4, that
      attack is blown off course by the scouring sands, and automatically
      misses. Additionally, when a Creature enters the area during their Turn,
      or begins their Turn there, they must make a Constitution Saving Throw. On
      a failed Save, they take 5d6 Slashing Damage and begin Bleeding. On a
      successful Save, they take half as much Damage, and suffer no other
      effects.</p><p><strong>Semi-Automated: </strong>The Damage component of
      this Art is automated. Causing ranged attacks to fail is also automated,
      but only against Creatures within the Sandstorm; attacks that are just
      passing through will not be automatically given a fail chance.</p>
