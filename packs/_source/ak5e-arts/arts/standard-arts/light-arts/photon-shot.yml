  description:
    value: >-
      <p>You choose two points that you can see that are 10 feet apart; both
      must be within the range of this Art. A mote of light zips from one point
      to the other in a straight line; all Creatures who this line passes
      through must succeed on a Dexterity Saving Throw or take 1d6 Radiant
      Damage.</p><p><strong>Cantrip Upgrade:</strong> The Damage increases by
      1d6 when you reach levels 5 (2d6), 11 (3d6), and 17 (4d6).</p>
