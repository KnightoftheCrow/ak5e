  description:
    value: >-
      <p>An orb of inky darkness streaks toward a creature of your choice within
      range.</p><p>Make a ranged spell attack against the target. On a hit, the
      target takes 4d6 psychic damage, and the Creature has Disadvantage on the
      next Attack Roll it makes, thanks to the cloying, clinging shadow fouling
      their vision.</p><p><strong>At Higher Levels.</strong> The damage of this
      Art increases by 1d6 for each level above 1 it is cast
      at.</p><p><strong>Automated.</strong></p>
