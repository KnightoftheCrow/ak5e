  description:
    value: >-
      <p>You choose a Creature you can see within range and steal the light from
      their eyes, guiding it away from their retinas and scorching their flesh
      instead; that Creature must make an Intelligence Saving Throw.</p><p>On a
      failed Save, they are Blinded for the duration, and suffer 3d6 Radiant
      Damage at the beginning of each of their Turns. On a successful Save, they
      suffer 3d6 Radiant Damage, and no other effects. A Creature Blinded in
      this way can use their Action to reattempt this Saving Throw, ending the
      effect on a success.</p><p><strong>Semi-Automated: </strong>The target
      will take the Radiant Damage even if they fail the initial save, instead
      of only on a successful Save.</p>
