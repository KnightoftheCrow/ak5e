  description:
    value: >-
      <p>You unleash a sudden burst of disorientating shadow at a point you can
      see within range; all Creatures within a 15-foot-radius sphere centered on
      that point must make a Wisdom Saving Throw as magical Darkness covers the
      affected area. Creatures that fail the Saving Throw take 8d4 Psychic
      Damage, while Creatures that succeed on the Saving Throw take half as much
      Damage. The area of Darkness lasts until the beginning of your next
      Turn.</p><p><strong>At Higher Levels:</strong> The Psychic Damage
      increases by 2d4 for each Level above 3 this Art is cast
      at.</p><p><strong>Automated.</strong></p>
