  description:
    value: >-
      <p>You cause a flash of searing light to emerge, scorching the creature
      that damaged you; the triggering Creature must make a Dexterity Saving
      Throw. On a failed Save, they take 2d10 Radiant Damage and are Blinded
      until the end of their next Turn. On a successful Save, they take half as
      much Damage, and are not Blinded.</p><p><strong>At Higher Levels:</strong>
      The Damage increases by 1d10 for each Level above 2 it is cast
      at.</p><p><strong>Automated.</strong></p>
