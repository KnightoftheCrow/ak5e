  description:
    value: >-
      <p>With a swipe of your hand, you cut through the very fabric of space in
      a 30-foot-long, 10-foot-wide line; this line must be entirely within the
      range of this Art.</p><p>All Creatures caught in this area must make a
      Charisma Saving Throw to hold their very being together. On a failed Save,
      they take 6d6 Force Damage, and their maximum Hit Points are reduced by
      6d6, and they begin Bleeding. This Bleeding cannot be removed, except by
      reattempting the Saving Throw as an Action and succeeding; the Creature
      quite literally pulling itself together. On a successful Save, they take
      6d6 Force Damage, and begin Bleeding.</p><p><strong>Semi-Automated:
      </strong>All effects arising from failing the Saving Throw are automated.
      However, succeeding on the Saving Throw does not apply Bleeding.</p>
