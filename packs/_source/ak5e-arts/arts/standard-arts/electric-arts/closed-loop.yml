  description:
    value: >-
      <p>You create a linked current between two Creatures of your choice in
      range that crackles with electrical power.</p><p>When either one of the
      linked Creatures takes Lightning Damage, you can cause the link to pulse
      as a Reaction, dealing 3d12 Lightning Damage to both linked Creatures. The
      Link breaks if the two Creatures are ever more than 150 feet apart, ending
      the Art. If you choose yourself as one of the Linked Creatures, you become
      Immune to Lightning Damage dealt by you for the duration, and when you use
      your Reaction to cause the link to pulse, it instead deals 5d12 Lightning
      Damage.</p><p><strong>Not Automated: </strong>Casting the Art marks up to
      two Creatures. Use the Pulse Link Activity to deal the Damage; only target
      the hostile Creature for the Linked to Caster version.</p>
