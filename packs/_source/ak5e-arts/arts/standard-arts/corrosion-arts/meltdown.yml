  description:
    value: >-
      <p>You choose a Creature you can see within range, causing very being to
      bubble and burn as you violently alter the pH of fluids on and in that
      Creature. That Creature must make a Constitution Saving Throw; on a failed
      Save, they are afflicted for the duration of the Art. While afflicted, at
      the end of each of their Turns, they take 1d8 Acid Damage. On a successful
      Saving Throw, that Creature instead takes 3d8 Acid Damage and suffers no
      other effects.</p><p>If a Creature is reduced to 0 Hit Points while
      afflicted, it detonates in a burst of corrosive fluids. When this occurs,
      all other Creatures within 10 feet of them must succeed on a Dexterity
      Saving Throw or become afflicted for the remaining duration of this
      Art.</p><p><strong>Semi-Automated: </strong>The initial target will take
      3d8 Acid Damage even when they fail the initial save, instead of only on a
      pass. Use the Death Burst activity when a Creature under the effect of
      this Art dies. Additionally, they duration of the Condition applied by
      Death Burst is always 1 minute, not the remaining duration as
      intended.</p>
