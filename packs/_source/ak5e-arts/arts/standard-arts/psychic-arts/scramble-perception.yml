  description:
    value: >-
      <p>You unleash your prowess, scrambling the perceptions of Creatures
      within a 15-foot radius of you. Up becomes down, and left becomes right,
      in a nauseating maelstrom. When a Creature (except yourself) enters the
      area during their Turn, or begins their Turn there, they must make a
      Intelligence Saving Throw. On a failed Save, their perception becomes
      scrambled until the end of their Turn, suffering the following
      effects:</p><ul><li><p>All Attack Rolls are made at Disadvantage, and any
      Trait or Action that affects specifically allied Creatures or hostile
      Creatures affects all Creatures instead.</p></li><li><p>When that Creature
      would take an Action that targets an area, it must first roll 1d12. Each
      result on the die is equal to the equivalent number on a clock face, where
      12 o’clock is pointing in the direction the Creature wanted to target. It
      instead rotates its targeting area to face the rolled result, keeping the
      same range for the Action unless they cannot due to terrain, in which case
      they take the maximum range
      available.</p></li></ul><p><strong>Semi-Automated: </strong>The aura
      providing disadvantage to attacks on failed Saving Throw is automated; all
      else must be done manually.</p>
