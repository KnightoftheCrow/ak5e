    max: ''
  description:
    value: >-
      <p>You choose a grounded point you can see within range; this point cannot
      be on any kind of raised surface, such as a second storey. The ground
      cracks and rumbles, and water from deep underground blasts upwards from
      the earth at your chosen point in a geyser. When the Geyser appears, all
      Creatures within 15 feet of that point must make a Strength Saving Throw;
      on a failed Save, they take 7d8 Bludgeoning Damage and are knocked 30 feet
      directly away from the original point. On a successful save, they take
      half as much damage, and are knocked back to the edge of the
      radius.</p><p>The Geyser continues to pump out water for the duration of
      this Art, at a rate of 30 cubic metres a round. When a Creature enters the
      radius of the Geyser, that Creature must make a Strength Saving Throw; on
      a failed Save, they take 7d8 Bludgeoning Damage and are knocked 30 feet
      directly away from the original point. On a successful save, they take
      half as much damage, and are knocked back to the edge of the
      radius.</p><p>While the Geyser is producing water, and for a number of
      Rounds after this Spell ends equal to the number of Rounds it was
      concentrated on, Fluid Arts are empowered; Arts that manipulate or use
      water cost 2 fewer Arts Points to cast (minimum of 0), so long as they are
      cast within 50 feet of the Geyser’s location, and the water from it
      remains.</p><p><strong>Semi-Automated: </strong>The Geyser Damage and
      knockback is automated. When you cast this Art, you will be prompted to
      place the area of AP cost reduction; place it at the same origin as the
      geyser. It does not actually reduce the cost of Fluid Arts.</p>
