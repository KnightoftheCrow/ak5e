  description:
    value: >-
      <p>The powers of the Elves are not Originium Arts- Originium is deathly
      harmful for the Elves. Wherefore then, do they manifest these strange
      powers, adjacent to Arts and yet not Arts? The truth lies in their origin,
      as the Creations of Muel the Feranmut, an old and powerful member of an
      old and powerful species, capable of godlike feats.</p><p>(Arts that are
      <span style="text-decoration:underline"><span
      style="text-decoration:underline">underlined</span></span> require the
      Player's Handbook. Arts that are in <em>italics</em> require Tasha's
      Cauldron of Everything. Arts that are <strong>Bold</strong> are not
      currently available in official content on Foundry; often Xanathar's Guide
      to Everything.)</p><table><thead><tr><td data-colwidth="229"><p
      style="text-align:center"><strong>Arts Level</strong></p></td><td><p
      style="text-align:center"><strong>Arts</strong></p></td></tr></thead><tbody><tr><td
      data-colwidth="229"><p>Cantrip</p></td><td><p>Druidcraft, <strong>Shape
      Water</strong>, Water Bullet</p></td></tr><tr><td
      data-colwidth="229"><p>1st</p></td><td><p>Create/Destroy Water, Leaf
      Blade, Woodland Lance</p></td></tr><tr><td
      data-colwidth="229"><p>2nd</p></td><td><p><strong>Earthbind</strong>, Life
      Seed, Misty Step, <strong>Wither and Bloom</strong></p></td></tr><tr><td
      data-colwidth="229"><p>3rd</p></td><td><p><strong>Erupting Earth</strong>,
      <strong>Tidal Wave</strong>, Water Breathing, Water
      Walk</p></td></tr><tr><td
      data-colwidth="229"><p>4th</p></td><td><p>Control Water, <span
      style="text-decoration:underline"><span
      style="text-decoration:underline">Grasping Vine</span></span>,
      <strong>Guardian of Nature</strong></p></td></tr><tr><td
      data-colwidth="229"><p>5th</p></td><td><p>Waters of Life, <strong>Wrath of
      Nature</strong></p></td></tr><tr><td
      data-colwidth="229"><p>6th</p></td><td><p>Wall of
      Thorns</p></td></tr><tr><td
      data-colwidth="229"><p>7th</p></td><td><p>Ancestral
      Tide</p></td></tr><tr><td
      data-colwidth="229"><p>8th</p></td><td><p><strong>Abi-Dalzim’s Horrid
      Wilting</strong></p></td></tr><tr><td
      data-colwidth="229"><p>9th</p></td><td><p>Yggdrasil</p></td></tr></tbody></table>
