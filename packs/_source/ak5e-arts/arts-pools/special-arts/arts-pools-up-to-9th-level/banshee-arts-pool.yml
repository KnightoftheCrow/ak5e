  description:
    value: >-
      <h4>Banshee Arts</h4><p>Banshee Arts, like many Sarkaz Arts, are not so
      much Arts in the modern context as they are rituals. Rituals require a
      goal, and most notably, a cost. How the Caster defines these things is a
      crucial component in the end result. For Banshees, they manifest their
      Arts through word and song; in other words, language. To a Banshee, the
      power of language is in its rules and constraints; in fact and definition,
      not interpretation and imagination. Through imposing these limitations on
      language to themselves, they can pay the “cost” for their Rituals in a way
      less mortal than other Sarkaz.</p><p>The end result of this is that
      Banshee Arts simply cause things to happen; the limitations imposed ensure
      that the intended result either happens, or it doesn’t. There is no room
      for doubt in the words of a Banshee.</p><p>(Arts that are <span
      style="text-decoration:underline"><span
      style="text-decoration:underline">underlined</span></span> require the
      Player's Handbook. Arts that are in <em>italics</em> require Tasha's
      Cauldron of Everything. Arts that are <strong>Bold</strong> are not
      currently available in official content on Foundry; often Xanathar's Guide
      to Everything.)</p><table><thead><tr><td><p
      style="text-align:center"><strong>Arts Level</strong></p></td><td><p
      style="text-align:center"><strong>Arts</strong></p></td></tr></thead><tbody><tr><td><p>Cantrip</p></td><td><p>-</p></td></tr><tr><td><p>1st</p></td><td><p>Power
      Word Push</p></td></tr><tr><td><p>2nd</p></td><td><p>Power Word Kneel,
      Power Word Shield</p></td></tr><tr><td><p>3rd</p></td><td><p>Bestow Curse,
      Power Word Bleed, Power Word Despair, Remove Curse, Speak with
      Dead</p></td></tr><tr><td><p>4th</p></td><td><p>Power Word
      Stupefy</p></td></tr><tr><td><p>5th</p></td><td><p>Altar of Weeping, Power
      Word Aegis, Power Word
      Succumb</p></td></tr><tr><td><p>6th</p></td><td><p>Power Word Forget,
      Power Word Mute</p></td></tr><tr><td><p>7th</p></td><td><p><strong>Power
      Word Pain</strong></p></td></tr><tr><td><p>8th</p></td><td><p>Power Word
      Stop, Power Word Stun</p></td></tr><tr><td><p>9th</p></td><td><p><span
      style="text-decoration:underline"><span
      style="text-decoration:underline">Power Word Heal</span></span>, Power
      Word Kill</p></td></tr></tbody></table>
