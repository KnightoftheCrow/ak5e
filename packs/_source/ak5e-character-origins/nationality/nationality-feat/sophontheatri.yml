    value: >-
      <p>The social architecture of modern Ægir has been heavily influenced by
      the teachings of Martus the Sage. Though now a reviled figure, Ægir clings
      to his traditions of public debate to solve issues, and thus every Ægirian
      is intimately familiar with the art of debate.</p><p>When you fail a
      Persuasion Check to convince someone of your point of view, you may reroll
      that Check, but must use the new result.</p>
