  description:
    value: >-
      <p>The Abyssal Hunters are genetically modified supersoldiers created by
      the state of Ægir to combat the Seaborn threat, through genetic
      hybridisation with the Seaborn themselves. Physically, they still appear
      to be the Aegir they were created from, with two notable exceptions borne
      from their Seaborn blood; ruby eyes and hoary
      hair.</p><blockquote><p><strong>History of the Abyssal
      Hunters</strong></p><p>The history of the Abyssal Hunters goes back the
      ninth Terran century; a suggestion that was initially firmly rejected by
      Ægir as a betrayal of their human primacy. As Ægir’s battle with the
      Seaborn intensified, and the Seaborn continued to adapt to Ægir’s
      weaponry, the debate would continuously reemerge until it was finally
      approved in 1080. The Abyssal Hunters were created and equipped with
      “primitive” melee weapons; a form of combat the Seaborn could never truly
      adapt to, and leveraged the enhanced speed and strength of the
      Hunters.</p><p>In 1095, the entire Hunter cadre was dispatched to slay the
      Seaborn Leviathan Ishar-mla; while they were successful, almost every
      Hunter was wiped out, with survivors scattered to the shores. With such a
      dramatic loss, Ægir immediately discontinued the project, unable to
      suppress negative public opinion of the Abyssal Hunter project any
      longer.</p></blockquote><p>Internally, however, the Abyssal Hunters have
      strayed far from the Aegir they once were. Their Seaborn blood has granted
      them strength and agility unmatched by other Terrans. They are at home in
      the water as fish are, able to keep pace with Ægir submarines. They can
      filter oxygen from the water through specialised gas exchange systems,
      allowing them to breathe underwater indefinitely. All this comes with a
      cost; their new closeness to the Seaborn leaves them especially
      susceptible to subversion by We Many, the hive mind of the Seaborn. Many
      Abyssal Hunters report being able to hear the persuasive voice and
      seductive influence of We Many; resisting its pull is a constant battle,
      and any lapse threatens to tip the delicate scale of human to seaborn
      balance within them irrevocably.</p><blockquote><p><strong>Note: Playing
      an Abyssal Hunter</strong></p><p>Abyssal Hunters were created from Aegir,
      in Ægir; others have tried to repeat the creation process, without true
      success.</p><p>Depending on the era of the game you are playing in, there
      are likely to be very few surviving Abyssal Hunters; canonically, the
      known number can be counted on one hand.</p><p>Thus, they are
      exceptionally rare and powerful; when considering an Abyssal Hunter
      Character, you must first talk with your DM about how and why this Hunter
      survived.</p></blockquote><h2>Abyssal Hunter
      Traits</h2><p><strong>Creature Type:</strong> You are a
      Humanoid.</p><p><strong>Size:</strong> Aegir stand between 5 and 6 feet,
      and average 150 pounds. Your size is Medium.</p><p><strong>Life
      Expectancy:</strong> The technology of Aegir combined with the natural
      characteristics of the race has extended their lifespan dramatically.
      Aegir reach adulthood around the age of 18, but have an average lifespan
      of 150 years.</p><p><strong>Speed:</strong> Your base Walking Speed is 30
      feet. You have a Swimming Speed that is equal to twice your Walking
      Speed.</p><p><strong>Ability Score Improvement:</strong> Your Strength
      Score increases by 2, and two other Scores of your choice increase by
      1.</p><h2>Abyssal Hunter Features</h2><p>As an Abyssal Hunter, you gain
      the following Features:</p><h3>Battle Rhythm</h3><p>Ægir maintains a
      strong focus on the arts and music as a core pillar of “humanity”, seeing
      it as the thing that differentiates humans from beasts. As creations of
      Ægir, the arts are a core pillar of the Abyssal Hunters, too. To watch
      them fight is to watch the steps of an intricate, violent dance, performed
      at blinding speed to the drums of war and the pulsing of blood.</p><p>When
      you roll Initiative, you can additionally roll 1d4+1 to determine your
      Rhythm for that combat. Until combat ends, while the round number of the
      combat is equal to a multiple of your Rhythm, you are considered to be On
      Beat.</p><blockquote><p><strong>Dance Partner</strong></p><p>When another
      Creature with this Feature rolls to determine their Rhythm, you can expend
      your use of this Feature to set your Rhythm to the same value as
      theirs.</p></blockquote><p>While you are On Beat, you gain a bonus to the
      following equal to your current Rhythm:</p><ul><li><p>Attack
      Rolls</p></li><li><p>Damage Rolls</p></li><li><p>Martial
      DC</p></li></ul><p>Once you have used this Feature, you cannot do so again
      until you complete a Short Rest.</p><blockquote><p><strong>Example: Battle
      Rhythm</strong></p><p>Player A rolls to determine their Rhythm and rolls a
      total of 2. On the 2nd round, 4th round, 6th round, and so on of that
      combat, they are considered to be On Beat and gain a +2 Bonus to the
      affected values.</p><p>Player B rolls to determine their Rhythm and rolls
      a total of 5. On the 5nd round, 10th round, 15th round, and so on of that
      combat, they are considered to be On Beat and gain a +5 Bonus to the
      affected values.</p></blockquote><h3>Crafted for War</h3><p>The Abyssal
      Hunters are biological supersoldiers adapted from the Aegir Species; the
      traits of the Aegir are still prominent, inflated to dramatic proportions
      through hybridisation with Seaborn DNA. For the better in most cases, for
      the worse in some.</p><p><strong>Blessing of the Sea.</strong> You cannot
      contract Oripathy through mundane means.</p><p><strong>Duck and
      Dive.</strong> While you are swimming, you have Advantage on Dexterity
      Saving Throws.</p><p><strong>Incapable of Arts.</strong> Your seaborn
      blood rejects Originium in all its forms, leaving you unable to cast Arts
      in any way.</p><p><strong>Seaborn Darkvision.</strong> You have 60 feet of
      Darkvision.</p><p><strong>Seaborn Ventilation.</strong> You can breathe
      underwater.</p><h3>Living Weapon</h3><p>Despite the vehement discourse on
      whether the Abyssal Hunters should even have been created, both sides of
      the argument can agree on one thing; they are weapons. Like any weapon,
      they require the right tools and proper maintenance to remain useful in
      their battle against the Seaborn. You gain the following
      benefits:</p><p><strong>Additional Weapon Proficiencies.</strong> You are
      Proficient with Heavy Melee Weapons.</p><p><strong>Anti-Aberration
      Conditioning.</strong> You have Advantage on Saving Throws against
      Aberrations. If you would already have Advantage on that Saving Throw, you
      can roll three dice and keep the highest result.</p><h3>Ancient
      Versatility</h3><p>The Ancient Species seized the world of Terra from the
      Teekaz, and have since spread all over its surface, to all its climes and
      domains. As such, those of an Ancient Species possess a versatility not
      seen in the Teekaz. Choose one from the following benefits when you select
      this Species:</p><p><strong>Durable.</strong> Your Hit Point maximum
      increases by an amount equal to your Level. Whenever you gain a Level
      thereafter, your Hit Point maximum increases by an additional Hit
      Point.</p><p><strong>Reliable.</strong> You gain Proficiency in one Skill
      of your choice.</p><p><strong>Tenacious.</strong> You can add half of your
      Proficiency Bonus (rounded down) to any Saving Throw you are not
      Proficient in.</p>
