  description:
    value: >-
      <p>Nightzmoran Kuranta and modern Terran Kuranta visually appear very
      similar, sharing the traits of equines; tall stature, funnel-shaped ears
      and long-haired tails. Physically, then, the main difference is in
      colouration; Kuranta fur and hair comes in a variety of colours. For
      Nightzmoran Kuranta however, all is shades of red; so synonymous with them
      is the colour, that the bright red hair of a Nightzmoran Kuranta flaring
      in the wind was once a symbol of death and destruction, when the
      Nightzmoran Khaghanate rampaged across Terra. There is still variety
      within this colouration; some much darker shades, near brown, are
      possible- but for many Nightzmora, they take pride in their red
      hair.</p><p>Beneath the surface level however, Nightzmora and Kuranta have
      evolved along similar, but different roads. Both have adapted for high
      speed running for the plains they both dwelled in. But, where the Kuranta
      chose to outlast their foe, the Nightzmora chose another path;
      misdirection. Nightzmora have an inbuilt proficiency for a form of Arts
      revolving around illusion and fooling the senses. On the plains, this
      served them well to provide avenues of retreat from predators. When the
      Khaganate began its rampage across the continent, these Arts left their
      enemies dazed and off-guard, simply waiting to be trampled thousands of
      feet.</p><p>Unlike the Ancient Kuranta, the Nightzmora firmly belong to
      the Elder races, yet both are considered Kuranta. Some scholars speculate
      that the Kuranta were created from a population diverged and descended
      from the Nightzmora, while others speculate that perhaps both share a
      common Elder ancestor, now extinct. Whatever the truth, the Nightzmora
      played a signifcant hand in the downfall of many other Elder races. The
      Nightzmoran Khaganate, led by Kharanduu Khagan, began a continent wide
      conquest starting in Terran year 11; many nations ruled by Elder species
      fell to their swords. The conquest only ended upon its arrival in Sargon,
      where the Khan and Shahanshah Lugalszargus joined forces to defeat the
      “demons” in the Foenn hotlands. The pair succeeded, but the conflict all
      but destroyed the Khaganate.</p><p>In modern times, Nightzmora are rare,
      scattered across the world by their conflict and eventual disbandment.
      Many modern Nightzmora originate from Sargon, where some tribes remained
      after the great Khan’s death. Many of these tribes maintain their nomadic
      lifestyle, and have taken up banditry in order to maintain it in a
      modernising
      world.</p><blockquote><p><strong>Khaganquest</strong></p><p>Nightzmora
      have a tradition known as “Khaganquest”; a coming-of-age ritual where a
      adolescent Nightzmora leaves their homeland with only their weapons in
      hand, and cannot return unless in glory; whether it be the trophies of
      defeated foes, wealth, or power. In the time of the Khan, a Nightzmora was
      not considered an adult until after a successful Khaganquest, regardless
      of age, as it showed individuality and resourcefulness useful to the
      tribe. Many modern Nightzmora still practice this tradition, though the
      symbolism and reasoning has been mostly forgotten; many Nightzmora simply
      undertake a “Khaganquest” with the nation of becoming rich and powerful,
      without context of how it aids the
      tribe.</p></blockquote><h2><strong>Nightzmora Kuranta
      Traits</strong></h2><p><strong>Creature Type:</strong> You are a
      Humanoid.</p><p><strong>Size:</strong> Kuranta are marginally taller than
      some other races, clocking in between 5 and a half and 6 feet on average,
      but pack a lot of dense muscle into their frames; thus, they weigh about
      190 pounds on average. Their size is Medium.</p><p><strong>Life
      Expectancy:</strong> Kuranta reach adulthood around the age of 18, and
      have a life expectancy of around 80 years.</p><p><strong>Speed:</strong>
      Your base Walking Speed is 30 feet.</p><p><strong>Ability Score
      Improvement:</strong> Your Constitution Score increases by 2, and two
      other scores of your choice increase by 1.</p><h2>Nightzmora Kuranta
      Features</h2><p>As a Nightzmora Kuranta, you gain the following
      Features:</p><h3>Misdirection</h3><p>Nightzmora are famously proficient in
      illusionary and psychic Arts they use to sow confusion among their foes;
      all it takes is for their foe to look the wrong way to open up their neck
      to a sword strike. You gain the following
      benefits:</p><ul><li><p><strong>Minor Illusion Expert.</strong> You know
      the Minor Illusion Cantrip, and may cast it as a Bonus Action. You can use
      your Martial DC in place of your Spell Save DC for this Art; you do not
      need a weapon with the Casting Unit Property to cast this
      Art.</p></li><li><p><strong>Illusion Mastery.</strong> You can cast
      Illusion Arts without providing Verbal components, and if an Illusion Arts
      you cast has a range of 10+ feet, the range increases by 60
      feet.</p></li></ul><h3>Run Them Down</h3><p>Kuranta are naturally suited
      to battle by their stunning speed, opening up the opportunities for those
      lightning fast clashes that make the Kuranta Knights of Kazimierz so
      enthralling to watch.</p><p>You may take the Dash Action as a Bonus
      Action; when you do so using this Feature, you lose 1d8 Hit
      Points.</p><h3>Living Nightmares</h3><p>“All warfare is based on
      deception.</p><p>Hence, when we are able to attack, we must seem unable;
      when using our forces, we must appear inactive; when we are near, we must
      make the enemy believe we are far away; when far away, we must make him
      believe we are near.”</p><blockquote><p>Sun Tzu, The Art of
      War</p></blockquote><p>The Nightzmoran Khanate once conquered vast swathes
      of Terra; few nations did not suffer their destructive rampage. Key to
      their success was their masterful ability in illusion; when combined with
      their hit and run tactics, their foes ever struggled to mount the correct
      response at the right time</p><p>You learn the Nightzmoran’s Illusory
      Arts. You learn more Illusory Arts as your Character Level increases; all
      Illusory Arts are always prepared. If you cannot cast Arts in another way,
      Wisdom is your Spellcasting Ability for these Arts; you do not need a
      weapon with the Casting Unit Property to cast these Arts.</p><h3>Illusory
      Arts</h3><table><tbody><tr><td><p
      style="text-align:center"><strong>Character Level</strong></p></td><td><p
      style="text-align:center"><strong>Known
      Arts</strong></p></td></tr><tr><td><p
      style="text-align:center">1</p></td><td><p
      style="text-align:center">Silent Image</p></td></tr><tr><td><p
      style="text-align:center">7</p></td><td><p
      style="text-align:center">Phantasmal Force, Fear</p></td></tr><tr><td><p
      style="text-align:center">14</p></td><td><p
      style="text-align:center">Hallucinatory Terrain,
      Seeming</p></td></tr></tbody></table><p>Once per Short Rest, you can cast
      one of your known Illusory Arts at the minimum level without expending any
      Arts Points.</p><h3>Divine Right of Kings</h3><p>The Elder species once
      ruled over the Ancients, using them as footsoldiers in their conflict with
      the Teekaz. After their victory, they ruled over their subjects, often
      with an iron fist, until they were cast down by the Ancients that placed
      them on those Thrones. Now, while members of the Elder Races are rare,
      they have never forgotten that they used to rule.</p><p>You have Advantage
      on any Charisma based Check against a Creature who’s Level or CR is lower
      than your own.</p>
