  description:
    value: >-
      <p>The Djaj (singular: Djall) were once one of the more feared tribes of
      the Sarkaz Royal Courts, both for their proficiency with psychic Arts and
      for their ability to feed on the thoughts of others. The stronger the
      emotion, the more sustanance a Djall can derive from it, leading them to
      resort to physical and psychological torture to generate those strong
      emotions. The exact means by which they “consume” thought is not well
      documented; in the past, their reputation was too fearsome to attempt
      study. In the modern age, Djaj are considerably rarer than other members
      of the Royal Court, as their constant exposure to the negative emotion in
      and around Kazdel has caused the vast majority to emigrate to isolated
      lands, away from where they might feasibly be studied.</p><p>Physically,
      Djaj are shorter in stature, with long whip-like tails, large pointed
      ears, and large upwards horns that curve inwards. Their less physical
      nature than other Sarkaz causes many to underestimate them; a final,
      agonizing mistake their minds never recover from.</p><h1>Sarkaz Djall
      Traits</h1><p><strong>Creature Type:</strong> As the direct descendants of
      the Teekaz, you are a Fiend (Humanoid).</p><p><strong>Size:</strong> As
      the Sarkaz are, in reality, a collection of related subspecies joined
      under one heading, their physical size and build can vary greatly.
      Generally speaking, however, they fall between 5 feet and 6 and a half
      feet in height, and around 160 pounds in weight. Male Sarkaz tend to be
      taller and heavier, but it is not a given. Your size is
      Medium.</p><p><strong>Life Expectancy:</strong> The Sarkaz mature at the
      same rate as many other races, reaching adulthood around 18, but have a
      vastly extended lifespan, able to live for many centuries. Most, however,
      do not live this long; the life of the Sarkaz is hard, fraught with peril,
      and Oripathy can shorten their lifespan dramatically, as it does all
      others.</p><p><strong>Speed:</strong> Your base Walking Speed is 30
      feet.</p><p><strong>Ability Score Improvement:</strong> Your Charisma
      Score increase by 1, and you may increase two other scores of your choice
      by 1, or one other score of your choice by 2.</p><h1>Sarkaz Djall
      Features</h1><p>As a Sarkaz Djall, you gain the following
      Features:</p><h3>Nephesh</h3><p>All Sarkaz have an intrinsic, genetic
      connection to the Sarkaz of the past and present. The memories of the
      Sarkaz are embedded in their very genetics, allowing modern Sarkaz to
      recall the events of centuries ago as if they were there, under the right
      conditions. You gain the following benefits:</p><p><strong>Ancestral
      Knowledge.</strong> Whenever you would make a Lore Check regarding the
      history of the Sarkaz, or events that directly pertain to it, you are
      treated as having Expertise in that skill. If you already have Expertise,
      you make that Check at Advantage.</p><p><strong>Lifelink.</strong> When a
      Sarkaz you know dies, you immediately become aware of it, though you learn
      nothing about the circumstances.</p><h3>Witchcraft</h3><p>Sarkaz have a
      tighter bond with Originum and the curse of Oripathy than other races, and
      can wield it to destructive effect; both for themselves and their
      foes.</p><p>You have access to the Witchcraft Arts Pool; these are Sarkaz
      Arts. These Arts are always prepared. If you cannot cast Arts in another
      way, Wisdom is your Spellcasting Ability for these Arts; you do not need a
      weapon with the Casting Unit Property to cast these Arts.</p><p>Once per
      Long Rest, you can cast a Sarkaz Art without expending any Arts Points.
      The maximum level of Sarkaz Art you can cast in this way is controlled by
      your Character Level. At 7th Level, you can cast Sarkaz Arts in this way
      twice per Long Rest.</p><table><thead><tr><td><p
      style="text-align:center"><strong>Character Level</strong></p></td><td><p
      style="text-align:center"><strong>Maximum Arts
      Level</strong></p></td></tr></thead><tbody><tr><td><p>1</p></td><td><p>1</p></td></tr><tr><td><p>2</p></td><td><p>1</p></td></tr><tr><td><p>3</p></td><td><p>1</p></td></tr><tr><td><p>4</p></td><td><p>1</p></td></tr><tr><td><p>5</p></td><td><p>1</p></td></tr><tr><td><p>6</p></td><td><p>1</p></td></tr><tr><td><p>7</p></td><td><p>2</p></td></tr><tr><td><p>8</p></td><td><p>2</p></td></tr><tr><td><p>9</p></td><td><p>2</p></td></tr><tr><td><p>10</p></td><td><p>2</p></td></tr><tr><td><p>11</p></td><td><p>2</p></td></tr><tr><td><p>12</p></td><td><p>2</p></td></tr><tr><td><p>13</p></td><td><p>2</p></td></tr><tr><td><p>14</p></td><td><p>3</p></td></tr><tr><td><p>15</p></td><td><p>3</p></td></tr><tr><td><p>16</p></td><td><p>3</p></td></tr><tr><td><p>17</p></td><td><p>3</p></td></tr><tr><td><p>18</p></td><td><p>3</p></td></tr><tr><td><p>19</p></td><td><p>4</p></td></tr><tr><td><p>20</p></td><td><p>4</p></td></tr></tbody></table><h3>Cognitovore</h3><p>As
      you walk the streets of any location, you cannot help but brush your mind
      against others; a mere taste of what lies inside their skulls. With just a
      little urging, you can dig deeper, like a bird pecking for worms, and coax
      free the sustenance your crave. You can do so gently, excising pain and
      misery; or you can rip it free, leaving a raw psychological wound for you
      to exploit.</p><p>You can sense the surface thoughts of any Creature
      within 15 feet, as long as that Creature has an Intelligence Score greater
      than 3, and is not an Undead, Plant, or Construct. You learn how these
      Creatures are feeling in simple terms, such as Angry or Sad.</p><p>As an
      Action, you can attempt to probe deeper into the thoughts of a Creature
      you can read the surface thoughts of. That Creature must make an
      Intelligence Saving Throw (DC = 8 + Your Charisma Bonus + Proficiency
      Bonus OR Your Spell Save DC) to resist the effect; a Creature can choose
      to fail this Saving Throw.</p><p>On a successful Save, you learn nothing,
      and the Creature becomes immune to this effect for 24 hours. On a failed
      Saving Throw, you gain insight into what they are currently thinking
      about, its reasoning for its actions, and something that it thinks about
      often (such as a loved one, or a major point of stress) for 1
      minute.</p><p>A target Creature knows you are probing its mind, and can
      reattempt the Saving Throw at the end of each of their Turns, ending the
      effect on a success. You can only probe the thoughts of one Creature at a
      time in this way; using this effect on another Creature ends the effect on
      the first.</p><p>Additionally, when a Creature fails the initial Saving
      Throw against this effect, you can consume a thought gently or roughly. If
      you consume a thought gently, that Creature is considered to be under the
      effect of the Heroism Art until you stop probing deeper into their
      thoughts. If you consume a thought roughly, that Creature is Dazed until
      you stop probing deeper into their thoughts.</p><h3>Key to the
      Heart</h3><p>The Djall’s original fearsome reputation comes from their
      innate proficiency for Psychic Arts. When facing a Djaj, your own mind is
      not your ally.</p><p>You learn all levelled Arts from the Psychic Arts
      Pool; these are considered to be Sarkaz Arts. If you do not have the
      Ability to cast Arts in another way, Charisma is your Arts Casting
      Ability; you do not need a weapon with the Casting Unit Property to cast
      these Arts.</p><p>If you gain the ability to cast any of these Psychic
      Arts in another way, you instead gain a permanent +1 to your Spell Save DC
      and Spell Attack Rolls when casting that Art.</p>
