  description:
    value: >-
      <p>Anaty are difficult to generalise. Such are the degree of their
      variance, that until recent years the concept of a unified Anaty species
      was non-existant; those who would become known as Anaty were believed to
      be members of closely related species instead. Modern science has shown
      these supposed related species were far closer to each other than
      previously assumed, and this the concept of the unified Anaty species was
      born. Even now, some question whether Anaty should be considered a
      singular species, or if Anaty is the name of a family of
      species.</p><p>The most common Anaty animalistic traits are those of
      mustelids, with rounded ears and tails, at varying degrees of bushyness.
      They are physically small, but possess highly developed musculature that
      grants them strength beyond their size; many Anaty also have tough claws
      that are used for climbing, digging, and self defence. They are a solitary
      people drawn to the wilderness, most commonly found in forests and
      mountains, carving out their domains, but some Anaty dwell beside rivers
      and lakes, living amphibious lives.</p><h1>Anaty
      Traits</h1><p><strong>Creature Type:</strong> You are a
      Humanoid.</p><p><strong>Size:</strong> Anaty stand between 4 and 5.5 feet,
      and average 120 pounds. Your size is
      Small.</p><blockquote><p><strong>Variant: Larger
      Stature</strong></p><p>When you choose this species, you can choose for
      your size to be Medium. If you do, your base Walking Speed decreases by
      5ft, but you will have an easier time finding equipment in your
      size.</p></blockquote><p><strong>Life Expectancy:</strong> Anaty reach
      adulthood around the age of 18, and have a life expectancy of around 80
      years.</p><p><strong>Speed:</strong> Your base Walking Speed is 35
      feet.</p><p><strong>Ability Score Improvement:</strong> Your Strength
      Score increases by 2, and two other scores of your choice increase by
      1.</p><h1>Anaty Features</h1><p>As an Anaty, you gain the Ancient
      Versatility Feature, detailed below. Then, choose three of the
      Evolutionary Adaptation Features; these become your Species Features. You
      cannot choose the same Adaption twice.</p><h3>Ancient
      Versatility</h3><p>The Ancient Species seized the world of Terra from the
      Teekaz, and have since spread all over its surface, to all its climes and
      domains. As such, those of an Ancient Species possess a versatility not
      seen in the Teekaz. Choose one from the following benefits when you select
      this Species:</p><p><strong>Durable.</strong> Your Hit Point maximum
      increases by an amount equal to your Level. Whenever you gain a Level
      thereafter, your Hit Point maximum increases by an additional Hit
      Point.</p><p><strong>Reliable.</strong> You gain Proficiency in one Skill
      of your choice.</p><p><strong>Tenacious.</strong> You can add half of your
      Proficiency Bonus (rounded down) to any Saving Throw you are not
      Proficient in.</p><h2>Evolutionary Adaptions</h2><h3>Folk of the
      Forest</h3><p>Few expect to see an Anaty when looking up. For the Anaty
      adapted to dwell aloft of others, this can be their greatest weapon, or
      their greatest tool for survival. You gain the following
      benefits:</p><ul><li><p><strong>Additional Movement Speeds.</strong> You
      gain a Climbing Speed equal to your Walking
      Speed.</p></li><li><p><strong>Four Walls, Six Paths.</strong> When using
      your Climbing Speed, you may move any direction across a vertical surface
      in any orientation, and may even climb upside down along horizontal
      surfaces, though you may not take any Actions that require both hands
      while traversing in this manner.</p></li></ul><h3>Folk of the
      Mountain</h3><p>Some assume the Anaty are physically frail as a
      generalisation, fooled by the small size. This is a falsehood. The
      strength of their small bodies is concentrated, compressed; and in this
      case, strongly specialised for digging. You gain the following
      benefits:</p><ul><li><p><strong>Burrowers.</strong> Over the course of 1
      minute, you can prepare to tunnel through a soft surface, scrabbling and
      digging to find safe purchase. At the conclusion of this period, you gain
      a Burrow Speed equal to your Walking Speed for 1 hour; when this time is
      over, you must immediately dig towards the closest above ground location;
      you instinctively know which direction this is
      in.</p></li><li><p><strong>Carve Hill and Dale.</strong> In any terrain
      you are burrowing through, you can spend 1 minute to dig a tunnel 10 feet
      long and 5 feet in diameter that a Large or smaller creature can traverse
      as if it was difficult terrain. Tunnels made in this manner collapse after
      24 hours, unless you spend 1 minute during that time to reinforce the
      tunnel, or it is reinforced through other
      means.</p><blockquote><p><strong>Reminder: Burrow Speeds</strong></p><p>A
      Creature that has a Burrow Speed can use that speed to move through sand,
      earth, mud, or ice. The Creature can’t burrow through solid rock unless
      the Creature has a trait that allows it to do so. A Creature using a
      burrow speed does not leave a tunnel to be followed unless it has a trait
      that specifies as such, though a sapient Creature could feasibly excavate
      a tunnel with time. Finally, a Creature cannot detect anything happening
      around it while Burrowing unless it also has
      Tremorsense.</p></blockquote></li><li><p><strong>Vibrissae.</strong> While
      you are using your Burrow Speed, you have 15 feet of
      Tremorsense.</p></li></ul><h3>Folk of the Water</h3><p>Lithe, small,
      powerful; the sleek bodies of water-dwelling Anaty belie their predatory
      nature. Darting into the water, or from it, they quickly seize hold of
      unwary prey and deliver a killing blow. You gain the following
      benefits:</p><ul><li><p><strong>Additional Movement Speeds.</strong> You
      gain a Swimming Speed equal to your Walking
      Speed.</p></li><li><p><strong>Dart Forward.</strong> If you have used two
      or more Speeds during your Turn, you may take the Dash Action as a Bonus
      Action during that Turn. If you do so, the first time you make an Attack
      that Turn against a Creature within 15 feet, you can roll a d8 and add it
      to either the Attack Roll or Damage
      Roll.</p></li><li><p><strong>Nictitating Membrane.</strong> While
      underwater, you have 30 feet of Darkvision.</p></li></ul><h3>Lead the
      Way</h3><p>Many Anaty live in hostile, distant wilderness; frozen
      snowscapes, rough crags, deep forests. These same Anaty can navigate this
      terrain with the ease another person might cross the street, and thus many
      find employment as guides, sherpa, or catastrophe messengers.</p><p>As a
      Long Rest Activity, you can plan a route through the current environment
      you are in; until you next complete a Long Rest, moving through
      non-magical Difficult Terrain in that environment costs you no additional
      movement. As a Bonus Action, you can grant Creatures of your choice that
      can hear you this benefit for 1 minute; they must remain within 30 feet of
      you and be able to hear you to maintain this
      benefit.</p><h3>Passthrough</h3><p>Small and slight, some Anaty survive
      their hazardous, rugged homelands by avoiding danger rather than
      confronting it. You can move through the spaces of hostile Creatures, but
      it is treated as Difficult Terrain that is not affected by your Lead The
      Way Feature.</p><h3>Run For Cover</h3><p>Despite many being fearsome in
      their own right, the Anaty can still find themselves prey to more fearsome
      beasts; in the distant past, their ancestor’s blood shivered at the sight
      of the ancestors of the Lupo and Liberi. In some Anaty, the techniques
      they learned to survive then still persist now.</p><p>When you take the
      Hide Action, but before you make the Stealth Check, you can move up to
      half of your Speed without provoking Opportunity
      Attacks.</p><h3>Scrappy</h3><p>Perhaps because of their smaller stature,
      Anaty are not typically considered to be a belligerent folk. For some,
      this is simply untrue, showing aggression that would put a Lupo to shame
      when pressed. They might not want to fight, but they will kill
      you.</p><p>You have Advantage on any Saving Throw to avoid or end the
      Charmed or Frightened Conditions.</p><h3>Tough Claws</h3><p>Digging
      through earth and mud without tools is not a simple task. Luckily, some
      Anaty are not without tools, as they possess thick, keratinous claws
      capable of digging through earth or flesh with equal ease. Nor is it only
      burrowing Anaty that can possess such talons; such tools are equally
      useful for scrambling up trees, or scavenging in riverbeds.</p><p>You can
      use your Claws to make Unarmed Strikes, which deal 1d4 + your Ability
      Modifier in Slashing Damage instead of the normal Bludgeoning Damage for
      an Unarmed Strike. Furthermore, Unarmed Strikes you make using your Claws
      have the Deadly Property.</p><h3>Trueborn Naturalist</h3><p>To live in the
      wilds as many Anaty do requires a deep understanding of nature. For many,
      it is learned. For the Anaty, it is natural.</p><p>Choose either Wisdom
      (Animal Hadling) or Wisdom (Wilderness). You gain Proficiency in the
      chosen skill. If you would gain Proficiency in that skill from a
      non-Species Feature source, you instead gain Expertise in that
      Skill.</p><p></p><p></p>
