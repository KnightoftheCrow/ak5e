  description:
    value: >-
      <p>Known for their antler-esque horns, reptillian tails ending in
      brush-like tufts, and imposing presence, the Elder Lung are draconic
      cousins to the Draco. Despite scaly similarity, the Lung share little to
      no ancestry with the Draco, hailing from eastern Terra, and coming to
      power within what would become Yan and Higashi. Like many Terrans, some
      Lung physically trend even further towards the bestial, with large manes
      of lion-like hair, deer-like ears, and further covering of scales. Unlike
      a Draco or a Vouivre, the scales of a Lung are no armour plates, but
      iridescent and shimmering, like those of a fish, giving them a
      particularly striking appearance to the unfamiliar.</p><p>A majority of
      Lung still originate from the two lands they are irrevocably entwined with
      the history of; Yan and Higashi. So entwined are they with the history of
      Yan that the Yanese Emperor’s official tital is True Lung, and has
      naturally been held by a Lung since historical records began in Yan. This
      is a very long time indeed, for those historical records encompass a frame
      of time longer than the lifespan of most extant Terran civilizations. This
      is borne from the seemingly inherent tendency of the Lung to categorise,
      organise, and record; bordering on obsessive. Anywhere a Lung population
      dwells for a time will soon play host to a library, or other repository of
      knowledge. Nowhere is this ancestral call to archivism more visible than
      Great Yan itself, where there is an offical Imperial Historical Cabinet
      responsible for histiography.</p><h2>Lung Traits</h2><p><strong>Creature
      Type:</strong> You are a Humanoid.</p><p><strong>Size:</strong> The
      average height of a Lung varies for male or female Lung, with males being
      notably taller on average. Female Lung average between 5 and half feet and
      6 feet; male Lung average between 6 and 6 and a half feet. Unlike the
      Draco they are sometimes conflated with, Lung tails are small and don’t
      contribute much to their total mass, averaging at 165 pounds. Your size is
      Medium.</p><p><strong>Life Expectancy:</strong> Lung reach adulthood
      around the age of 18. As a species belonging to the Elder Species, the
      lifespan of a Lung can encompass up to 300
      years.</p><p><strong>Speed:</strong> Your base Walking Speed is 30
      feet.</p><p><strong>Ability Score Improvement:</strong> Your Intelligence
      Score increases by 2, and two other scores of your choice increase by
      1.</p><h2>Lung Features</h2><p>As a Lung, you gain the following
      Features:</p><h3>Godslayers</h3><p>Of all the world-shifting events in
      Terra’s history, the one the Lung are most associated with is the “Great
      Hunt”; a massive conflict carried out by the first Emperor of Yan, a Lung
      himself, against the Feranmuts who had uncontested dominion over the
      region. Their eventual victory paved the first stone for modern Terran
      civilization, allowing nations to form freed from the threat of these
      godlike beings. Thus, it is only natural that the Lung retain some
      proficiency in the slaying of titans. You gain the following
      benefits:</p><p>When your score a Critical Hit on a Creature of a Creature
      who’s CR (or Level) is greater than your Level, you can roll one of that
      Attack’s Damage Dice an additional time and add it to the extra Damage of
      the Critical Hit. Similarly, if a Creature who’s CR (or Level) is greater
      than your Level rolls a result of a 1 on the d20 for a Saving Throw
      against you that would result in you dealing Damage to them, you can roll
      1 additional dice of the Damage; that Creature takes additional Damage
      equal to the amount rolled.</p><h3>Weight of History</h3><p>Like all
      Elders, the Lung bear the weight of the past; unlike others, they wield it
      as a fine ink pen, rather than a cross for their own backs. You gain the
      following benefits:</p><p><strong>Additional Skill Proficiency.</strong>
      You are Proficient in the Lore Skill.</p><p><strong>Learn From The
      Past.</strong> Once per Long Rest, when you would make a Skill Check using
      your Charisma Score, you can choose to make a Lore Check instead. If the
      result of the Lore Check is higher than the DC of the Skill Check, you
      succeed on that Skill Check.</p><h3>Xue Wu Zhi Jing</h3><p>“<em>In a group
      of three people, there will always be one person I can learn
      from.</em>”</p><p>A Famous Yanese Philsopher</p><p>You can mimic the
      Features of other species. To do so, you must write and study a Treatise
      on that Feature. When you select this Species, you begin with one Treatise
      already written and studied on a Feature of your
      choice.</p><p><strong>Writing a Treatise.</strong> Writing a Treatise is a
      Long Rest Activity that costs 1500 LMD. When you do so, choose a single
      Feature from a non-Rare Species, except the
      following:</p><ul><li><p>Ancient Versatility</p></li><li><p>Any Feature
      that would grant you any Arts.</p></li><li><p>Any Feature from a Species
      that has the Cling to the World Feature.</p></li></ul><p>When you write a
      Treatise, you can choose to have studied it at the same time. A Treatise
      has a value of 0 LMD.</p><p><strong>Studying a Treatise.</strong> Studying
      a Treatise is a Long Rest Activity, as if you were concentrating on an
      Art. You can only study Treatise that you have written. At the end of that
      Activity, you gain the Feature the Treatise is written on, including any
      negative effects. You can only have one Treatise studied at a time;
      studying a new Treatise replaces the previous Feature with the newly
      studied one. Any Feature that provides a longer-term benefit (such as the
      special Inspiration from the Phidia’s Agendum Feature) can only be used
      while that Treatise is the currently studied one.</p><h3>Divine Right of
      Kings</h3><p>The Elder species once ruled over the Ancients, using them as
      footsoldiers in their conflict with the Teekaz. After their victory, they
      ruled over their subjects, often with an iron fist, until they were cast
      down by the Ancients that placed them on those Thrones. Now, while members
      of the Elder Races are rare, they have never forgotten that they used to
      rule.</p><p>You have Advantage on any Charisma based Check against a
      Creature who’s Level or CR is lower than your own.</p>
