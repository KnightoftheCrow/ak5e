  description:
    value: >-
      <h2>Oni Traits</h2><p><strong>Creature Type:</strong> You are a descendant
      of the Teekaz; your horns and stature mark you as such. You are a Fiend
      (Humanoid)</p><p><strong>Size:</strong> Oni have a reputation for being
      physically imposing, but there is huge variance in the height of Oni, from
      5 feet to 6 and a half feet in height, trending towards 6 feet. Due to
      this variance, there is a similar variance in their weight; their heavy
      musculature puts their average weight around 190 pounds. Your size is
      Medium.</p><p><strong>Life Expectancy:</strong> As distant evolutionary
      relatives of the Sarkaz, the lifespan of an Oni is much greater than other
      Terrans. They reach maturity around 18 years old, and can live for over a
      hundred years, though not as far as 150.</p><p><strong>Speed:</strong>
      Your base Walking Speed is 30 feet.</p><p><strong>Ability Score
      Improvement:</strong> Your Strength Score increases by 2, and two other
      scores of your choice increase by
      1.</p><blockquote><p><strong>Variant:</strong> Larger Stature</p><p>When
      you choose this species, you can choose for your size to be Large. If you
      do, your base Walking Speed increases by 5ft, but you cannot wear
      equipment that isn’t made for someone of your
      size.</p></blockquote><h2>Oni Features</h2><p>As an Oni, you gain the
      following Features:</p><h3>Demonic Strength</h3><p>The strength of the Oni
      is a thing of legend. You gain the following
      benefits:</p><p><strong>Earthmover.</strong> You count as one size larger
      when determining your carrying capacity and the weight you can push, drag,
      or lift.</p><p><strong>Supreme Strength.</strong> You have Advantage on
      Strength-based Ability Checks and Strength Saving Throws.</p><h3>Journey
      of Self-Pacification</h3><p>So far removed from the Royal Courts of the
      Sarkaz cousins, the Oni have had to confront their nature unsupported;
      chaining their rage away with discipline and meditation. This practice of
      self-strengthening has been essential for their survival and integration
      within society, and has given them a mental fortitude unmatched by most.
      You gain the following benefits:</p><p><strong>Condition
      Resistance.</strong> You have Advantage on Saving Throws to avoid or end
      the Frightened or Charmed Condition.</p><p><strong>Damage
      Resistance.</strong> You are Resistant to Psychic
      Damage.</p><p><strong>Mediator.</strong> You have Advantage on
      Charisma-based Checks to convince Creatures to disarm or choose a
      non-violent option.</p><h3>Journey’s End</h3><p>The mental fortitude of
      the Oni is ironclad, but even iron can crack under enough pressure. When
      driven to it, an Oni can issue a stark reminder that the bloody rampages
      of the Oni are more than stories.</p><p>Once per Long Rest when your Turn
      begins, you can choose to enter a berserk state known as
      Bloodfury.</p><p>While active, your Bloodfury follows the rules
      below:</p><p><strong>Berserk Mind.</strong> When you enter a Bloodfury,
      and at the beginning of each Turn while you are in one, you choose the
      closest Creature you can see (your choice if it is tied), and can then
      choose to either Give In or Resist.</p><ul><li><p><strong>Give
      In:</strong> This Turn, you must attempt to move towards and attack that
      Creature. The first time during that Turn you hit that Creature with a
      Melee Attack, that Attack deals 2d6 additional Damage. This increases to
      3d6 at 7th Level, and 4d6 at 14th
      Level.</p></li><li><p><strong>Resist:</strong> You must make a DC15 Wisdom
      Saving Throw; you have Advantage on this Saving Throw if you cannot see a
      hostile Creature. On a successful Save, the Bloodfury ends. On a failed
      save, you take 1d8 Psychic Damage as you struggle to suppress the rage,
      but can move freely; you cannot make any Attacks or take any Action that
      would cause Damage to a Creature until the end of that Turn. If this
      Psychic Damage would reduce you to 0 Hit Points, your Bloodfury instead
      ends, and you gain 1 Exhaustion.</p></li></ul><p><strong>Condition
      Immunity.</strong> You are immune to the Frightened and Charmed
      Conditions.</p><p><strong>Disturbed Inner Calm.</strong> When you enter a
      Bloodfury, you lose all benefits from your “Journey of Self-Pacification”
      Feature until you complete a Long Rest.</p><p><strong>Duration.</strong>
      Your Bloodfury lasts 1 minute (10 rounds).</p><h3>Cling to the
      World</h3><p>The Teekaz lost this world to the Ancients long ago, and yet
      they remain; stubbornly clinging to their lives, and their place on
      Terra.</p><p>When you make a Death Saving Throw, you may add your
      Proficiency Bonus to the result of the roll.</p>
