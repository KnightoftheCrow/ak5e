  description:
    value: >-
      <p>In truth, little is known about the history of the Nine-Tailed Vulpo.
      That they are Vulpo, or at least closely related to them, is immediately
      obvious, for they bear the same large furred ears and brush-like tails;
      nine of them, in fact. Some have theorized that they were once, befitting
      those of an elder species, monarchs or spiritual rulers for the Vulpo
      immediately after the descent of the species not native to Terra. The
      latter theory seems to have particular prominence, given their role in
      modern Terra; Nine-Tailed Vulpo are almost exclusively from Higashi, where
      they serve as religious leaders and shrine keepers for the prominent faith
      of that land. They are considered to be wise seers, capable of charting
      the correct path, both literally and figuratively; some legends tell of
      lost travellers being led to safety by a mysterious stranger casting
      unusual light, only to catch a glimpse of nine tails when they are finally
      safe. Equally, however, do legends tell of their mischevious, even
      malicious streak; with their unique Originium Arts, a Nine-Tailed Vulpo is
      capable of disguising themselves as others. Their use of these Arts within
      the legends ranges from helpful aid, to simple pranks, to bloody
      murder.</p><p>Despite this reverence, however, unspoken questions remain.
      Across Terra, resentment burns against the elder species for their epochs
      of oppressive rule over the ancient species. In Higashi, they claim it is
      not so, revering the Nine-Tailed Vulpo for their role in the founding of
      the nation, or so the legends say. Why then, is it exceedingly rare for a
      Nine-Tailed Vulpo to be free? Why then, are they are all but trapped by
      their role and their shrines? Why then, is their history almost unknown,
      and that which is obscured by myth and legend?</p><h2>Nine-Tailed Vulpo
      Traits</h2><p><strong>Creature Type:</strong> You are a
      Humanoid.</p><p><strong>Size:</strong> Vulpo are typically between 5 and 6
      feet in height, trending towards the lower end, with an average weight of
      130lbs. On average, male Vulpo are taller than their female counterparts.
      Your size is Medium.</p><p><strong>Life Expectancy:</strong> Vulpo reach
      adulthood around the age of 18, and have a life expectancy of around 80
      years.</p><p><strong>Speed:</strong> Your base Walking Speed is 30
      feet.</p><p><strong>Ability Score Improvement:</strong> Your Charisma
      Score increases by 2, and two other scores of your choice increase by
      1.</p><h2>Nine-Tailed Vulpo Features</h2><p>As a Nine-Tailed Vulpo, you
      gain the following Features:</p><h3>Faceless Tricksters</h3><p>Nine-tailed
      Vulpo have a variable reputation over the east of Terra. Some legends cast
      them as benevolent agents and guardians; others as malicious, sadistic,
      and power-hungry. No matter the subject however, the legends agree on one
      aspect; they can wear faces that are not their own.</p><p>You learn the
      Disguise Self Art, and can cast it at will; this Art is always prepared.
      If you do not have the Ability to cast Arts in another way, Charisma is
      your Arts Casting Ability for this Art; you do not need a Weapon with the
      Casting Unit Property to cast this Art. Additionally, when you cast this
      Art, you may use your Martial DC in place of your Spell Save
      DC.</p><h3>Foxfire</h3><p>The Originium Arts of the Nine-Tailed Vulpo are
      a sight to behold; radiant light that sparkles like gemstones, yet is not
      dazzling in its intensity. These lights can guide, distract, and entertain
      in equal measure. You gain the following
      benefits:</p><ul><li><p><strong>Burn.</strong> Once per Short Rest, you
      can cast the Faerie Fire Art as a Bonus Action using this Trait. Starting
      from 7th Level, you may cast this Art in this way twice per Short Rest
      instead.</p></li><li><p><strong>Guide.</strong> You can cast the Dancing
      Lights Cantrip at will using this Trait.</p></li></ul><h3>Incredible Sense
      of Smell</h3><p>The Vulpo’s sense of smell is so adept, their other senses
      can sometimes take a backseat.</p><p>As long as you have access to your
      sense of smell, you have 20 feet of Blindsight. From 7th level, you can
      also see Invisible Creatures within this range.</p><h3>Divine Right of
      Kings</h3><p>The Elder species once ruled over the Ancients, using them as
      footsoldiers in their conflict with the Teekaz. After their victory, they
      ruled over their subjects, often with an iron fist, until they were cast
      down by the Ancients that placed them on those Thrones. Now, while members
      of the Elder Races are rare, they have never forgotten that they used to
      rule.</p><p>You have Advantage on any Charisma based Check against a
      Creature who’s Level or CR is lower than your own.</p>
