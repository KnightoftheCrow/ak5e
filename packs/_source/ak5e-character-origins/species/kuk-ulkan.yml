  description:
    value: >-
      <p>Often mistaken from both Liberi and Phidia, the K’uk’ulkan are tall of
      frame, possessing feathered wing-like structures on their head and massive
      ophidian tails, with frightening dexterity for their size. The K’uk’ulkan
      are principally rare, existing almost exclusively in hidden, scattered
      enclaves all throughout Terra- K’uk’ulkan away from these enclaves are
      often solitary folk. In the distant past, the species was tied to the
      ancient Sargonian Empire, being depicted in carvings and writings from
      that time. These writing speak of the K’uk’ulkan “ruling the skies”,
      “blessed by the heavens”, and even altering the weather with their
      Arts.</p><p>Much like the Sargonian Empire however, the K’uk’ulkan have
      fallen far. In those long-passed ages, the K’uk’ulkan shared the gigantic
      life expectancy of other Elder species. However, around six centuries ago,
      they became obsessed with the preservation of knowledge and history for
      reasons unknown to all but themselves. The keeping of knowledge became the
      burden of the K’uk’ulkan, and they devised a series of rituals and
      surgeries by which to implant knowledge into the minds of young
      K’uk’ulkan, ensuring that nothing was forgotten. Of course, turning young
      minds into living repositories has dramatic side effects, vastly
      shortening the lifespan of the victims.</p><p>Even putting aside the
      horrific effects on the health of its adherents, this practice is yet
      another millstone around the necks of the K’uk’ulkan. Their once vaunted,
      weather-changing might is a thing unknown, of the ancient past; while they
      retain their affinity for weather-based Arts, they do not typically live
      long enough to mature into the feathered serpents that once ruled Sargon’s
      skies. One hopes that the reason for this ritual is thus worth this
      sacrifice; if any still remember the reason for it.</p><h2>K’uk’ulkan
      Traits</h2><p><strong>Creature Type:</strong> You are a
      Humanoid.</p><p><strong>Size:</strong> K’uk’ulkan are typically tall of
      stature, clocking in on the upper half of five feet, and bear large,
      ophidian tails that add to their weight. On average, a K’uk’ulkan weighs
      about 160 pounds; your size is Medium.</p><p><strong>Life
      Expectancy:</strong> K’uk’ulkan reach adulthood around the age of 18.
      However, due to the brutal rituals K’uk’ulkan to instill them with their
      ancestral knowledge, their life span is cut dramatically. Your life
      expectancy is 60 years.</p><p><strong>Speed:</strong> Your base Walking
      Speed is 30 feet.</p><p><strong>Ability Score Improvement:</strong> Your
      Intelligence Score increases by 2, and two other scores of your choice
      increase by 1.</p><h2>K’uk’ulkan Features</h2><p>As a K’uk’ulkan, you gain
      the following Features:</p><h3>Burden of the Blessed</h3><p>The K’uk’ulkan
      always have the full weight of history at their beck and call; the answer
      for every solution lies within, if they are willing to risk further
      suppuration of their grey matter.</p><p>When you roll a d20 (such as for a
      Skill Check or Attack Roll) and the target number is less than 20 + your
      Modifiers to that roll, you can instead choose to succeed on that Roll
      with the minimum possible value to succeed. If you do, make a DC15 Saving
      Throw; you do not apply any modifiers, and cannot use this Feature on that
      Saving Throw. On a failed Save, your Life Expectancy decreases by 1d10
      years. On a successful Save, nothing happens. If your Life Expectancy is
      reduced to a lower value than your current age, roll 2d12; after that many
      days have passed, you die. You are aware this end is
      nigh.</p><blockquote><p><strong>Variant Rule: A Painful
      Exchange</strong></p><p>If the starting age of a Character of this Species
      during Character Creation is greater than 40, they may increase one of
      their Ability Scores by 1 on DM
      Discretion.</p></blockquote><h3>Constrictor</h3><p>Much like the Phidia
      they are often mistaken for, the tail of a K’uk’ulkan is both dextrous and
      strong. you gain the following
      benefits:</p><ul><li><p><strong>Prehensile.</strong> During each of your
      Turns, you can interact with two objects without having to use your
      Action, as opposed to one.</p></li><li><p><strong>Python Strike.</strong>
      When you take the Grapple Action, you can do so using your tail and thus
      not requiring a free hand. When you make a Athletics Check to initiate a
      Grapple in this way, or prevent a Creature grappled by your tail from
      escaping, you may use your Dexterity bonus instead of
      Strength.</p></li></ul><h3>Stormborne</h3><p>The K’uk’ulkan were once said
      to live amongst the clouds and control the weather; that power has long
      since faded, but they have retained their affinity with the primordial
      force of storms.</p><p>You learn a number of Arts from the Fluid,
      Lightning, and Wind Arts Pools, shown below; these Arts are always
      prepared. Intelligence is your Spellcasting Ability for these Arts, and
      you can cast them without a weapon with the Casting Unit Property. If you
      would gain the ability to cast one of these Arts from a different source,
      that Art instead permanently costs 1 fewer Arts Point to cast for
      you.</p><table><tbody><tr><td><p style="text-align:center"><strong>Arts
      Level</strong></p></td><td><p style="text-align:center"><strong>Arts
      Learned</strong></p></td></tr><tr><td><p
      style="text-align:center">Cantrip</p></td><td><p
      style="text-align:center">Gust, Shocking Grasp</p></td></tr><tr><td><p
      style="text-align:center">1st</p></td><td><p style="text-align:center">Fog
      Cloud, Ligtning Spear</p></td></tr><tr><td><p
      style="text-align:center">2nd</p></td><td><p
      style="text-align:center">Gust of Wind, Air Barrage, Water
      Pulse</p></td></tr><tr><td><p style="text-align:center">3rd</p></td><td><p
      style="text-align:center">Fly</p></td></tr></tbody></table><p>Once per
      Long Rest, when you would expend Arts Points to cast an Art you learned
      from this Feature, you can cast it without expending Arts Points. The
      maximum level of Arts you can cast using this Feature is shown in the
      K’uk’ulkan Arts Table.</p><h3>K’uk’ulkan Arts</h3><table><tbody><tr><td><p
      style="text-align:center"><strong>Character Level</strong></p></td><td><p
      style="text-align:center"><strong>Maximum Arts
      Level</strong></p></td></tr><tr><td><p
      style="text-align:center">1+</p></td><td><p
      style="text-align:center">1</p></td></tr><tr><td><p
      style="text-align:center">7+</p></td><td><p
      style="text-align:center">2</p></td></tr><tr><td><p
      style="text-align:center">14+</p></td><td><p
      style="text-align:center">3</p></td></tr></tbody></table><h3>Divine Right
      of Kings</h3><p>The Elder species once ruled over the Ancients, using them
      as footsoldiers in their conflict with the Teekaz. After their victory,
      they ruled over their subjects, often with an iron fist, until they were
      cast down by the Ancients that placed them on those Thrones. Now, while
      members of the Elder Races are rare, they have never forgotten that they
      used to rule.</p><p>You have Advantage on any Charisma based Check against
      a Creature who’s Level or CR is lower than your own.</p>
