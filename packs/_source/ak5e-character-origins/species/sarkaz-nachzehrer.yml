  description:
    value: >-
      <p>On a cursory examination, one could confuse a Nachzehrer for a Vampire;
      tall and slender in stature, and pale in skin. Unlike Vampires, however,
      Nachzehrer do possess the horns typically associated with
      Sarkaz.</p><p>The most notable trait of the Nachzehrer is the very one
      that has given rise to their association with war and death; their ability
      to “eat” the fallen by absorbing all the nutrients and mass left in the
      corpse, leaving it a dessicated husk. When they do so, they learn the
      recent memories of those they consume.</p><p>For many Nachzehrer, this is
      a deeply spiritual and religious act; their death is not the end so long
      as they are consumed by another. Every Nachzehrer is nourished by they who
      came before. Some Nachzehrer take this a step further, physically
      consuming the flesh of their fallen enemies and comrades.</p><h1>Sarkaz
      Nachzehrer Traits</h1><p><strong>Creature Type:</strong> As the direct
      descendants of the Teekaz, you are a Fiend
      (Humanoid).</p><p><strong>Size:</strong> As the Sarkaz are, in reality, a
      collection of related subspecies joined under one heading, their physical
      size and build can vary greatly. Generally speaking, however, they fall
      between 5 feet and 6 and a half feet in height, and around 160 pounds in
      weight. Male Sarkaz tend to be taller and heavier, but it is not a given.
      Your size is Medium.</p><p><strong>Life Expectancy:</strong> The Sarkaz
      mature at the same rate as many other races, reaching adulthood around 18,
      but have a vastly extended lifespan, able to live for many centuries.
      Most, however, do not live this long; the life of the Sarkaz is hard,
      fraught with peril, and Oripathy can shorten their lifespan dramatically,
      as it does all others.</p><p><strong>Speed:</strong> Your base Walking
      Speed is 30 feet.</p><p><strong>Ability Score Improvement:</strong> Your
      Constitution Scores increases by 1, and you may increase two other scores
      of your choice by 1, or one other score of your choice by 2.</p><h1>Sarkaz
      Nachzehrer Features</h1><p>As a Sarkaz Nachzehrer, you gain the following
      Features:</p><h3>Nephesh</h3><p>All Sarkaz have an intrinsic, genetic
      connection to the Sarkaz of the past and present. The memories of the
      Sarkaz are embedded in their very genetics, allowing modern Sarkaz to
      recall the events of centuries ago as if they were there, under the right
      conditions. You gain the following benefits:</p><p><strong>Ancestral
      Knowledge.</strong> Whenever you would make a Lore Check regarding the
      history of the Sarkaz, or events that directly pertain to it, you are
      treated as having Expertise in that skill. If you already have Expertise,
      you make that Check at Advantage.</p><p><strong>Lifelink.</strong> When a
      Sarkaz you know dies, you immediately become aware of it, though you learn
      nothing about the circumstances.</p><h3>Witchcraft</h3><p>Sarkaz have a
      tighter bond with Originum and the curse of Oripathy than other races, and
      can wield it to destructive effect; both for themselves and their
      foes.</p><p>You have access to the Witchcraft Arts Pool; these are Sarkaz
      Arts. These Arts are always prepared. If you cannot cast Arts in another
      way, Wisdom is your Spellcasting Ability for these Arts; you do not need a
      weapon with the Casting Unit Property to cast these Arts.</p><p>Once per
      Long Rest, you can cast a Sarkaz Art without expending any Arts Points.
      The maximum level of Sarkaz Art you can cast in this way is controlled by
      your Character Level. At 7th Level, you can cast Sarkaz Arts in this way
      twice per Long Rest.</p><table><thead><tr><td><p
      style="text-align:center"><strong>Character Level</strong></p></td><td><p
      style="text-align:center"><strong>Maximum Arts
      Level</strong></p></td></tr></thead><tbody><tr><td><p>1</p></td><td><p>1</p></td></tr><tr><td><p>2</p></td><td><p>1</p></td></tr><tr><td><p>3</p></td><td><p>1</p></td></tr><tr><td><p>4</p></td><td><p>1</p></td></tr><tr><td><p>5</p></td><td><p>1</p></td></tr><tr><td><p>6</p></td><td><p>1</p></td></tr><tr><td><p>7</p></td><td><p>2</p></td></tr><tr><td><p>8</p></td><td><p>2</p></td></tr><tr><td><p>9</p></td><td><p>2</p></td></tr><tr><td><p>10</p></td><td><p>2</p></td></tr><tr><td><p>11</p></td><td><p>2</p></td></tr><tr><td><p>12</p></td><td><p>2</p></td></tr><tr><td><p>13</p></td><td><p>2</p></td></tr><tr><td><p>14</p></td><td><p>3</p></td></tr><tr><td><p>15</p></td><td><p>3</p></td></tr><tr><td><p>16</p></td><td><p>3</p></td></tr><tr><td><p>17</p></td><td><p>3</p></td></tr><tr><td><p>18</p></td><td><p>3</p></td></tr><tr><td><p>19</p></td><td><p>4</p></td></tr><tr><td><p>20</p></td><td><p>4</p></td></tr></tbody></table><h3>In
      Death, Life; In Life, Death</h3><p>The Nachzehrer are called the
      personification of war by some. For many, that invokes the image of
      powerful warriors laying waste to their foes. The Nachzehrer fit this
      bill, but it is not for this reason that they embody war; the Nachzehrer
      feast upon death to continue, just as war does.</p><p>Once per Short Rest,
      you may “consume” a corpse by absorbing all of the nutrients from it over
      the course of a minute, leaving it a deflated husk; you must remain in
      contact with the corpse for the entire duration. When you do so, you gain
      Rot equal to the CR or Level of that Creature (minimum 1). The maximum Rot
      you can have is equal to your Character Level. In addition, when you do
      this, you can ask that corpse a single question, as if it was under the
      effect of the Speak with Dead Art; it must be as truthful as it is
      possible for it to be in its answer.</p><p>When you cast a Necrotic Art,
      you may expend any amount of your Rot (no Action required); you gain a
      Bonus to your Spell Save DC and Spell Attack Rolls for the casting of the
      Art equal to the amount of Rot expended.</p><h3>Rot and
      Ruin</h3><p>Relentless, gruesome, ruinous; all words that could be used to
      describe the Nachzehrer and their withering Arts.</p><p>You learn the Arts
      from the Necrotic Arts Pool; these are Sarkaz Arts. If you do not have the
      Ability to cast Arts in another way, Charisma is your Arts Casting
      Ability; you do not need a weapon with the Casting Unit Property to cast
      these Arts.</p>
