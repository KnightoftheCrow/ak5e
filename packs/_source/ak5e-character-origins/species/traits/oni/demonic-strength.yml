  description:
    value: >-
      <h3>Demonic Strength</h3><p>The strength of the Oni is a thing of legend.
      You gain the following benefits:</p><p><strong>Earthmover.</strong> You
      count as one size larger when determining your carrying capacity and the
      weight you can push, drag, or lift.</p><p><strong>Supreme
      Strength.</strong> You have Advantage on Strength-based Ability Checks and
      Strength Saving Throws.</p><p><strong>Semi-Automated. </strong>Supreme
      Strength is automated, not Earthmover.</p>
