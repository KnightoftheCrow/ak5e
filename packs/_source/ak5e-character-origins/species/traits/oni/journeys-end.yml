  description:
    value: >-
      <h3>Journey’s End</h3><p>The mental fortitude of the Oni is ironclad, but
      even iron can crack under enough pressure. When driven to it, an Oni can
      issue a stark reminder that the bloody rampages of the Oni are more than
      stories.</p><p>Once per Long Rest when your Turn begins, you can choose to
      enter a berserk state known as Bloodfury.</p><p>While active, your
      Bloodfury follows the rules below:</p><p><strong>Berserk Mind.</strong>
      When you enter a Bloodfury, and at the beginning of each Turn while you
      are in one, you choose the closest Creature you can see (your choice if it
      is tied), and can then choose to either Give In or
      Resist.</p><ul><li><p><strong>Give In:</strong> This Turn, you must
      attempt to move towards and attack that Creature. The first time during
      that Turn you hit that Creature with a Melee Attack, that Attack deals 2d6
      additional Damage. This increases to 3d6 at 7th Level, and 4d6 at 14th
      Level.</p></li><li><p><strong>Resist:</strong> You must make a DC15 Wisdom
      Saving Throw; you have Advantage on this Saving Throw if you cannot see a
      hostile Creature. On a successful Save, the Bloodfury ends. On a failed
      save, you take 1d8 Psychic Damage as you struggle to suppress the rage,
      but can move freely; you cannot make any Attacks or take any Action that
      would cause Damage to a Creature until the end of that Turn. If this
      Psychic Damage would reduce you to 0 Hit Points, your Bloodfury instead
      ends, and you gain 1 Exhaustion.</p></li></ul><p><strong>Condition
      Immunity.</strong> You are immune to the Frightened and Charmed
      Conditions.</p><p><strong>Disturbed Inner Calm.</strong> When you enter a
      Bloodfury, you lose all benefits from your “Journey of Self-Pacification”
      Feature until you complete a Long Rest.</p><p><strong>Duration.</strong>
      Your Bloodfury lasts 1 minute (10 rounds).</p><p><strong>Not
      Automated.</strong></p>
