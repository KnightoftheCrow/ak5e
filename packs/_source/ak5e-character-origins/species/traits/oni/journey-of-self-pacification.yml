  description:
    value: >-
      <h3>Journey of Self-Pacification</h3><p>So far removed from the Royal
      Courts of the Sarkaz cousins, the Oni have had to confront their nature
      unsupported; chaining their rage away with discipline and meditation. This
      practice of self-strengthening has been essential for their survival and
      integration within society, and has given them a mental fortitude
      unmatched by most. You gain the following
      benefits:</p><p><strong>Condition Resistance.</strong> You have Advantage
      on Saving Throws to avoid or end the Frightened or Charmed
      Condition.</p><p><strong>Damage Resistance.</strong> You are Resistant to
      Psychic Damage.</p><p><strong>Mediator.</strong> You have Advantage on
      Charisma-based Checks to convince Creatures to disarm or choose a
      non-violent option.</p><p><strong>Partially Automated.</strong> Resistance
      to psychic damage Automated. Mediatir and condition resistance not
      automated.</p>
