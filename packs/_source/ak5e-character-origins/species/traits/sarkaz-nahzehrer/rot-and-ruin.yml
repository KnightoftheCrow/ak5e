    value: >-
      <h3>Rot and Ruin</h3><p>Relentless, gruesome, ruinous; all words that
      could be used to describe the Nachzehrer and their withering
      Arts.</p><p>You learn the Arts from the Necrotic Arts Pool; these are
      Sarkaz Arts. If you do not have the Ability to cast Arts in another way,
      Charisma is your Arts Casting Ability; you do not need a weapon with the
      Casting Unit Property to cast these Arts.</p><p><strong>Not
      Automated.</strong></p>
