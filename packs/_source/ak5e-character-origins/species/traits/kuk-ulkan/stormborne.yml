  description:
    value: >-
      <h3>Stormborne</h3><p>The K’uk’ulkan were once said to live amongst the
      clouds and control the weather; that power has long since faded, but they
      have retained their affinity with the primordial force of
      storms.</p><p>You learn a number of Arts from the Fluid, Lightning, and
      Wind Arts Pools, shown below; these Arts are always prepared. Intelligence
      is your Spellcasting Ability for these Arts, and you can cast them without
      a weapon with the Casting Unit Property. If you would gain the ability to
      cast one of these Arts from a different source, that Art instead
      permanently costs 1 fewer Arts Point to cast for you.</p><p>(Arts that are
      <span style="text-decoration:underline"><span
      style="text-decoration:underline">underlined</span></span> require the
      Player's Handbook. Arts that are in <em>italics</em> require Tasha's
      Cauldron of Everything. Arts that are <strong>Bold</strong> are not
      currently available in official content on Foundry; often Xanathar's Guide
      to Everything.)</p><table><tbody><tr><td><p
      style="text-align:center"><strong>Arts Level</strong></p></td><td><p
      style="text-align:center"><strong>Arts
      Learned</strong></p></td></tr><tr><td><p
      style="text-align:center">Cantrip</p></td><td><p
      style="text-align:center">Gust, Shocking Grasp</p></td></tr><tr><td><p
      style="text-align:center">1st</p></td><td><p style="text-align:center">Fog
      Cloud, Ligtning Spear</p></td></tr><tr><td><p
      style="text-align:center">2nd</p></td><td><p
      style="text-align:center">Gust of Wind, Air Barrage, Water
      Pulse</p></td></tr><tr><td><p style="text-align:center">3rd</p></td><td><p
      style="text-align:center">Fly</p></td></tr></tbody></table><p>Once per
      Long Rest, when you would expend Arts Points to cast an Art you learned
      from this Feature, you can cast it without expending Arts Points. The
      maximum level of Arts you can cast using this Feature is shown in the
      K’uk’ulkan Arts Table.</p><h3>K’uk’ulkan Arts</h3><table><tbody><tr><td><p
      style="text-align:center"><strong>Character Level</strong></p></td><td><p
      style="text-align:center"><strong>Maximum Arts
      Level</strong></p></td></tr><tr><td><p
      style="text-align:center">1+</p></td><td><p
      style="text-align:center">1</p></td></tr><tr><td><p
      style="text-align:center">7+</p></td><td><p
      style="text-align:center">2</p></td></tr><tr><td><p
      style="text-align:center">14+</p></td><td><p
      style="text-align:center">3</p></td></tr></tbody></table><p><strong>Automated.</strong></p>
