  description:
    value: >-
      <h3>Burden of the Blessed</h3><p>The K’uk’ulkan always have the full
      weight of history at their beck and call; the answer for every solution
      lies within, if they are willing to risk further suppuration of their grey
      matter.</p><p>When you roll a d20 (such as for a Skill Check or Attack
      Roll) and the target number is less than 20 + your Modifiers to that roll,
      you can instead choose to succeed on that Roll with the minimum possible
      value to succeed. If you do, make a DC15 Saving Throw; you do not apply
      any modifiers, and cannot use this Feature on that Saving Throw. On a
      failed Save, your Life Expectancy decreases by 1d10 years. On a successful
      Save, nothing happens. If your Life Expectancy is reduced to a lower value
      than your current age, roll 2d12; after that many days have passed, you
      die. You are aware this end is nigh.</p><blockquote><p><strong>Variant
      Rule: A Painful Exchange</strong></p><p>If the starting age of a Character
      of this Species during Character Creation is greater than 40, they may
      increase one of their Ability Scores by 1 on DM
      Discretion.</p></blockquote><p><strong>Not Automated.</strong></p>
