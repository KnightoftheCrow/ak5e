  description:
    value: >-
      <h3>Constrictor</h3><p>Much like the Phidia they are often mistaken for,
      the tail of a K’uk’ulkan is both dextrous and strong. you gain the
      following benefits:</p><ul><li><p><strong>Prehensile.</strong> During each
      of your Turns, you can interact with two objects without having to use
      your Action, as opposed to one.</p></li><li><p><strong>Python
      Strike.</strong> When you take the Grapple Action, you can do so using
      your tail and thus not requiring a free hand. When you make a Athletics
      Check to initiate a Grapple in this way, or prevent a Creature grappled by
      your tail from escaping, you may use your Dexterity bonus instead of
      Strength.</p></li></ul><p><strong>Not Automated.</strong></p>
