  description:
    value: >-
      <h3>Zanne del Lupo</h3><p>A Lone Wolf is dangerous enough, but a pack of
      wolves can tear even large threats to pieces.</p><p>Your first Attack you
      make each Turn against a Creature is made at Advantage if that Creature is
      within the Reach of at least one of your allies, and that ally is not
      Incapacitated.</p><p>From 7th Level, all Attacks you make against a
      Creature are made at Advantage if that Creature is within the Reach of at
      least one of your allies, and that ally is not
      Incapacitated.</p><p><strong>Automated: </strong>Your first Attack is
      rolled twice, but this is not shown correctly in the chat. From 7th Level,
      all your Attacks are rerolled.</p>
