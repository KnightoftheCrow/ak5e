  description:
    value: >-
      <h3>Odore di Sangue</h3><p>Lupi do not allow prey to escape easily; when
      the scent of blood is in the air, they are at their most
      vicious.</p><p>Once per Turn, when you would make an Attack on which you
      have Advantage against a Creature with less than half of its maximum Hit
      Points remaining, you can cause that Attack to deal 1d8 additional Damage
      (no Action required).</p><p><strong>Automated.</strong></p>
