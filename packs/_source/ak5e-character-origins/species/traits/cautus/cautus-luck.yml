  description:
    value: >-
      <h3>Cautus Luck</h3><p>Is it luck, base cunning, or a combination of the
      two? Regardless of the reason, Cautus seem to have a knack for “landing on
      their feet”, even when they have no business doing so.</p><p>When you roll
      a 1 on the d20 for an Attack Roll, Ability Check, or Saving Throw, you can
      reroll the die and must use the new
      roll.</p><p><strong>Automated.</strong></p>
