  description:
    value: >-
      <h3>Breath of Life</h3><p>Hearthfire Draco also hold power over life;
      their “flames” are not flames in the traditional sense at all; their
      domain lies in power over cellular respiration. By speeding up the natural
      processes of the body, they promote wound healing and recovery, at the
      cost of their own life force.</p><p>You have a pool of dice equal to twice
      your Proficiency Bonus. These dice are d4’s; your pool of dice is refilled
      to its maximum whenever you complete a Long Rest.</p><p>As an Action, you
      can choose a Creature you can see within 60 feet, and expend any amount of
      dice from your pool. Roll those dice, and add your Charisma Modifier
      (unless it is negative); the chosen Creature regains Hit Points equal to
      the total. If you can cast any levelled Art, you may use this Feature as a
      Bonus Action instead.</p><p>From 7th Level, the size of the dice in your
      pool is increased to d6.</p><p><strong>Not Automated.</strong></p>
