  description:
    value: >-
      <h3>In Their Blood</h3><p>Caprinae have a natural affinity for Arts; even
      those who do not choose to pursue it have that might imprinted upon them
      from birth. You gain the following benefits:</p><ul><li><p><strong>Arts
      Proficiency.</strong> You gain Proficiency in the Arts
      Skill.</p></li><li><p><strong>Inherent Magic.</strong> Choose one of the
      Arts Pools available to the Caster Class; you learn all of the Cantrips
      for that Arts Pool, in addition to a 1st Level and a 2nd Level Spell of
      your choice from that Arts Pool.</p><p>Intelligence, Wisdom, or Charisma
      is your Spellcasting Ability for these Arts (choose when you gain this
      Feature). Additionally, you do not require a weapon with the Casting Unit
      Property to cast these Arts.</p><p>Once per Short Rest, when you would
      expend Arts Points to cast an Art you learned from this Feature, you can
      cast it without expending Arts Points. The maximum level of Arts you can
      cast using this Feature is shown in the Caprinae Arts
      Table.</p></li></ul><table><thead><tr><td><p><strong>Character
      Level</strong></p></td><td><p><strong>Maximum Arts
      Level</strong></p></td></tr></thead><tbody><tr><td><p>1+</p></td><td><p>1</p></td></tr><tr><td><p>7+</p></td><td><p>2</p></td></tr></tbody></table><hr><p><strong>Automated:
      </strong>Drag and Drop the Arts you want to learn from the Compendium.</p>
