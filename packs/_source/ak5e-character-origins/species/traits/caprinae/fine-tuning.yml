  description:
    value: >-
      <h3>Fine Tuning</h3><p>Perhaps due to their natural affinity for Arts
      tuning them into the flow of things at a subconscious level, Caprinae can
      place their blows and their Arts to achieve maximum effect.</p><p>Once per
      Turn, when you roll to determine the Damage you deal, or the Hit Points
      you restore with an Art, you can roll one additional die and discard the
      die with the lowest result.</p><hr><p><strong>Automated: </strong>You have
      an Opt-In effect when rolling Damage or Healing.</p>
