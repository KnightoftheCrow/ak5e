  description:
    value: >-
      <h3>Dragon’s Rage</h3><p>A deep heat burns within the breast of every
      Draco; while they learn to live with it, it is a chronic and constant
      pain. This flame is the engine of their power, and when fully unleashed
      alongside their wrath, it is to lethal effect.</p><p>You learn the Hellish
      Rebuke Art; this Art is always prepared. If you do not have the Ability to
      cast Arts in another way, Charisma is your Arts Casting Ability for this
      Art; you do not need a Weapon with the Casting Unit Property to cast this
      Art. Additionally, when you cast this Art, you may use your Martial DC in
      place of your Spell Save DC.</p><p>Once per Short Rest, You can cast this
      Art at 1st Level without expending any Arts Points. From 7th Level, when
      casting this Art via this Feature, you may instead cast it at 2nd
      Level.</p><p><strong>Partially Automated. </strong>The spell is given with
      this feature.</p>
