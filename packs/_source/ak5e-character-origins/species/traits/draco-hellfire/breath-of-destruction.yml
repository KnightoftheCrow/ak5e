  description:
    value: >-
      <h3>Breath of Destruction</h3><p>Hellfire Draco wield fire in its most
      literal, primal sense; they convert their inner fire, their life force,
      into explosive, combustive force.</p><p>You have a pool of dice equal to
      twice your Proficiency Bonus. These dice are d4’s; your pool of dice is
      refilled to its maximum whenever you complete a Long Rest.</p><p>As an
      Action, you can choose a Creature you can see within 60 feet, and expend
      any amount of dice from your pool. Roll those dice; that Creature must
      then make a Dexterity Saving Throw against either your Spell Save DC or
      Martial DC (your choice). On a failed Save, they take Fire Damage equal to
      the amount rolled and begin Burning. On a successful Save, they take half
      as much Damage and suffer no other effects. If you can cast any levelled
      Art, when you use this Feature, you can cause it to burst explosively
      outwards; this feature affects all Creatures within 10 feet of the chosen
      Creature, not just the chosen Creature.</p><p>From 7th Level, the size of
      the dice in your pool is increased to d6.</p><p><strong>Not
      Automated.</strong></p>
