  description:
    value: >-
      <h3>Cognitovore</h3><p>As you walk the streets of any location, you cannot
      help but brush your mind against others; a mere taste of what lies inside
      their skulls. With just a little urging, you can dig deeper, like a bird
      pecking for worms, and coax free the sustenance your crave. You can do so
      gently, excising pain and misery; or you can rip it free, leaving a raw
      psychological wound for you to exploit.</p><p>You can sense the surface
      thoughts of any Creature within 15 feet, as long as that Creature has an
      Intelligence Score greater than 3, and is not an Undead, Plant, or
      Construct. You learn how these Creatures are feeling in simple terms, such
      as Angry or Sad.</p><p>As an Action, you can attempt to probe deeper into
      the thoughts of a Creature you can read the surface thoughts of. That
      Creature must make an Intelligence Saving Throw (DC = 8 + Your Charisma
      Bonus + Proficiency Bonus OR Your Spell Save DC) to resist the effect; a
      Creature can choose to fail this Saving Throw.</p><p>On a successful Save,
      you learn nothing, and the Creature becomes immune to this effect for 24
      hours. On a failed Saving Throw, you gain insight into what they are
      currently thinking about, its reasoning for its actions, and something
      that it thinks about often (such as a loved one, or a major point of
      stress) for 1 minute.</p><p>A target Creature knows you are probing its
      mind, and can reattempt the Saving Throw at the end of each of their
      Turns, ending the effect on a success. You can only probe the thoughts of
      one Creature at a time in this way; using this effect on another Creature
      ends the effect on the first.</p><p>Additionally, when a Creature fails
      the initial Saving Throw against this effect, you can consume a thought
      gently or roughly. If you consume a thought gently, that Creature is
      considered to be under the effect of the Heroism Art until you stop
      probing deeper into their thoughts. If you consume a thought roughly, that
      Creature is Dazed until you stop probing deeper into their
      thoughts.</p><p><strong>Not Automated.</strong></p>
