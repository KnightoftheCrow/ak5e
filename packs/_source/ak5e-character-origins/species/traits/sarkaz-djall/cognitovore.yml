  advancement: {}
  description:
    value: >-
      <h3>Cognitovore</h3><p>You cannot help but brush your mind against others;
      a mere taste of what lies inside their skulls. With just a little urging,
      you can dig deeper, like a bird pecking for worms, and coax free the
      sustenance your crave. You can do so gently, excising pain and misery; or
      you can rip it free, leaving a raw psychological wound for you to exploit.
      You gain the following benefits:</p><ul><li><p><strong>Detect
      Thoughts.</strong> You can sense the surface thoughts of any Creature
      within 15 feet, as long as that Creature has an Intelligence Score greater
      than 3, and is not an Undead, Plant, or Construct. You learn how these
      Creatures are feeling in simple terms, such as Angry or
      Sad.</p></li><li><p><strong>Thoughtseize.</strong> Once per Short Rest as
      an Action, you can attempt to probe deeper into the thoughts of a Creature
      you can read the surface thoughts of; that Creature must make an
      Intelligence Saving Throw (DC = 8 + Your Charisma Bonus + Proficiency
      Bonus OR Your Spell Save DC); a Creature can choose to fail this Saving
      Throw. On a successful Save, you learn nothing, and the Creature becomes
      immune to this effect for 24 hours. On a failed Saving Throw, you may ask
      the DM one question about that Creature; that DM truthfully shares one of
      that Creature’s memories with you that tries to answer your
      question.</p><p>Additionally, when a Creature fails the initial Saving
      Throw against this effect, you can choose to consume the memory you saw
      gently or roughly. If you consume a thought gently, that Creature is
      considered to be under the effect of the Heroism Art for 1 minute. If you
      consume a thought roughly, that Creature is Dazed for 1 minute. Either
      way, that Creature loses that
      memory.</p></li></ul><hr><p><strong>Semi-Automated: </strong>Use the
      Thoughtseize Activity when you desire, and choose the correct effect for
      Creatures that fail the Save. Detect Thoughts cannot be automated.</p>
