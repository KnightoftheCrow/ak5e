  description:
    value: >-
      <h3>Key to the Heart</h3><p>The Djall’s original fearsome reputation comes
      from their innate proficiency for Psychic Arts. When facing a Djaj, your
      own mind is not your ally.</p><p>You learn all levelled Arts from the
      Psychic Arts Pool; these are considered to be Sarkaz Arts. If you do not
      have the Ability to cast Arts in another way, Charisma is your Arts
      Casting Ability; you do not need a weapon with the Casting Unit Property
      to cast these Arts.</p><p>If you gain the ability to cast any of these
      Psychic Arts in another way, you instead gain a permanent +1 to your Spell
      Save DC and Spell Attack Rolls when casting that
      Art.</p><p><strong>Partially Automated.</strong> Psychic Arts Pool is
      given automatically.</p>
