  description:
    value: >-
      <h3>Living Weapon</h3><p>Despite the vehement discourse on whether the
      Abyssal Hunters should even have been created, both sides of the argument
      can agree on one thing; they are weapons. Like any weapon, they require
      the right tools and proper maintenance to remain useful in their battle
      against the Seaborn. You gain the following
      benefits:</p><p><strong>Additional Weapon Proficiencies.</strong> You are
      Proficient with Heavy Melee Weapons.</p><p><strong>Anti-Aberration
      Conditioning.</strong> You have Advantage on Saving Throws against
      Aberrations. If you would already have Advantage on that Saving Throw, you
      can roll three dice and keep the highest
      result.</p><p><strong>Semi-Automated. </strong>Proficiency in heavy melee
      weapons is automated. About the anti-aberration conditioning, you will be
      prompted on whether your Saving Throw is against an Aberration, when you
      make a Saving Throw; this will provide Advantage if you choose "yes". If
      you already have advantage, the third throw must be manually done.</p>
