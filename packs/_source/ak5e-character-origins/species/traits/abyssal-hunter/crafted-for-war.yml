  description:
    value: >-
      <h3>Crafted for War</h3><p>The Abyssal Hunters are biological
      supersoldiers adapted from the Aegir Species; the traits of the Aegir are
      still prominent, inflated to dramatic proportions through hybridisation
      with Seaborn DNA. For the better in most cases, for the worse in
      some.</p><p><strong>Blessing of the Sea.</strong> You cannot contract
      Oripathy through mundane means.</p><p><strong>Duck and Dive.</strong>
      While you are swimming, you have Advantage on Dexterity Saving
      Throws.</p><p><strong>Incapable of Arts.</strong> Your seaborn blood
      rejects Originium in all its forms, leaving you unable to cast Arts in any
      way.</p><p><strong>Seaborn Darkvision.</strong> You have 60 feet of
      Darkvision.</p><p><strong>Seaborn Ventilation.</strong> You can breathe
      underwater.</p><p><strong>Semi-Automated: </strong>You will be prompted on
      whether you are swimming when you make a Dexterity Saving Throw; this will
      provide Advantage if you choose "yes".</p>
