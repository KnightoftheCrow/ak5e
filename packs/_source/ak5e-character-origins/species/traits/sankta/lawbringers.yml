  description:
    value: >-
      <h3>Lawbringers</h3><p>The Sankta tend to prefer ranged combat, not out of
      cowardice, but because that is where they can best apply their frightening
      accuracy.</p><p>When you make an Attack Roll using a Weapon you are
      Proficient with or as part of an Art, you may choose to double your
      Proficiency Bonus for that Attack Roll.</p><p>You can use this Feature a
      number of times equal to your Proficiency Bonus, regaining all expended
      uses when you finish a Long Rest, and may only do so once per
      Attack.</p><p><strong>Automated.</strong></p>
