  description:
    value: >-
      <h3>Misdirection</h3><p>Nightzmora are famously proficient in illusionary
      and psychic Arts they use to sow confusion among their foes; all it takes
      is for their foe to look the wrong way to open up their neck to a sword
      strike. You gain the following benefits:</p><ul><li><p><strong>Minor
      Illusion Expert.</strong> You know the Minor Illusion Cantrip, and may
      cast it as a Bonus Action. You can use your Martial DC in place of your
      Spell Save DC for this Art; you do not need a weapon with the Casting Unit
      Property to cast this Art.</p></li><li><p><strong>Illusion
      Mastery.</strong> You can cast Illusion Arts without providing Verbal
      components, and if an Illusion Arts you cast has a range of 10+ feet, the
      range increases by 60 feet.</p></li></ul><p><strong>Partially
      Automated.</strong> The Minor Illusion Cantrip is given.</p>
