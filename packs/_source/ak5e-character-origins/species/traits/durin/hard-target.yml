  description:
    value: >-
      <h3>Hard Target</h3><p>The diminutive size of the Durin would, at first
      glance, appear to be a crushing disadvantage in combat. However, in
      practice, the difference in height has an uncanny habit of throwing off
      their opponents, who struggle to keep up.</p><p>Your base Armour Class is
      equal to 12 + your Dexterity Modifier. You can use this base Armour Class
      even while wearing Armour if your Armour Class would be lower than
      this.</p><p><strong>Automated: </strong>Use the "Custom Formula" AC
      Calculation when you want to use this AC.</p>
