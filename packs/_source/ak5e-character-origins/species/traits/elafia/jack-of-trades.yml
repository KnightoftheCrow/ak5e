  description:
    value: >-
      <h3>Jack-of-Trades</h3><p>Perhaps it comes from their Sami ancestry, but
      Elafia are prone to wanderlust. It is useful then, that they find it easy
      to learn new skills and adapt on the fly to wherever their travels and
      travails take them.</p><p>You may add half of your Proficiency Bonus
      (rounding up) to all Checks made for Skills you are not Proficient in.</p>
