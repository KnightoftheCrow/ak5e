  description:
    value: >-
      <h3>Flowing Shape</h3><p>As an Action, you can create a Flowing Shape of
      yourself, or a Creature you can see within 15 feet; when you do so, your
      maximum Hit Points are reduced by the maximum Hit Points of that Flowing
      Shape; this reduction cannot reduce you to 0 Hit Points, but you cannot
      create any more Flowing Shapes if your Maximum Hit Points are lower than
      the value you would lose.</p><p>A Flowing Shape is a water-based clone
      created by elven “magic”. Visually, the Flowing Shape appears to be the
      Creature you created it to resemble- it can even speak, but only with your
      voice; a Creature must succeed on a DC18 Perception Check to see that it
      is fake, unless there is an obvious clue that something is amiss. A
      Flowing Shape is not capable of wearing clothes, armour, and wielding
      weapons, though it can appear to be wielding or wearing these things, but
      can interact with the environment such as pushing switches, opening doors,
      etc.</p><p>In addition, you can see and hear whatever your Flowing Shape
      can see and hear.</p><p><strong>Controlling Flowing Shapes.</strong> You
      can use your Bonus Action to command each of your Flowing Shapes to move
      and take a non-Attack Action available to them. There is no limit on the
      distance you can command your Flowing Shapes from in this
      way.</p><p><strong>Flowing Shapes in Combat.</strong> In Combat, your
      Flowing Shapes act during your Turn, and can use Reactions on their own.
      When you take the Attack Action, you can sacrifice one of your Attacks to
      cause all of your Flowing Shapes within 100 feet of you to make an
      Attack.</p><p><strong>Restoring your Maximum Hit Points.</strong> As an
      Action, you can touch one of your Flowing Shapes and reabsorb it,
      regaining the maximum Hit Points you lost to create that Flowing Shape.
      Alternatively, you can touch the puddle left behind by the “death” of a
      Flowing Shape to reabsorb it, regaining the maximum Hit Points you lost to
      create that Flowing Shape. Finally, if you have no Flowing Shapes, you
      regain missing maximum Hit Points you used to create Flowing Shapes equal
      to your Proficiency Bonus whenever you complete a Long
      Rest.</p><p><strong>Not Automated.</strong></p>
