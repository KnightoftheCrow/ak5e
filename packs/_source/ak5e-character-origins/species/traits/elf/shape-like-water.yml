  description:
    value: >-
      <h3>Shape Like Water</h3><p>The pecularities of the Elves are not well
      documented, for Elves themselves are not well documented. For those that
      do venture away from their ancestral home, they often raise more questions
      that they answer; what is an Elf?</p><p>You can squeeze through a space as
      narrow as 1 inch wide, provided you are wearing no Armour and carrying
      nothing. You have Advantage on Ability Checks and Saving Throws you make
      to avoid or escape a grapple.</p><p><strong>Not Automated.</strong></p>
