  description:
    value: >-
      <h3>Guardian of Terra</h3><p>Due to their extreme susceptibility to
      Originium, Elves are not capable of using Originium Arts. However, they
      possess the ability to use their own “magic”; hydrokinetic and
      dendrokinetic powers granted to them by their creator, Muel the Feranmut,
      so that they could heal Sami the All-Father.</p><p>You learn the Arts from
      the Elven Magic “Arts Pool”; these Arts are always Prepared. Intelligence,
      Wisdom, or Charisma is your Spellcasting Ability for these Arts (choose
      when you select this Species); you do not need a weapon with the Casting
      Unit Property to cast these Arts. You cannot cast any other Arts except
      Elven Magic.</p><p>When you would choose a Standard Arts Pool to learn
      Arts from as part of a Class or Branch Feature, you instead gain a
      permanent +1 Bonus to your Spell Save DC, Spell Attack Rolls, and Hit
      Points restored by your Elven Magic. Any Special Arts Pools you gain
      access to are considered to be Elven Magic in addition to their original
      pool.</p><p>Once per Short Rest, you can cast Elven Magic without
      expending any Arts Points. The maximum level of Elven Magic you can cast
      in this way is controlled by your Character Level.</p><p><strong>Partially
      automated.</strong> Elven Magic Pool is given. The +1 bonus must be
      manually done.</p>
