  description:
    value: >-
      <h3>Folk of the Water</h3><p>Lithe, small, powerful; the sleek bodies of
      water-dwelling Anaty belie their predatory nature. Darting into the water,
      or from it, they quickly seize hold of unwary prey and deliver a killing
      blow. You gain the following benefits:</p><ul><li><p><strong>Additional
      Movement Speeds.</strong> You gain a Swimming Speed equal to your Walking
      Speed.</p></li><li><p><strong>Dart Forward.</strong> If you have used two
      or more Speeds during your Turn, you may take the Dash Action as a Bonus
      Action during that Turn. If you do so, the first time you make an Attack
      that Turn against a Creature within 15 feet, you can roll a d8 and add it
      to either the Attack Roll or Damage
      Roll.</p></li><li><p><strong>Nictitating Membrane.</strong> While
      underwater, you have 30 feet of
      Darkvision.</p></li></ul><hr><p><strong>Semi-Automated: </strong>Use the
      Dart Forward Action to do your Bonus Action Dash; this also provides the
      Attack/Damage Opt In. Use the Toggle Darkvision Activity when you enter
      and leave underwater.</p>
