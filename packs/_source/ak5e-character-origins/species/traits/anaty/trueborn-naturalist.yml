  description:
    value: >-
      <h3>Trueborn Naturalist</h3><p>To live in the wilds as many Anaty do
      requires a deep understanding of nature. For many, it is learned. For the
      Anaty, it is natural.</p><p>Choose either Wisdom (Animal Hadling) or
      Wisdom (Wilderness). You gain Proficiency in the chosen skill. If you
      would gain Proficiency in that skill from a non-Species Feature source,
      you instead gain Expertise in that
      Skill.</p><hr><p><strong>Semi-Automated: </strong>You will not manually
      gain Expertise when gaining the Proficiency for a second time; you must
      manually set that.</p>
