  advancement: {}
  description:
    value: >-
      <h3>Folk of the Mountain</h3><p>Some assume the Anaty are physically frail
      as a generalisation, fooled by the small size. This is a falsehood. The
      strength of their small bodies is concentrated, compressed; and in this
      case, strongly specialised for digging. You gain the following
      benefits:</p><ul><li><p><strong>Burrowers.</strong> Over the course of 1
      minute, you can prepare to tunnel through a soft surface, scrabbling and
      digging to find safe purchase. At the conclusion of this period, you gain
      a Burrow Speed equal to your Walking Speed for 1 hour; when this time is
      over, you must immediately dig towards the closest above ground location;
      you instinctively know which direction this is
      in.</p></li><li><p><strong>Carve Hill and Dale.</strong> In any terrain
      you are burrowing through, you can spend 1 minute to dig a tunnel 10 feet
      long and 5 feet in diameter that a Large or smaller creature can traverse
      as if it was difficult terrain. Tunnels made in this manner collapse after
      24 hours, unless you spend 1 minute during that time to reinforce the
      tunnel, or it is reinforced through other
      means.</p><blockquote><p><strong>Reminder: Burrow Speeds</strong></p><p>A
      Creature that has a Burrow Speed can use that speed to move through sand,
      earth, mud, or ice. The Creature can’t burrow through solid rock unless
      the Creature has a trait that allows it to do so. A Creature using a
      burrow speed does not leave a tunnel to be followed unless it has a trait
      that specifies as such, though a sapient Creature could feasibly excavate
      a tunnel with time. Finally, a Creature cannot detect anything happening
      around it while Burrowing unless it also has
      Tremorsense.</p></blockquote></li><li><p><strong>Vibrissae.</strong> While
      you are using your Burrow Speed, you have 15 feet of
      Tremorsense</p><hr></li></ul><p><strong>Automated.</strong></p>
