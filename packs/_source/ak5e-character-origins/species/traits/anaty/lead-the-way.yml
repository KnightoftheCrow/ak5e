  advancement: {}
  description:
    value: >-
      <h3>Lead the Way</h3><p>Many Anaty live in hostile, distant wilderness;
      frozen snowscapes, rough crags, deep forests. These same Anaty can
      navigate this terrain with the ease another person might cross the street,
      and thus many find employment as guides, sherpa, or catastrophe
      messengers.</p><p>As a Long Rest Activity, you can plan a route through
      the current environment you are in; until you next complete a Long Rest,
      moving through non-magical Difficult Terrain in that environment costs you
      no additional movement. As a Bonus Action, you can grant Creatures of your
      choice that can hear you this benefit for 1 minute; they must remain
      within 30 feet of you and be able to hear you to maintain this
      benefit.</p><hr><p><strong>Automated.</strong></p>
