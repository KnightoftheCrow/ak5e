  description:
    value: >-
      <h3>Folk of the Forest</h3><p>Few expect to see an Anaty when looking up.
      For the Anaty adapted to dwell aloft of others, this can be their greatest
      weapon, or their greatest tool for survival. You gain the following
      benefits:</p><ul><li><p><strong>Additional Movement Speeds.</strong> You
      gain a Climbing Speed equal to your Walking
      Speed.</p></li><li><p><strong>Four Walls, Six Paths.</strong> When using
      your Climbing Speed, you may move any direction across a vertical surface
      in any orientation, and may even climb upside down along horizontal
      surfaces, though you may not take any Actions that require both hands
      while traversing in this
      manner.</p></li></ul><hr><p><strong>Automated.</strong></p>
