  description:
    value: >-
      <h3>Run For Cover</h3><p>Despite many being fearsome in their own right,
      the Anaty can still find themselves prey to more fearsome beasts; in the
      distant past, their ancestor’s blood shivered at the sight of the
      ancestors of the Lupo and Liberi. In some Anaty, the techniques they
      learned to survive then still persist now.</p><p>When you take the Hide
      Action, but before you make the Stealth Check, you can move up to half of
      your Speed without provoking Opportunity
      Attacks.</p><hr><p><strong>Automation not required.</strong></p>
