  description:
    value: >-
      <h3>Tough Claws</h3><p>Digging through earth and mud without tools is not
      a simple task. Luckily, some Anaty are not without tools, as they possess
      thick, keratinous claws capable of digging through earth or flesh with
      equal ease. Nor is it only burrowing Anaty that can possess such talons;
      such tools are equally useful for scrambling up trees, or scavenging in
      riverbeds.</p><p>You can use your Claws to make Unarmed Strikes, which
      deal 1d4 + your Ability Modifier in Slashing Damage instead of the normal
      Bludgeoning Damage for an Unarmed Strike. Furthermore, Unarmed Strikes you
      make using your Claws have the Deadly
      Property.</p><hr><p><strong>Automated.</strong></p>
