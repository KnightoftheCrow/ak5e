  description:
    value: >-
      <h3>Divine Right of Kings</h3><p>The Elder species once ruled over the
      Ancients, using them as footsoldiers in their conflict with the Teekaz.
      After their victory, they ruled over their subjects, often with an iron
      fist, until they were cast down by the Ancients that placed them on those
      Thrones. Now, while members of the Elder Races are rare, they have never
      forgotten that they used to rule.</p><p>You have Advantage on any Charisma
      based Check against a Creature who’s Level or CR is lower than your
      own.</p><p><strong>Not Automated.</strong></p>
