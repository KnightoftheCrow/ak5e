  description:
    value: >-
      <h3>Witchcraft</h3><p>Sarkaz have a tighter bond with Originum and the
      curse of Oripathy than other races, and can wield it to destructive
      effect; both for themselves and their foes.</p><p>You have access to the
      Witchcraft Arts Pool; these are Sarkaz Arts. These Arts are always
      prepared. If you cannot cast Arts in another way, Wisdom is your
      Spellcasting Ability for these Arts; you do not need a weapon with the
      Casting Unit Property to cast these Arts.</p><p>Once per Long Rest, you
      can cast a Sarkaz Art without expending any Arts Points. The maximum level
      of Sarkaz Art you can cast in this way is controlled by your Character
      Level. At 7th Level, you can cast Sarkaz Arts in this way twice per Long
      Rest.</p><table><thead><tr><td><p
      style="text-align:center"><strong>Character Level</strong></p></td><td><p
      style="text-align:center"><strong>Maximum Arts
      Level</strong></p></td></tr></thead><tbody><tr><td><p>1</p></td><td><p>1</p></td></tr><tr><td><p>2</p></td><td><p>1</p></td></tr><tr><td><p>3</p></td><td><p>1</p></td></tr><tr><td><p>4</p></td><td><p>1</p></td></tr><tr><td><p>5</p></td><td><p>1</p></td></tr><tr><td><p>6</p></td><td><p>1</p></td></tr><tr><td><p>7</p></td><td><p>2</p></td></tr><tr><td><p>8</p></td><td><p>2</p></td></tr><tr><td><p>9</p></td><td><p>2</p></td></tr><tr><td><p>10</p></td><td><p>2</p></td></tr><tr><td><p>11</p></td><td><p>2</p></td></tr><tr><td><p>12</p></td><td><p>2</p></td></tr><tr><td><p>13</p></td><td><p>2</p></td></tr><tr><td><p>14</p></td><td><p>3</p></td></tr><tr><td><p>15</p></td><td><p>3</p></td></tr><tr><td><p>16</p></td><td><p>3</p></td></tr><tr><td><p>17</p></td><td><p>3</p></td></tr><tr><td><p>18</p></td><td><p>3</p></td></tr><tr><td><p>19</p></td><td><p>4</p></td></tr><tr><td><p>20</p></td><td><p>4</p></td></tr></tbody></table><hr><p><strong>Semi-Automated:
      </strong>You are provided the Arts at the appropriate level you can cast
      them. If you want to cast one of these Arts as a Sarkaz Art, cast it using
      this Feature.</p>
