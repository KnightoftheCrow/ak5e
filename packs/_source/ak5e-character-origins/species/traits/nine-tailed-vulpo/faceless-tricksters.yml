  description:
    value: >-
      <h3>Faceless Tricksters</h3><p>Nine-tailed Vulpo have a variable
      reputation over the east of Terra. Some legends cast them as benevolent
      agents and guardians; others as malicious, sadistic, and power-hungry. No
      matter the subject however, the legends agree on one aspect; they can wear
      faces that are not their own.</p><p>You learn the Disguise Self Art, and
      can cast it at will; this Art is always prepared. If you do not have the
      Ability to cast Arts in another way, Charisma is your Arts Casting Ability
      for this Art; you do not need a Weapon with the Casting Unit Property to
      cast this Art. Additionally, when you cast this Art, you may use your
      Martial DC in place of your Spell Save DC.</p><p><strong>Partially
      Automated.</strong> Automatically give the spell.</p>
