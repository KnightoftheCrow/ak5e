  description:
    value: >-
      <h3>Foxfire</h3><p>The Originium Arts of the Nine-Tailed Vulpo are a sight
      to behold; radiant light that sparkles like gemstones, yet is not dazzling
      in its intensity. These lights can guide, distract, and entertain in equal
      measure. You gain the following
      benefits:</p><ul><li><p><strong>Burn.</strong> Once per Short Rest, you
      can cast the Faerie Fire Art as a Bonus Action using this Trait. Starting
      from 7th Level, you may cast this Art in this way twice per Short Rest
      instead.</p></li><li><p><strong>Guide.</strong> You can cast the Dancing
      Lights Cantrip at will using this Trait.</p></li></ul><p><strong>Partially
      Automated.</strong> Automatically give the spells.</p>
