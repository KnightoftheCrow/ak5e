  description:
    value: >-
      <h3>Weight of History</h3><p>Like all Elders, the Lung bear the weight of
      the past; unlike others, they wield it as a fine ink pen, rather than a
      cross for their own backs. You gain the following
      benefits:</p><p><strong>Additional Skill Proficiency.</strong> You are
      Proficient in the Lore Skill.</p><p><strong>Learn From The Past.</strong>
      Once per Long Rest, when you would make a Skill Check using your Charisma
      Score, you can choose to make a Lore Check instead. If the result of the
      Lore Check is higher than the DC of the Skill Check, you succeed on that
      Skill Check.</p><p><strong>Partially Automated.</strong> Give proficiency
      in the Lore Skill.</p>
