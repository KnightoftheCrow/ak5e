  description:
    value: >-
      <h3>Godslayers</h3><p>Of all the world-shifting events in Terra’s history,
      the one the Lung are most associated with is the “Great Hunt”; a massive
      conflict carried out by the first Emperor of Yan, a Lung himself, against
      the Feranmuts who had uncontested dominion over the region. Their eventual
      victory paved the first stone for modern Terran civilization, allowing
      nations to form freed from the threat of these godlike beings. Thus, it is
      only natural that the Lung retain some proficiency in the slaying of
      titans. You gain the following benefits:</p><p>When your score a Critical
      Hit on a Creature who’s CR (or Level) is greater than your Level, you can
      roll one of that Attack’s Damage Dice an additional time and add it to the
      extra Damage of the Critical Hit. Similarly, if a Creature who’s CR (or
      Level) is greater than your Level rolls a result of a 1 on the d20 for a
      Saving Throw against you that would result in you dealing Damage to them,
      you can roll 1 additional dice of the Damage; that Creature takes
      additional Damage equal to the amount rolled.</p><p><strong>Not
      Automated.</strong></p>
