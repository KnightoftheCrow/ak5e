  description:
    value: >-
      <h3>Xue Wu Zhi Jing</h3><p>“<em>In a group of three people, there will
      always be one person I can learn from.</em>”</p><blockquote><p>A Famous
      Yanese Philsopher</p></blockquote><p>You can mimic the Features of other
      species. To do so, you must write and study a Treatise on that Feature.
      When you select this Species, you begin with one Treatise already written
      and studied on a Feature of your choice.</p><p><strong>Writing a
      Treatise.</strong> Writing a Treatise is a Long Rest Activity that costs
      1500 LMD. When you do so, choose a single Feature from a non-Rare Species,
      except the following:</p><ul><li><p>Ancient Versatility</p></li><li><p>Any
      Feature that would grant you any Arts.</p></li><li><p>Any Feature from a
      Species that has the Cling to the World Feature.</p></li></ul><p>When you
      write a Treatise, you can choose to have studied it at the same time. A
      Treatise has a value of 0 LMD.</p><p><strong>Studying a Treatise</strong>.
      Studying a Treatise is a Long Rest Activity, as if you were concentrating
      on an Art. You can only study Treatise that you have written. At the end
      of that Activity, you gain the Feature the Treatise is written on,
      including any negative effects. You can only have one Treatise studied at
      a time; studying a new Treatise replaces the previous Feature with the
      newly studied one. Any Feature that provides a longer-term benefit (such
      as the special Inspiration from the Phidia’s Agendum Feature) can only be
      used while that Treatise is the currently studied one.</p><p><strong>Not
      Automated.</strong></p>
