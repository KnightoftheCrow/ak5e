  description:
    value: >-
      <h3>Breath of Ill Omen</h3><p>Legends and stories of Doomfire Draco tell
      of their purple flames consuming entire cities and nations, burning sanity
      but never a building. The Doomfire’s “flames” can bring back the dead, for
      good or ill intention, but the cost of defying death is never free; the
      further a Doomfire spreads their flames, the frailer they
      become.</p><p>You have a pool of dice equal to twice your Proficiency
      Bonus. These dice are d4’s; your pool of dice is refilled to its maximum
      whenever you complete a Long Rest. As an Action, choose a dead Creature
      within 10 feet of you whose CR or Level is less than your Level; this
      range is increased to 100 feet if you are capable of casting any Levelled
      Art. Then, expend any amount of dice from your pool. Roll those dice, and
      add your Charisma Modifier (unless it is negative); that Creature is
      returned to life with Hit Points equal to the amount rolled. Creatures
      revived in this way follow these rules:</p><ul><li><p>The Creatures Stats
      and Features remain the same.</p></li><li><p>The Creature’s Type is
      changed to Undead.</p></li><li><p>They are completely loyal to you, but
      cannot speak or otherwise communicate.</p></li><li><p>The Creature acts on
      its own Initative in combat.</p></li><li><p>They cannot regain Hit Points
      in any way.</p></li><li><p>They cannot cast Arts.</p></li><li><p>A
      Creature revived in this way cannot be revived in this way
      again.</p></li></ul><p>While you have a Creature revived in this way, you
      cannot regain the dice from your Pool you expended to revive that
      Creature. As an Action, you can take back your Fire from any of your
      Undead; this results in the Creature’s instant death, and restores your
      ability to regain those dice.</p><p>From 7th Level, the size of the dice
      in your pool is increased to d6.</p><p><strong>Not Automated.</strong></p>
