  description:
    value: >-
      <p>Oft mistaken for Vouivre, the name “Draco” is a relatively modern term
      to describe the species, born from a desire to refer to the noble houses
      they then belonged to as a collective, rather than the individual houses.
      Some scholars, however, debate the legitmacy of such a term, for the
      individual Draco bloodlines can possess notably different physical
      characteristics. Generally speaking, however, Draco possess a long pair of
      horns, physical strength, serpentine tails; hefty and long. The tails of
      some Draco bloodlines are so prominent as to preclude them lying down
      comfortably; these Draco typically sleep while standing up, and have thus
      developed tougher cartilage and knee joints more prone to locking; just
      one example of the variance among Draco bloodlines.</p><p>Unifying all
      Draco, however, is the engine of their power; it rests in the centre of
      their breast, smouldering like a furnace, visible through skin and bone.
      Even through thin clothing, the inner heat of a Draco shines bright,
      especially when employing their unique pyrokinetic Arts; the colour of
      which varies on which “type” of Draco they are, seperate from their
      ancestral bloodline.</p><p>As an Elder species, Draco were once more
      common, especially in what was Tara, and would become Victoria. They too
      suffered from the fall of the Elder Races, but in Tara they held their
      power until years of treachery, internal and external, scattered them
      also. Now, only a few scattered communities and populations remain;
      shadows of the monarchs they once were.</p><p>The rarest of all Draco,
      Doomfire Draco are the opposite side of the coin to Hearthfire Draco; said
      to be imbued with death itself. Like Hearthfire Draco, Doomfire Draco are
      kingdom builders by inclination; it is no wonder the Draco were once among
      Terra’s ruling class. Unlike Hearthfire, however, Doomfire are not
      inclined to community and mutual faith; nay, communities built by Doomfire
      tend towards control, and iron fisted rule. It is perhaps more accurate to
      say then, that if Hearthfire Draco are kingdom builders, Doomfire Draco
      are empire builders; with all the positive and negative connotations that
      implies.</p><h2>Doomfire Draco Traits</h2><p><strong>Creature
      Type:</strong> Your Creature Type is
      Humanoid.</p><p><strong>Size:</strong> Draco are on the taller side of
      Terra’s residents, averaging around 6 feet in height. The addition of
      their bulky, serpentine tails causes them to weigh more than might be
      expected, weighing in on average 190 pounds. Your size is
      Medium.</p><p><strong>Life Expectancy:</strong> Draco reach adulthood at
      about 18 years old. Their enhanced constitution gives them a longer life
      expectancy of around 120 years.</p><p><strong>Speed:</strong> Your base
      Walking Speed is 30 feet.</p><p><strong>Ability Score
      Improvement:</strong> Your Charisma Score increases by 2, and two other
      scores of your choice increase by 1.</p><h2>Doomfire Draco
      Features</h2><p>As a Draco, you gain the following
      Features:</p><h3>Dragon’s Rage</h3><p>A deep heat burns within the breast
      of every Draco; while they learn to live with it, it is a chronic and
      constant pain. This flame is the engine of their power, and when fully
      unleashed alongside their wrath, it is to lethal effect.</p><p>You learn
      the Hellish Rebuke Art; this Art is always prepared. If you do not have
      the Ability to cast Arts in another way, Charisma is your Arts Casting
      Ability for this Art; you do not need a Weapon with the Casting Unit
      Property to cast this Art. Additionally, when you cast this Art, you may
      use your Martial DC in place of your Spell Save DC.</p><p>Once per Short
      Rest, You can cast this Art at 1st Level without expending any Arts
      Points. From 7th Level, when casting this Art via this Feature, you may
      instead cast it at 2nd Level.</p><h3>Walk Through Fire</h3><p>The Draco
      are instrincially linked to flames; the heat they feel within colours
      every waking moment. You gain the following
      benefits:</p><ul><li><p><strong>Damage Resistance.</strong> You are
      Resistant to Fire Damage.</p></li><li><p><strong>Self-Flame
      Immunity.</strong> You are Immune to Fire Damage dealt by
      you.</p></li></ul><h3>Divine Right of Kings</h3><p>The Elder species once
      ruled over the Ancients, using them as footsoldiers in their conflict with
      the Teekaz. After their victory, they ruled over their subjects, often
      with an iron fist, until they were cast down by the Ancients that placed
      them on those Thrones. Now, while members of the Elder Races are rare,
      they have never forgotten that they used to rule.</p><p>You have Advantage
      on any Charisma based Check against a Creature who’s Level or CR is lower
      than your own.</p><h3>Breath of Ill Omen</h3><p>Legends and stories of
      Doomfire Draco tell of their purple flames consuming entire cities and
      nations, burning sanity but never a building. The Doomfire’s “flames” can
      bring back the dead, for good or ill intention, but the cost of defying
      death is never free; the further a Doomfire spreads their flames, the
      frailer they become.</p><p>You have a pool of dice equal to twice your
      Proficiency Bonus. These dice are d4’s; your pool of dice is refilled to
      its maximum whenever you complete a Long Rest. As an Action, choose a dead
      Creature within 10 feet of you whose CR or Level is less than your Level;
      this range is increased to 100 feet if you are capable of casting any
      Levelled Art. Then, expend any amount of dice from your pool. Roll those
      dice, and add your Charisma Modifier (unless it is negative); that
      Creature is returned to life with Hit Points equal to the amount rolled.
      Creatures revived in this way follow these rules:</p><ul><li><p>The
      Creatures Stats and Features remain the same.</p></li><li><p>The
      Creature’s Type is changed to Undead.</p></li><li><p>They are completely
      loyal to you, but cannot speak or otherwise
      communicate.</p></li><li><p>The Creature acts on its own Initative in
      combat.</p></li><li><p>They cannot regain Hit Points in any
      way.</p></li><li><p>They cannot cast Arts.</p></li><li><p>A Creature
      revived in this way cannot be revived in this way
      again.</p></li></ul><p>While you have a Creature revived in this way, you
      cannot regain the dice from your Pool you expended to revive that
      Creature. As an Action, you can take back your Fire from any of your
      Undead; this results in the Creature’s instant death, and restores your
      ability to regain those dice.</p><p>From 7th Level, the size of the dice
      in your pool is increased to d6.</p>
