  description:
    value: >-
      <p>Elves share many physical traits with Durin, despite not sharing any
      evolutionary ancestry; pointed ears, a predisposition towards lithe,
      willowy bodies, and a youthful appearance. In fact, it is said that Elves
      never visually age beyond adulthood. They do not, however, share the
      diminuitive height of the Durin; elves stand roughly shoulder to shoulder
      with the other sapient species of Terra.</p><p>This, however, is where the
      similarities with other Terrans end. Elves are a law unto themselves, due
      in whole to their origin as a creation of the Feranmut known as Muel. They
      possess a strange ability to manipulate water and plant life that is not
      contingent on Originium Arts, much like the reality warping powers of the
      Feranmuts themselves, even cloning themselves convincingly from water.
      Even their own physical form is unusual; Elves are capable of changing
      state into a water-like fluid and reconstituting themselves from it. Some
      of hypothesised that the true form of Elves may be something more akin to
      an amorphous multicellular being, rather than the humanoids they appear to
      be.</p><p>Elves were created for two purposes; to nurse and heal Muel’s
      fellow Feranmut known as Sami the All-Father after its cataclysmic battle
      with a giant metal “fowlbeast” known as Valrhvita in the early days of the
      world, and to protect and preserve ruins of the “Predecessors” from those
      who might misuse them. It is a losing battle; their efforts to heal Sami
      are hindered by the Collapsals pouring from the northern Aethergate, which
      they are unable to prevent. Their efforts to preserve Precursor technology
      are hindered by the spread of Originium and technologies that use it;
      Elves are deathly sensitive to Oripathy, cutting a centuries long lifespan
      down to mere weeks in the case of infection.</p><p>Thus, Elves are a dying
      breed, described by some as “belonging to the past only”. An overwhelming
      majority of the withered population live in Sami, dwelling within a giant
      amber-laced tree that they venerate.</p><h2>Elf
      Traits</h2><p><strong>Creature Type:</strong> You are a
      Humanoid.</p><p><strong>Size:</strong> Elves stand between 5 and 6 feet,
      and average 140 pounds. Your size is Medium.</p><p><strong>Life
      Expectancy:</strong> Similar to the Sarkaz, the natural lifespan of an Elf
      can easily encompass centuries. However, of all Terran species, they are
      the most susceptible to Oripathy; an Infected Elf typically has less than
      a month to live.</p><p><strong>Speed:</strong> Your base Walking Speed is
      30 feet.</p><p><strong>Ability Score Improvement:</strong> Your Wisdom
      Score increases by 2, and two other Scores of your choice increase by
      1.</p><h2>Elf Features</h2><p>As an Elf, you gain the following
      Features:</p><h3>Flowing Shape</h3><p>As an Action, you can create a
      Flowing Shape of yourself, or a Creature you can see within 15 feet; when
      you do so, your maximum Hit Points are reduced by the maximum Hit Points
      of that Flowing Shape; this reduction cannot reduce you to 0 Hit Points,
      but you cannot create any more Flowing Shapes if your Maximum Hit Points
      are lower than the value you would lose.</p><p>A Flowing Shape is a
      water-based clone created by elven “magic”. Visually, the Flowing Shape
      appears to be the Creature you created it to resemble- it can even speak,
      but only with your voice; a Creature must succeed on a DC18 Perception
      Check to see that it is fake, unless there is an obvious clue that
      something is amiss. A Flowing Shape is not capable of wearing clothes,
      armour, and wielding weapons, though it can appear to be wielding or
      wearing these things, but can interact with the environment such as
      pushing switches, opening doors, etc.</p><p>In addition, you can see and
      hear whatever your Flowing Shape can see and
      hear.</p><p><strong>Controlling Flowing Shapes.</strong> You can use your
      Bonus Action to command each of your Flowing Shapes to move and take a
      non-Attack Action available to them. There is no limit on the distance you
      can command your Flowing Shapes from in this way.</p><p><strong>Flowing
      Shapes in Combat.</strong> In Combat, your Flowing Shapes act during your
      Turn, and can use Reactions on their own. When you take the Attack Action,
      you can sacrifice one of your Attacks to cause all of your Flowing Shapes
      within 100 feet of you to make an Attack.</p><p><strong>Restoring your
      Maximum Hit Points.</strong> As an Action, you can touch one of your
      Flowing Shapes and reabsorb it, regaining the maximum Hit Points you lost
      to create that Flowing Shape. Alternatively, you can touch the puddle left
      behind by the “death” of a Flowing Shape to reabsorb it, regaining the
      maximum Hit Points you lost to create that Flowing Shape. Finally, if you
      have no Flowing Shapes, you regain missing maximum Hit Points you used to
      create Flowing Shapes equal to your Proficiency Bonus whenever you
      complete a Long Rest.</p><h3>Guardian of Terra</h3><p>Due to their extreme
      susceptibility to Originium, Elves are not capable of using Originium
      Arts. However, they possess the ability to use their own “magic”;
      hydrokinetic and dendrokinetic powers granted to them by their creator,
      Muel the Feranmut, so that they could heal Sami the All-Father.</p><p>You
      learn the Arts from the Elven Magic “Arts Pool”; these Arts are always
      Prepared. Intelligence, Wisdom, or Charisma is your Spellcasting Ability
      for these Arts (choose when you select this Species); you do not need a
      weapon with the Casting Unit Property to cast these Arts. You cannot cast
      any other Arts except Elven Magic.</p><p>When you would choose a Standard
      Arts Pool to learn Arts from as part of a Class or Branch Feature, you
      instead gain a permanent +1 Bonus to your Spell Save DC, Spell Attack
      Rolls, and Hit Points restored by your Elven Magic. Any Special Arts Pools
      you gain access to are considered to be Elven Magic in addition to their
      original pool.</p><p>Once per Short Rest, you can cast Elven Magic without
      expending any Arts Points. The maximim level of Elven Magic you can cast
      in this way is controlled by your Character Level.</p><h3>In
      Touch</h3><p>The Elves were made explicitly to heal Sami the All-Father,
      and to preserve and defend the ruins of the Predecessors. They were made
      as stewards of Terra, and thus their connection to Terra is stronger than
      any others.</p><p>You have Expertise in the Wilderness Skill.</p><h3>Shape
      Like Water</h3><p>The pecularities of the Elves are not well documented,
      for Elves themselves are not well documented. For those that do venture
      away from their ancestral home, they often raise more questions that they
      answer; what is an Elf?</p><p>You can squeeze through a space as narrow as
      1 inch wide, provided you are wearing no Armour and carrying nothing. You
      have Advantage on Ability Checks and Saving Throws you make to avoid or
      escape a grapple.</p><h3>Elven Magic</h3><table><tbody><tr><td><p
      style="text-align:center"><strong>Character Level</strong></p></td><td><p
      style="text-align:center"><strong>Maximum Arts
      Level</strong></p></td></tr><tr><td><p>1</p></td><td><p>1</p></td></tr><tr><td><p>2</p></td><td><p>1</p></td></tr><tr><td><p>3</p></td><td><p>1</p></td></tr><tr><td><p>4</p></td><td><p>1</p></td></tr><tr><td><p>5</p></td><td><p>1</p></td></tr><tr><td><p>6</p></td><td><p>1</p></td></tr><tr><td><p>7</p></td><td><p>2</p></td></tr><tr><td><p>8</p></td><td><p>2</p></td></tr><tr><td><p>9</p></td><td><p>2</p></td></tr><tr><td><p>10</p></td><td><p>2</p></td></tr><tr><td><p>11</p></td><td><p>2</p></td></tr><tr><td><p>12</p></td><td><p>2</p></td></tr><tr><td><p>13</p></td><td><p>3</p></td></tr><tr><td><p>14</p></td><td><p>3</p></td></tr><tr><td><p>15</p></td><td><p>3</p></td></tr><tr><td><p>16</p></td><td><p>3</p></td></tr><tr><td><p>17</p></td><td><p>3</p></td></tr><tr><td><p>18</p></td><td><p>3</p></td></tr><tr><td><p>19</p></td><td><p>4</p></td></tr><tr><td><p>20</p></td><td><p>4</p></td></tr></tbody></table>
