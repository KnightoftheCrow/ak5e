  description:
    value: >-
      <h3>Foxfire</h3><p>The Originium Arts of the Nine-Tailed Vulpo are a sight
      to behold; radiant light that sparkles like gemstones, yet is not dazzling
      in its intensity. These lights can guide, distract, and entertain in equal
      measure. You gain the following
      benefits:</p><ul><li><p><strong>Burn.</strong> Once per Short Rest, you
      can cast the Faerie Fire Art as a Bonus Action using this Trait. If you
      cannot cast Arts in another way, Charisma is your Spellcasting Ability for
      these Arts; You can also use your Martial DC in place of your Spell Save
      DC for these Arts, and you do not need a weapon with the Casting Unit
      Property to cast this Art. Starting from 7th Level, you may cast this Art
      in this way twice per Short Rest
      instead.</p></li><li><p><strong>Guide.</strong> You can cast the Dancing
      Lights Cantrip at will using this
      Trait.</p></li></ul><hr><p><strong>Automated: </strong>Cast the Arts using
      this Feature.</p>
    chat: ''
