  description:
    value: >-
      <h3>Battle Rhythm</h3><p>Ægir maintains a strong focus on the arts and
      music as a core pillar of “humanity”, seeing it as the thing that
      differentiates humans from beasts. As creations of Ægir, the arts are a
      core pillar of the Abyssal Hunters, too. To watch them fight is to watch
      the steps of an intricate, violent dance, performed at blinding speed to
      the drums of war and the pulsing of blood.</p><p>When you roll Initiative,
      you can additionally roll 1d4+1 to determine your Rhythm for that combat.
      Until combat ends, while the round number of the combat is equal to a
      multiple of your Rhythm, you are considered to be On
      Beat.</p><blockquote><p><strong>Dance Partner</strong></p><p>When another
      Creature with this Feature rolls to determine their Rhythm, you can expend
      your use of this Feature to set your Rhythm to the same value as
      theirs.</p></blockquote><p>While you are On Beat, you gain a bonus to the
      following equal to your current Rhythm:</p><ul><li><p>Attack
      Rolls</p></li><li><p>Damage Rolls</p></li><li><p>Martial
      DC</p></li></ul><p>Once you have used this Feature, you cannot do so again
      until you complete a Short Rest.</p><blockquote><p><strong>Example: Battle
      Rhythm</strong></p><p>Player A rolls to determine their Rhythm and rolls a
      total of 2. On the 2nd round, 4th round, 6th round, and so on of that
      combat, they are considered to be On Beat and gain a +2 Bonus to the
      affected values.</p><p>Player B rolls to determine their Rhythm and rolls
      a total of 5. On the 5nd round, 10th round, 15th round, and so on of that
      combat, they are considered to be On Beat and gain a +5 Bonus to the
      affected values.</p></blockquote><hr><p><strong>Semi-Automated:
      </strong>Rolling the Battle Rhythm runs a second activity; set the scaling
      value on this activity to the amount rolled. This provides an Opt-In for
      relevant rolls; only use it when you are On Beat. If you are joining a
      Dance Partner, instead insert whatever they rolled for your Scaling
      Value.</p>
