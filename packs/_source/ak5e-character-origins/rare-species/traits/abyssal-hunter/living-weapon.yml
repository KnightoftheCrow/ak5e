  description:
    value: >-
      <h3>Living Weapon</h3><p>Despite the vehement discourse on whether the
      Abyssal Hunters should even have been created, both sides of the argument
      can agree on one thing; they are weapons. Like any weapon, they require
      the right tools and proper maintenance to remain useful in their battle
      against the Seaborn. You gain the following
      benefits:</p><ul><li><p><strong>Additional Weapon Proficiencies.</strong>
      You are Proficient with Heavy Melee
      Weapons.</p></li><li><p><strong>Anti-Aberration Conditioning.</strong> You
      have Advantage on Saving Throws against Aberrations. If you would already
      have Advantage on that Saving Throw, you can roll three dice and keep the
      highest result.</p></li></ul><hr><p><strong>Semi-Automated.
      </strong>Proficiency in heavy melee weapons is automated. You will
      automatically have Advantage on Saving Throws vs Aberrations. The third
      dice must be accounted for manually.</p>
