  description:
    value: >-
      <h3>Weight of History</h3><p>Like all Elders, the Lung bear the weight of
      the past; unlike others, they wield it as a fine ink pen, rather than a
      cross for their own backs. You gain the following
      benefits:</p><ul><li><p><strong>Additional Skill Proficiency.</strong> You
      are Proficient in the Lore Skill.</p></li><li><p><strong>Learn From The
      Past.</strong> Once per Long Rest, when you would make a Skill Check using
      your Charisma Score, you can choose to make a Lore Check instead. If the
      result of the Lore Check is higher than the DC of the Skill Check, you
      succeed on that Skill Check.</p></li></ul><hr><p><strong>Automated:
      </strong>Proficiency is automatic. When using Learn From The Past, set the
      Scaling Value to the DC of the Skill Check.</p>
