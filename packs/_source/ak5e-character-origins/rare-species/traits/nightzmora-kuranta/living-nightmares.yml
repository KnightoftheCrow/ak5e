  description:
    value: >-
      <h3>Living Nightmares</h3><blockquote><p>“All warfare is based on
      deception.</p><p>Hence, when we are able to attack, we must seem unable;
      when using our forces, we must appear inactive; when we are near, we must
      make the enemy believe we are far away; when far away, we must make him
      believe we are near.”</p><p>Sun Tzu, The Art of War</p></blockquote><p>The
      Nightzmoran Khanate once conquered vast swathes of Terra; few nations did
      not suffer their destructive rampage. Key to their success was their
      masterful ability in illusion; when combined with their hit and run
      tactics, their foes ever struggled to mount the correct response at the
      right time</p><p>You learn the Nightzmoran’s Illusory Arts. You learn more
      Illusory Arts as your Character Level increases; all Illusory Arts are
      always prepared. If you cannot cast Arts in another way, Wisdom is your
      Spellcasting Ability for these Arts; you do not need a weapon with the
      Casting Unit Property to cast these Arts.</p><p>(Arts that are <span
      style="text-decoration:underline"><span
      style="text-decoration:underline">underlined</span></span> require the
      Player's Handbook. Arts that are in <em>italics</em> require Tasha's
      Cauldron of Everything. Arts that are <strong>Bold</strong> are not
      currently available in official content on Foundry; often Xanathar's Guide
      to Everything.)</p><h3>Illusory Arts</h3><table><thead><tr><td><p
      style="text-align:center"><strong>Character Level</strong></p></td><td><p
      style="text-align:center"><strong>Known
      Arts</strong></p></td></tr></thead><tbody><tr><td><p
      style="text-align:center">1</p></td><td><p
      style="text-align:center">Silent Image</p></td></tr><tr><td><p
      style="text-align:center">7</p></td><td><p style="text-align:center"><span
      style="text-decoration:underline"><span
      style="text-decoration:underline">Phantasmal Force</span></span>,
      Fear</p></td></tr><tr><td><p style="text-align:center">14</p></td><td><p
      style="text-align:center">Hallucinatory Terrain,
      Seeming</p></td></tr></tbody></table><p>Once per Short Rest, you can cast
      one of your known Illusory Arts at the minimum level without expending any
      Arts Points.</p><hr><p><strong>Automated.</strong></p>
