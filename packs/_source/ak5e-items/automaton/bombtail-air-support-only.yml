    value: >-
      <p><strong>Effect:</strong> This Automaton possesses a powerful explosive
      payload. As an Action, it can choose a visible point within 60 feet; each
      Creature in a 10-foot radius Sphere centred on that point must make a
      Dexterity Saving Throw against your Artificer DC. On a failed Save, they
      take Thunder Damage equal to five rolls of your Aid Die. On a successful
      Save, they take half as much Damage.</p><p>Once this Automaton has used
      this Action, it may not do so again until both it and its Creator complete
      a Long Rest at the same time.</p>
