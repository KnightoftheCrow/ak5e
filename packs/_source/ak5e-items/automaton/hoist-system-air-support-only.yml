    value: >-
      <p><strong>Effect:</strong> This Automaton is fitted with more powerful
      engines and a system by which a Creature can hold onto it and be lifted.
      One Medium or smaller Humanoid Creature can grab onto the Automaton when
      they are within 5 feet of it, can see it, and have at least one empty
      hand; while they are holding onto it, that Creature’s Speed is reduced to
      0, and the Automaton’s Speed is halved. However, when the Automaton moves,
      it also moves that Creature, including flying movement.</p>
