    value: >-
      <p><strong>Effect:</strong> This Automaton is fitted with a second,
      explosive crossbow.</p><p>Once per Turn, as an Action the Automaton can
      launch an explosive bolt at a Creature it can see within 80 feet; the
      Automaton makes a Crossbow Attack against that Creature. On a hit, it
      deals Piercing Damage equal to 3 + one roll of your Aid Die instead of its
      normal Damage, and all Creatures within 5 feet of the original target must
      succeed on a Dexterity Saving against your Artificer DC or take Thunder
      Damage equal to one roll of your Aid Die.</p>
