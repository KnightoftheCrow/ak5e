  description:
    value: >-
      <p><strong>Effect:</strong> As a Reaction when this Automaton is hit by an
      Attack, it can release the energy stored within specialised power cells in
      an explosive manner; all other Creatures within 10 feet of the Automaton
      must make a Dexterity Saving Throw against your Artificer DC. On a failed
      Save, they take Force Damage equal to three rolls of your Aid Die and are
      knocked 10 feet away from the Automaton. On a successful Save, they take
      half as much Damage, and suffer no other effects.</p><p>Once this
      Automaton has used this Reaction, it may not do so again until both it and
      its Creator complete a Short or Long Rest at the same time. However, if
      the Automaton is reduced to 0 Hit Points, it may use this Reaction even if
      it has expended its use of it.</p>
