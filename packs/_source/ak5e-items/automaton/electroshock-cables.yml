  description:
    value: >-
      <p><strong>Effect:</strong> This Automaton can fire wires that deliver a
      powerful electric shock on contact. As an Action, it can choose a Creature
      it can see within 15 feet; that Creature must succeed on a Dexterity
      Saving Throw against your Artificer DC or take Lightning Damage equal to
      three rolls of your Aid Die, and be Stunned until the end of their next
      Turn.</p><p>Once this Automaton has used this Action, it may not do so
      again until both it and its Creator complete a Short or Long Rest at the
      same time.</p>
