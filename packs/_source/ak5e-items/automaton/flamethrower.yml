  description:
    value: >-
      <p><strong>Effect:</strong> As an Action, the Automaton releases a 20 foot
      long Cone of flame in a chosen direction. Every Creature within that area
      must make a Dexterity Saving Throw against your Artificer DC; on a failed
      Save, they take Fire Damage equal to three rolls of your Aid Die and are
      Burning. On a successful Save, they take half as much Damage, and suffer
      no further effects.</p><p>Once this Automaton has used this Action, it may
      not do so again until both it and its Creator complete a Short or Long
      Rest at the same time.</p>
