  description:
    value: >-
      <p><strong>Effect:</strong> As an Action, the Automaton begins emitting
      toxic gas in a 10 foot radius sphere that moves with the Automaton for the
      next minute. When a Creature enters the area for the first time during
      their Turn, or begins their Turn within the area, they must make a
      Constitution Saving Throw against your Artificer DC. On a failed Save,
      they take Poison Damage equal to two rolls of your Aid Die, and are
      Poisoned until the beginning of their next Turn. On a successful Save,
      they take half as much Damage, and are not Poisoned.</p><p>Once this
      Automaton has used this Action, it may not do so again until both it and
      its Creator complete a Long Rest at the same time.</p>
