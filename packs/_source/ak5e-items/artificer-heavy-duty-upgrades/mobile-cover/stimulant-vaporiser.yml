      <p><strong>Effect:</strong> This Mobile Cover is fitted with a vaporiser
      that is filled with a heady mix of anaesthetic gases and combat
      stimulants. Creatures that begin their Turn within 5 feet of the Mobile
      Cover can gain Temporary Hit Points equal to one roll of your Aid
