  description:
    value: >-
      <p><strong>Effect:</strong> The Automaton can produce obscuring smoke as
      an Action; the smoke cloud is a 20 foot radius Sphere centred on the
      Automaton, and lasts until the end of your next Turn. For the Duration,
      any Attack that would pass into or out of the smoke is made at
      Disadvantage.</p><p>This Automaton may perform this Action a number of
      times equal to your Intelligence Modifier, and regains all expended uses
      when it and its Creator complete a Short Rest at the same
      time.</p><hr><p><strong>Semi-Automated: </strong>Manually set the maximum
      uses for this Feature. When this Creature is projecting smoke, it only
      affects Creatures attacking and being attacked that are within the smoke;
      it does not affect attacks travelling through.</p>
