  description:
    value: >-
      <p><strong>Effect:</strong> This Automaton is upgraded with a series of
      bladed weapons to engage foes. These weapons have the following
      profile:</p><p><strong>Cutting Edge Blades</strong>. Melee Weapon Attack:
      Bonus equals Proficiency Bonus + your Intelligence Modifier, Reach 5ft,
      one target, <em>Hit</em> = Strength Modifier + one roll of your Aid Dice
      in Slashing Damage.</p><p>Additionally, whenever this Automaton takes the
      Attack Action, it may Attack an additional time using this
      Weapon.</p><hr><p><strong>Automated.</strong></p>
