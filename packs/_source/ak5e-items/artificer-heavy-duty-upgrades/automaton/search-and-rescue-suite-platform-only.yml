  description:
    value: >-
      <p><strong>Effect:</strong> This Automaton possesses powerful “arms” that
      it uses to relocate people, willingly or otherwise.</p><p>The Automaton is
      treated as being two sizes larger for the purposes of lifting and carrying
      other Objects and Creatures. Additionally, as an Action, it may target a
      Creature within 5 feet of itself and attempt to move them. If the Creature
      is unwilling, it must succeed on a Strength Saving Throw against your
      Artificer DC. On a failed Save, or if the Creature is willing, this
      Automaton may immediately move up to half its Speed, moving the Creature
      with it.</p><hr><p><strong>Automated.</strong></p>
