  description:
    value: >-
      <p><strong>Effect:</strong> This Automaton is upgraded with the capability
      to dispense restorative substances to nearby wounded.</p><p>As an Action,
      this Automaton chooses a Creature it can see within 5 feet; that Creature
      recovers Hit Points equal to two rolls of your Aid Die.</p><p>This
      Automaton may perform this Action a number of times equal to your
      Intelligence Modifier, and regains all expended uses when it and its
      Creator complete a Short Rest at the same
      time.</p><hr><p><strong>Semi-Automated: </strong>Manually set the maximum
      number of uses for this Feature.</p>
