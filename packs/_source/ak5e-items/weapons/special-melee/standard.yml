      <p>[[/attack extended]], [[/damage extended]].</p><p>Finesse,
      Two-Handed.</p><hr><p><strong>Semi-Automated: </strong>You automatically
      project your Aura of Influence in a 10ft sphere around yourself. When you
      use the Plant Standard Activity, you stop projecting that Aura and it is
      instead projected from your planted Standard. You cannot Attack with this
      Weapon while your Standard is planted. When you use the Retrieve Standard
      Activity, you begin projecting your Aura again and can attack, but must
      manually remove the region created by planting your Standard.</p>
