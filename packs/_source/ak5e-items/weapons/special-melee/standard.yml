        name: Retrieve Standard
        command: >-
          let targetActor = workflow.targets.first()?.actor;

          if (!targetActor) return;


          let effectId = targetActor.appliedEffects.find(effect => effect.name
          === "Standard Planted")?.id;

          if (!effectId) return;


          await MidiQOL.removeEffects({
              actorUuid: targetActor.uuid,
              effects: [effectId]
          });
