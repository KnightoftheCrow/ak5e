  description:
    value: >-
      <p>[[/attack extended]], [[/damage extended]]</p><p>Finesse,
      Two-Handed</p><p>You can only have one Standard at a time; replacing a
      Standard costs 200 LMD.</p><p>Your Standard is a symbol of power; it lifts
      up your allies, and casts down your foes. While you are wielding it, it
      projects an Aura of Influence around you in a 10-foot-radius sphere
      centered on you. As a Bonus Action while you are wielding it, you can
      plant the Standard at your current location; A Planted Standard does not
      impede movement, and can be picked up by a Creature within 5 feet of it as
      a Bonus Action.</p><p>While the Standard is planted, the size of the Aura
      of Influence is increased to 25 feet, but it is centered on the Standard
      instead of you. Additionally, when a Creature enters that area, or begins
      their Turn there, you can use your Tip of the Spear Feature on that
      Creature (no Action required). Once you have done so, you cannot do so
      again on that Creature until the beginning of your next Turn.</p>
